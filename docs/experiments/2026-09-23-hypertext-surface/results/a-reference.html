<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Continuo — Architecture Reference</title>
<style>
/* ============================================================
   Continuo architecture reference
   Ground rules for this stylesheet:
     - three semantic hues only: pure / bound / outside.
       They mean "version-independent", "tied to one Minecraft
       version", "outside the boundary". Nothing else is coloured.
     - ink carries interaction; luminance carries state.
     - mono is chrome and data; serif is prose.
   ============================================================ */
:root{
  --paper:#EAEDE7;
  --card:#FAFBF8;
  --card-2:#F2F4EF;
  --ink:#13171A;
  --ink-2:#48525A;
  --ink-3:#67717A;
  --rule:#CDD3CA;
  --rule-2:#E0E4DC;
  --pure:#1C4788;
  --bound:#8B4E0D;
  --outside:#3B5A37;
  --pure-w:#E7ECF5;
  --bound-w:#F5EBDF;
  --outside-w:#E6EDE4;
  --mark:#F6EDC9;
  --mono:ui-monospace,"Cascadia Mono","Cascadia Code",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Constantia,Charter,Cambria,Georgia,serif;
  --spine:252px;
  --head:54px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font:400 14px/1.5 var(--mono);
  /* the subject's own material: a block grid. Kept faint and only
     visible in gutters — every reading surface is opaque. */
  background-image:
    linear-gradient(to right, rgba(19,23,26,.045) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(19,23,26,.045) 1px, transparent 1px),
    linear-gradient(to right, rgba(19,23,26,.05) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(19,23,26,.05) 1px, transparent 1px);
  background-size:22px 22px,22px 22px,88px 88px,88px 88px;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--pure);outline-offset:2px;border-radius:2px}

/* ---------- head ---------- */
.head{
  position:sticky;top:0;z-index:60;height:var(--head);
  display:flex;align-items:center;gap:18px;
  padding:0 16px 0 18px;
  padding-top:env(safe-area-inset-top,0px);
  height:calc(var(--head) + env(safe-area-inset-top,0px));
  background:rgba(234,237,231,.94);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--rule);
}
.brand{display:flex;align-items:baseline;gap:10px;flex:0 0 auto;text-decoration:none}
.brand b{font-weight:700;font-size:15px;letter-spacing:.18em;text-transform:uppercase}
.brand span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.searchwrap{position:relative;flex:1 1 auto;max-width:520px}
#q{
  width:100%;height:32px;padding:0 30px 0 28px;
  font:400 12.5px/1 var(--mono);color:var(--ink);
  background:var(--card);border:1px solid var(--rule);border-radius:2px;
}
#q::placeholder{color:var(--ink-3)}
.searchwrap::before{content:"/";position:absolute;left:10px;top:9px;font-size:12px;color:var(--ink-3)}
.kbd{
  position:absolute;right:7px;top:8px;font-size:10px;color:var(--ink-3);
  border:1px solid var(--rule);border-radius:2px;padding:1px 4px;background:var(--card-2);
}
#results{
  position:absolute;top:36px;left:0;right:0;max-height:min(66vh,520px);overflow:auto;
  background:var(--card);border:1px solid var(--rule);border-radius:2px;
  box-shadow:0 12px 32px rgba(19,23,26,.16);
}
.rgroup{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);
  padding:7px 10px 3px;border-top:1px solid var(--rule-2)}
.rgroup:first-child{border-top:0}
.ritem{display:block;padding:5px 10px;text-decoration:none;border-left:3px solid transparent;cursor:pointer}
.ritem b{font-weight:600;font-size:12.5px}
.ritem i{display:block;font:400 12px/1.35 var(--serif);color:var(--ink-2);font-style:normal;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem.on,.ritem:hover{background:var(--card-2);border-left-color:var(--ink)}
.ritem mark{background:var(--mark);color:inherit}
.rnone{padding:12px 10px;color:var(--ink-3);font-size:12px}
.headbtn{
  flex:0 0 auto;font:400 11px/1 var(--mono);letter-spacing:.06em;color:var(--ink-2);
  background:var(--card);border:1px solid var(--rule);border-radius:2px;padding:7px 9px;cursor:pointer;
}
.headbtn:hover{background:var(--card-2)}
#backchip{display:none;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#backchip.on{display:block}
#menubtn{display:none}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--spine) minmax(0,1fr);align-items:start}
.spine{
  position:sticky;top:calc(var(--head) + env(safe-area-inset-top,0px));
  height:calc(100vh - var(--head) - env(safe-area-inset-top,0px));
  overflow:auto;border-right:1px solid var(--rule);
  background:linear-gradient(to right,rgba(250,251,248,.86),rgba(250,251,248,.86));
  padding:12px 0 40px;
}
.spine h4{
  margin:14px 0 5px;padding:0 14px;font:600 9.5px/1 var(--mono);
  letter-spacing:.17em;text-transform:uppercase;color:var(--ink-3);
}
.slink{
  display:block;padding:3px 14px 3px 14px;text-decoration:none;font-size:12px;
  color:var(--ink-2);border-left:3px solid transparent;
}
.slink:hover{color:var(--ink);background:var(--card-2)}
.slink.here{color:var(--ink);border-left-color:var(--ink);font-weight:600;background:var(--card-2)}
.streerow{display:flex;align-items:stretch;border-left:3px solid transparent}
.streerow.here{border-left-color:var(--ink);background:var(--card-2)}
.streerow .slink{border-left:0;flex:1 1 auto;padding-left:8px;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.twisty{
  flex:0 0 auto;width:20px;border:0;background:none;cursor:pointer;color:var(--ink-3);
  font:400 10px/1 var(--mono);padding:0;
}
.twisty:hover{color:var(--ink)}
.kids{display:none;padding:1px 0 3px}
.kids.open{display:block}
.kids .slink{padding-left:31px;font-size:11.5px;color:var(--ink-2)}
.swatch{display:inline-block;width:5px;height:5px;margin-right:6px;vertical-align:1px;border-radius:1px}
.sw-pure{background:var(--pure)}.sw-bound{background:var(--bound)}.sw-outside{background:var(--outside)}

main{min-width:0;padding:0 26px 120px;max-width:1160px}
section{scroll-margin-top:calc(var(--head) + 14px)}
[id]{scroll-margin-top:calc(var(--head) + 14px)}
/* entries can sit under a sticky container header, so they need more headroom */
.entry[id],tr[id]{scroll-margin-top:calc(var(--head) + 56px)}

/* ---------- section furniture ---------- */
.band{
  display:flex;align-items:baseline;gap:12px;margin:46px 0 14px;
  padding-bottom:6px;border-bottom:2px solid var(--ink);
}
.band h2{margin:0;font:700 13px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase}
.band .count{font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.band p{margin:0 0 0 auto;font:400 12px/1.4 var(--serif);color:var(--ink-2);max-width:46ch;text-align:right}

/* ---------- orientation ---------- */
.thesis{
  background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--pure);
  padding:22px 26px 20px;margin:22px 0 0;
}
.eyebrow{font:600 9.5px/1 var(--mono);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3)}
.thesis h1{margin:8px 0 2px;font:700 30px/1.05 var(--mono);letter-spacing:-.01em}
.lede{margin:6px 0 14px;font:400 16px/1.4 var(--serif);color:var(--ink-2)}
.prose{font:400 14.5px/1.6 var(--serif);color:var(--ink);max-width:74ch}
.prose p{margin:0 0 .7em}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:16px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin-top:18px}
.stat{background:var(--card);padding:11px 13px}
.stat b{display:block;font:700 22px/1.1 var(--mono);letter-spacing:-.02em}
.stat span{display:block;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-top:3px}
.stat i{display:block;font:400 11.5px/1.5 var(--serif);font-style:normal;color:var(--ink-2);margin-top:6px}

/* ---------- the four rules ---------- */
.rulegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule)}
.ruleitem{background:var(--card);padding:12px 14px;display:flex;gap:12px}
.rulenum{flex:0 0 auto;font:700 26px/1 var(--mono);color:var(--rule);letter-spacing:-.04em}
.ruleitem.n .rulenum{color:var(--pure)}
.ruletxt{font:400 13.5px/1.5 var(--serif)}
.ruletxt b{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
  display:block;color:var(--ink-2);font-weight:700;margin-bottom:2px}

/* ---------- boundary matrix (the signature) ---------- */
.matrixwrap{background:var(--card);border:1px solid var(--rule);padding:20px 22px 16px;margin-top:6px}
.matrixscroll{overflow-x:auto;padding-bottom:4px}
table.dsm{border-collapse:collapse;font:400 11px/1 var(--mono)}
table.dsm th,table.dsm td{border:1px solid var(--rule-2);padding:0}
table.dsm td.cell{width:26px;height:26px;text-align:center;vertical-align:middle;position:relative}
table.dsm td.cell.diag{background:repeating-linear-gradient(45deg,transparent,transparent 3px,var(--rule-2) 3px,var(--rule-2) 4px)}
table.dsm td.cell a{
  display:block;width:100%;height:100%;text-decoration:none;line-height:26px;font-size:10px;
}
table.dsm td.cell.on{background:var(--pure-w)}
table.dsm td.cell.on.b{background:var(--bound-w)}
table.dsm td.cell.on.o{background:var(--outside-w)}
table.dsm td.cell.on a::after{content:"";position:absolute;inset:6px;border-radius:1px;background:var(--pure)}
table.dsm td.cell.on.b a::after{background:var(--bound)}
table.dsm td.cell.on.o a::after{background:var(--outside)}
table.dsm td.cell.on a:hover::after,table.dsm td.cell.on a:focus::after{inset:3px}
table.dsm th.rowh{
  text-align:right;padding:0 9px;white-space:nowrap;font-weight:400;font-size:11px;height:26px;
  background:var(--card);
}
table.dsm th.rowh .n{font-weight:600}
table.dsm th.colh{height:150px;width:26px;padding:0;background:var(--card);vertical-align:bottom}
table.dsm th.colh div{
  writing-mode:vertical-rl;transform:rotate(180deg);
  white-space:nowrap;font-weight:400;font-size:11px;padding:6px 0;text-align:left;
}
table.dsm th.colh div .n{font-weight:600}
table.dsm td.tot,table.dsm th.tot{
  font-size:10.5px;color:var(--ink-3);text-align:center;width:26px;height:26px;background:var(--card-2)
}
table.dsm tr.hl th.rowh{background:var(--mark)}
table.dsm .corner{background:var(--card)}
.matrixkey{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule-2);
  font-size:11px;color:var(--ink-2)}
.matrixkey span{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:1px;display:inline-block}
.matrixnote{margin:12px 0 0;font:400 13.5px/1.55 var(--serif);color:var(--ink);max-width:78ch}

/* ---------- legend / key ---------- */
.keygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.keycell{background:var(--card);padding:12px 14px}
.keycell h5{margin:0 0 6px;font:700 9.5px/1 var(--mono);letter-spacing:.17em;text-transform:uppercase;color:var(--ink-3)}
.keycell p{margin:0 0 6px;font:400 13px/1.5 var(--serif);color:var(--ink)}
.keycell p:last-child{margin-bottom:0}

/* ---------- entries ---------- */
.unit{margin-top:34px}
.unithead{
  position:sticky;top:calc(var(--head) + env(safe-area-inset-top,0px));z-index:20;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--paper);padding:9px 0 7px;border-bottom:1px solid var(--ink);
}
.unithead .ux{font:700 9.5px/1 var(--mono);letter-spacing:.17em;text-transform:uppercase;color:var(--ink-3)}
.unithead h3{margin:0;font:700 19px/1.1 var(--mono);letter-spacing:-.01em}
.unithead .spacer{flex:1 1 auto}

.entry{
  background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--rule);
  padding:14px 16px;margin-top:12px;
}
.entry.pure{border-left-color:var(--pure)}
.entry.bound{border-left-color:var(--bound)}
.entry.outside{border-left-color:var(--outside)}
.entry.big{padding:18px 20px}
.entry:target{background:var(--mark);box-shadow:0 0 0 2px var(--ink)}
.ehead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ehead h4{margin:0;font:700 16px/1.2 var(--mono);letter-spacing:-.005em}
.entry.big .ehead h4{font-size:19px}
.ehead .anchor{font-size:10.5px;color:var(--ink-3);text-decoration:none;opacity:0;margin-left:-4px}
.entry:hover .ehead .anchor{opacity:1}
.esum{margin:5px 0 0;font:400 14.5px/1.45 var(--serif);color:var(--ink-2);max-width:80ch}
.entry.big .esum{font-size:16px}

.ebody{display:grid;grid-template-columns:minmax(0,1.32fr) minmax(0,1fr);gap:20px;margin-top:12px}
.ebody.wide{grid-template-columns:minmax(0,1fr)}
.blk{margin-bottom:13px}
.blk:last-child{margin-bottom:0}
.blk h5{
  margin:0 0 5px;font:700 9.5px/1 var(--mono);letter-spacing:.17em;text-transform:uppercase;color:var(--ink-3);
  padding-bottom:3px;border-bottom:1px solid var(--rule-2);
}
ul.tight{margin:0;padding:0;list-style:none}
ul.tight li{
  font:400 13.5px/1.5 var(--serif);margin:0 0 4px;padding-left:15px;position:relative;
}
ul.tight li::before{content:"";position:absolute;left:2px;top:.62em;width:5px;height:5px;background:var(--rule);border-radius:1px}
ul.rules li::before{background:var(--ink-3);border-radius:50%}
.note{font:400 13.5px/1.55 var(--serif);color:var(--ink)}

/* tags */
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{
  font:600 9.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;
  padding:3px 5px;border:1px solid var(--rule);border-radius:2px;color:var(--ink-2);background:var(--card-2);
  white-space:nowrap;
}
.tag.t-pure{color:var(--pure);border-color:var(--pure);background:var(--pure-w)}
.tag.t-bound{color:var(--bound);border-color:var(--bound);background:var(--bound-w)}
.tag.t-outside{color:var(--outside);border-color:var(--outside);background:var(--outside-w)}
.tag.t-found{color:var(--bound);border-color:var(--bound);background:var(--bound-w)}
.tag.t-plain{}
.meter{display:inline-flex;gap:2px;align-items:center;vertical-align:1px}
.meter i{width:5px;height:5px;background:var(--rule);border-radius:1px;display:block}
.meter i.f{background:var(--ink)}

/* data tables */
table.data{width:100%;border-collapse:collapse;font:400 11.5px/1.35 var(--mono)}
table.data th{
  text-align:left;font:700 9px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);
  padding:0 6px 4px 0;border-bottom:1px solid var(--rule-2);font-weight:700;
}
table.data td{padding:4px 6px 4px 0;border-bottom:1px solid var(--rule-2);vertical-align:top}
table.data tr:last-child td{border-bottom:0}
table.data tr.hl{background:var(--mark)}
table.data .lab{font:400 12.5px/1.4 var(--serif);color:var(--ink)}
table.data .dir{color:var(--ink-3);width:1%;white-space:nowrap}
.viagroup td{background:var(--card-2);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.viagroup td b{font-weight:700}

/* refs */
.reflist{display:flex;flex-direction:column;gap:2px}
.ref{
  font:400 11px/1.4 var(--mono);color:var(--ink-2);word-break:break-all;
  padding-left:16px;position:relative;
}
.ref .k{position:absolute;left:0;top:0;font-size:9px;color:var(--ink-3);letter-spacing:.06em}
.ref em{font-style:normal;color:var(--ink);font-weight:600}
.ref .frag{color:var(--bound)}

/* cross-links */
a.x{
  color:var(--ink);text-decoration:none;
  border-bottom:1px solid var(--rule);
}
a.x:hover{border-bottom-color:var(--ink);background:var(--mark)}
a.x.k-node{font-weight:600}
a.x.k-conn,a.x.k-flow,a.x.k-pattern{font-style:normal}
.muted{color:var(--ink-3)}
.thin{font:400 12.5px/1.5 var(--serif);color:var(--ink-3)}

/* scoped diagrams */
.diagram{background:var(--card-2);border:1px solid var(--rule-2);padding:10px;overflow-x:auto;margin-bottom:10px}
.diagram svg{display:block}
.dgbox{fill:var(--card);stroke:var(--rule);stroke-width:1}
.dgbox.hl{stroke:var(--ink);stroke-width:1.5}
.dglabel{font:600 10.5px/1 var(--mono);fill:var(--ink)}
.dgedge{fill:none;stroke:var(--ink-3);stroke-width:1.2;marker-end:url(#ah)}
.dgedge.hl{stroke:var(--pure);stroke-width:2;marker-end:url(#ahh)}
.dghit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.dgcap{font:400 11px/1.4 var(--serif);color:var(--ink-3);margin:0 0 8px}

/* flows */
.flowsteps{border:1px solid var(--rule);background:var(--card)}
.fstep{display:grid;grid-template-columns:30px minmax(0,1fr) 26px minmax(0,1fr);gap:0 10px;
  align-items:baseline;padding:7px 12px;border-bottom:1px solid var(--rule-2)}
.fstep:last-child{border-bottom:0}
.fstep .ord{font:600 10px/1.5 var(--mono);color:var(--ink-3);text-align:right}
.fstep .from{text-align:right;font-size:12px;min-width:0}
.fstep .to{font-size:12px;min-width:0}
.fstep .arr{text-align:center;color:var(--ink-3);font-size:12px}
.fstep .msg{grid-column:2 / 5;font:400 13px/1.4 var(--serif);color:var(--ink);margin-top:2px}
.fstep .msg .viaref{font:400 10.5px/1 var(--mono);color:var(--ink-3);margin-left:8px}
.fstep.kind-Async .arr{color:var(--bound)}
.fstep.kind-Return{background:var(--card-2)}
.fstep.kind-Return .arr{color:var(--ink-3)}
.ctrlchip{
  display:inline-block;margin-right:8px;padding:2px 6px;border:1px solid var(--bound);border-radius:2px;
  background:var(--bound-w);color:var(--bound);font:600 9.5px/1.3 var(--mono);letter-spacing:.09em;
  text-transform:uppercase;vertical-align:1px;
}
.ctrlchip em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink-2)}
.parts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}

/* patterns */
.patgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.stbox{fill:var(--card);stroke:var(--ink-3);stroke-width:1.2}
.stbox.hl{stroke:var(--pure);stroke-width:2.4;fill:var(--pure-w)}
.stlabel{font:600 11px/1 var(--mono);fill:var(--ink);text-anchor:middle}
.tredge{fill:none;stroke:var(--ink-3);stroke-width:1.2;marker-end:url(#ah)}
.tredge.hl{stroke:var(--pure);stroke-width:2.2;marker-end:url(#ahh)}

footer{margin:70px 0 0;padding-top:16px;border-top:1px solid var(--rule);
  font:400 12px/1.6 var(--serif);color:var(--ink-3);max-width:80ch}

/* peek popover */
#peek{
  position:fixed;z-index:90;max-width:340px;display:none;
  background:var(--card);border:1px solid var(--ink);border-left-width:4px;
  box-shadow:0 10px 30px rgba(19,23,26,.2);padding:10px 12px;
}
#peek.on{display:block}
#peek .pk-h{font:700 13px/1.2 var(--mono);margin-bottom:3px}
#peek .pk-t{font:600 9px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
#peek .pk-s{font:400 13px/1.45 var(--serif);color:var(--ink-2)}
#peek .pk-m{font:400 10.5px/1.4 var(--mono);color:var(--ink-3);margin-top:6px}
#peek.pure{border-color:var(--pure)}#peek.bound{border-color:var(--bound)}#peek.outside{border-color:var(--outside)}

@media (max-width:1080px){
  .twocol,.patgrid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .rulegrid,.keygrid{grid-template-columns:1fr}
  .ebody{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .spine{
    position:fixed;left:0;top:calc(var(--head) + env(safe-area-inset-top,0px));
    width:280px;z-index:50;background:var(--card);display:none;
    box-shadow:0 12px 40px rgba(19,23,26,.2);
  }
  .spine.open{display:block}
