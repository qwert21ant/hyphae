<script type="application/json" id="model-data">{"schemaVersion":1,"metadata":{"name":"Untitled","description":"","createdAt":"2026-09-15T08:36:11.280Z","updatedAt":"2026-09-15T08:36:11.280Z"},"activeProfile":"c4-backend","nodes":[{"id":"1dd6e6eb-e0fc-4121-a887-f8baafb58c67","name":"Continuo","type":"System","parentId":null,"root":null,"role":null,"foundational":false,"description":"Continuo is a Baritone-inspired automation mod built around the one decision Baritone did not make: the core knows nothing about Minecraft. The world, the player and the inputs are reached through a narrow platform SPI, and each supported version×loader pair implements that SPI as a thin adapter. The trade-off is that every capability the core wants must be expressible in the SPI's minimal, 1.7.10-compatible surface — in exchange the pathfinding, movement and execution logic are tested headlessly against fixture worlds and ship as one artifact.","codeRefs":[],"docRefs":["mc-automation-architecture.md","docs/injection-strategy.md","docs/toolchain-decision.md"],"createdAt":"2026-09-15T09:13:33.569Z","updatedAt":"2026-09-15T09:13:33.569Z","fields":{"responsibilities":["Plans and walks routes through a Minecraft world with a single core artifact shared by every supported game version","Confines all game- and loader-specific code to per-version adapters so the core never needs a fork per version"],"rules":["Nothing outside an adapter references Minecraft or a mod loader, and the build fails if it does","Module dependencies point one way only; nothing depends on an adapter"],"summary":"Cross-version Minecraft bot: one pure core, thin per-version adapters"}},{"id":"0a22b87f-d84f-4d70-9271-5b44f7263e27","name":"Platform SPI","type":"Container","parentId":"1dd6e6eb-e0fc-4121-a887-f8baafb58c67","root":"platform/","role":null,"foundational":false,"description":"Kept deliberately minimal: every type added here is a compatibility obligation on every future adapter. Testing seams are kept out of it for the same reason and live on the core side instead.","codeRefs":[],"docRefs":[],"createdAt":"2026-09-15T09:14:00.491Z","updatedAt":"2026-09-15T10:31:42.182Z","fields":{"responsibilities":["Defines what the core may ask of the game: block reads, player state, tick events, platform facts and input","States the four global rules every adapter and the core must honour, in a numbering the conformance suite depends on"],"rules":["Never references a Minecraft or loader type","Never assumes a Minecraft version newer than 1.7.10","**Rule 1 — Threading:** every call in either direction happens on the client main thread and never blocks","**Rule 2 — Lifecycle:** the core is started once and stopped on every change of the client's level, including a dimension change","**Rule 3 — Faults:** a core fault never reaches the game's tick loop; the core is stopped and gets no ticks until the next world load","**Rule 4 — Actuation is level-triggered:** the platform may clear held input at any time, so the core restates its whole desired input every tick"],"summary":"The contract between the pure core and any Minecraft version","technology":"Java"}},{"id":"9a66c47b-ea1f-4789-8ed2-02e779d0ab63","name":"Core","type":"Container","parentId":"1dd6e6eb-e0fc-4121-a887-f8baafb58c67","root":"core/","role":null,"foundational":false,"description":"The layer where a Minecraft block stops being a version-specific state and becomes a fact the rest of the core can reason about. Geometry does most of the work, so the per-version tables stay a few dozen rows. Snapshots exist because a search reads each position many times over and every live read is a main-thread SPI call; copying once and sealing turns those repeats into memory lookups.","codeRefs":[],"docRefs":[],"createdAt":"2026-09-15T09:14:00.494Z","updatedAt":"2026-09-15T10:35:27.080Z","fields":{"responsibilities":["Turns the SPI's raw block states into version-independent block facts using per-version override tables","Provides a cheap, sealable copy of the world a search can read repeatedly","Declares the seam an adapter runtime drives the core through"],"rules":["Contains no bot behaviour a conformance suite would have to encode"],"summary":"Version-independent world model: block classification and snapshots","technology":"Java"}},{"id":"979f2e82-9a64-4e74-995f-3a12161f5e92","name":"Movement API","type":"Container","parentId":"1dd6e6eb-e0fc-4121-a887-f8baafb58c67","root":"core-movement/","role":null,"foundational":false,"description":"Split out of the pathfinder so a movement can be written without seeing the search. The dependency-direction check keeps it that way, which is what lets the parkour plugin serve as proof that the seam holds. Not yet stable for out-of-tree authors: planned additions are expected to be additive but carry no compatibility promise.","codeRefs":[],"docRefs":[],"createdAt":"2026-09-15T09:14:00.495Z","updatedAt":"2026-09-15T10:35:27.082Z","fields":{"responsibilities":["Defines what a movement is, what it costs and when a block can be stood on","Filters and orders the active movements for a search by capability"],"rules":["Exposes nothing of the search: a movement cannot see how A* works"],"summary":"Published contract a movement plugin compiles against","technology":"Java"}},{"id":"5f00f65b-d38e-4057-9497-07d436443301","name":"Pathfinder","type":"Container","parentId":"1dd6e6eb-e0fc-4121-a887-f8baafb58c67","root":"core-pathfinder/","role":null,"foundational":false,"description":"Baritone's A* rethought for a core that cannot touch the game. Because the world arrives only as a block source, every search can be pinned by fixture-world tests, and determinism is a hard requirement those tests rely on. The search can be sliced across ticks without changing its result, which is what lets the executor walk a long route before it is fully planned.","codeRefs":[],"docRefs":[],"createdAt":"2026-09-15T09:14:00.496Z","updatedAt":"2026-09-15T10:35:27.083Z","fields":{"responsibilities":["Finds a route from a start to a goal through a world it sees only as a block source","Supplies the built-in ground movements","Reports why a search ended when it does not reach the goal"],"rules":["Deterministic: the same world and goal yield the same path, with budgets counted in nodes rather than time"],"summary":"Headless A* search over block positions toward a goal","technology":"Java"}},{"id":"654c0dbe-f216-4d99-beaa-6470527193d2","name":"Engine","type":"Container","parentId":"1dd6e6eb-e0fc-4121-a887-f8baafb58c67","root":"core-engine/","role":null,"foundational":false,"description":"Today this is the whole of the core's behaviour: walk to a marked block. The architecture doc's process manager and task scripts do not exist yet; this container is where they would sit. It holds no reference to its owner, so the adapter constructs it and the shared runtime drives it, and it is tested with no game on the classpath.","codeRefs":[],"docRefs":[],"createdAt":"2026-09-15T09:14:00.497Z","updatedAt":"2026-09-15T10:35:27.084Z","fields":{"responsibilities":["Turns a destination into a path and the path into per-tick inputs","Is the core implementation an adapter hands to the runtime"],"rules":["A walk never plans a parkour jump: its searches are granted no movement capabilities","Turns the camera at a bounded rate rather than snapping to a heading"],"summary":"Drives the player along a planned path, one tick at a time","technology":"Java"}},{"id":"d8c22384-0a36-4361-9612-5df05b754a8f","name":"Parkour Movement","type":"Container","parentId":"1dd6e6eb-e0fc-4121-a887-f8baafb58c67","root":"movement-parkour/","role":null,"foundational":false,"description":"Deliberately a separate module with access only to the movement API. Nothing in the core names it; it is found through Java service loading. The only consumer that grants the parkour capability today is the dev path probe, so normal walks never use it.","codeRefs":[],"docRefs":[],"createdAt":"2026-09-15T09:14:00.498Z","updatedAt":"2026-09-15T10:35:27.085Z","fields":{"responsibilities":["Proves the movement seam works for a plugin with no access to the search"],"rules":["Discovered at runtime; nothing in the core names it"],"summary":"Parkour jump as an out-of-tree movement plugin","technology":"Java"}},{"id":"ed5b165e-8593-4cb6-94ca-ea11055f94c4","name":"Adapter Runtime","type":"Container","parentId":"1dd6e6eb-e0fc-4121-a887-f8baafb58c67","root":"runtime/","role":null,"foundational":false,"description":"Extracted from what used to be duplicated across the Fabric and Forge mod entrypoints. It touches the game only through non-game handles, which is what made fault handling, click draining and tick pairing testable offline.","codeRefs":[],"docRefs":[],"createdAt":"2026-09-15T09:14:00.500Z","updatedAt":"2026-09-15T09:14:00.500Z","fields":{"responsibilities":["Discharges the adapter side of the platform's global rules once, for every version","Hosts dev-only probes that run the pathfinder against a live world"],"rules":["Holds no bot behaviour"],"summary":"Version-independent adapter machinery shared by every adapter","technology":"Java"}},{"id":"6f7466ca-7bfe-4e3d-a397-50b2ac990a2e","name":"Fabric 1.21.11 Adapter","type":"Container","parentId":"1dd6e6eb-e0fc-4121-a887-f8baafb58c67","root":"adapters/adapter-fabric-1.21.11/","role":null,"foundational":false,"description":"The modern-version adapter, built with Fabric Loom on official Mojang mappings. It stays thin because everything version-independent moved into the shared runtime; what remains is translating the SPI into 1.21.11 client calls and registering keys. Adapter code cannot be tested headlessly, so it is gated by the manual smoke checklist and review against decompiled sources.","codeRefs":[],"docRefs":[],"createdAt":"2026-09-15T09:14:00.502Z","updatedAt":"2026-09-15T10:35:27.086Z","fields":{"responsibilities":["Binds the platform SPI to the modern Minecraft client","Wires the core, engine and runtime into a loadable mod"],"summary":"Implements the platform SPI for Minecraft 1.21.11 on Fabric","technology":"Fabric"}},{"id":"de24162f-a108-4b63-8f8f-e8fc5d686071","name":"Forge 1.7.10 Adapter","type":"Container","parentId":"1dd6e6eb-e0fc-4121-a887-f8baafb58c67","root":"adapters/adapter-forge-1.7.10/","role":null,"foundational":false,"description":"Built with RetroFuturaGradle against decompiled, deobfuscated 1.7.10 sources. An access transformer opens the client fields the bindings must write, and has to be applied at both of RFG's deobfuscation stages to survive Forge's own source patches. 1.7.10 has no main-thread client-stopping event, so this adapter satisfies the lifecycle rule's shutdown clause by the omission the contract explicitly permits.","codeRefs":[],"docRefs":[],"createdAt":"2026-09-15T09:14:00.502Z","updatedAt":"2026-09-15T10:31:42.186Z","fields":{"responsibilities":["Binds the platform SPI to the legacy Minecraft client","Wires the core, engine and runtime into a loadable mod"],"rules":["Holds keys through each key binding's own pressed state, never the static global key route the platform contract calls non-conformant"],"summary":"Implements the platform SPI for Minecraft 1.7.10 on Forge","technology":"Forge"}},{"id":"dbacee45-2803-4b3a-b0a9-e4794022a281","name":"Parkour Jump","type":"Component","parentId":"d8c22384-0a36-4361-9612-5df05b754a8f","root":null,"role":null,"foundational":false,"description":"The first movement spanning two axis steps, which makes it the case that exercises the search's per-step admissibility condition for real. Registered through `META-INF/services/dev.continuo.movement.IMovementType`, so the core finds it at runtime without naming it.","codeRefs":["src/main/java/dev/continuo/movement/parkour/","src/main/resources/META-INF/services/"],"docRefs":[],"createdAt":"2026-09-15T09:17:20.381Z","updatedAt":"2026-09-15T09:17:20.381Z","fields":{"responsibilities":["Adds a jump across a single non-standable gap at the same height as a candidate move","Declares its cost so the search's heuristic stays admissible across a two-block move"],"rules":["Never offered where the gap is standable, so walking is never outbid by jumping","Only one block and level: longer jumps are claims about momentum nothing has measured"],"summary":"Offers sprint-jumps across a one-block gap to the search","technology":"Java"}},{"id":"9bcb16a5-0f18-4b87-a831-5fd8df34a1c9","name":"Core Entry Point","type":"Component","parentId":"654c0dbe-f216-4d99-beaa-6470527193d2","root":null,"role":null,"foundational":false,"description":"Deliberately holds no static state and knows nothing about whatever holds it — the adapter constructs it and drives it, and that is exactly what keeps it testable with no Minecraft on the classpath. That trade-off is why the lifecycle guarding here matters: a `start` that throws partway through must not leave `stop` free to throw again on top of it, since a caller already in that position is in an unspecified state either way.","codeRefs":["ContinuoCore.java"],"docRefs":[],"createdAt":"2026-09-15T09:19:43.317Z","updatedAt":"2026-09-15T10:35:32.096Z","fields":{"responsibilities":["Gives the adapter a single Minecraft-free type to construct, start, and drive every tick","Builds the classified block reads a level's walk depends on, and shares them with every reader","Releases every held input on a level transition, so a disconnect mid-walk never leaves a key latched"],"rules":["Writes nothing until `start` has been called, and never leaves a partially-failed `start` in a state that throws again on `stop`"],"summary":"The adapter-facing lifecycle: start, stop, tick, and the current walk target"}},{"id":"f47fd47b-7529-4d24-a5e9-ed2121633dc0","name":"Path Executor","type":"Component","parentId":"654c0dbe-f216-4d99-beaa-6470527193d2","root":null,"role":null,"foundational":false,"description":"Recomputes the whole input set every tick from the path and the player's current position, rather than remembering what it last pressed — so a tick that drops held keys costs at most one lost tick instead of silently truncating a walk. A search's segments are adopted as each one finishes rather than only once a full route is found, which is what lets a plan-ahead search run alongside driving instead of blocking it: inputs keep being written on the very ticks a continuation is being searched for.","codeRefs":["PathExecutor.java","PathFollower.java"],"docRefs":[],"createdAt":"2026-09-15T09:19:43.319Z","updatedAt":"2026-09-15T10:35:32.099Z","fields":{"responsibilities":["Keeps exactly one path being walked at a time, and replaces it before it runs out","Notices when the player has fallen off the path or stopped advancing, and repaths from where it actually is","Gives up on a destination once repathing has failed too many times in a row, instead of retrying forever","Tracks where the player currently is on the driven path, within a bounded window, so a route that loops back on itself cannot anchor to the wrong revolution"],"rules":["Writes no input at all while idle, so it never fights the user's own keyboard","Never grants a movement capability its own searches don't already assume, so a search here never produces a step it cannot drive","Restates the full input set and desired facing every tick rather than remembering what it last pressed"],"summary":"Turns a path into per-tick inputs, and keeps searching so it never runs out"}},{"id":"3f0ec4a1-2478-456e-b37b-a6246a9e6d13","name":"Humanized Actuator","type":"Component","parentId":"654c0dbe-f216-4d99-beaa-6470527193d2","root":null,"role":null,"foundational":false,"description":"The seam future anticheat plausibility work extends without touching the executor or the movements it drives: because it is a plain core-side decorator around the adapter's actuator, that work stays testable and version-independent instead of being duplicated per adapter.","codeRefs":["HumanizedActuator.java"],"docRefs":[],"createdAt":"2026-09-15T09:19:43.320Z","updatedAt":"2026-09-15T09:19:43.320Z","fields":{"responsibilities":["Caps the player's turn rate to something a human could plausibly produce","Absorbs a server-side rotation correction or the user's own mouse nudge on the very next tick, rather than fighting or detecting it"],"rules":["Never drops or delays a pressed input — only the requested facing is throttled","Remembers no target and no prior rotation; every call steps from the player's actual current yaw"],"summary":"Bounds how fast the simulated player can turn, so aim doesn't teleport"}},{"id":"b510a9cb-ba0c-4f9a-8723-9bd0b4a1265b","name":"World Reading","type":"Component","parentId":"0a22b87f-d84f-4d70-9271-5b44f7263e27","root":null,"role":null,"foundational":false,"description":"Some blocks compute their geometry from their neighbours rather than from their state alone, which is why the expensive query takes a position instead of a cached identifier — an implementation given only an identifier could not answer for those blocks. The core's caching is sound only because its own shape categories are behavioural rather than literal, so a neighbour-dependent block's cached geometry can come from whichever instance was described first.","codeRefs":["IBlockView.java","BlockDescription.java"],"docRefs":[],"createdAt":"2026-09-15T09:19:48.754Z","updatedAt":"2026-09-15T09:19:48.754Z","fields":{"responsibilities":["Lets the core learn a block's raw facts — collision, fluid, climbable, gravity — without any version-specific knowledge","Keeps classification (safe, a slab, worth avoiding) entirely on the core's side, so two adapters can never disagree about the same block","Tells the core whether a chunk is loaded, distinctly from a position that simply lies outside the world"],"rules":["The cheap per-position query and the expensive per-state query are contractually distinct: the core calls the expensive one only once per state it hasn't seen, then caches the result","A block's raw facts never encode a verdict about the block"],"summary":"Read-only, judgement-free view of the live world's blocks"}},{"id":"e21f82e8-7e41-43fc-9938-e109b82a58b6","name":"Actuation","type":"Component","parentId":"0a22b87f-d84f-4d70-9271-5b44f7263e27","root":null,"role":null,"foundational":false,"description":"Yaw and pitch are combined into one call because both target games apply rotation as a single write, and the conventions those two values follow are facts about the underlying games rather than inventions of this contract.","codeRefs":["IActuator.java","Input.java"],"docRefs":[],"createdAt":"2026-09-15T09:19:48.755Z","updatedAt":"2026-09-15T09:19:48.755Z","fields":{"responsibilities":["Lets the core press movement inputs and set the player's facing without touching any game internals","Defines the abstract movement vocabulary — `FORWARD`, `JUMP`, `SPRINT`, and the rest — that every adapter must support","Makes input humanization a single future seam rather than a cross-cutting concern"],"rules":["Held input and facing may be cleared or overwritten by the platform at any time without notice, so the core — not this channel — is responsible for restating its full desired state every tick","Facing is set absolutely, never as a delta, because the server's own rotation corrections overwrite it independently of anything the core has sent"],"summary":"The single channel through which the core acts on the game"}},{"id":"a2154030-43cd-4c00-8725-9dc1cff18eb1","name":"Player State","type":"Component","parentId":"0a22b87f-d84f-4d70-9271-5b44f7263e27","root":null,"role":null,"foundational":false,"description":"The field budget is deliberately narrow — velocity, eye height, bounding-box size, fluid state and sneak/sprint state are all natively available on both target games and all deliberately left out, because nothing consumes them yet. Each field added here is a version-compatibility obligation on every future adapter.","codeRefs":["IPlayerView.java"],"docRefs":[],"createdAt":"2026-09-15T09:19:48.756Z","updatedAt":"2026-09-15T09:19:48.756Z","fields":{"responsibilities":["Gives the core the player's feet position, facing, and ground state for the current tick"],"rules":["Never describes anything but the current tick — a core wanting the previous tick's state has to have stored it itself","Y always means the bottom of the player's collision box, resolving an ambiguity the two target games define differently"],"summary":"Per-tick snapshot of the local player's position and facing"}},{"id":"ca185d62-b446-4a0f-bc2e-f319ee8d47bb","name":"Game Events","type":"Component","parentId":"0a22b87f-d84f-4d70-9271-5b44f7263e27","root":null,"role":null,"foundational":false,"description":"Ticks counted and ticks of ground travelled are not the same quantity — this keeps firing while the game is paused or a death screen is up, since the tick loop still runs even though the world itself is frozen.","codeRefs":["IGameEvents.java","TickPhase.java"],"docRefs":[],"createdAt":"2026-09-15T09:19:48.757Z","updatedAt":"2026-09-15T09:19:48.757Z","fields":{"responsibilities":["Tells the core when each client tick's two phases occur, so the rest of the contract knows when it is safe to act or read","Bounds every other read and write in this package to the window while a world is loaded and a local player exists"],"rules":["An input set during the pre-tick phase always lands on that same tick, never the next one","The post-tick phase may go undelivered for a tick only when the window has already closed or a fault has occurred — never for any other reason","Never delivered re-entrantly: one call finishes before the next begins"],"summary":"Delivers tick lifecycle events from the adapter into the core"}},{"id":"d1338404-7825-4265-a82c-9100318a2254","name":"Platform Context","type":"Component","parentId":"0a22b87f-d84f-4d70-9271-5b44f7263e27","root":null,"role":null,"foundational":false,"description":"Bundled into one type so that adding a capability later changes a single signature rather than every call site. The version and loader metadata has no consumer yet; it exists because it costs nothing now and establishes the direction capability negotiation will need later.","codeRefs":["IPlatformContext.java","IPlatformInfo.java","Loader.java"],"docRefs":[],"createdAt":"2026-09-15T09:19:48.758Z","updatedAt":"2026-09-15T09:19:48.758Z","fields":{"responsibilities":["Vends the actuator, block reader, and player reader as stable instances the core may cache for the adapter's whole lifetime","Reports which game version and mod loader the core is running under"],"rules":["Every accessor returns the same instance on every call for as long as the adapter lives"],"summary":"Bundles everything an adapter hands the core at startup"}},{"id":"55aaecfd-d920-4c25-b792-87afe87f1c5e","name":"Global Rule Guard","type":"Component","parentId":"ed5b165e-8593-4cb6-94ca-ea11055f94c4","root":null,"role":null,"foundational":false,"description":"Before this existed the same lifecycle, fault-containment and click-draining logic sat twice, once in each of the Fabric and Forge entrypoints, as version-independent Java that happened to be duplicated. Moving it behind an identity-compared level, a null-checked player, a boolean click poll and a logger made it testable offline, which adapter code otherwise never is.","codeRefs":["src/main/java/dev/continuo/runtime/AdapterRuntime.java","src/main/java/dev/continuo/runtime/ClickSource.java"],"docRefs":[],"createdAt":"2026-09-15T09:20:13.200Z","updatedAt":"2026-09-15T09:20:13.200Z","fields":{"responsibilities":["Deliver `PRE`/`POST` tick calls to the core only while a world is loaded and a player exists","Contain any fault the core throws so it never reaches the game's own tick loop","Enforce that the core is started exactly once and stopped on every world unload or dimension change","Drain queued clicks outside a world or during a fault so none replay once conditions change"],"rules":["A `POST` call never fires without a same-tick `PRE`","A fault silences every further tick until the next world load, and clears automatically then","A click queued while out of a world or while faulted is discarded, never replayed later"],"summary":"Discharges the platform's four global rules so two adapters can't drift on them"}},{"id":"3d4cdcbb-0419-4d27-8792-bec5a8d5c51e","name":"Path Probe","type":"Component","parentId":"ed5b165e-8593-4cb6-94ca-ea11055f94c4","root":null,"role":null,"foundational":false,"description":"The conformance suite cannot see an adapter's live block view or player state, so this exists to let an owner point a running game at a search and read back what happened. A wall-clock stopping condition would make the pathfinder's deterministic-outcome tests flaky, so nothing here can influence search behaviour; the live run is replayed twice against a sealed snapshot purely to measure where its time went, which only a dev-only probe can afford to spend.","codeRefs":["src/main/java/dev/continuo/runtime/PathProbe.java","src/main/java/dev/continuo/runtime/ProbeBounds.java","src/main/java/dev/continuo/runtime/ProbeReport.java"],"docRefs":[],"createdAt":"2026-09-15T09:20:13.202Z","updatedAt":"2026-09-15T09:20:13.202Z","fields":{"responsibilities":["Let an owner mark a destination and search live terrain toward it from a running game","Split a search's measured time into world-reading cost and pure search cost","Surface the standing and look round-trip invariants no automated test can reach on a live adapter"],"rules":["A marked goal does not survive a level or dimension change","The drawn map is clamped and anchored on the start rather than centred, so a distant goal can fall outside it","The elapsed time it reports is never consulted by the search itself, only logged"],"summary":"Dev-only probe that runs a live search and renders it as an ASCII map"}},{"id":"7bd90e71-8bf8-4811-bdbe-420d2d594da9","name":"Block Dump Walker","type":"Component","parentId":"ed5b165e-8593-4cb6-94ca-ea11055f94c4","root":null,"role":null,"foundational":false,"description":"An adapter's block view has the same structural gap as the search probe beside it: asserting it needs a live world, which the conformance suite cannot provide. An owner runs this once per version against an identical fixture structure, checks the two outputs into source control, and a headless test diffs them instead.","codeRefs":["src/main/java/dev/continuo/runtime/BlockDumpWalker.java"],"docRefs":[],"createdAt":"2026-09-15T09:20:13.203Z","updatedAt":"2026-09-15T09:20:13.203Z","fields":{"responsibilities":["Produce one comparable text dump per Minecraft version so a headless test can diff them","Pair the raw block identity with the classifier's decision on the same line, so a mismatch reads as either a classification or a placement error without a second run"],"rules":["Describes any distinct block state only once, even when it recurs at many positions in the walked region"],"summary":"Dev-only walker that renders a region's blocks for cross-adapter parity checks"}},{"id":"a362ef87-272c-4655-88e9-408f5f50a515","name":"Block Classification","type":"Component","parentId":"9a66c47b-ea1f-4789-8ed2-02e779d0ab63","root":null,"role":null,"foundational":false,"description":"Classification is a pure function of a description and the per-version override table — no world, no mutable state — which is what lets both adapters run through identical code and makes cross-adapter agreement structural rather than hoped-for.","codeRefs":["BlockClassifier.java","BlockData.java","BlockShape.java","Fluid.java","BlockTag.java"],"docRefs":[],"createdAt":"2026-09-15T09:20:24.946Z","updatedAt":"2026-09-15T09:20:24.946Z","fields":{"responsibilities":["Gives every adapter's raw description the same shape and fluid classification, so the two Minecraft versions cannot disagree about what a block means","Keeps an unreadable position distinguishable from a genuinely empty one"],"rules":["A shape that doesn't exactly match a category is `PARTIAL`, never the nearest guessed category — a wrong-but-plausible answer is worse than a vaguer true one"],"summary":"Turns an adapter's raw block description into the core's classified block data","technology":"Java"}},{"id":"88890791-bb2b-4b0d-a322-f7ebc691fede","name":"Block Tables","type":"Component","parentId":"9a66c47b-ea1f-4789-8ed2-02e779d0ab63","root":null,"role":"datastore","foundational":false,"description":"Two sections — whole-block rows and state-specific rows, with states winning — over a deliberately tiny hand-rolled JSON subset (objects, strings, and string arrays only) so a strict reader can catch a typo that a general-purpose parser would happily swallow.","codeRefs":["BlockTable.java","BlockTableLoader.java","JsonReader.java","JsonValue.java","resources/blocks/"],"docRefs":[],"createdAt":"2026-09-15T09:20:24.948Z","updatedAt":"2026-09-15T09:20:24.948Z","fields":{"responsibilities":["Supplies the shape, fluid and tag overrides a block's geometry cannot derive on its own, such as soul sand slowing movement while shaped exactly like stone","Rejects a malformed or misspelled override table at load time instead of silently ignoring the mistake"],"rules":["An unrecognised game version yields an empty table rather than an error, so geometry-only classification always has a fallback"],"summary":"Per-version override rows for facts geometry alone can't express, loaded from shipped JSON","technology":"Java"}},{"id":"3bfc3f3b-4b98-4988-9811-5ac8037800ba","name":"Live Block Reader","type":"Component","parentId":"9a66c47b-ea1f-4789-8ed2-02e779d0ab63","root":null,"role":null,"foundational":false,"description":"The memo is session-scoped, so it must not outlive the level it was built against; clearing it is tied to the same level-transition moment the adapter lifecycle already requires, adding no new condition to track.","codeRefs":["BlockLookup.java","BlockSource.java"],"docRefs":[],"createdAt":"2026-09-15T09:20:24.949Z","updatedAt":"2026-09-15T09:20:24.949Z","fields":{"responsibilities":["Gives search code a read-only block view it can implement over a live world or a headless test fixture interchangeably","Keeps classification cost proportional to the number of distinct block states seen, not the number of positions queried"],"summary":"Reads classified blocks from the live world, one classification per block state","technology":"Java"}},{"id":"6a33eb78-f607-4e25-a7b9-3b4f28c0ffdf","name":"World Snapshot","type":"Component","parentId":"9a66c47b-ea1f-4789-8ed2-02e779d0ab63","root":null,"role":null,"foundational":false,"description":"Staleness is the contract, not a bug: a snapshot is a copy at one instant, nothing refreshes it, and a caller that finds the world has moved on repaths instead. Storage is sectioned to match the locality of how a search actually reads terrain, chosen by measurement over the naive per-position map it replaced.","codeRefs":["WorldSnapshot.java","SealedSnapshot.java","SectionStore.java","PositionKey.java"],"docRefs":[],"createdAt":"2026-09-15T09:20:24.950Z","updatedAt":"2026-09-15T09:20:24.950Z","fields":{"responsibilities":["Turns repeated reads of the same position within one search into a single read from the live block source","Freezes into an immutable, safely-shared copy once a search is done reading"],"summary":"A point-in-time copy of exactly the world positions one search touched","technology":"Java"}},{"id":"bfdc8c6d-0eb2-4224-89fb-3f7a6c692e78","name":"Core Lifecycle Seam","type":"Component","parentId":"9a66c47b-ea1f-4789-8ed2-02e779d0ab63","root":null,"role":null,"foundational":false,"description":"Deliberately excludes bot behaviour such as walking to a goal: an adapter runtime dispatches a consumed click to a supplied callback instead, so the runtime never has to learn what a walk is.","codeRefs":["CoreApi.java"],"docRefs":[],"createdAt":"2026-09-15T09:20:24.951Z","updatedAt":"2026-09-15T09:20:24.951Z","fields":{"responsibilities":["Gives a conformance suite a core-side type to substitute a recording implementation for, so an adapter runtime's behaviour can be observed without a running game"],"summary":"The start/stop contract an adapter runtime drives the core through","technology":"Java"}},{"id":"dde8a451-acce-43d7-9030-a058f8d4138e","name":"Runtime Log","type":"Component","parentId":"9a66c47b-ea1f-4789-8ed2-02e779d0ab63","root":null,"role":null,"foundational":false,"description":"Exists here, rather than in an adapter, because Engine and the Adapter Runtime are sibling modules that cannot see each other but both need to log through the same contract.","codeRefs":["RuntimeLog.java"],"docRefs":[],"createdAt":"2026-09-15T09:20:24.952Z","updatedAt":"2026-09-15T10:31:25.390Z","fields":{"responsibilities":["Gives every module and every game version one abstraction to log through, implemented once per adapter, so both versions emit byte-identical text"],"summary":"Core's version-independent contract for reporting to the host game's logger","technology":"Java"}},{"id":"23b592e9-e0fc-4635-ae7f-c5ef9977f79a","name":"Movement Contract","type":"Component","parentId":"979f2e82-9a64-4e74-995f-3a12161f5e92","root":null,"role":null,"foundational":false,"description":"A movement is a plugin, not an enum member: this is what it compiles against, and it deliberately does not expose the search itself — a build-time dependency-direction check enforces that a movement module cannot see the pathfinder. `Cardinals` exists as accessors rather than an array constant because an array on a public interface is a mutable global a movement from another jar could reorder, silently breaking the determinism every built-in movement depends on.","codeRefs":["IMovementType.java","ExpansionContext.java","MutableExpansionContext.java","MoveSink.java","Cardinals.java"],"docRefs":[],"createdAt":"2026-09-15T09:20:57.126Z","updatedAt":"2026-09-15T09:20:57.126Z","fields":{"responsibilities":["The system relies on the movement contract to let a movement declare its identity, required capabilities, and cost bounds without seeing how the search works","The system relies on the movement contract to hand each movement a single, disposable view of the position it is expanding from","The system relies on `Cardinals` to fix the order every movement offers cardinal neighbours in, so cost ties break the same way on every run"],"rules":["Neighbours are always offered in the same fixed order, so a path's cost ties break identically on every run.","An `ExpansionContext` must never be retained past the call that handed it out — the search reuses one instance across every position it visits."],"summary":"The plugin API a movement compiles against: declare, expand, offer.","technology":"Java"}},{"id":"272a8fc1-d4ea-43dd-9d27-837f6bbbe130","name":"Contract Auditor","type":"Component","parentId":"979f2e82-9a64-4e74-995f-3a12161f5e92","root":null,"role":null,"foundational":false,"description":"Turns a movement's declared cost-per-unit into a checked claim rather than a trusted one, expanding it across many seeded worlds drawn from a block palette wide enough to reach every built-in movement's preconditions. It returns violations instead of asserting them, keeping JUnit off the production classpath while any module — including a plugin's own tests — can run it over its own movement.","codeRefs":["MovementContract.java"],"docRefs":[],"createdAt":"2026-09-15T09:20:57.128Z","updatedAt":"2026-09-15T09:20:57.128Z","fields":{"responsibilities":["The system relies on the contract auditor to catch a movement whose declared cost bound is too high before it silently breaks the search's shortest-path guarantee","The system relies on the auditor to report when it could not exercise a movement at all, rather than reading missing evidence as a pass"],"rules":["An empty result means a declaration was exercised and held — it never merely means nothing was checked.","Only the first counterexample is reported, since the same wrong declaration is wrong at every position a movement can offer from."],"summary":"Checks a movement's declared cost bounds against what it truly offers.","technology":"Java"}},{"id":"4227fd2f-c244-4277-ae27-1b2afd540060","name":"Movement Costs","type":"Component","parentId":"979f2e82-9a64-4e74-995f-3a12161f5e92","root":null,"role":null,"foundational":false,"description":"Every constant is derived from the decompiled sources of both target Minecraft versions and cites its lines, following the project's rule that Minecraft behaviour is evidenced, never recalled. The figures are admissible and self-consistent today, not yet validated against a real run — that is left to the first thing able to measure one.","codeRefs":["MovementCosts.java"],"docRefs":[],"createdAt":"2026-09-15T09:20:57.129Z","updatedAt":"2026-09-15T09:20:57.129Z","fields":{"responsibilities":["The system relies on the movement cost table to price every movement in a comparable, evidence-derived unit rather than a guess"],"rules":["Every figure takes the slower of the two supported Minecraft versions, so one table serves both adapters with no per-version seam.","Every movement is costed at the sprint rate, never the walk rate, because the executor sprints wherever it can."],"summary":"The versioned cost table every movement is priced from, in ticks.","technology":"Java"}},{"id":"63b2b973-c0f7-4870-bdb4-179d737b92cf","name":"Standability","type":"Component","parentId":"979f2e82-9a64-4e74-995f-3a12161f5e92","root":null,"role":null,"foundational":false,"description":"An earlier draft decided standing by testing block shape against a fixed set of categories, which refused to walk on any geometry it failed to recognise and disagreed between versions on blocks like farmland. Reading the collision-top number instead makes both versions agree; shape is still consulted for the two cases a number alone cannot answer.","codeRefs":["Standability.java"],"docRefs":[],"createdAt":"2026-09-15T09:20:57.130Z","updatedAt":"2026-09-15T09:20:57.130Z","fields":{"responsibilities":["The system relies on standability to be the only place that reads a block's shape, fluid, or collision top to decide movement facts"],"rules":["Standing and passability are always decided by measuring a block's collision top, never by switching on its shape category — so unrecognised or per-version geometry is classified consistently."],"summary":"Turns raw block facts into the passable/supports/standable predicates.","technology":"Java"}},{"id":"bc790d33-d671-4832-a213-9e353ef1611b","name":"Movement Registry","type":"Component","parentId":"979f2e82-9a64-4e74-995f-3a12161f5e92","root":null,"role":null,"foundational":false,"description":"Replaces the fixed array an earlier search iterated: adding a movement becomes a registration, or a jar on the classpath, rather than an edit to the search. Explicit registrations always keep their position ahead of discovered ones, which is what lets the built-in movements preserve their original expansion order. Filtering by capability produces an active set bound to the heuristic rates it implies, so a search can never filter by one movement set while scaling its estimate by another's.","codeRefs":["MovementRegistry.java","IMovementRegistry.java","Capability.java","CapabilitySet.java","ActiveMovements.java"],"docRefs":[],"createdAt":"2026-09-15T09:20:57.131Z","updatedAt":"2026-09-15T09:20:57.131Z","fields":{"responsibilities":["The system relies on the registry to find every movement on the classpath and register them in a deterministic, classpath-independent order","The system relies on the registry to reject a movement whose id collides with one already registered, or whose declared costs could stall or break the search","The system relies on `CapabilitySet` to decide, per caller, which registered movements are actually active"],"rules":["Discovered movements are always sorted by id before registration, so a path never depends on which order the classpath happened to load jars in.","A movement granted no capabilities by the caller is still active — an empty requirement is always satisfied."],"summary":"Discovers, deduplicates, and capability-filters the usable movements.","technology":"Java"}},{"id":"fe7819e4-ede2-4f25-b3ff-f90bf9644e19","name":"Heuristic Rates","type":"Component","parentId":"979f2e82-9a64-4e74-995f-3a12161f5e92","root":null,"role":null,"foundational":false,"description":"Horizontal distance is measured in octile units rather than Chebyshev steps — one cardinal step is one unit, one diagonal step is roughly 1.41 units — because crediting a diagonal move as a single step left the estimate short and degraded the search toward an exhaustive one on open ground. The same octile calculation is deliberately shared with the contract auditor's check of a movement's declared bound, so the two can never silently drift apart.","codeRefs":["HeuristicRates.java"],"docRefs":[],"createdAt":"2026-09-15T09:20:57.131Z","updatedAt":"2026-09-15T09:20:57.131Z","fields":{"responsibilities":["The system relies on heuristic rates to keep the search's distance estimate admissible by scaling it to the cheapest active movement on each axis independently"],"rules":["Horizontal and vertical rates are minimised independently, so a cheap movement on one axis never loosens the estimate on the other.","A displacement's estimate is always the larger of its horizontal and vertical halves, never their sum, since one move can close both axes at once."],"summary":"The horizontal/vertical rates and octile math the search's estimate scales by.","technology":"Java"}},{"id":"7dd35231-4d36-498b-817e-f0283734106a","name":"Movement Kind","type":"Component","parentId":"979f2e82-9a64-4e74-995f-3a12161f5e92","root":null,"role":null,"foundational":false,"description":"A path carries no movement identity of its own, so either a consumer re-derives what each step was or the search pays to thread an edge identity through its hottest interface; derivation was chosen on the evidence that today's five registered movements make it lossless. That property is not permanent — a future movement whose delta overlaps another's would break it silently in a client if the guarding test did not fail the build first, at the point such a movement is added.","codeRefs":["MovementKind.java"],"docRefs":[],"createdAt":"2026-09-15T09:20:57.132Z","updatedAt":"2026-09-15T09:20:57.132Z","fields":{"responsibilities":["The system relies on movement kind to let a consumer recover which movement produced a path step without the search threading movement identity through its hottest interface"],"rules":["A step's kind is derived, never stored, on the evidence that the registered movements' delta sets are pairwise disjoint and jointly cover everything the registry can produce — a property a build-time test guards rather than assumes."],"summary":"Names the movement kind that joins two positions, from their delta alone.","technology":"Java"}},{"id":"c37ab8af-ea11-4807-9da8-229fa8195fb1","name":"A* Search Engine","type":"Component","parentId":"5f00f65b-d38e-4057-9497-07d436443301","root":null,"role":null,"foundational":false,"description":"Splits into a fixed-budget driver and a steppable core, so one loop serves both a single unbounded call and a caller that must spend a search across many ticks in bounded slices. Because there is exactly one loop, a sliced search is guaranteed to reach the same answer as an unsliced one by construction, not merely by test coverage. The default node budget is not a guess: it is set from the largest expansion count measured across real routes, with headroom above the hardest of them.","codeRefs":["src/main/java/dev/continuo/pathfinder/AStarPathfinder.java","src/main/java/dev/continuo/pathfinder/Search.java","src/main/java/dev/continuo/pathfinder/PathNode.java","src/main/java/dev/continuo/pathfinder/QueuedNode.java","src/main/java/dev/continuo/pathfinder/QueuedNodeOrder.java"],"docRefs":[],"createdAt":"2026-09-15T09:21:21.199Z","updatedAt":"2026-09-15T09:21:21.199Z","fields":{"responsibilities":["Finds the cheapest route between two points, using only the movements a caller has unlocked","Expands candidates in a fixed, reproducible order, so identical searches return identical paths","Reports the closest useful progress when the node budget runs out, instead of nothing at all"],"rules":["A node closed once is never reopened, even when a cheaper route to it is found later","An identical search over an identical world always returns the same path"],"summary":"Runs one deterministic A* search over the block graph, sliceable."}},{"id":"c53eb98f-7e1c-4b5b-a90d-2171797b66e9","name":"Segmented Runner","type":"Component","parentId":"5f00f65b-d38e-4057-9497-07d436443301","root":null,"role":null,"foundational":false,"description":"A run outlives a single tick, so it owns the world view it reads for as long as the run is alive and must be released explicitly if the underlying level changes mid-run. The point a budget-exhausted segment backs off to is chosen by proximity to the goal alone -- a cost term was tried and measured to bias selection toward the start, producing segments too timid to make any real progress, so the scoring stays cost-free.","codeRefs":["src/main/java/dev/continuo/pathfinder/SegmentedSearch.java","src/main/java/dev/continuo/pathfinder/Run.java","src/main/java/dev/continuo/pathfinder/SegmentedResult.java","src/main/java/dev/continuo/pathfinder/SegmentSelector.java"],"docRefs":[],"createdAt":"2026-09-15T09:21:21.202Z","updatedAt":"2026-09-15T09:21:21.202Z","fields":{"responsibilities":["Keeps a bot moving toward a distant goal by walking each segment and re-searching from where it stopped","Picks a believable backoff point when a search's budget runs out, instead of giving up immediately","Bounds how many segments a run may take, so an unreachable goal terminates instead of searching forever"],"rules":["Segmentation is a fallback for an undersized budget, never the intended way to reach a distant goal","A run's accumulated route keeps every segment already walked, even when the run overall does not reach the goal"],"summary":"Chains searches into a long-distance run when one budget falls short."}},{"id":"3271f29c-1fd8-4554-b6f7-65bef6aba74c","name":"Goals","type":"Component","parentId":"5f00f65b-d38e-4057-9497-07d436443301","root":null,"role":null,"foundational":false,"description":"Two shapes cover what callers ask for today: an exact block, and a column open at any height. Both estimates factor through the active movement set's own minimum costs rather than a fixed constant, so a heuristic stays valid no matter which movements a particular search has unlocked.","codeRefs":["src/main/java/dev/continuo/pathfinder/Goal.java","src/main/java/dev/continuo/pathfinder/GoalBlock.java","src/main/java/dev/continuo/pathfinder/GoalXZ.java"],"docRefs":[],"createdAt":"2026-09-15T09:21:21.203Z","updatedAt":"2026-09-15T09:21:21.203Z","fields":{"responsibilities":["Tells a search whether a candidate position satisfies what the caller asked for","Gives the search a lower bound on the remaining distance to any goal shape it defines"],"rules":["A goal's distance estimate can never overestimate the true remaining cost, or the search's shortest-path guarantee breaks"],"summary":"What a search is trying to reach, and a lower-bound distance to it."}},{"id":"f8c689af-fecc-4572-bd49-3457c332fab0","name":"Built-in Ground Moves","type":"Component","parentId":"5f00f65b-d38e-4057-9497-07d436443301","root":null,"role":null,"foundational":false,"description":"These four register into the default movement set in a fixed order, and that order is load-bearing: the search breaks equal-cost ties by discovery order, so registering them differently would silently change which of two equally cheap paths comes back. All four delegate what counts as stable ground to one shared classifier outside this package, so the rules about walkable terrain live in a single place rather than being restated per movement.","codeRefs":["src/main/java/dev/continuo/pathfinder/TraverseMove.java","src/main/java/dev/continuo/pathfinder/AscendMove.java","src/main/java/dev/continuo/pathfinder/DescendMove.java","src/main/java/dev/continuo/pathfinder/DiagonalMove.java"],"docRefs":[],"createdAt":"2026-09-15T09:21:21.203Z","updatedAt":"2026-09-15T09:21:21.203Z","fields":{"responsibilities":["Offers every legal ground movement from a position, so the search only ever sees positions a player could actually reach","Prices each movement so a cheaper route is always found before a more expensive one of equal usefulness"],"rules":["A diagonal step is refused unless both blocks at the corner are clear at feet and head height, since a player cannot squeeze between two blocks meeting at a corner","A fall only ever offers the landing, never a position passed through on the way down, since a falling player has no choices left to make mid-air"],"summary":"The four basic walk, jump, fall and diagonal moves every search starts with."}},{"id":"628cd4da-d958-4822-a6bf-d7b9b619bb10","name":"Path Results","type":"Component","parentId":"5f00f65b-d38e-4057-9497-07d436443301","root":null,"role":null,"foundational":false,"description":"One shared derivation turns a list of positions into the moves between them, so a result from a single search and a result from a chained multi-segment run can never disagree about what a route's steps are. Positions here are packed using the same key format a sibling module already keys its own terrain cache by, so a location computed here is directly comparable to one read back from a world snapshot with no conversion step.","codeRefs":["src/main/java/dev/continuo/pathfinder/PathResult.java","src/main/java/dev/continuo/pathfinder/PathResults.java","src/main/java/dev/continuo/pathfinder/PathOutcome.java","src/main/java/dev/continuo/pathfinder/Step.java","src/main/java/dev/continuo/pathfinder/Steps.java","src/main/java/dev/continuo/pathfinder/Pos.java"],"docRefs":[],"createdAt":"2026-09-15T09:21:21.204Z","updatedAt":"2026-09-15T09:21:21.204Z","fields":{"responsibilities":["Gives a caller one settled answer -- outcome, route and cost -- whether it came from a single search or a chained run","Derives the individual moves a route is made of, so nothing downstream has to re-derive a movement's kind from raw positions itself"],"rules":["Every outcome other than a found or partial route carries an empty path and a zero cost, never a stale value from an earlier attempt","A partial outcome always carries a real, non-empty route to somewhere useful, distinguishing a search that backed off from one that found nothing"],"summary":"What a search or run produced: outcome, route, cost and its steps."}},{"id":"aa1f1e46-87d4-4b0c-b29a-33e9b428b843","name":"Text Renderer","type":"Component","parentId":"5f00f65b-d38e-4057-9497-07d436443301","root":null,"role":null,"foundational":false,"description":"Deliberately ASCII rather than an image, since the people and agents debugging a failing route read text output directly rather than opening a file from a build directory. The round trip is not perfect on live terrain: a block outside the legend's classification prints as a wall rather than as itself, so a map captured from a running game can be stricter than the world it came from and needs checking for unmapped or unexpectedly-blocked characters before it is trusted as a regression fixture.","codeRefs":["src/main/java/dev/continuo/pathfinder/PathRenderer.java","src/main/java/dev/continuo/pathfinder/BlockLegend.java"],"docRefs":[],"createdAt":"2026-09-15T09:21:21.205Z","updatedAt":"2026-09-15T09:21:21.205Z","fields":{"responsibilities":["Turns a search result into a text map a person or an agent can read straight from test output","Keeps the character-to-block mapping identical between what gets rendered and what a fixture parser reads back, so a rendered failure is pasteable as a new test fixture"],"rules":["An overlay character replaces the terrain underneath rather than layering onto it, so a passable non-air block is indistinguishable from air wherever a path or expansion marker covers it","A block the legend cannot name renders the same as an unreadable block, so the two look identical once written"],"summary":"Renders a world and a search result as ASCII art fixtures can reuse."}},{"id":"a61e821d-b06a-4268-ac61-619e6b1490ec","name":"Mod Entrypoint","type":"Component","parentId":"de24162f-a108-4b63-8f8f-e8fc5d686071","root":null,"role":null,"foundational":false,"description":"No client-stopping hook exists here: this loader offers no main-thread client-stopping event, so conformance with the platform's shutdown rule is achieved by omission rather than an off-thread hook that would violate the SPI's threading contract. Log bridging exists because this version predates SLF4J in Minecraft, so the runtime's logs are routed through the logger the game itself ships.","codeRefs":["src/main/java/dev/continuo/adapter/forge/ContinuoForgeMod.java","src/main/java/dev/continuo/adapter/forge/Log4jRuntimeLog.java","src/main/resources/assets/continuo/lang/en_US.lang"],"docRefs":[],"createdAt":"2026-09-15T09:21:23.448Z","updatedAt":"2026-09-15T10:35:31.134Z","fields":{"responsibilities":["The system relies on the Mod Entrypoint to forward each client tick's start and end phases to the shared adapter runtime in the order Forge delivers them.","The system relies on the Mod Entrypoint to turn the walk keybind into a click that resolves against whichever goal was most recently marked.","The system relies on the Mod Entrypoint to route the shared runtime's log messages through the game's own logger."],"rules":["Holds no conformance state of its own for the tick-window and phase-ordering contract — that responsibility is discharged entirely by the shared adapter runtime, so this entrypoint and the Fabric one cannot diverge."],"summary":"Registers keybinds, forwards tick events to the runtime, and bridges its log sink","technology":"Forge"}},{"id":"749ca35b-ddda-46d6-a569-1cd01309411e","name":"Platform Bindings","type":"Component","parentId":"de24162f-a108-4b63-8f8f-e8fc5d686071","root":null,"role":null,"foundational":false,"description":"Composed behind a single context object so the rest of the mod depends on one seam rather than four separate bindings. Writing a chosen key binding's pressed state — rather than addressing a keycode — depends on an access transformer that widens a private field on Minecraft's own key-binding class, since this version's only public route addresses whichever binding currently holds a keycode rather than the one the adapter chose.","codeRefs":["src/main/java/dev/continuo/adapter/forge/ForgeActuator.java","src/main/java/dev/continuo/adapter/forge/ForgeBlockView.java","src/main/java/dev/continuo/adapter/forge/ForgePlayerView.java","src/main/java/dev/continuo/adapter/forge/ForgePlatformInfo.java","src/main/java/dev/continuo/adapter/forge/ForgePlatformContext.java","src/main/resources/META-INF/continuo_at.cfg"],"docRefs":[],"createdAt":"2026-09-15T09:21:23.449Z","updatedAt":"2026-09-15T09:21:23.449Z","fields":{"responsibilities":["The system relies on Platform Bindings to translate abstract input and look commands into concrete key-binding and player-field writes.","The system relies on Platform Bindings to report block geometry and identity exactly as 1.7.10 exposes them, leaving classification to the core.","The system relies on Platform Bindings to report the local player's position, orientation and ground state in the SPI's coordinate convention."],"rules":["Always reports the player's vertical position as the bottom of the collision box, never the network stance value — the two differ by 1.62 blocks on this version.","Never collapses still and flowing water into one fluid id — that classification is the core's job, not this adapter's.","Setting input state never changes behaviour on its own; only the core decides what to press."],"summary":"Implements the Platform SPI over the 1.7.10 client: input, look, blocks, player, version","technology":"Forge"}},{"id":"4c62b1f4-a9e1-45e9-9478-e6a3be1c149c","name":"Mod Entrypoint","type":"Component","parentId":"6f7466ca-7bfe-4e3d-a397-50b2ac990a2e","root":null,"role":null,"foundational":false,"description":"Kept deliberately thin, mirroring the container's own philosophy: nearly all game-facing decision logic lives in the shared `AdapterRuntime`, so this class mostly translates Fabric's own event API into calls onto it. `fabric.mod.json` names it as the mod's sole client entrypoint, and a small SLF4J bridge (`Slf4jRuntimeLog`) is built alongside it to satisfy the core's logging SPI.","codeRefs":["src/main/java/dev/continuo/adapter/fabric/ContinuoFabricMod.java#L39-L129","src/main/java/dev/continuo/adapter/fabric/ContinuoFabricMod.java#L203-L205","src/main/java/dev/continuo/adapter/fabric/Slf4jRuntimeLog.java","src/main/resources/fabric.mod.json","src/main/resources/assets/continuo/lang/en_us.json"],"docRefs":[],"createdAt":"2026-09-15T09:22:08.157Z","updatedAt":"2026-09-15T09:22:08.157Z","fields":{"responsibilities":["The system relies on Mod Entrypoint to build `ContinuoCore` and the shared `AdapterRuntime` once per client session","The system relies on Mod Entrypoint to forward every tick and lifecycle event Fabric delivers to `AdapterRuntime`, so both adapters see the same phase ordering"],"rules":["Registers exactly one production tick path through `AdapterRuntime`; the dev-only dump and probe keys are polled independently so they can never perturb the four global rules."],"summary":"Wires the Fabric client entrypoint to keybinds, core, and runtime","technology":"Fabric"}},{"id":"c2fb492e-73f7-49f2-8690-260f1318619f","name":"Platform Bindings","type":"Component","parentId":"6f7466ca-7bfe-4e3d-a397-50b2ac990a2e","root":null,"role":null,"foundational":false,"description":"Five thin classes each answer to one of the platform SPI's interfaces -- `IActuator`, `IBlockView`, `IPlatformContext`, `IPlatformInfo`, `IPlayerView` -- with the `IPlatformContext` implementation acting as the composition root that builds and holds the other four for a session. Rotation writes touch both the current and the previous-tick fields in the same call, since the game snapshots the previous angle once per tick and a write landing after that snapshot would leave the camera interpolating from a stale angle.","codeRefs":["src/main/java/dev/continuo/adapter/fabric/FabricActuator.java","src/main/java/dev/continuo/adapter/fabric/FabricBlockView.java","src/main/java/dev/continuo/adapter/fabric/FabricPlatformContext.java","src/main/java/dev/continuo/adapter/fabric/FabricPlatformInfo.java","src/main/java/dev/continuo/adapter/fabric/FabricPlayerView.java"],"docRefs":[],"createdAt":"2026-09-15T09:22:08.159Z","updatedAt":"2026-09-15T09:22:08.159Z","fields":{"responsibilities":["The system relies on Platform Bindings to report blocks, player state, and input in the platform SPI's vocabulary, and to make no judgement calls while doing it","The system relies on Platform Bindings to give `AdapterRuntime` one composed view of the world, the player, and input, assembled once per session","The system relies on Platform Bindings to identify this adapter as running under `FABRIC` to version-independent code"],"rules":["Never turns an observation into a decision: a conditional that changes behaviour, rather than one that resolves a name or guards a null, belongs in the core.","Reports the world's vertical bound as exclusive, one past the game's own inclusive maximum, so version-independent code can loop without an off-by-one at the top layer.","Always resolves whether a chunk is loaded through the chunk source, never the client level's own always-true shortcut."],"summary":"Translates 1.21.11 game state into the platform SPI's vocabulary","technology":"Fabric"}},{"id":"e6d4a103-1f0b-4ce8-ad55-e585195f680e","name":"Dev Diagnostics","type":"Component","parentId":"6f7466ca-7bfe-4e3d-a397-50b2ac990a2e","root":null,"role":null,"foundational":false,"description":"Bypasses `AdapterRuntime` by design: the dump and probe run directly against the runtime's own block-dump and path-probe helpers rather than through the tick methods the four global rules govern, so a developer can drive them without touching conformance logic the walk key exercises. A known one-tick window exists where a level transition can leave a click already queued against the goal from the previous level, since the transition and the click are observed from different points in the tick.","codeRefs":["src/main/java/dev/continuo/adapter/fabric/ContinuoFabricMod.java#L131-L201"],"docRefs":[],"createdAt":"2026-09-15T09:22:08.160Z","updatedAt":"2026-09-15T09:22:08.160Z","fields":{"responsibilities":["The system relies on Dev Diagnostics to let a developer mark a goal, run a sliced path probe against it, and see the result without leaving the game","The system relies on Dev Diagnostics to write a block-row dump to disk that this adapter's and the 1.7.10 adapter's fixtures can be compared against"],"rules":["Drains the mark, path, and dump keys every tick even when no player is present, so a press queued before a world finishes loading cannot fire on an unrelated later tick.","A level change discards any goal marked in the level being left, so a stale mark can never carry a walk into the wrong world."],"summary":"Dev-only block-dump and path-probe tools for cross-adapter checks"}},{"id":"5908f036-a23a-40dd-81b1-1767aac3f235","name":"Minecraft 1.21.11 (Fabric)","type":"ExternalSystem","parentId":null,"root":null,"role":null,"foundational":false,"description":"Mojang-mapped 1.21.11 client with Fabric Loader and Fabric API. The trust boundary for Continuo: everything the core learns about the world crosses from here through the Fabric adapter's platform bindings.","codeRefs":[],"docRefs":[],"createdAt":"2026-09-15T10:31:46.054Z","updatedAt":"2026-09-15T10:31:46.054Z","fields":{"responsibilities":["Hosts the Fabric adapter as a client mod and delivers its tick and lifecycle events","Owns the world, player and key state the adapter reads and writes"],"summary":"Modern Minecraft client running the Fabric loader"}},{"id":"4f67b464-98e9-479a-bf0b-05d2b3dd0423","name":"Minecraft 1.7.10 (Forge)","type":"ExternalSystem","parentId":null,"root":null,"role":null,"foundational":false,"description":"The 1.7.10 client with Forge, the oldest version the platform contract promises to support and the reason pure modules target Java 8 bytecode.","codeRefs":[],"docRefs":[],"createdAt":"2026-09-15T10:31:46.056Z","updatedAt":"2026-09-15T10:31:46.056Z","fields":{"responsibilities":["Hosts the Forge adapter as a mod and delivers client ticks over the FML event bus","Owns the world, player and key state the adapter reads and writes"],"summary":"Legacy Minecraft client running Forge"}},{"id":"7f7cbc4b-5b85-4065-abd7-fb202837c24a","name":"Dev Diagnostics","type":"Component","parentId":"de24162f-a108-4b63-8f8f-e8fc5d686071","root":null,"role":null,"foundational":false,"description":"Dev-only tooling, unrelated to the four global platform rules the entrypoint discharges through the shared runtime. Polled once per tick end regardless of whether a key was pressed, since a sliced probe run advances on the tick rather than on the keypress.","codeRefs":["src/main/java/dev/continuo/adapter/forge/ContinuoForgeMod.java#pollDumpKey","src/main/java/dev/continuo/adapter/forge/ContinuoForgeMod.java#pollProbeKeys"],"docRefs":[],"createdAt":"2026-09-15T10:31:49.202Z","updatedAt":"2026-09-15T10:31:49.202Z","fields":{"responsibilities":["The system relies on Dev Diagnostics to capture a fixture-row block dump on demand for cross-adapter parity checks.","The system relies on Dev Diagnostics to mark a path goal and run the path probe, writing its result map to disk."],"rules":["A diagnostic tool's failure is always logged and swallowed, never allowed to escape the tick loop and take down the client."],"summary":"Dev-only keys that dump blocks and mark/run a path probe in a live world","technology":"Forge"}}],"connections":[{"id":"6a197a86-15b2-41f5-914a-f586f842e867","from":"9bcb16a5-0f18-4b87-a831-5fd8df34a1c9","to":"f47fd47b-7529-4d24-a5e9-ed2121633dc0","label":"constructs at start() and drives it every tick","description":"","direction":"Unidirectional","realizedBy":[],"codeRefs":[],"fields":{}},{"id":"26d59a84-fc0a-442e-b7cc-84e0a9b0fe16","from":"f47fd47b-7529-4d24-a5e9-ed2121633dc0","to":"3f0ec4a1-2478-456e-b37b-a6246a9e6d13","label":"wraps the adapter's actuator so its own turns are bounded","description":"","direction":"Unidirectional","realizedBy":[],"codeRefs":[],"fields":{}},{"id":"608bc5bd-bf22-4f10-b263-9a60328a3fe5","from":"d1338404-7825-4265-a82c-9100318a2254","to":"b510a9cb-ba0c-4f9a-8723-9bd0b4a1265b","label":"vends the block reader","description":"","direction":"Unidirectional","realizedBy":[],"codeRefs":[],"fields":{}},{"id":"4e60b9d8-c73a-45e8-8f42-3ff56c47a58a","from":"d1338404-7825-4265-a82c-9100318a2254","to":"a2154030-43cd-4c00-8725-9dc1cff18eb1","label":"vends the player reader","description":"","direction":"Unidirectional","realizedBy":[],"codeRefs":[],"fields":{}},{"id":"4772a195-0517-4f91-afe4-98c86c4394ec","from":"d1338404-7825-4265-a82c-9100318a2254","to":"e21f82e8-7e41-43fc-9938-e109b82a58b6","label":"vends the actuator","description":"","direction":"Unidirectional","realizedBy":[],"codeRefs":[],"fields":{}},{"id":"6542cde3-ae3f-4b2a-97e8-ce786826dc0f","from":"ca185d62-b446-4a0f-bc2e-f319ee8d47bb","to":"b510a9cb-ba0c-4f9a-8723-9bd0b4a1265b","label":"opens the window block reads need","description":"","direction":"Unidirectional","realizedBy":[],"codeRefs":[],"fields":{}},{"id":"b94472fa-70b4-4923-8e43-fdede9d348e5","from":"ca185d62-b446-4a0f-bc2e-f319ee8d47bb","to":"a2154030-43cd-4c00-8725-9dc1cff18eb1","label":"opens the window player reads need","description":"","direction":"Unidirectional","realizedBy":[],"codeRefs":[],"fields":{}},{"id":"f8e4bb67-fb34-44b4-ac12-6083d63efc22","from":"ca185d62-b446-4a0f-bc2e-f319ee8d47bb"," <script>
"use strict";
/* ==========================================================================
   Everything below derives from the inlined model. No fact is authored here;
   only headings, field captions and one-line explanations of what a Hyphae
   node / connection / flow / pattern is.
   ========================================================================== */
const M = JSON.parse(document.getElementById('model-data').textContent);

/* ---------- small helpers ---------- */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
/* profile fields allow **bold** and `code` */
const fmt = s => esc(s)
  .replace(/`([^`]+)`/g,'<code style="font-family:var(--mono);font-size:.88em;background:var(--card-2);border:1px solid var(--rule-2);border-radius:2px;padding:0 3px">$1</code>')
  .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');
const el = id => document.getElementById(id);
const sid = id => id.slice(0,8);

/* ---------- indexes ---------- */
const byId = Object.fromEntries(M.nodes.map(n => [n.id, n]));
const connById = Object.fromEntries(M.connections.map(c => [c.id, c]));
const flowById = Object.fromEntries(M.flows.map(f => [f.id, f]));
const patById  = Object.fromEntries(M.patterns.map(p => [p.id, p]));
const kids = {}; M.nodes.forEach(n => { (kids[n.parentId] = kids[n.parentId] || []).push(n); });
const childrenOf = id => kids[id] || [];

const LAYER = { System:'Context', Actor:'Context', ExternalSystem:'Context', Container:'Container', Component:'Component' };
const LAYER_IX = { Context:0, Container:1, Component:2 };

/* the containment ancestor at Container altitude (or the external itself) */
function unitOf(id){ let n = byId[id]; while (n && n.type === 'Component') n = byId[n.parentId]; return n; }

/* root chain: a node's refs resolve against every `root` from the outermost ancestor down */
function resolveRoot(id){
  const chain = []; const seen = new Set(); let cur = byId[id];
  while (cur && !seen.has(cur.id)) {
    seen.add(cur.id);
    if (cur.root) { chain.push(cur.root); if (cur.root.startsWith('/')) break; }
    cur = cur.parentId ? byId[cur.parentId] : null;
  }
  if (!chain.length) return null;
  const joined = chain.reverse().reduce((a,p) => a.endsWith('/') ? a + p : a + '/' + p);
  return joined.endsWith('/') ? joined : joined + '/';
}
function refKind(r){
  if (r.includes('*')) return 'glob';
  if (r.includes('#')) return /#L\d+-L\d+$/.test(r) ? 'lines' : 'symbol';
  return r.endsWith('/') ? 'dir' : 'file';
}
const REF_GLYPH = { dir:'▸', file:'·', symbol:'#', lines:'≡', glob:'∗' };

/* colour class = the distinction the whole architecture exists to make:
   is this code independent of the Minecraft version, or bound to one? */
function techOf(n){
  let cur = n;
  while (cur) { const t = cur.fields && cur.fields.technology; if (t) return t; cur = cur.parentId ? byId[cur.parentId] : null; }
  return null;
}
function klass(n){
  if (n.type === 'ExternalSystem' || n.type === 'Actor') return 'outside';
  const t = techOf(n);
  return (t === 'Fabric' || t === 'Forge') ? 'bound' : 'pure';
}

/* connection partition */
const rolled   = M.connections.filter(c => c.realizedBy.length > 0);
const claimedBy = {}; rolled.forEach(c => c.realizedBy.forEach(r => claimedBy[r] = c.id));
const leaves   = M.connections.filter(c => c.realizedBy.length === 0);
const internalOf = {};   // unit id -> connections wholly inside it
const crossingLeaves = [];
leaves.forEach(c => {
  const a = unitOf(c.from), b = unitOf(c.to);
  if (a && b && a.id === b.id) (internalOf[a.id] = internalOf[a.id] || []).push(c);
  else crossingLeaves.push(c);
});
const outOf = {}, inTo = {};
M.connections.forEach(c => { (outOf[c.from] = outOf[c.from] || []).push(c); (inTo[c.to] = inTo[c.to] || []).push(c); });

/* units = the things the boundary matrix is about */
const units = M.nodes.filter(n => n.type === 'Container' || n.type === 'ExternalSystem');
const unitIds = new Set(units.map(u => u.id));
const unitEdges = M.connections.filter(c => unitIds.has(c.from) && unitIds.has(c.to));

/* dependency order: a unit comes after everything it depends on */
const unitOrder = (() => {
  const indeg = {}, rev = {};
  units.forEach(u => { indeg[u.id] = 0; rev[u.id] = []; });
  unitEdges.forEach(e => { rev[e.to].push(e.from); indeg[e.from]++; });
  let q = units.filter(u => indeg[u.id] === 0).map(u => u.id);
  const order = [];
  while (q.length) {
    q.sort((a,b) => byId[a].name.localeCompare(byId[b].name));
    const x = q.shift(); order.push(x);
    rev[x].forEach(y => { if (--indeg[y] === 0) q.push(y); });
  }
  units.forEach(u => { if (!order.includes(u.id)) order.push(u.id); });
  return order;
})();
const unitPos = Object.fromEntries(unitOrder.map((id,i) => [id,i]));
const bodyOrder = unitOrder.filter(id => byId[id].type === 'Container');

/* flow / pattern back-references */
const flowsOfNode = {}, patternsOfNode = {};
M.flows.forEach(f => f.steps.forEach(s => {
  [s.from, s.to].forEach(n => { (flowsOfNode[n] = flowsOfNode[n] || new Set()).add(f.id); });
}));
M.patterns.forEach(p => { if (p.anchor) (patternsOfNode[p.anchor] = patternsOfNode[p.anchor] || []).push(p.id); });
const flowStepsVia = {};
M.flows.forEach(f => f.steps.forEach(s => { if (s.via) (flowStepsVia[s.via] = flowStepsVia[s.via] || []).push([f.id, s.order]); }));

/* ---------- anchors + cross-links ---------- */
const anchorNode  = id => 'n-' + sid(id);
const anchorConn  = id => 'c-' + sid(id);
const anchorFlow  = id => 'f-' + sid(id);
const anchorPat   = id => 'p-' + sid(id);

function linkNode(id, label){
  const n = byId[id]; if (!n) return esc(label || id);
  return '<a class="x k-node" href="#' + anchorNode(id) + '" data-peek="n:' + id + '">' + esc(label || n.name) + '</a>';
}
function linkConn(id, label){
  const c = connById[id]; if (!c) return esc(label || id);
  return '<a class="x k-conn" href="#' + anchorConn(id) + '" data-peek="c:' + id + '">' + esc(label || c.label) + '</a>';
}
function linkFlow(id){ const f = flowById[id]; return '<a class="x k-flow" href="#' + anchorFlow(id) + '" data-peek="f:' + id + '">' + esc(f.name) + '</a>'; }
function linkPat(id){ const p = patById[id]; return '<a class="x k-pattern" href="#' + anchorPat(id) + '" data-peek="p:' + id + '">' + esc(p.name) + '</a>'; }

/* a component's name repeats across containers — always disambiguate in a link list */
function qualified(id){
  const n = byId[id]; if (!n) return esc(id);
  const dupes = M.nodes.filter(x => x.name === n.name).length > 1;
  const par = n.parentId ? byId[n.parentId] : null;
  return linkNode(id) + (dupes && par
    ? ' <span class="muted"><a class="x" href="#' + anchorNode(par.id) + '" data-peek="n:' + par.id + '">' + esc(par.name) + '</a></span>'
    : '');
}

/* ---------- chips ---------- */
function meter(layer){
  const ix = LAYER_IX[layer];
  return '<span class="meter" title="' + layer + ' layer">' +
    [0,1,2].map(i => '<i class="' + (i === ix ? 'f' : '') + '"></i>').join('') + '</span>';
}
function tagsFor(n){
  const k = klass(n), t = techOf(n), own = n.fields && n.fields.technology;
  const out = [];
  out.push('<span class="tag t-plain">' + meter(LAYER[n.type]) + ' ' + esc(n.type) + '</span>');
  if (own) out.push('<span class="tag t-' + k + '">' + esc(own) + '</span>');
  else if (k === 'bound') out.push('<span class="tag t-bound">' + esc(t) + ' · inherited</span>');
  else if (k === 'outside') out.push('<span class="tag t-outside">outside</span>');
  if (n.role) out.push('<span class="tag">' + esc(n.role) + '</span>');
  if (n.foundational) out.push('<span class="tag t-found">foundational</span>');
  if (n.root) out.push('<span class="tag t-plain">root ' + esc(n.root) + '</span>');
  return '<span class="tags">' + out.join('') + '</span>';
}

/* ---------- field blocks ---------- */
function listBlock(title, items, cls){
  if (!items || !items.length) return '';
  return '<div class="blk"><h5>' + title + '</h5><ul class="tight ' + (cls||'') + '">' +
    items.map(i => '<li>' + fmt(i) + '</li>').join('') + '</ul></div>';
}
function proseBlock(title, text){
  if (!text) return '';
  return '<div class="blk"><h5>' + title + '</h5><div class="note">' + fmt(text) + '</div></div>';
}
function refsBlock(title, refs, nodeId){
  if (!refs || !refs.length) return '';
  const root = resolveRoot(nodeId);
  const rows = refs.map(r => {
    const k = refKind(r);
    const full = root && !r.startsWith('/') ? root + r : r;
    const hash = full.indexOf('#');
    const path = hash === -1 ? full : full.slice(0, hash);
    const frag = hash === -1 ? '' : full.slice(hash);
    const slash = path.lastIndexOf('/', path.length - 2);
    const dir = slash === -1 ? '' : path.slice(0, slash + 1);
    const base = slash === -1 ? path : path.slice(slash + 1);
    return '<div class="ref"><span class="k">' + REF_GLYPH[k] + '</span>' +
      esc(dir) + '<em>' + esc(base) + '</em>' + (frag ? '<span class="frag">' + esc(frag) + '</span>' : '') + '</div>';
  }).join('');
  return '<div class="blk"><h5>' + title + '</h5><div class="reflist">' + rows + '</div></div>';
}

/* ---------- the touches table: the hub answer ----------
   A node's edges are grouped by the boundary crossing that claims them, so a
   high-degree node reads as a handful of named crossings rather than a list. */
function touchesBlock(n){
  const rows = [];
  const mk = (c, dir) => {
    const other = dir === 'out' ? c.to : c.from;
    return '<tr data-cid="' + c.id + '"><td class="dir">' + (dir === 'out' ? '→' : '←') + '</td>' +
      '<td>' + qualified(other) + '</td>' +
      '<td class="lab"><a class="x k-conn" href="#' + anchorConn(c.id) + '" data-peek="c:' + c.id + '">' +
      esc(c.label) + '</a></td></tr>';
  };
  const mine = [].concat((outOf[n.id]||[]).map(c => [c,'out']), (inTo[n.id]||[]).map(c => [c,'in']));
  const groups = new Map();
  mine.forEach(([c,dir]) => {
    let key;
    if (c.realizedBy.length) key = 'self';                     // this node IS a unit; the edge is its own crossing
    else if (claimedBy[c.id]) key = 'via:' + claimedBy[c.id];
    else key = 'inside';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push([c,dir]);
  });
  const order = ['inside', ...[...groups.keys()].filter(k => k.startsWith('via:')), 'self'];
  const seen = new Set();
  order.forEach(k => {
    if (!groups.has(k) || seen.has(k)) return; seen.add(k);
    const arr = groups.get(k);
    let head = '';
    if (k === 'inside') { const u = unitOf(n.id); head = 'inside ' + (u ? linkNode(u.id) : ''); }
    else if (k === 'self') head = 'boundary crossings of this container';
    else {
      const cr = connById[k.slice(4)];
      head = 'across the boundary — ' + linkConn(cr.id, byId[cr.from].name + ' → ' + byId[cr.to].name);
    }
    rows.push('<tr class="viagroup"><td colspan="3"><b>' + head + '</b> <span>· ' + arr.length + '</span></td></tr>');
    arr.forEach(([c,dir]) => rows.push(mk(c, dir)));
  });
  if (!rows.length) return '<div class="blk"><h5>Touches</h5><div class="thin">No connections recorded.</div></div>';
  return '<div class="blk"><h5>Touches · ' + mine.length + '</h5><table class="data">' + rows.join('') + '</table></div>';
}

function appearsBlock(n){
  const bits = [];
  const fs = flowsOfNode[n.id];
  if (fs) fs.forEach(fid => {
    const steps = flowById[fid].steps.filter(s => s.from === n.id || s.to === n.id).map(s => s.order);
    bits.push('<li>' + linkFlow(fid) + ' <span class="muted">step' + (steps.length>1?'s':'') + ' ' + steps.join(', ') + '</span></li>');
  });
  (patternsOfNode[n.id] || []).forEach(pid => {
    bits.push('<li>' + linkPat(pid) + ' <span class="muted">' + esc(patById[pid].kind) + ' · anchored here</span></li>');
  });
  if (!bits.length) return '';
  return '<div class="blk"><h5>Appears in</h5><ul class="tight">' + bits.join('') + '</ul></div>';
}

/* ---------- node entry ---------- */
function nodeEntry(n, big){
  const f = n.fields || {};
  const left =
    listBlock('Responsibilities', f.responsibilities) +
    listBlock('Rules', f.rules, 'rules') +
    proseBlock('Notes', n.description);
  const right =
    touchesBlock(n) +
    refsBlock('Code', n.codeRefs, n.id) +
    refsBlock('Docs', n.docRefs, n.id) +
    appearsBlock(n);
  const where = n.parentId ? '<span class="muted">in ' + linkNode(n.parentId) + '</span>' : '';
  return '<article class="entry ' + klass(n) + (big ? ' big' : '') + '" id="' + anchorNode(n.id) + '">' +
    '<div class="ehead"><h4>' + esc(n.name) + '</h4>' + where +
      '<span style="flex:1 1 auto"></span>' + tagsFor(n) +
      '<a class="anchor" href="#' + anchorNode(n.id) + '" title="Link to this entry">¶</a></div>' +
    (f.summary ? '<p class="esum">' + fmt(f.summary) + '</p>' : '') +
    ((left || right) ? '<div class="ebody' + (right ? '' : ' wide') + '"><div>' + left + '</div>' +
      (right ? '<div>' + right + '</div>' : '') + '</div>' : '') +
    '</article>';
}
