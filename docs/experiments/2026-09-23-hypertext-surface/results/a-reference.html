/* ==========================================================================
   THE BOUNDARY MATRIX — the signature surface.
   Rows depend on columns. Ordered so every dependency points backwards, which
   is why the marks all fall below the diagonal.
   ========================================================================== */
(function matrix(){
  const cell = {};
  unitEdges.forEach(e => cell[e.from + '|' + e.to] = e);
  const rowT = {}, colT = {};
  unitEdges.forEach(e => { rowT[e.from] = (rowT[e.from]||0)+1; colT[e.to] = (colT[e.to]||0)+1; });

  let head = '<tr><th class="corner"></th>';
  unitOrder.forEach((id,i) => {
    head += '<th class="colh" data-col="' + i + '"><div><span class="n">' + esc(byId[id].name) + '</span></div></th>';
  });
  head += '<th class="tot" title="crossings out of this container">out</th></tr>';

  let body = '';
  unitOrder.forEach((rid,ri) => {
    body += '<tr><th class="rowh" data-row="' + ri + '"><span class="swatch sw-' + klass(byId[rid]) + '"></span>' +
      '<a class="x" href="#' + anchorNode(rid) + '" data-peek="n:' + rid + '"><span class="n">' + esc(byId[rid].name) + '</span></a></th>';
    unitOrder.forEach((cid,ci) => {
      if (rid === cid) { body += '<td class="cell diag"></td>'; return; }
      const e = cell[rid + '|' + cid];
      if (!e) { body += '<td class="cell" data-row="' + ri + '" data-col="' + ci + '"></td>'; return; }
      const k = klass(byId[cid]);
      body += '<td class="cell on ' + (k === 'bound' ? 'b' : k === 'outside' ? 'o' : '') + '" data-row="' + ri + '" data-col="' + ci + '">' +
        '<a href="#' + anchorConn(e.id) + '" data-peek="c:' + e.id + '" aria-label="' +
        esc(byId[rid].name + ' ' + e.label + ' ' + byId[cid].name) + '"></a></td>';
    });
    body += '<td class="tot">' + (rowT[rid] || '') + '</td></tr>';
  });
  body += '<tr><th class="tot" style="text-align:right;padding-right:9px">in</th>' +
    unitOrder.map(id => '<td class="tot">' + (colT[id] || '') + '</td>').join('') +
    '<td class="tot">' + unitEdges.length + '</td></tr>';

  const adapters = unitOrder.filter(id => klass(byId[id]) === 'bound');
  const park = M.nodes.find(n => n.name === 'Parkour Movement');
  const adapterOut = adapters.map(id => rowT[id] || 0);
  const sameOut = adapterOut.every(v => v === adapterOut[0]);
  const adapterIn = adapters.reduce((a,id) => a + (colT[id] || 0), 0);

  el('matrix').innerHTML =
    '<div class="band"><h2>Boundary matrix</h2><span class="count">' + unitEdges.length + ' crossings · ' + units.length + ' units</span>' +
      '<p>The ' + unitEdges.length + ' container-to-container connections are the architecture in one grid. Every mark is a named crossing; click one to read it.</p></div>' +
    '<div class="matrixwrap">' +
      '<div class="matrixscroll"><table class="dsm"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>' +
      '<div class="matrixkey">' +
        '<span><span class="dot" style="background:var(--pure)"></span>depends on version-independent code</span>' +
        '<span><span class="dot" style="background:var(--bound)"></span>depends on version-bound code</span>' +
        '<span><span class="dot" style="background:var(--outside)"></span>depends on something outside the boundary</span>' +
        '<span><span class="dot" style="background:var(--rule-2)"></span>no connection recorded</span>' +
      '</div>' +
      '<p class="matrixnote"><b>Read it as: the row depends on the column.</b> Units are ordered so that nothing can depend on anything listed after it — which is why every mark falls below the diagonal and the upper triangle is empty. That empty triangle is the system rule <i>“Module dependencies point one way only; nothing depends on an adapter”</i>, drawn. The ' +
      adapters.length + ' adapter rows at the bottom carry ' +
      (sameOut ? adapterOut[0] + ' marks each' : adapterOut.join(' and ') + ' marks') +
      ' and ' + (adapterIn === 0 ? 'no column of their own' : adapterIn + ' incoming') + '; ' +
      (park ? linkNode(park.id) + ' has ' + (rowT[park.id]||0) + ' mark and ' +
        ((colT[park.id]||0) === 0 ? 'an empty column, because nothing in the core names it' :
         (colT[park.id]) + ' incoming') + '.' : '') + '</p>' +
    '</div>';
})();

/* ==========================================================================
   SCOPED DIAGRAM: one container's internal wiring
   ========================================================================== */
function internalsDiagram(unitId){
  const edges = internalOf[unitId] || [];
  const comps = childrenOf(unitId);
  if (!edges.length) {
    return comps.length > 1
      ? '<p class="dgcap">No connections recorded between this container’s ' + comps.length + ' components.</p>'
      : '';
  }
  const wired = new Set(); edges.forEach(e => { wired.add(e.from); wired.add(e.to); });
  const ids = comps.filter(c => wired.has(c.id)).map(c => c.id);
  const loose = comps.filter(c => !wired.has(c.id));

  /* longest-path layering: every edge spans at least one rank */
  const rank = {}; ids.forEach(i => rank[i] = 0);
  for (let pass = 0; pass < ids.length; pass++) {
    let moved = false;
    edges.forEach(e => { if (rank[e.to] < rank[e.from] + 1) { rank[e.to] = rank[e.from] + 1; moved = true; } });
    if (!moved) break;
  }
  const cols = {}; ids.forEach(i => (cols[rank[i]] = cols[rank[i]] || []).push(i));
  const nCols = Math.max(...Object.keys(cols).map(Number)) + 1;
  const W = 176, H = 34, GX = 58, GY = 13, PAD = 8;
  const pos = {};
  for (let c = 0; c < nCols; c++) (cols[c] || []).forEach((id, r) => {
    pos[id] = { x: PAD + c * (W + GX), y: PAD + r * (H + GY) };
  });
  const maxRows = Math.max(...Object.values(cols).map(a => a.length));
  const svgW = PAD * 2 + nCols * (W + GX) - GX;
  const svgH = PAD * 2 + maxRows * (H + GY) - GY;

  const paths = edges.map(e => {
    const a = pos[e.from], b = pos[e.to];
    const x1 = a.x + W, y1 = a.y + H/2, x2 = b.x - 4, y2 = b.y + H/2;
    const mx = (x1 + x2) / 2;
    const d = 'M' + x1 + ',' + y1 + ' C' + mx + ',' + y1 + ' ' + mx + ',' + y2 + ' ' + x2 + ',' + y2;
    return '<path class="dghit" d="' + d + '" data-cid="' + e.id + '"></path>' +
           '<path class="dgedge" d="' + d + '" data-cid="' + e.id + '"></path>';
  }).join('');
  const boxes = ids.map(id => {
    const p = pos[id], n = byId[id];
    let label = n.name, max = Math.floor((W - 16) / 6.3);
    if (label.length > max) label = label.slice(0, max - 1) + '…';
    return '<a href="#' + anchorNode(id) + '" data-peek="n:' + id + '" data-nid="' + id + '">' +
      '<rect class="dgbox" x="' + p.x + '" y="' + p.y + '" width="' + W + '" height="' + H + '" rx="2"></rect>' +
      '<text class="dglabel" x="' + (p.x + 9) + '" y="' + (p.y + H/2 + 4) + '">' + esc(label) + '</text></a>';
  }).join('');

  const table = '<table class="data"><thead><tr><th style="width:26%">From</th><th style="width:26%">To</th><th>What it does</th></tr></thead><tbody>' +

/* ==========================================================================
   PATTERNS — state machines drawn small, with the authoritative table beside
   ========================================================================== */
function stateMachineSvg(p){
  const n = p.members.length;
  const W = 460, H = n > 3 ? 320 : 190, cx = W/2, cy = H/2;
  const rx = n > 3 ? 150 : 150, ry = n > 3 ? 108 : 52;
  const bw = 112, bh = 30;
  const pos = {};
  p.members.forEach((m,i) => {
    const a = -Math.PI/2 + (i * 2 * Math.PI) / n;
    pos[m.name] = { x: cx + rx * Math.cos(a), y: cy + ry * Math.sin(a) };
  });
  const ix = Object.fromEntries(p.members.map((m,i) => [m.name, i]));
  const edges = p.transitions.map((t,i) => {
    const a = pos[t.from], b = pos[t.to];
    if (!a || !b) return '';
    const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx,dy) || 1;
    const ux = dx/len, uy = dy/len;
    /* trim to the box edge so the arrowhead lands on the border, not inside it */
    const tx = Math.abs(ux) > 1e-6 ? (bw/2 + 4) / Math.abs(ux) : 1e9;
    const ty = Math.abs(uy) > 1e-6 ? (bh/2 + 4) / Math.abs(uy) : 1e9;
    const trim = Math.min(tx, ty);
    const x1 = a.x + ux*trim, y1 = a.y + uy*trim, x2 = b.x - ux*trim, y2 = b.y - uy*trim;
    const bow = (ix[t.from] < ix[t.to] ? 1 : -1) * Math.min(38, len * 0.18);
    const mx = (x1+x2)/2 - uy*bow, my = (y1+y2)/2 + ux*bow;
    const d = 'M' + x1.toFixed(1) + ',' + y1.toFixed(1) + ' Q' + mx.toFixed(1) + ',' + my.toFixed(1) + ' ' + x2.toFixed(1) + ',' + y2.toFixed(1);
    return '<path class="dghit" d="' + d + '" data-tid="' + i + '"></path>' +
           '<path class="tredge" d="' + d + '" data-tid="' + i + '"></path>';
  }).join('');
  const boxes = p.members.map(m => {
    const q = pos[m.name];
    return '<g data-sname="' + esc(m.name) + '">' +
      '<rect class="stbox" x="' + (q.x - bw/2).toFixed(1) + '" y="' + (q.y - bh/2).toFixed(1) + '" width="' + bw + '" height="' + bh + '" rx="15"></rect>' +
      '<text class="stlabel" x="' + q.x.toFixed(1) + '" y="' + (q.y + 4).toFixed(1) + '">' + esc(m.name) + '</text></g>';
  }).join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" height="' + H + '" role="img" aria-label="State diagram for ' + esc(p.name) + '">' +
    edges + boxes + '</svg>';
}

/* ---------- scroll spy ---------- */
(function spy(){
  if (typeof IntersectionObserver === 'undefined') return;
  const targets = [...document.querySelectorAll('[data-spy]')];
  const map = {};
  targets.forEach(t => map[t.dataset.spy] = t);
  const obs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      const t = map[en.target.id];
      if (!t) return;
      if (en.isIntersecting) {
        targets.forEach(x => x.classList.remove('here'));
        t.classList.add('here');
      }
    });
  }, { rootMargin: '-60px 0px -70% 0px', threshold: 0 });
  Object.keys(map).forEach(id => { const n = document.getElementById(id); if (n) obs.observe(n); });
})();

/* ==========================================================================

const INDEX = (() => {

            (f.rules||[]).join(' '), n.codeRefs.join(' '), n.docRefs.join(' '), f.technology, n.role]
            .filter(Boolean).join(' ').toLowerCase()
    });

    });

    hay: (p.name + ' ' + p.kind + ' ' + p.description + ' ' + p.members.map(m => m.name).join(' ') + ' ' +
          p.transitions.map(t => t.trigger).join(' ')).toLowerCase()

const GROUP_ORDER = ['Context','Containers','Components','Crossings','Connections','Flows','Patterns'];
const qEl = el('q'), rEl = el('results');
let cursor = -1, hits = [];

function hl(text, terms){
  let out = esc(text);
  terms.forEach(t => {
    if (!t) return;
    out = out.replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')','ig'), '<mark>$1</mark>');
  });
  return out;
}
function runSearch(){
  const raw = qEl.value.trim().toLowerCase();
  if (!raw) { rEl.hidden = true; rEl.innerHTML = ''; hits = []; cursor = -1; return; }
  const terms = raw.split(/\s+/);
  hits = INDEX.filter(e => terms.every(t => e.hay.includes(t)))
    .sort((a,b) => {
      const ai = a.title.toLowerCase().indexOf(terms[0]), bi = b.title.toLowerCase().indexOf(terms[0]);
      const as = ai === -1 ? 999 : ai, bs = bi === -1 ? 999 : bi;
      if (as !== bs) return as - bs;
      return GROUP_ORDER.indexOf(a.kind) - GROUP_ORDER.indexOf(b.kind);
    }).slice(0, 60);
  if (!hits.length) { rEl.hidden = false; rEl.innerHTML = '<div class="rnone">Nothing in the model matches.</div>'; cursor = -1; return; }
  const groups = {};
  hits.forEach((h,i) => { (groups[h.kind] = groups[h.kind] || []).push([h,i]); });
  rEl.innerHTML = GROUP_ORDER.filter(g => groups[g]).map(g =>
    '<div class="rgroup">' + g + ' · ' + groups[g].length + '</div>' +
    groups[g].map(([h,i]) =>
      '<a class="ritem" data-i="' + i + '" href="#' + h.a + '"><b><span class="swatch sw-' + h.k + '"></span>' +
      hl(h.title, terms) + '</b><i>' + hl((h.sub||'').slice(0,120), terms) + '</i></a>').join('')
  ).join('');
  rEl.hidden = false; cursor = -1;
}
function moveCursor(d){
  const items = [...rEl.querySelectorAll('.ritem')];
  if (!items.length) return;
  items.forEach(i => i.classList.remove('on'));
  cursor = (cursor + d + items.length + (cursor === -1 && d < 0 ? 1 : 0)) % items.length;
  const cur = items[cursor];
  cur.classList.add('on');
  cur.scrollIntoView({ block:'nearest' });
}
qEl.addEventListener('input', runSearch);
qEl.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); moveCursor(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); moveCursor(-1); }
  else if (e.key === 'Enter') {
    const items = [...rEl.querySelectorAll('.ritem')];
    const pick = items[cursor === -1 ? 0 : cursor];
    if (pick) { e.preventDefault(); go(pick.getAttribute('href')); closeSearch(); }
  } else if (e.key === 'Escape') { closeSearch(); qEl.blur(); }
});
rEl.addEventListener('mousedown', e => {
  const a = e.target.closest('.ritem');
  if (a) { e.preventDefault(); go(a.getAttribute('href')); closeSearch(); }
});
function closeSearch(){ rEl.hidden = true; }
document.addEventListener('click', e => { if (!e.target.closest('.searchwrap')) closeSearch(); });
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== qEl && !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) {
    e.preventDefault(); qEl.focus(); qEl.select();
  }
});

/* ==========================================================================
   NAVIGATION — never lose the reader
   ========================================================================== */
let backTo = null;
function labelOfAnchor(){
  const y = window.scrollY;
  let best = null;
  document.querySelectorAll('.entry[id], .band h2, .unithead h3').forEach(n => {
    const top = n.getBoundingClientRect().top + y;
    if (top <= y + 90 && (!best || top > best.top)) {
      const h = n.matches('.entry') ? n.querySelector('.ehead h4') : n;
      best = { top, text: h ? h.textContent.trim() : n.textContent.trim() };
    }
  });
  return best ? best.text : 'the top';
}
function go(href){
  backTo = { y: window.scrollY, label: labelOfAnchor() };
  showBack();
  location.hash = href.replace(/^#/, '');
}
function showBack(){
  const b = el('backchip');
  if (!backTo) { b.classList.remove('on'); return; }
  b.textContent = '← back to ' + backTo.label;
  b.classList.add('on');
}
el('backchip').addEventListener('click', () => {
  if (!backTo) return;
  const y = backTo.y; backTo = null; showBack();
  window.scrollTo({ top: y, behavior: 'auto' });
});
document.addEventListener('click', e => {
  const a = e.target.closest('a[href^="#"]');
  if (!a || a.closest('#results')) return;
  if (a.classList.contains('anchor')) return;
  e.preventDefault();
  go(a.getAttribute('href'));
});

/* ==========================================================================
   PEEK — hover any cross-link, see the thing without leaving your place
   ========================================================================== */
const peek = el('peek');
let peekTimer = null;
function peekContent(spec){
  const [k, id] = [spec.slice(0,1), spec.slice(2)];
  if (k === 'n') {
    const n = byId[id]; if (!n) return null;
    const f = n.fields || {};
    const par = n.parentId ? byId[n.parentId] : null;
    const deg = (outOf[n.id]||[]).length + (inTo[n.id]||[]).length;
    return { cls: klass(n), type: n.type + (par ? ' in ' + par.name : ''), head: n.name,
      sub: f.summary || '', meta: deg + ' connection' + (deg===1?'':'s') +
        (f.responsibilities ? ' · ' + f.responsibilities.length + ' responsibilities' : '') +
        (n.codeRefs.length ? ' · ' + n.codeRefs.length + ' code refs' : '') };
  }
  if (k === 'c') {
    const c = connById[id]; if (!c) return null;
    const a = byId[c.from], b = byId[c.to];
    return { cls: klass(b), type: c.realizedBy.length ? 'Boundary crossing' : 'Connection',
      head: a.name + ' → ' + b.name, sub: c.label,
      meta: c.realizedBy.length ? 'realized by ' + c.realizedBy.length + ' component edges' : c.direction };
  }
  if (k === 'f') {
    const f = flowById[id]; if (!f) return null;
    return { cls:'pure', type:'Flow' + (f.scope ? ' · ' + f.scope + ' scope' : ''), head:f.name, sub:f.description, meta:f.steps.length + ' steps' };
  }
  if (k === 'p') {
    const p = patById[id]; if (!p) return null;
    return { cls:'pure', type:'Pattern · ' + p.kind, head:p.name, sub:p.description,
      meta: p.members.length + ' states · ' + p.transitions.length + ' transitions' };
  }
  return null;
}
function showPeek(target){
  const c = peekContent(target.dataset.peek);
  if (!c) return;
  peek.className = 'on ' + c.cls;
  peek.innerHTML = '<div class="pk-t">' + esc(c.type) + '</div><div class="pk-h">' + esc(c.head) + '</div>' +
    (c.sub ? '<div class="pk-s">' + fmt(c.sub) + '</div>' : '') +
    (c.meta ? '<div class="pk-m">' + esc(c.meta) + '</div>' : '');
  const r = target.getBoundingClientRect();
  peek.style.left = '0px'; peek.style.top = '0px';
  const pr = peek.getBoundingClientRect();
  let left = Math.min(Math.max(8, r.left), window.innerWidth - pr.width - 8);
  let top = r.bottom + 8;
  if (top + pr.height > window.innerHeight - 8) top = Math.max(8, r.top - pr.height - 8);
  peek.style.left = left + 'px'; peek.style.top = top + 'px';
  peek.setAttribute('aria-hidden','false');
}
function hidePeek(){ clearTimeout(peekTimer); peek.className = ''; peek.setAttribute('aria-hidden','true'); }
document.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-peek]');
  if (!t) return;
  clearTimeout(peekTimer);
  peekTimer = setTimeout(() => showPeek(t), 230);
});
document.addEventListener('mouseout', e => { if (e.target.closest('[data-peek]')) hidePeek(); });
document.addEventListener('scroll', hidePeek, { passive:true });
document.addEventListener('focusin', e => {
  const t = e.target.closest('[data-peek]');
  if (t) showPeek(t); else hidePeek();
});

/* ==========================================================================
   CROSS-HIGHLIGHT — diagram ↔ table, one interaction vocabulary everywhere
   ========================================================================== */
function setHl(sel, on){
  document.querySelectorAll(sel).forEach(n => n.classList.toggle('hl', on));
}
document.addEventListener('mouseover', e => {
  const c = e.target.closest('[data-cid]');
  if (c) setHl('[data-cid="' + c.dataset.cid + '"]', true);
  const t = e.target.closest('[data-tid]');
  if (t) {
    const box = t.closest('.entry');
    if (box) box.querySelectorAll('[data-tid="' + t.dataset.tid + '"]').forEach(n => n.classList.add('hl'));
  }
});
document.addEventListener('mouseout', e => {
  const c = e.target.closest('[data-cid]');
  if (c) setHl('[data-cid="' + c.dataset.cid + '"]', false);
  const t = e.target.closest('[data-tid]');
  if (t) {
    const box = t.closest('.entry');
    if (box) box.querySelectorAll('[data-tid="' + t.dataset.tid + '"]').forEach(n => n.classList.remove('hl'));
  }
});
/* matrix row/column crosshair */
(function crosshair(){
  const table = document.querySelector('table.dsm');
  if (!table) return;
  table.addEventListener('mouseover', e => {
    const cell = e.target.closest('[data-row],[data-col]');
    table.querySelectorAll('.xr,.xc').forEach(n => n.classList.remove('xr','xc'));
    if (!cell) return;
    const r = cell.dataset.row, c = cell.dataset.col;
    if (r != null) table.querySelectorAll('[data-row="' + r + '"]').forEach(n => n.classList.add('xr'));
    if (c != null) table.querySelectorAll('[data-col="' + c + '"]').forEach(n => n.classList.add('xc'));
  });
  table.addEventListener('mouseleave', () => table.querySelectorAll('.xr,.xc').forEach(n => n.classList.remove('xr','xc')));
})();

/* integrity check, visible only in the console */
(function check(){
  const ids = new Set(), dupes = [];
  document.querySelectorAll('[id]').forEach(n => { if (ids.has(n.id)) dupes.push(n.id); ids.add(n.id); });
  const broken = [...document.querySelectorAll('a[href^="#"]')]
    .map(a => a.getAttribute('href').slice(1))
    .filter(h => h && !document.getElementById(h));
  console.log('[continuo-reference] anchors=' + ids.size + ' duplicate-ids=' + dupes.length +
    ' broken-links=' + broken.length, dupes.length ? dupes : '', broken.length ? [...new Set(broken)] : '');
})();
</script>

table.dsm th.colh.xc,table.dsm th.rowh.xr{background:var(--mark)}
table.dsm td.cell.on.xr,table.dsm td.cell.on.xc{box-shadow:none}
