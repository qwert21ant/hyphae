<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Continuo — architecture map</title>
<style>
/* ────────────────────────────────────────────────────────────────────────
   Continuo architecture map.
   Palette: deep slate ground, stone neutrals, two accents only —
     copper  = the boundary (anything outside Continuo, and edges that cross it)
     mineral = coupling weight and interaction
   Type rule: anything the model's author wrote as PROSE is serif.
              anything that is a NAME, an ID, a COUNT or a COORDINATE is mono.
   ──────────────────────────────────────────────────────────────────────── */
:root{
  --ground:#1b2026;
  --ground-2:#1f252c;
  --surface:#242c34;
  --surface-2:#2a333c;
  --field:#2e3841;
  --ink:#e0e6ea;
  --ink-2:#aeb9c2;
  --ink-3:#8593a0;
  --rule:#39444f;
  --rule-2:#4a5763;
  --copper:#cf7c46;
  --copper-dim:#8d5330;
  --mineral:#6cb2b7;
  --mineral-dim:#3c6a6e;
  --focus:#a8d8dc;

  --mono:ui-monospace,"Cascadia Mono","Segoe UI Mono","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --serif:ui-serif,Georgia,"Iowan Old Style","Palatino Linotype",Palatino,"Times New Roman",serif;

  --pad:clamp(16px,3.2vw,40px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--mono);font-size:13px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:6rem;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
code{font-family:var(--mono);font-size:.92em;background:#00000038;padding:.08em .34em;border-radius:2px;color:var(--ink)}
strong{font-weight:700;color:#f2f6f8}

.wrap{max-width:1320px;margin:0 auto;padding:0 var(--pad)}
.prose{font-family:var(--serif);font-size:15.5px;line-height:1.62;color:var(--ink-2);max-width:70ch}
.prose strong{color:var(--ink)}

/* ── eyebrows, tags, chips ─────────────────────────────────────────────── */
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.tag{
  display:inline-block;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;
  padding:.18em .45em;border:1px solid var(--rule-2);border-radius:2px;color:var(--ink-3);
  vertical-align:.08em;white-space:nowrap;
}
.tag--ext{color:var(--copper);border-color:var(--copper-dim)}
.tag--tech{border-style:dashed}
.tag--role{border-color:var(--mineral-dim);color:var(--mineral)}
.tag--found{border-color:var(--copper);color:var(--copper)}
.tag--kind{border-color:var(--rule-2)}

/* ── top bar ───────────────────────────────────────────────────────────── */
.bar{
  position:sticky;top:0;z-index:40;background:#1b2026f2;backdrop-filter:blur(8px);
  border-bottom:1px solid var(--rule);
  padding-top:env(safe-area-inset-top,0px);
}
.bar__in{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:9px 0}
.bar__id{font-size:13px;letter-spacing:.2em;font-weight:700;text-transform:uppercase}
.bar__counts{color:var(--ink-3);font-size:11px;letter-spacing:.04em}
.bar__sp{flex:1 1 20px}
.ctl{display:flex;align-items:center;gap:6px}
.ctl__lab{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
input[type=search]{
  font:inherit;font-size:12px;background:var(--ground-2);color:var(--ink);
  border:1px solid var(--rule);border-radius:2px;padding:4px 8px;width:min(230px,42vw);
}
input[type=search]::placeholder{color:#6b7883}
.seg{display:flex;border:1px solid var(--rule);border-radius:2px;overflow:hidden}
.seg button{padding:4px 9px;font-size:11px;color:var(--ink-3);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:none}
.seg button[aria-pressed=true]{background:var(--mineral-dim);color:#eaf6f7}
.seg button:hover{color:var(--ink)}
.bar__trail{width:100%;display:none;gap:8px;align-items:center;padding-bottom:8px}
.bar__trail[data-on=on]{display:flex}
.trailbtn{font-size:11px;color:var(--mineral);border:1px solid var(--mineral-dim);border-radius:2px;padding:3px 8px}
.trailbtn:hover{background:var(--mineral-dim);color:#eaf6f7}
.hint{font-size:10.5px;color:var(--ink-3)}

/* ── masthead ──────────────────────────────────────────────────────────── */
.mast{padding:52px 0 40px;border-bottom:1px solid var(--rule)}
.mast__eyebrow{margin-bottom:14px}
.mast__name{
  font-size:clamp(34px,6.4vw,62px);line-height:1.02;font-weight:700;letter-spacing:-.02em;margin:0 0 6px;
}
.mast__sum{font-size:clamp(14px,1.9vw,18px);color:var(--mineral);letter-spacing:-.005em;margin:0 0 26px}
.mast__grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:34px}
@media(max-width:820px){.mast__grid{grid-template-columns:1fr}}

/* ── generic field blocks ──────────────────────────────────────────────── */
.fieldset{margin:0 0 20px}
.fieldset__h{display:block;margin-bottom:7px}
.bullets{list-style:none;margin:0;padding:0;font-family:var(--serif);font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.bullets li{position:relative;padding-left:18px;margin-bottom:8px}
.bullets li::before{content:"";position:absolute;left:1px;top:.62em;width:7px;height:1px;background:var(--rule-2)}
.bullets--rules li::before{content:"";left:0;top:.5em;width:5px;height:5px;border:1px solid var(--rule-2);background:none;transform:rotate(45deg)}

/* ── sections ──────────────────────────────────────────────────────────── */
.sec{padding:46px 0 10px;border-bottom:1px solid var(--rule)}
.sec__head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.sec__t{font-size:clamp(19px,2.6vw,25px);font-weight:600;letter-spacing:-.01em;margin:0}
.sec__n{color:var(--ink-3);font-size:11px;letter-spacing:.1em}
.sec__lede{margin:0 0 26px}

/* ── the coupling grid (signature) ─────────────────────────────────────── */
.grid2{display:grid;grid-template-columns:auto minmax(280px,1fr);gap:28px;align-items:start}
@media(max-width:1040px){.grid2{grid-template-columns:1fr}}

.mx{border-collapse:separate;border-spacing:0;font-size:11px;background:var(--field);border:1px solid var(--rule-2);border-radius:3px}
.mx th,.mx td{padding:0;text-align:center;vertical-align:middle}
.mx .rowlab{
  text-align:left;padding:0 10px 0 8px;white-space:nowrap;font-size:11.5px;color:var(--ink-2);
  border-right:1px solid var(--rule-2);max-width:250px;overflow:hidden;text-overflow:ellipsis;
}
.mx .rowlab button{display:block;width:100%;text-align:left;padding:3px 0;overflow:hidden;text-overflow:ellipsis}
.mx .rowlab button:hover{color:var(--mineral)}
.mx .rk{color:var(--ink-3);margin-right:7px}
.mx thead th{height:26px;color:var(--ink-3);font-weight:400;font-size:10.5px;border-bottom:1px solid var(--rule-2)}
.mx thead th.corner{text-align:left;padding-left:8px;letter-spacing:.1em;font-size:9.5px}
.mx td.cell{width:30px;height:26px;border-right:1px solid #ffffff0d;border-bottom:1px solid #ffffff0d;position:relative}
.mx td.cell:last-child{border-right:none}
.mx tbody tr:last-child td{border-bottom:none}
.cell button{width:100%;height:100%;display:block;color:#eaf6f7;font-size:11px;line-height:26px}
.cell[data-w]{background:var(--mineral-dim)}
.cell[data-ext=y][data-w]{background:var(--copper-dim)}
.cell.diag{background:#00000030}
.cell.diag::after{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(135deg,transparent 0 3px,#ffffff0e 3px 4px)}
.cell.dim{opacity:.18}
.mx td.out,.mx th.out{width:40px;color:var(--ink-3);font-size:10.5px;border-left:1px solid var(--rule-2)}
.mx tfoot td{height:24px;color:var(--ink-3);font-size:10.5px;border-top:1px solid var(--rule-2)}
.mx tfoot td.rowlab{text-align:right;padding-right:10px;letter-spacing:.09em;font-size:9.5px}
.mx tr.xrow .cell,.mx tr .cell.xcol{box-shadow:inset 0 0 0 1px #ffffff26}
.mx tr.xrow .rowlab{color:var(--ink)}

.mxwrap{overflow-x:auto;max-width:100%}
.legend{margin-top:16px;display:flex;flex-wrap:wrap;gap:6px 22px;font-size:10.5px;color:var(--ink-3)}
.legend b{font-weight:400;color:var(--ink-2)}
.sw{display:inline-block;width:11px;height:11px;border:1px solid var(--rule-2);vertical-align:-1px;margin-right:5px}

.readout{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:16px 18px;min-height:220px;position:sticky;top:64px}
.readout__empty{color:var(--ink-3);font-size:11.5px;line-height:1.7}
.readout__t{font-size:12.5px;margin:0 0 4px;letter-spacing:.01em}
.readout__lab{font-family:var(--serif);font-size:15px;color:var(--ink);margin:8px 0 14px;line-height:1.45}
.edgelist{list-style:none;margin:0;padding:0}
.edgelist li{padding:7px 0;border-top:1px solid var(--rule);font-size:11.5px;line-height:1.45}
.edgelist .lbl{display:block;font-family:var(--serif);font-size:13.5px;color:var(--ink-2);margin-top:3px}

/* ── the block map ─────────────────────────────────────────────────────── */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:12px;margin-top:8px}
.mapbox{background:var(--ground-2);border:1px solid var(--rule);border-radius:3px;padding:9px 10px 11px}
.mapbox--ext{border-color:var(--copper-dim)}
.mapbox__h{display:flex;gap:8px;align-items:baseline;margin-bottom:8px}
.mapbox__h .rk{color:var(--ink-3);font-size:10px}
.mapbox__h a{font-size:11.5px;text-decoration:none;font-weight:600}
.mapbox__h a:hover{color:var(--mineral)}
.mapbox__n{margin-left:auto;color:var(--ink-3);font-size:10px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{
  display:block;text-decoration:none;font-size:10.5px;line-height:1.25;padding:4px 6px;
  border:1px solid var(--rule);border-radius:2px;background:transparent;color:var(--ink);
  position:relative;
}
.chip:hover{border-color:var(--mineral);color:#fff}
.chip__d{color:var(--ink-3);font-size:9px;margin-left:4px}
.chip:hover .chip__d{color:var(--ink-2)}
.mapbox__none{font-size:10.5px;color:var(--ink-3);font-style:italic}
.dimmed{opacity:.22}

/* ── module blocks ─────────────────────────────────────────────────────── */
.mods{margin-top:6px}
.mod{border-top:1px solid var(--rule)}
.mod:last-child{border-bottom:1px solid var(--rule)}
.mod__head{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:14px;align-items:start;width:100%;text-align:left;padding:15px 0 16px}
.mod__head:hover .mod__name{color:var(--mineral)}
.mod__rk{color:var(--ink-3);font-size:11px;padding-top:2px}
.mod__name{font-size:16px;font-weight:600;letter-spacing:-.01em}
.mod__tags{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0 0}
.mod__sum{font-family:var(--serif);font-size:15px;color:var(--ink-2);margin:7px 0 0;max-width:62ch;line-height:1.5}
.mod__meta{text-align:right;color:var(--ink-3);font-size:10.5px;white-space:nowrap;padding-top:3px}
.mod__meta b{display:inline-block;min-width:1.6em;text-align:right;color:var(--ink-2);font-weight:400}
.bars{display:flex;gap:2px;justify-content:flex-end;margin-top:6px;height:5px}
.bars i{display:block;width:3px;background:var(--mineral-dim);border-radius:1px}
.bars i.o{background:var(--mineral)}
.mod__toggle{color:var(--ink-3);font-size:10px;letter-spacing:.1em}
.mod__body{padding:0 0 26px 48px}
@media(max-width:700px){.mod__body{padding-left:0}.mod__head{grid-template-columns:26px 1fr}.mod__meta{grid-column:2;text-align:left}}

.sub{margin-top:24px}
.sub__h{display:block;margin-bottom:10px;padding-bottom:5px;border-bottom:1px solid var(--rule)}

/* node entries (components) */
.ent{border-top:1px solid var(--rule)}
.ent:first-of-type{border-top:none}
.ent__head{display:flex;gap:12px;align-items:baseline;width:100%;text-align:left;padding:10px 0}
.ent__head:hover .ent__name{color:var(--mineral)}
.ent__name{font-size:13px;font-weight:600}
.ent__sum{font-family:var(--serif);font-size:14px;color:var(--ink-3);flex:1 1 auto;min-width:0}
.ent__deg{color:var(--ink-3);font-size:10px;white-space:nowrap}
.ent__body{padding:2px 0 22px 0}
.ent__body .prose{max-width:66ch}

.deps{list-style:none;margin:6px 0 0;padding:0}
.deps li{padding:8px 0 8px 0;border-top:1px solid #ffffff0f;font-size:11.5px}
.deps li:first-child{border-top:none}
.deps .lbl{font-family:var(--serif);font-size:14px;color:var(--ink-2);display:block;margin-top:2px}
.deps .dirn{color:var(--ink-3);font-size:10px;letter-spacing:.08em}
.deps .rby{color:var(--ink-3);font-size:10.5px;margin-top:3px;display:block}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:8px 34px}
.refs{font-size:11px;color:var(--ink-3);word-break:break-all;line-height:1.7}
.refs span{display:inline-block;margin-right:12px}

/* ── entity links + peek card ──────────────────────────────────────────── */
.el{color:var(--mineral);text-decoration:none;border-bottom:1px solid #6cb2b73d;white-space:nowrap}
.el:hover{border-bottom-color:var(--mineral);color:var(--focus)}
.el--ext{color:var(--copper);border-bottom-color:#cf7c463d}
.el--ext:hover{border-bottom-color:var(--copper);color:#e7a173}
.el--prose{font-family:var(--mono);font-size:.88em}

#peek{
  position:absolute;z-index:60;width:min(330px,88vw);background:var(--surface-2);
  border:1px solid var(--rule-2);border-radius:3px;padding:11px 13px;
  box-shadow:0 10px 30px #0009;pointer-events:none;
}
#peek[hidden]{display:none!important}
#peek .pk__n{font-size:12px;font-weight:600;margin-bottom:3px}
#peek .pk__m{font-size:10px;color:var(--ink-3);letter-spacing:.06em;margin-bottom:7px}
#peek .pk__s{font-family:var(--serif);font-size:13.5px;color:var(--ink-2);line-height:1.45}

@keyframes flashring{0%{box-shadow:0 0 0 2px var(--mineral);background:#6cb2b71f}100%{box-shadow:0 0 0 2px transparent;background:transparent}}
.flash{animation:flashring 1.3s ease-out 1}

/* ── flows ─────────────────────────────────────────────────────────────── */
.flow{margin-bottom:40px}
.flow__h{font-size:16px;font-weight:600;margin:0 0 4px}
.cast{display:flex;flex-wrap:wrap;gap:5px;margin:12px 0 18px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--rule)}
.step__n{color:var(--ink-3);font-size:10.5px;padding-top:3px}
.step__msg{font-family:var(--serif);font-size:15px;color:var(--ink);margin-bottom:4px}
.step__wire{font-size:11px;color:var(--ink-3);display:flex;flex-wrap:wrap;gap:6px;align-items:baseline}
.step__arrow{color:var(--rule-2)}
.k{font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:.1em .4em;border:1px solid var(--rule-2);border-radius:2px;color:var(--ink-3)}
.k--async{border-style:dashed}
.k--return{border-color:var(--rule);color:var(--ink-3);font-style:italic}
.frag{border-left:2px solid var(--copper-dim);padding-left:14px;margin:10px 0 10px 0}
.frag__h{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--copper);padding:4px 0}
.frag__h em{font-style:normal;font-family:var(--serif);text-transform:none;letter-spacing:0;font-size:13px;color:var(--ink-2);margin-left:8px}
.frag .step:first-child{border-top:none}

/* ── patterns ──────────────────────────────────────────────────────────── */
.pat{margin-bottom:42px}
.pat__h{font-size:16px;font-weight:600;margin:0 0 4px}
.tm{border-collapse:separate;border-spacing:0;font-size:11px;background:var(--field);border:1px solid var(--rule-2);border-radius:3px;margin-top:16px;width:100%}
.tm th,.tm td{border-right:1px solid #ffffff0f;border-bottom:1px solid #ffffff0f;padding:7px 9px;vertical-align:top;text-align:left}
.tm th:last-child,.tm td:last-child{border-right:none}
.tm tbody tr:last-child td{border-bottom:none}
.tm thead th{font-weight:400;color:var(--ink-3);font-size:10px;letter-spacing:.09em;text-transform:uppercase;border-bottom:1px solid var(--rule-2)}
.tm .st{color:var(--ink-2);white-space:nowrap;border-right:1px solid var(--rule-2);font-size:11.5px}
.tm td.on{background:var(--mineral-dim);color:#eaf6f7}
.tm td.on .trg{font-family:var(--serif);font-size:13px;line-height:1.35}
.tm td.self{background:#00000030}
.tmwrap{overflow-x:auto}

.foot{padding:40px 0 10px;color:var(--ink-3);font-size:11px;line-height:1.8}
.foot b{color:var(--ink-2);font-weight:400}
</style>
</head>
<body>

<div class="bar">
  <div class="wrap bar__in">
    <span class="bar__id">Continuo</span>
    <span class="bar__counts" id="counts"></span>
    <span class="bar__sp"></span>
    <span class="ctl">
      <label class="ctl__lab" for="q">Find</label>
      <input type="search" id="q" placeholder="name, summary, edge label…" autocomplete="off">
      <span class="hint" id="qn"></span>
    </span>
    <span class="ctl">
      <span class="ctl__lab">Edges</span>
      <span class="seg" id="scope">
        <button data-v="all" aria-pressed="true">All</button>
        <button data-v="cross" aria-pressed="false">Cross-module</button>
        <button data-v="ext" aria-pressed="false">Touching the game</button>
      </span>
    </span>
    <span class="ctl">
      <span class="seg" id="bulk">
        <button data-v="open">Expand all</button>
        <button data-v="shut">Collapse all</button>
      </span>
    </span>
  </div>
  <div class="wrap bar__trail" id="trail"></div>
</div>

<div id="peek" hidden></div>

<header class="mast" id="mastHeader"><div class="wrap">
  <div class="eyebrow mast__eyebrow" id="mastEyebrow"></div>
  <h1 class="mast__name" id="mastName"></h1>
  <p class="mast__sum" id="mastSum"></p>
  <div class="mast__grid">
    <div class="prose" id="mastDesc"></div>
    <div id="mastFields"></div>
  </div>
</div></header>

<section class="sec" id="sec-grid"><div class="wrap">
  <div class="sec__head">
    <h2 class="sec__t">The whole system, on one grid</h2>
    <span class="sec__n" id="gridCount"></span>
  </div>
  <p class="prose sec__lede" id="gridLede"></p>

  <div class="grid2">
    <div>
      <div class="mxwrap"><table class="mx" id="mx"></table></div>
      <div class="legend" id="mxLegend"></div>
    </div>
    <div class="readout" id="readout"></div>
  </div>
</div></section>

<section class="sec" id="sec-map"><div class="wrap">
  <div class="sec__head">
    <h2 class="sec__t">Every part, shaded by how much talks to it</h2>
    <span class="sec__n" id="mapCount"></span>
  </div>
  <p class="prose sec__lede" id="mapLede"></p>
  <div class="map" id="map"></div>
</div></section>

<section class="sec" id="sec-mods"><div class="wrap">
  <div class="sec__head">
    <h2 class="sec__t">The modules, in dependency order</h2>
    <span class="sec__n" id="modCount"></span>
  </div>
  <p class="prose sec__lede" id="modLede"></p>
  <div class="mods" id="mods"></div>
</div></section>

<section class="sec" id="sec-flows"><div class="wrap">
  <div class="sec__head">
    <h2 class="sec__t">What it does, step by step</h2>
    <span class="sec__n" id="flowCount"></span>
  </div>
  <p class="prose sec__lede" id="flowLede"></p>
  <div id="flows"></div>
</div></section>

<section class="sec" id="sec-pats"><div class="wrap">
  <div class="sec__head">
    <h2 class="sec__t">Shapes the author named</h2>
    <span class="sec__n" id="patCount"></span>
  </div>
  <p class="prose sec__lede" id="patLede"></p>
  <div id="pats"></div>
</div></section>

<footer class="foot"><div class="wrap" id="foot"></div></footer>

    {
      "id": "f8c689af-fecc-4572-bd49-3457c332fab0",
      "name": "Built-in Ground Moves",
      "type": "Component",
      "parentId": "5f00f65b-d38e-4057-9497-07d436443301",
      "root": null,
      "role": null,
      "foundational": false,
      "description": "These four register into the default movement set in a fixed order, and that order is load-bearing: the search breaks equal-cost ties by discovery order, so registering them differently would silently change which of two equally cheap paths comes back. All four delegate what counts as stable ground to one shared classifier outside this package, so the rules about walkable terrain live in a single place rather than being restated per movement.",
      "codeRefs": [
        "src/main/java/dev/continuo/pathfinder/TraverseMove.java",
        "src/main/java/dev/continuo/pathfinder/AscendMove.java",
        "src/main/java/dev/continuo/pathfinder/DescendMove.java",
        "src/main/java/dev/continuo/pathfinder/DiagonalMove.java"
      ],
      "docRefs": [],
      "createdAt": "2026-09-15T09:21:21.203Z",
      "updatedAt": "2026-09-15T09:21:21.203Z",
      "fields": {
        "responsibilities": [
          "Offers every legal ground movement from a position, so the search only ever sees positions a player could actually reach",
          "Prices each movement so a cheaper route is always found before a more expensive one of equal usefulness"
        ],
        "rules": [
          "A diagonal step is refused unless both blocks at the corner are clear at feet and head height, since a player cannot squeeze between two blocks meeting at a corner",
          "A fall only ever offers the landing, never a position passed through on the way down, since a falling player has no choices left to make mid-air"
        ],
        "summary": "The four basic walk, jump, fall and diagonal moves every search starts with."
      }

    {
      "id": "628cd4da-d958-4822-a6bf-d7b9b619bb10",

      "root": null,
      "role": null,
      "foundational": false,
      "description": "One shared derivation turns a list of positions into the moves between them, so a result from a single search and a result from a chained multi-segment run can never disagree about what a route's steps are. Positions here are packed using the same key format a sibling module already keys its own terrain cache by, so a location computed here is directly comparable to one read back from a world snapshot with no conversion step.",
      "codeRefs": [
        "src/main/java/dev/continuo/pathfinder/PathResult.java",
        "src/main/java/dev/continuo/pathfinder/PathResults.java",
        "src/main/java/dev/continuo/pathfinder/PathOutcome.java",

          "Derives the individual moves a route is made of, so nothing downstream has to re-derive a movement's kind from raw positions itself"
        ],
        "rules": [
          "Every outcome other than a found or partial route carries an empty path and a zero cost, never a stale value from an earlier attempt",
          "A partial outcome always carries a real, non-empty route to somewhere useful, distinguishing a search that backed off from one that found nothing"
        ],
        "summary": "What a search or run produced: outcome, route, cost and its steps."
      }

    {
      "id": "aa1f1e46-87d4-4b0c-b29a-33e9b428b843",

      "foundational": false,
      "description": "Deliberately ASCII rather than an image, since the people and agents debugging a failing route read text output directly rather than opening a file from a build directory. The round trip is not perfect on live terrain: a block outside the legend's classification prints as a wall rather than as itself, so a map captured from a running game can be stricter than the world it came from and needs checking for unmapped or unexpectedly-blocked characters before it is trusted as a regression fixture.",
      "codeRefs": [
        "src/main/java/dev/continuo/pathfinder/PathRenderer.java",
        "src/main/java/dev/continuo/pathfinder/BlockLegend.java"

      "updatedAt": "2026-09-15T09:21:21.205Z",
      "fields": {
        "responsibilities": [

          "Keeps the character-to-block mapping identical between what gets rendered and what a fixture parser reads back, so a rendered failure is pasteable as a new test fixture"
        ],
        "rules": [
          "An overlay character replaces the terrain underneath rather than layering onto it, so a passable non-air block is indistinguishable from air wherever a path or expansion marker covers it",

      "description": "The executor's own phase across a walk, driven by walkTo, search completion, and the stuck/off-path detector. Distinct from the per-tick input write, which is recomputed fresh in every phase rather than accumulated.",
      "anchor": "f47fd47b-7529-4d24-a5e9-ed2121633dc0",

        {

          "trigger": "off-path or stuck",

        },
        {
          "from": "Plan-Ahead",
          "to": "Repathing",
          "trigger": "off-path or stuck",

        },
        {
          "from": "Repathing",

        },

          "trigger": "repath budget exceeded, or NO_PATH",

      "description": "The lifecycle global rule 2 and rule 3 together impose on the adapter: start once, deliver ticks, and stop delivering the moment the core faults until the world reloads.",
      "anchor": "55aaecfd-d920-4c25-b792-87afe87f1c5e",

}</script>
<script>
"use strict";
(function(){
const M = JSON.parse(document.getElementById('model').textContent);
const NODES = M.nodes, CONNS = M.connections, FLOWS = M.flows, PATS = M.patterns;
const byId = new Map(NODES.map(n => [n.id, n]));
const cById = new Map(CONNS.map(c => [c.id, c]));

/* ── helpers ──────────────────────────────────────────────────────────── */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// the profile says list fields support **bold** and `code`; nothing else.
const md = s => esc(s)
  .replace(/`([^`]+)`/g, (m,a)=>'<code>'+a+'</code>')
  .replace(/\*\*([^*]+)\*\*/g, (m,a)=>'<strong>'+a+'</strong>');
const el = (tag, cls, html) => { const e = document.createElement(tag);
  if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const LAYER = { System:'Context', Container:'Container', Component:'Component',
                ExternalSystem:'Context', Actor:'Context' };

const isExt   = n => n.type === 'ExternalSystem';
const parent  = n => n.parentId ? byId.get(n.parentId) : null;
/** The unit a node belongs to: a Component rolls up to its Container; everything else is itself. */
const unitOf  = n => n.type === 'Component' ? byId.get(n.parentId) : n;
const sumOf   = n => (n.fields && n.fields.summary) || '';
const techOf  = n => (n.fields && n.fields.technology) || '';
const listOf  = (n,k) => (n.fields && Array.isArray(n.fields[k])) ? n.fields[k] : [];

/** Accumulated root down the containment chain (see packages/schema/src/ref.ts). */
function rootOf(n){ const chain=[]; let cur=n, guard=0;
  while (cur && guard++ < 50){ if (cur.root) chain.push(cur.root); cur = parent(cur); }
  if (!chain.length) return null;
  let out = chain.reverse().reduce((a,b)=> a.replace(/\/$/,'') + '/' + b );
  return out.endsWith('/') ? out : out + '/';
}
const resolveRef = (n, r) => { const root = rootOf(n);
  return root && !r.startsWith('/') ? root.replace(/\/$/,'') + '/' + r : r; };

/* ── degree, at component altitude ────────────────────────────────────── */
const deg = new Map(NODES.map(n => [n.id, {i:0,o:0}]));
CONNS.forEach(c => {
  const a = byId.get(c.from), b = byId.get(c.to);
  if (a.type !== 'Component' && b.type !== 'Component') return;  // container edges counted separately
  deg.get(c.from).o++; deg.get(c.to).i++;
});
const degOf = n => deg.get(n.id) || {i:0,o:0};
const degTot = n => { const d = degOf(n); return d.i + d.o; };
const maxDeg = Math.max(1, ...NODES.map(degTot));

/* ── units, ordered by distance from the metal ────────────────────────── */
const UNITS = NODES.filter(n => n.type === 'Container' || isExt(n));
const uAdj = new Map(UNITS.map(u => [u.id, new Set()]));
const uStat = new Map(UNITS.map(u => [u.id, {out:0, in:0, internal:0}]));
CONNS.forEach(c => {
  const a = byId.get(c.from), b = byId.get(c.to);
  if (a.type === 'System' || b.type === 'System') return;
  const ua = unitOf(a), ub = unitOf(b);
  if (!ua || !ub) return;
  if (ua.id === ub.id) { uStat.get(ua.id).internal++; return; }
  uAdj.get(ua.id).add(ub.id);
  uStat.get(ua.id).out++; uStat.get(ub.id).in++;
});
// longest path to a sink = how far this module sits from the bare metal
const depthMemo = new Map();
function depth(id, seen){ if (depthMemo.has(id)) return depthMemo.get(id);
  seen = seen || new Set(); if (seen.has(id)) return 0; seen.add(id);
  let d = 0; uAdj.get(id).forEach(t => { d = Math.max(d, 1 + depth(t, seen)); });
  depthMemo.set(id, d); return d;
}
UNITS.forEach(u => depth(u.id));
const ORDER = UNITS.slice().sort((a,b) =>
  depth(b.id) - depth(a.id) ||
  uStat.get(b.id).out - uStat.get(a.id).out ||
  uStat.get(b.id).in  - uStat.get(a.id).in  ||
  a.name.localeCompare(b.name));
const rank = new Map(ORDER.map((u,i) => [u.id, i]));
const rk = n => String((rank.get(unitOf(n) ? unitOf(n).id : n.id) ?? 0) + 1).padStart(2,'0');

/* ── the coupling grid: one cell per authored unit-level connection ───── */
const CELL = new Map();   // "fromId|toId" -> {conn, edges:[component connections]}
CONNS.forEach(c => {
  const a = byId.get(c.from), b = byId.get(c.to);
  if (a.type === 'Component' || b.type === 'Component') return;
  if (a.type === 'System' || b.type === 'System') return;
  CELL.set(c.from + '|' + c.to, { conn:c, edges:c.realizedBy.map(id => cById.get(id)).filter(Boolean) });
});
let maxW = 0; CELL.forEach(v => { maxW = Math.max(maxW, v.edges.length || 1); });
const forwardOnly = [...CELL.keys()].every(k => {
  const [f,t] = k.split('|'); return rank.get(f) < rank.get(t);
});

/* ── counts ───────────────────────────────────────────────────────────── */
const nComp = NODES.filter(n => n.type === 'Component').length;
const compEdges = CONNS.filter(c => byId.get(c.from).type === 'Component' || byId.get(c.to).type === 'Component');
const crossEdges = compEdges.filter(c => unitOf(byId.get(c.from)).id !== unitOf(byId.get(c.to)).id);
const extEdges = CONNS.filter(c => isExt(byId.get(c.from)) || isExt(byId.get(c.to)));
const founds = NODES.filter(n => n.foundational);

/* ── scope filter (mirrors the model's own crossingBoundary / involvingExternal) */
let scope = 'all';
function inScope(c){
  if (scope === 'all') return true;
  const a = byId.get(c.from), b = byId.get(c.to);
  if (scope === 'ext') return isExt(a) || isExt(b);
  return unitOf(a).id !== unitOf(b).id;   // 'cross'
}

/* ── entity links ─────────────────────────────────────────────────────── */
function nodeLink(n, opts){
  opts = opts || {};
  const cls = 'el' + (isExt(n) ? ' el--ext' : '') + (opts.prose ? ' el--prose' : '');
  const amb = opts.qualify !== false && NODES.filter(x => x.name === n.name).length > 1 && parent(n);
  const label = esc(n.name) + (amb ? ' <span style="color:var(--ink-3)">(' + esc(parent(n).name) + ')</span>' : '');
  return '<a class="' + cls + '" href="#n-' + n.id + '" data-peek="n-' + n.id + '">' + label + '</a>';
}
const connLink = (c, text) =>
  '<a class="el" href="#c-' + c.id + '" data-peek="c-' + c.id + '">' + esc(text) + '</a>';

/* ── masthead ─────────────────────────────────────────────────────────── */
const SYS = NODES.find(n => n.type === 'System');
function fieldsBlock(n){
  let h = '';
  const r = listOf(n,'responsibilities'), u = listOf(n,'rules');
  if (r.length) h += '<div class="fieldset"><span class="eyebrow fieldset__h">Relied on to</span>' +
    '<ul class="bullets">' + r.map(x => '<li>' + md(x) + '</li>').join('') + '</ul></div>';
  if (u.length) h += '<div class="fieldset"><span class="eyebrow fieldset__h">Always true</span>' +
    '<ul class="bullets bullets--rules">' + u.map(x => '<li>' + md(x) + '</li>').join('') + '</ul></div>';
  return h;
}
document.getElementById('counts').textContent =
  NODES.length + ' nodes · ' + CONNS.length + ' connections · ' + FLOWS.length + ' flows · ' + PATS.length + ' patterns';
document.getElementById('mastEyebrow').textContent =
  'Architecture model · profile ' + M.activeProfile + ' · ' + UNITS.filter(u=>!isExt(u)).length + ' modules, ' + nComp + ' components';
document.getElementById('mastName').textContent = SYS.name;
document.getElementById('mastHeader').id = 'n-' + SYS.id;
document.getElementById('mastSum').textContent = sumOf(SYS);
document.getElementById('mastDesc').innerHTML = md(SYS.description) +
  '<p style="font-size:13px;color:var(--ink-3);font-family:var(--mono);line-height:1.7;margin-top:22px">' +
  'Everything below comes from the model file and nothing else. Names, summaries, ' +
  'responsibilities, rules and edge labels are the author’s words; the counts, the ordering and ' +
  'the shading are computed from them. Where a field is empty it prints nothing.' +
  (SYS.docRefs.length ? '<br>Source documents: ' + SYS.docRefs.map(d=>'<code>'+esc(d)+'</code>').join(' ') : '') +
  '</p>';
document.getElementById('mastFields').innerHTML = fieldsBlock(SYS);

/* ── section 1: the grid ──────────────────────────────────────────────── */
document.getElementById('gridCount').textContent =
  ORDER.length + ' modules · ' + CELL.size + ' dependencies · ' + crossEdges.length + ' component edges beneath them';
document.getElementById('gridLede').innerHTML =
  'Continuo is nine modules plus the two Minecraft clients it runs inside. Read a row as ' +
  '<strong>&ldquo;this module depends on&hellip;&rdquo;</strong> and a column as ' +
  '<strong>&ldquo;&hellip;is depended on by&rdquo;</strong>. The number in a cell is how many ' +
  'component-level connections make that dependency real, so a heavy cell is a thick seam and a ' +
  'light one is a single call. Rows are ordered by distance from the bare metal: ' +
  '<strong>01</strong> is the furthest from Minecraft, <strong>' + String(ORDER.length).padStart(2,'0') +
  '</strong> the closest. ' +
  (forwardOnly
    ? 'Every mark therefore falls <strong>above the diagonal</strong> — which is the model’s own rule, ' +
      '<em>&ldquo;module dependencies point one way only; nothing depends on an adapter&rdquo;</em>, made visible. ' +
      'A cycle would show up as a mark below the line.'
    : 'Marks below the diagonal are dependency cycles.') +
  ' Click a cell to read the seam.';

function buildMatrix(){
  const t = document.getElementById('mx'); t.innerHTML = '';
  const head = el('thead');
  let hr = '<th class="corner">depends on →</th>';
  ORDER.forEach((u,i) => { hr += '<th title="' + esc(u.name) + '">' + String(i+1).padStart(2,'0') + '</th>'; });
  hr += '<th class="out">out</th>';
  head.innerHTML = '<tr>' + hr + '</tr>'; t.appendChild(head);

  const body = el('tbody');
  ORDER.forEach((u,i) => {
    const tr = el('tr'); tr.dataset.row = String(i);
    let out = 0;
    let h = '<td class="rowlab"><button data-goto="n-' + u.id + '" data-peek="n-' + u.id + '">' +
            '<span class="rk">' + String(i+1).padStart(2,'0') + '</span>' + esc(u.name) + '</button></td>';
    ORDER.forEach((v,j) => {
      if (i === j) { h += '<td class="cell diag"></td>'; return; }
      const cell = CELL.get(u.id + '|' + v.id);
      if (!cell) { h += '<td class="cell"></td>'; return; }
      const w = cell.edges.length || 1;
      out += w;
      const ext = isExt(u) || isExt(v) ? ' data-ext="y"' : '';
      const a = (0.30 + 0.70 * (w / maxW)).toFixed(2);
      h += '<td class="cell" data-w="' + w + '" data-c="' + u.id + '|' + v.id + '"' + ext +
           ' style="opacity:' + a + '"><button data-cell="' + u.id + '|' + v.id + '" ' +
           'title="' + esc(u.name + ' → ' + v.name) + '">' + w + '</button></td>';
    });
    h += '<td class="out">' + (out || '·') + '</td>';
    tr.innerHTML = h; body.appendChild(tr);
  });
  t.appendChild(body);

  const foot = el('tfoot');
  let fr = '<td class="rowlab">depended on by ↑</td>';
  ORDER.forEach((v) => {
    let inn = 0;
    ORDER.forEach(u => { const c = CELL.get(u.id + '|' + v.id); if (c) inn += (c.edges.length || 1); });
    fr += '<td>' + (inn || '·') + '</td>';
  });
  fr += '<td class="out"></td>';
  foot.innerHTML = '<tr>' + fr + '</tr>'; t.appendChild(foot);
}
buildMatrix();

document.getElementById('mxLegend').innerHTML =
  '<span><span class="sw" style="background:var(--mineral-dim)"></span><b>1–' + maxW +
  '</b> component edges realising the dependency — the brighter the cell, the thicker the seam</span>' +
  '<span><span class="sw" style="background:var(--copper-dim)"></span>the edge crosses out of Continuo into a Minecraft client</span>' +
  '<span><span class="sw" style="background:#00000030"></span>the diagonal — a module’s own internals, counted in its entry below</span>' +
  '<span>· no dependency in either direction</span>' +
  (founds.length
    ? '<span><span class="tag tag--found">foundational</span> ' + founds.length + ' node(s) the author marked as infrastructure</span>'
    : '<span><span class="tag tag--found">foundational</span> the author marked no node with it, so it prints nowhere</span>');

/* ── readout panel ────────────────────────────────────────────────────── */
const READ = document.getElementById('readout');
const READ_EMPTY =
  '<p class="readout__empty">Hover a cell to see which dependency it is.<br>Click to keep it here.' +
  '<br><br>Hover any <a class="el" href="#sec-mods">underlined name</a> anywhere on the page to peek at it ' +
  'without leaving your place.</p>';
READ.innerHTML = READ_EMPTY;
let pinned = null;

function showCell(key){
  const cell = CELL.get(key); if (!cell) return;
  const c = cell.conn, a = byId.get(c.from), b = byId.get(c.to);
  let h = '<div class="eyebrow" style="margin-bottom:8px">' +
    (pinned === key ? 'Pinned — click the cell again to release' : 'Dependency') + '</div>';
  h += '<p class="readout__t">' + nodeLink(a) + ' <span style="color:var(--ink-3)">→</span> ' + nodeLink(b) + '</p>';
  h += '<p class="readout__lab">' + md(c.label) + '</p>';
  h += '<div class="eyebrow">' + (cell.edges.length
      ? cell.edges.length + ' component edge' + (cell.edges.length > 1 ? 's' : '') + ' realise it'
      : 'Claims no component edges') + '</div>';
  h += '<ul class="edgelist">' + cell.edges.map(e => {
    const x = byId.get(e.from), y = byId.get(e.to);
    return '<li>' + nodeLink(x) + ' <span style="color:var(--ink-3)">→</span> ' + nodeLink(y) +
      '<span class="lbl">' + md(e.label) + '</span>' +
      '<a class="el" style="font-size:10px" href="#c-' + e.id + '">open →</a></li>';
  }).join('') + '</ul>';
  h += '<p style="margin-top:14px"><a class="el" style="font-size:11px" href="#c-' + c.id + '">' +
       'Open this connection where it lives →</a></p>';
  READ.innerHTML = h;
}
function crosshair(key){
  document.querySelectorAll('#mx tr.xrow').forEach(e => e.classList.remove('xrow'));
  document.querySelectorAll('#mx .xcol').forEach(e => e.classList.remove('xcol'));
  if (!key) return;
  const [f,t] = key.split('|'); const ri = rank.get(f), ci = rank.get(t);
  const rows = document.querySelectorAll('#mx tbody tr');
  if (rows[ri]) rows[ri].classList.add('xrow');
  rows.forEach(r => { const c = r.querySelectorAll('td.cell')[ci]; if (c) c.classList.add('xcol'); });
}
document.getElementById('mx').addEventListener('mouseover', ev => {
  const b = ev.target.closest('[data-cell]'); if (!b) return;
  crosshair(b.dataset.cell); if (!pinned) showCell(b.dataset.cell);
});
document.getElementById('mx').addEventListener('mouseleave', () => {
  if (!pinned) { crosshair(null); READ.innerHTML = READ_EMPTY; } else crosshair(pinned);
});
document.getElementById('mx').addEventListener('click', ev => {
  const b = ev.target.closest('[data-cell]');
  if (b) { pinned = (pinned === b.dataset.cell) ? null : b.dataset.cell;
           crosshair(pinned); pinned ? showCell(pinned) : (READ.innerHTML = READ_EMPTY); return; }
  const g = ev.target.closest('[data-goto]');
  if (g) { ev.preventDefault(); goTo(g.dataset.goto, true); }
});

/* ── section 2: the block map ─────────────────────────────────────────── */
document.getElementById('mapCount').textContent = NODES.length + ' nodes · no orphans';
document.getElementById('mapLede').innerHTML =
  'The same eleven boxes, opened up. Each tile is one component; its shade and the number beside it ' +
  'are its connection count, so the busiest parts of the system are the brightest tiles on the page. ' +
  'Hover one to read what it is for. Click to open its entry.';

function chipHTML(n){
  const d = degOf(n), tot = d.i + d.o;
  const a = (0.05 + 0.42 * (tot / maxDeg)).toFixed(3);
  return '<a class="chip" href="#n-' + n.id + '" data-peek="n-' + n.id + '" data-node="' + n.id + '" ' +
    'style="background:rgba(108,178,183,' + a + ')">' + esc(n.name) +
    '<span class="chip__d">' + tot + '</span></a>';
}
function buildMap(){
  const wrap = document.getElementById('map'); wrap.innerHTML = '';
  ORDER.forEach((u,i) => {
    const kids = NODES.filter(n => n.parentId === u.id);
    const box = el('div', 'mapbox' + (isExt(u) ? ' mapbox--ext' : ''));
    box.dataset.unit = u.id;
    box.innerHTML =
      '<div class="mapbox__h"><span class="rk">' + String(i+1).padStart(2,'0') + '</span>' +
      '<a href="#n-' + u.id + '" data-peek="n-' + u.id + '" data-node="' + u.id + '">' + esc(u.name) + '</a>' +
      '<span class="mapbox__n">' + (kids.length ? kids.length : '—') + '</span></div>' +
      (kids.length
        ? '<div class="chips">' + kids.map(chipHTML).join('') + '</div>'
        : '<div class="mapbox__none">' + (isExt(u)
            ? 'outside the model — no internals recorded'
            : 'no components recorded') + '</div>');
    wrap.appendChild(box);
  });
}
buildMap();

/* ── section 3: the modules ───────────────────────────────────────────── */
document.getElementById('modCount').textContent =
  UNITS.filter(u=>!isExt(u)).length + ' modules · ' + nComp + ' components · ' +
  compEdges.length + ' component connections (' + (compEdges.length - crossEdges.length) + ' internal, ' + crossEdges.length + ' crossing)';
document.getElementById('modLede').innerHTML =
  'Every node, connection, flow step and pattern member on this page links here, and everything opens ' +
  'in place — following a link never takes the page away from you, it just unfolds the thing you asked for ' +
  'and offers you a way back.';

function tagsFor(n){
  let t = '<span class="tag">' + esc(n.type === 'ExternalSystem' ? 'external system' : n.type) + '</span>';
  if (techOf(n)) t += '<span class="tag tag--tech">' + esc(techOf(n)) + '</span>';
  if (n.role) t += '<span class="tag tag--role">' + esc(n.role) + '</span>';
  if (n.foundational) t += '<span class="tag tag--found">foundational</span>';
  if (n.root) t += '<span class="tag">' + esc(n.root) + '</span>';
  return t;
}
/** Connections out of / into a node, at its own altitude. */
const outOf = n => CONNS.filter(c => c.from === n.id);
const inTo  = n => CONNS.filter(c => c.to === n.id);

function depRow(c, dir){
  const a = byId.get(c.from), b = byId.get(c.to);
  const other = dir === 'out' ? b : a;
  const idAttr = dir === 'out' ? ' id="c-' + c.id + '"' : '';   // canonical place = the source's entry
  let h = '<li' + idAttr + ' data-conn="' + c.id + '" data-scope="' +
    (unitOf(a).id !== unitOf(b).id ? 'cross' : 'in') + (isExt(a) || isExt(b) ? ' ext' : '') + '">';
  h += '<span class="dirn">' + (dir === 'out' ? '→' : '←') + '</span> ' + nodeLink(other);
  if (c.direction === 'Bidirectional') h += ' <span class="tag">bidirectional</span>';
  h += '<span class="lbl">' + md(c.label) + '</span>';
  if (c.description) h += '<span class="lbl" style="color:var(--ink-3);font-size:13px">' + md(c.description) + '</span>';
  if (c.realizedBy.length) {
    h += '<span class="rby">realised by ' + c.realizedBy.map(id => {
      const e = cById.get(id); if (!e) return '';
      return connLink(e, byId.get(e.from).name + ' → ' + byId.get(e.to).name);
    }).filter(Boolean).join(' &nbsp;·&nbsp; ') + '</span>';
  }
  if (dir === 'in') h += '<span class="rby"><a class="el" style="font-size:10px" href="#c-' + c.id + '">stated on ' + esc(a.name) + ' →</a></span>';
  if (c.codeRefs.length) h += '<span class="refs">' + c.codeRefs.map(r=>'<span>'+esc(r)+'</span>').join('') + '</span>';
  return h + '</li>';
}
function depsBlock(n){
  const o = outOf(n), i = inTo(n);
  if (!o.length && !i.length) return '<div class="sub"><span class="eyebrow sub__h">Connections</span>' +
    '<p class="prose" style="font-size:14px">Nothing in the model connects to this node.</p></div>';
  let h = '<div class="two">';
  h += '<div class="sub"><span class="eyebrow sub__h">Depends on · ' + o.length + '</span>' +
       (o.length ? '<ul class="deps">' + o.map(c => depRow(c,'out')).join('') + '</ul>'
                 : '<p class="refs">nothing — this is a leaf of the dependency order</p>') + '</div>';
  h += '<div class="sub"><span class="eyebrow sub__h">Depended on by · ' + i.length + '</span>' +
       (i.length ? '<ul class="deps">' + i.map(c => depRow(c,'in')).join('') + '</ul>'
                 : '<p class="refs">nothing — nothing in the model points here</p>') + '</div>';
  return h + '</div>';
}
function refsBlock(n){
  let h = '';
  if (n.codeRefs.length) h += '<div class="sub"><span class="eyebrow sub__h">In the source</span>' +
    '<p class="refs">' + n.codeRefs.map(r => '<span>' + esc(resolveRef(n,r)) + '</span>').join('') + '</p></div>';
  if (n.docRefs.length) h += '<div class="sub"><span class="eyebrow sub__h">In the docs</span>' +
    '<p class="refs">' + n.docRefs.map(r => '<span>' + esc(r) + '</span>').join('') + '</p></div>';
  return h;
}
function belongsBlock(n){
  const fl = FLOWS.filter(f => f.steps.some(s => s.from === n.id || s.to === n.id));
  const pa = PATS.filter(p => p.anchor === n.id || p.members.some(m => m.nodeId === n.id));
  if (!fl.length && !pa.length) return '';
  let h = '<div class="sub"><span class="eyebrow sub__h">Appears in</span><p class="refs" style="font-size:11.5px">';
  h += fl.map(f => '<span><a class="el" href="#f-' + f.id + '">' + esc(f.name) + '</a> — ' +
        f.steps.filter(s => s.from === n.id || s.to === n.id).length + ' step(s)</span>').join('');
  h += pa.map(p => '<span><a class="el" href="#p-' + p.id + '">' + esc(p.name) + '</a>' +
        (p.anchor === n.id ? ' — anchor' : '') + '</span>').join('');
  return h + '</p></div>';
}

function entryHTML(n){
  const d = degOf(n);
  return '<div class="ent" id="n-' + n.id + '" data-node="' + n.id + '" data-collapsible>' +
    '<button class="ent__head" data-toggle aria-expanded="false">' +
      '<span class="ent__name">' + esc(n.name) + '</span>' +
      '<span class="ent__sum">' + esc(sumOf(n)) + '</span>' +
      '<span class="ent__deg">' + d.o + '→ · →' + d.i + '</span>' +
      '<span class="mod__toggle" data-caret>OPEN</span>' +
    '</button>' +
    '<div class="ent__body" hidden>' +
      '<p class="mod__tags" style="margin-bottom:14px">' + tagsFor(n) + '</p>' +
      (n.description ? '<div class="prose">' + md(n.description) + '</div>' : '') +
      '<div class="two" style="margin-top:18px">' +
        '<div>' + fieldsBlock(n) + '</div>' +
        '<div>' + refsBlock(n) + belongsBlock(n) + '</div>' +
      '</div>' +
      depsBlock(n) +
    '</div></div>';
}

function buildMods(){
  const wrap = document.getElementById('mods'); wrap.innerHTML = '';
  ORDER.forEach((u,i) => {
    const kids = NODES.filter(n => n.parentId === u.id);
    const st = uStat.get(u.id);
    const bars = (v, cls) => { let s = ''; for (let k = 0; k < Math.min(v, 22); k++) s += '<i class="' + cls + '"></i>'; return s; };
    const box = el('div', 'mod'); box.id = 'n-' + u.id;
    box.dataset.node = u.id; box.dataset.unit = u.id; box.setAttribute('data-collapsible','');
    box.innerHTML =
      '<button class="mod__head" data-toggle aria-expanded="false">' +
        '<span class="mod__rk">' + String(i+1).padStart(2,'0') + '</span>' +
        '<span><span class="mod__name">' + esc(u.name) + '</span>' +
          '<span class="mod__tags">' + tagsFor(u) + '</span>' +
          '<span class="mod__sum">' + esc(sumOf(u)) + '</span></span>' +
        '<span class="mod__meta">' +
          (kids.length ? kids.length + ' components<br>' : 'no components<br>') +
          '<b>' + st.out + '</b> out · <b>' + st.in + '</b> in<br>' +
          '<span style="color:var(--ink-3)">' + st.internal + ' internal</span>' +
          '<span class="bars">' + bars(st.out,'o') + bars(st.in,'') + '</span>' +
          '<span class="mod__toggle" data-caret style="display:block;margin-top:6px">OPEN</span>' +
        '</span>' +
      '</button>' +
      '<div class="mod__body" hidden>' +
        (u.description ? '<div class="prose">' + md(u.description) + '</div>' : '') +
        '<div class="two" style="margin-top:18px">' +
          '<div>' + fieldsBlock(u) + '</div>' +
          '<div>' + refsBlock(u) + belongsBlock(u) + '</div>' +
        '</div>' +
        depsBlock(u) +
        (kids.length
          ? '<div class="sub"><span class="eyebrow sub__h">Inside · ' + kids.length + ' components, ' +
            st.internal + ' connections between them</span>' + kids.map(entryHTML).join('') + '</div>'
          : '') +
      '</div>';
    wrap.appendChild(box);
  });
}
buildMods();

/* ── section 4: flows ─────────────────────────────────────────────────── */
document.getElementById('flowCount').textContent =
  FLOWS.length + ' flows · ' + FLOWS.reduce((s,f)=>s+f.steps.length,0) + ' steps';
document.getElementById('flowLede').innerHTML =
  'A flow is an ordered walk through nodes the model already contains — it adds no new parts, it only ' +
  'says what happens in what order. A bracket marks a step the author fenced with a condition: ' +
  '<span class="k">loop</span> repeats, <span class="k">opt</span> may not happen at all.';

function stepHTML(s, f){
  const a = byId.get(s.from), b = byId.get(s.to);
  if (!a || !b) return '';
  const via = s.via ? cById.get(s.via) : null;
  return '<li class="step">' +
    '<span class="step__n">' + String(s.order).padStart(2,'0') + '</span>' +
    '<span><span class="step__msg">' + esc(s.message) + '</span>' +
    '<span class="step__wire">' + nodeLink(a) + '<span class="step__arrow">→</span>' + nodeLink(b) +
      (s.kind !== 'Sync' ? '<span class="k k--' + s.kind.toLowerCase() + '">' + esc(s.kind) + '</span>' : '') +
      (via ? '<span>over ' + connLink(via, via.label) + '</span>'
           : '<span style="color:var(--rule-2)">no connection named</span>') +
    '</span></span></li>';
}
function buildFlows(){
  const wrap = document.getElementById('flows'); wrap.innerHTML = '';
  FLOWS.forEach(f => {
    const cast = [];
    f.steps.forEach(s => { [s.from, s.to].forEach(id => { if (!cast.includes(id)) cast.push(id); }); });
    const box = el('div', 'flow'); box.id = 'f-' + f.id;
    // group consecutive steps sharing a control fragment
    let groups = [], cur = null;
    f.steps.slice().sort((x,y) => x.order - y.order).forEach(s => {
      const key = s.control ? s.control.type + '|' + s.control.condition : null;
      if (key && cur && cur.key === key) cur.steps.push(s);
      else { cur = { key: key, control: s.control || null, steps: [s] }; groups.push(cur); }
    });
    box.innerHTML =
      '<h3 class="flow__h">' + esc(f.name) + '</h3>' +
      '<p class="eyebrow">' + f.steps.length + ' steps · ' + cast.length + ' participants · ' +
        (f.scope ? 'written at ' + esc(f.scope) + ' altitude' : 'no altitude given') + '</p>' +
      '<div class="prose" style="margin-top:12px">' + md(f.description) + '</div>' +
      '<div class="cast">' + cast.map(id => {
          const n = byId.get(id);
          return n ? '<span class="tag" style="border-color:var(--rule)">' + rk(n) + ' ' +
                     nodeLink(n) + '</span>' : ''; }).join('') + '</div>' +
      '<ul class="steps">' + groups.map(g => {
          const inner = g.steps.map(s => stepHTML(s, f)).join('');
          if (!g.control) return inner;
          return '<div class="frag"><div class="frag__h">' + esc(g.control.type) +
                 (g.control.condition ? '<em>' + esc(g.control.condition) + '</em>' : '') + '</div>' + inner + '</div>';
        }).join('') + '</ul>';
    wrap.appendChild(box);
  });
}
buildFlows();

/* ── section 5: patterns ──────────────────────────────────────────────── */
document.getElementById('patCount').textContent =
  PATS.length + ' patterns · ' + PATS.reduce((s,p)=>s+p.members.length,0) + ' members · ' +
  PATS.reduce((s,p)=>s+p.transitions.length,0) + ' transitions';
document.getElementById('patLede').innerHTML =
  'A pattern names a shape the author recognised in one node and wrote down separately. Both of the ones ' +
  'here are state machines, so they get the same device as the overview: a grid. Read a row as ' +
  '<strong>&ldquo;from this state&rdquo;</strong> and a column as <strong>&ldquo;to this state&rdquo;</strong>; ' +
  'a filled cell is a transition and carries what triggers it.';

function buildPats(){
  const wrap = document.getElementById('pats'); wrap.innerHTML = '';
  PATS.forEach(p => {
    const anchor = p.anchor ? byId.get(p.anchor) : null;
    const box = el('div','pat'); box.id = 'p-' + p.id;
    const names = p.members.map(m => m.name);
    const tmap = new Map();
    p.transitions.forEach(t => tmap.set(t.from + '|' + t.to, t));
    let table = '<div class="tmwrap"><table class="tm"><thead><tr><th>from \\ to</th>' +
      names.map(n => '<th>' + esc(n) + '</th>').join('') + '</tr></thead><tbody>';
    names.forEach(f => {
      table += '<tr><td class="st">' + esc(f) + '</td>';
      names.forEach(t => {
        if (f === t) { table += '<td class="self"></td>'; return; }
        const tr = tmap.get(f + '|' + t);
        table += tr ? '<td class="on"><span class="trg">' + esc(tr.trigger || 'no trigger named') + '</span></td>'
                    : '<td></td>';
      });
      table += '</tr>';
    });
    table += '</tbody></table></div>';

    const bound = p.members.filter(m => m.nodeId || m.ref);
    box.innerHTML =
      '<h3 class="pat__h">' + esc(p.name) + '</h3>' +
      '<p class="eyebrow"><span class="tag tag--kind">' + esc(p.kind) + '</span> · ' +
        p.members.length + ' members · ' + p.transitions.length + ' transitions' +
        (anchor ? ' · anchored at ' + nodeLink(anchor) : ' · not anchored') + '</p>' +
      '<div class="prose" style="margin-top:12px">' + md(p.description) + '</div>' +
      table +
      '<p class="refs" style="margin-top:12px">' +
        (bound.length
          ? bound.map(m => '<span>' + esc(m.name) + ' → ' +
              (m.nodeId && byId.get(m.nodeId) ? nodeLink(byId.get(m.nodeId)) : esc(m.ref)) + '</span>').join('')
          : 'No member binds to a node or a file — every one of these is a pure name.') +
      '</p>';
    wrap.appendChild(box);
  });
}
buildPats();

/* ── footer ───────────────────────────────────────────────────────────── */
document.getElementById('foot').innerHTML =
  '<b>Where the numbers come from.</b> ' + CONNS.length + ' connections split into ' + CELL.size +
  ' written between modules and ' + compEdges.length + ' written between components; of those, ' +
  crossEdges.length + ' cross a module boundary and are claimed by a module-level connection’s ' +
  '<code>realizedBy</code>, and ' + (compEdges.length - crossEdges.length) + ' stay inside one module. ' +
  extEdges.length + ' touch a Minecraft client. Degrees, shading, the module ordering and the ' +
  'dependency-direction check are computed in the page from the model file; nothing is hand-entered.' +
  '<br><b>Built from</b> <code>apps/server/hyphae.json</code>, schema version ' + M.schemaVersion +
  ', profile <code>' + esc(M.activeProfile) + '</code>, last written ' + esc(M.metadata.updatedAt.slice(0,10)) + '.';

/* ── expand / collapse, navigation, trail ─────────────────────────────── */
function setOpen(box, on){
  const body = box.querySelector(':scope > .mod__body, :scope > .ent__body');
  const btn  = box.querySelector(':scope > [data-toggle]');
  if (!body || !btn) return;
  body.hidden = !on;
  btn.setAttribute('aria-expanded', on ? 'true' : 'false');
  const caret = btn.querySelector('[data-caret]');
  if (caret) caret.textContent = on ? 'CLOSE' : 'OPEN';
}
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-toggle]');
  if (!t) return;
  const box = t.closest('[data-collapsible]');
  setOpen(box, box.querySelector(':scope > .mod__body, :scope > .ent__body').hidden);
});
document.getElementById('bulk').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  document.querySelectorAll('[data-collapsible]').forEach(x => setOpen(x, b.dataset.v === 'open'));
});

const trail = [];
const trailEl = document.getElementById('trail');
function renderTrail(){
  if (!trail.length) { trailEl.dataset.on = 'off'; trailEl.innerHTML = ''; return; }
  const last = trail[trail.length - 1];
  trailEl.dataset.on = 'on';
  trailEl.innerHTML = '<button class="trailbtn" id="backBtn">← back to ' + esc(last.label) + '</button>' +
    '<span class="hint">' + (trail.length > 1 ? trail.length + ' steps back available · ' : '') +
    'or press Escape</span>';
  document.getElementById('backBtn').onclick = goBack;
}
function labelFor(){
  const y = window.scrollY + 90;
  let best = 'the top';
  document.querySelectorAll('.sec').forEach(s => { if (s.offsetTop <= y) best = s.querySelector('.sec__t').textContent; });
  if (window.scrollY < 120) best = 'the top';
  return best;
}
function goBack(){
  const p = trail.pop(); if (!p) return;
  window.scrollTo({ top: p.y, behavior: 'auto' });
  renderTrail();
}
document.addEventListener('keydown', ev => {
  if (ev.key !== 'Escape' || !trail.length) return;
  if (ev.target && ev.target.tagName === 'INPUT') return;
  ev.preventDefault(); goBack();
});

function openAncestors(target){
  let p = target.closest('[data-collapsible]');
  while (p) { setOpen(p, true); p = p.parentElement ? p.parentElement.closest('[data-collapsible]') : null; }
}
function goTo(hash, push){
  const target = document.getElementById(hash);
  if (!target) return false;
  if (push) trail.push({ y: window.scrollY, label: labelFor() });
  openAncestors(target);
  const top = target.getBoundingClientRect().top + window.scrollY - 92;
  window.scrollTo({ top: Math.max(0, top), behavior: 'smooth' });
  document.querySelectorAll('.flash').forEach(e => e.classList.remove('flash'));
  target.classList.add('flash');
  setTimeout(() => target.classList.remove('flash'), 1500);
  renderTrail();
  // file:// forbids replaceState in some browsers; the page must not care.
  try { if (history.replaceState) history.replaceState(null, '', '#' + hash); } catch (e) { /* ignore */ }
  return true;
}
document.addEventListener('click', ev => {
  const a = ev.target.closest('a[href^="#"]');
  if (!a) return;
  const id = a.getAttribute('href').slice(1);
  if (!id) return;
  if (goTo(id, true)) ev.preventDefault();
});

/* ── peek card ────────────────────────────────────────────────────────── */
const peek = document.getElementById('peek');
let peekT = null;
function peekHTML(key){
  const kind = key.slice(0,1), id = key.slice(2);
  if (kind === 'n'){
    const n = byId.get(id); if (!n) return null;
    const par = parent(n);
    // a component's degree is its own edges; a module's is every edge crossing its boundary
    const u = uStat.get(n.id);
    const d = u ? { o:u.out, i:u.in } : degOf(n);
    const kids = NODES.filter(x => x.parentId === n.id).length;
    return '<div class="pk__n">' + esc(n.name) + '</div>' +
      '<div class="pk__m">' + esc(n.type === 'ExternalSystem' ? 'EXTERNAL SYSTEM' : n.type.toUpperCase()) +
      (par ? ' · in ' + esc(par.name) : '') + (kids ? ' · ' + kids + ' inside' : '') +
      ' · ' + d.o + ' out, ' + d.i + ' in' + (techOf(n) ? ' · ' + esc(techOf(n)) : '') + '</div>' +
      '<div class="pk__s">' + (sumOf(n) ? esc(sumOf(n)) : '<em>no summary written</em>') + '</div>';
  }
  const c = cById.get(id); if (!c) return null;
  const a = byId.get(c.from), b = byId.get(c.to);
  return '<div class="pk__n">' + esc(a.name) + ' → ' + esc(b.name) + '</div>' +
    '<div class="pk__m">CONNECTION · ' + esc(c.direction) +
    (c.realizedBy.length ? ' · ' + c.realizedBy.length + ' edges beneath' : '') + '</div>' +
    '<div class="pk__s">' + md(c.label) + '</div>';
}
function showPeek(anchorEl, key){
  const h = peekHTML(key); if (!h) return;
  peek.innerHTML = h; peek.hidden = false;
  const r = anchorEl.getBoundingClientRect();
  const w = peek.offsetWidth, hh = peek.offsetHeight;
  let x = r.left + window.scrollX;
  x = Math.min(x, window.scrollX + document.documentElement.clientWidth - w - 12);
  x = Math.max(window.scrollX + 8, x);
  let y = r.bottom + window.scrollY + 8;
  if (r.bottom + hh + 20 > window.innerHeight) y = r.top + window.scrollY - hh - 8;
  peek.style.left = x + 'px'; peek.style.top = Math.max(window.scrollY + 4, y) + 'px';
}
function hidePeek(){ peek.hidden = true; }
document.addEventListener('mouseover', ev => {
  const a = ev.target.closest('[data-peek]');
  clearTimeout(peekT);
  if (!a) { peekT = setTimeout(hidePeek, 120); return; }
  peekT = setTimeout(() => showPeek(a, a.dataset.peek), 190);
});
document.addEventListener('focusin', ev => {
  const a = ev.target.closest('[data-peek]');
  if (a) showPeek(a, a.dataset.peek); else hidePeek();
});
window.addEventListener('scroll', hidePeek, { passive:true });

/* ── scope filter ─────────────────────────────────────────────────────── */
const scopeEl = document.getElementById('scope');
scopeEl.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  scope = b.dataset.v;
  scopeEl.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  applyScope();
});
function applyScope(){
  document.querySelectorAll('.deps li[data-conn]').forEach(li => {
    const c = cById.get(li.dataset.conn);
    li.style.display = inScope(c) ? '' : 'none';
  });
  document.querySelectorAll('#mx td.cell[data-c]').forEach(td => {
    const [f,t] = td.dataset.c.split('|');
    const ok = scope === 'all' ? true
      : scope === 'ext' ? (isExt(byId.get(f)) || isExt(byId.get(t)))
      : true;   // every cell in the grid is already a cross-module dependency
    td.classList.toggle('dim', !ok);
  });
  const n = CONNS.filter(inScope).length;
  document.getElementById('counts').textContent =
    NODES.length + ' nodes · ' + (scope === 'all' ? CONNS.length + ' connections'
      : n + ' of ' + CONNS.length + ' connections shown') +
    ' · ' + FLOWS.length + ' flows · ' + PATS.length + ' patterns';
}

/* ── find ─────────────────────────────────────────────────────────────── */
const qEl = document.getElementById('q'), qn = document.getElementById('qn');
function textOf(n){
  return [n.name, sumOf(n), n.description, techOf(n), n.type, n.role || '',
          listOf(n,'responsibilities').join(' '), listOf(n,'rules').join(' '),
          n.codeRefs.join(' ')].join(' ').toLowerCase();
}
function edgeTextOf(n){
  return CONNS.filter(c => c.from === n.id || c.to === n.id).map(c => c.label).join(' ').toLowerCase();
}
const HAY = new Map(NODES.map(n => [n.id, textOf(n) + ' ' + edgeTextOf(n)]));
qEl.addEventListener('input', () => {
  const q = qEl.value.trim().toLowerCase();
  const hit = new Set();
  if (q) NODES.forEach(n => { if (HAY.get(n.id).indexOf(q) !== -1) hit.add(n.id); });
  document.querySelectorAll('[data-node]').forEach(e => {
    e.classList.toggle('dimmed', !!q && !hit.has(e.dataset.node));
  });
  document.querySelectorAll('.mapbox').forEach(b => {
    const any = !q || hit.has(b.dataset.unit) ||
      NODES.some(n => n.parentId === b.dataset.unit && hit.has(n.id));
    b.classList.toggle('dimmed', !any);
  });
  document.querySelectorAll('#mx tbody tr').forEach((tr,i) => {
    tr.style.opacity = (!q || hit.has(ORDER[i].id)) ? '' : '.3';
  });
  qn.textContent = q ? hit.size + ' of ' + NODES.length : '';
});
qEl.addEventListener('keydown', ev => { if (ev.key === 'Escape') { qEl.value = ''; qEl.dispatchEvent(new Event('input')); } });

applyScope();
/* deep link on load */
if (location.hash) setTimeout(() => goTo(location.hash.slice(1), false), 60);
})();
</script>
</body>
</html>
