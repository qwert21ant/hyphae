<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatcher floor</title>
<style>
:root{
  --floor:#E4E8EA; --zone:#EDF0F2; --zone-line:#9CA8B0; --zone-ink:#5A6873;
  --ink:#14212B; --ink-2:#44525D; --ink-3:#7A868F; --paper:#FFFFFF; --panel:#F8F9F9; --line:#CDD4D8;
  --job:#1560A8; --talk:#8B2A78; --access:#55636E; --tick:#7A858D; --ops:#8A640F;
  --ok:#1E8E5A; --gap:#C97A00; --plan:#6B7B8A;
  --mark:#FFD21F; --mark-soft:#FFF4BF;
  --sign:Bahnschrift,"DIN Alternate","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --text:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --code:Consolas,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--floor);color:var(--ink);font:13px/1.4 var(--text);overflow:hidden;
  display:grid;grid-template-columns:284px minmax(0,1fr);grid-template-rows:44px minmax(0,1fr) 40px;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* ---------- top bar */
#bar{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 14px;background:var(--ink);color:#fff}
#bar .mark{font:600 19px/1 var(--sign);letter-spacing:.02em}
#bar .tag{color:#B9C4CC;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.seg{display:flex;border:1px solid #5A6873;border-radius:5px;overflow:hidden}
.seg button{padding:5px 12px;font:500 13px/1 var(--sign);letter-spacing:.02em;color:#C9D2D8}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.zoom{display:flex;align-items:center;gap:2px}
.zoom button{width:26px;height:26px;border-radius:4px;text-align:center;font:500 16px/1 var(--sign);color:#fff}
.zoom button:hover{background:#2A3945}
.zoom .lvl{min-width:86px;text-align:center;font:12px/1 var(--sign);color:#B9C4CC}
.zoom .fit{width:auto;padding:0 8px;font-size:12.5px}

/* ---------- left panel */
#panel{grid-row:2/3;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:10px 0 16px}
#panel h2{font:600 17px/1.15 var(--sign);margin:0}
.p-head{display:flex;align-items:baseline;gap:8px;padding:2px 14px 6px}
.p-head .n{color:var(--ink-3);font:13px var(--sign)}
.keyline{display:flex;gap:10px;padding:0 14px 6px;color:var(--ink-2);font-size:11.5px}
.keyline span{display:inline-flex;align-items:center;gap:4px}
.grp{margin:8px 0 0}
.grp h3{font:600 11.5px/1 var(--sign);letter-spacing:.05em;color:var(--ink-3);margin:0;padding:5px 14px 4px}
.uc{display:block}
.uc>button{display:flex;align-items:center;gap:8px;width:100%;padding:3.5px 14px;font:500 13.5px/1.25 var(--sign);border-left:4px solid transparent}
.uc>button:hover{background:#ECEFF0}
.uc.on>button{background:var(--mark-soft);border-left-color:var(--mark);font-weight:600}
.uc.touch>button{border-left-color:var(--ink)}
.uc.fade>button{opacity:.38}
.st{flex:none;width:11px;height:11px}
.uc .body{padding:4px 14px 8px 18px;background:#FFFBE3;border-left:4px solid var(--mark)}
.uc .sum{margin:2px 0 6px;color:var(--ink-2);font-size:12px;line-height:1.35}
.steps{list-style:none;margin:0;padding:0}
.steps li button{display:grid;grid-template-columns:20px 1fr;column-gap:7px;width:100%;padding:2.5px 0;border-radius:3px}
.steps li button:hover{background:#FFF0A6}
.num{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:var(--mark);color:var(--ink);
  font:700 11px/18px var(--sign);text-align:center;grid-row:1/3;align-self:start}
.steps .what{font:500 12.5px/1.25 var(--sign)}
.steps .where{font-size:11px;color:var(--ink-3);line-height:1.25}
.steps li.cur .what{text-decoration:underline}

.det{padding:0 14px}
.back{display:inline-block;margin:0 0 8px;padding:3px 8px 3px 6px;border:1px solid var(--line);border-radius:4px;font:500 12px/1.2 var(--sign);background:#fff}
.back:hover{background:#ECEFF0}
.crumb{margin:0 -14px 10px;padding:6px 14px 7px;background:var(--mark-soft);border-left:4px solid var(--mark)}
.crumb .rn{font:600 13px/1.2 var(--sign);display:flex;gap:6px;align-items:center}
.crumb .nums{display:flex;flex-wrap:wrap;gap:3px;margin-top:5px}
.crumb .nums button{min-width:18px;height:18px;border-radius:9px;background:#fff;border:1px solid #D9B400;font:700 11px/16px var(--sign);text-align:center}
.crumb .nums button.cur{background:var(--mark)}
.kind{font:500 11.5px/1.2 var(--sign);color:var(--ink-3);letter-spacing:.03em}
.kind button{text-decoration:underline;color:inherit;font:inherit}
.det h2{margin:2px 0 4px;font-size:19px}
.status{display:inline-flex;align-items:center;gap:5px;font:500 12px/1 var(--sign);color:var(--ink-2);margin-bottom:6px}
.status .app{margin-left:8px;padding-left:8px;border-left:1px solid var(--line);color:var(--ink-3)}
.det p.sum{margin:0 0 10px;font-size:13px;line-height:1.42}
.sec{margin:0 0 10px}
.sec h4{margin:0 0 3px;font:600 11.5px/1.2 var(--sign);letter-spacing:.05em;color:var(--ink-3)}
.sec ul{margin:0;padding:0;list-style:none}
.sec li{font-size:12.5px;line-height:1.38;padding:1.5px 0 1.5px 11px;position:relative}
.sec li::before{content:"";position:absolute;left:1px;top:8px;width:4px;height:4px;background:var(--ink-3);border-radius:50%}
.sec.gaps li::before{background:var(--gap)}
.sec.unv li::before{background:none;border:1px solid var(--ink-2);width:5px;height:5px;top:7px;left:0}
.sec.flow li{padding-left:0}
.sec.flow li::before{display:none}
.sec.flow button,.sec.inside button,.sec.used button{display:flex;gap:6px;align-items:baseline;width:100%;padding:1px 0;font-size:12.5px;line-height:1.3;border-radius:3px}
.sec.flow button:hover,.sec.inside button:hover,.sec.used button:hover{background:#ECEFF0}
.sec.inside li,.sec.used li{padding-left:0}
.sec.inside li::before,.sec.used li::before{display:none}
.sec.inside button,.sec.used button{align-items:center}
.dot{flex:none;width:8px;height:8px;border-radius:2px;display:inline-block;position:relative;top:0}
.muted{color:var(--ink-3)}
.code li{padding:2px 0;font:11.5px/1.35 var(--code);overflow-wrap:anywhere}
.code li b{font-weight:600}
.code li::before{display:none}
.code .dir{color:var(--ink-3)}
.pills{display:flex;flex-wrap:wrap;gap:3px;align-items:center;font:500 11.5px/1 var(--sign)}
.pills span.pill{border:1px solid var(--ink-2);border-radius:9px;padding:3px 7px;background:#fff}
.pills span.ar{color:var(--ink-3)}

/* ---------- stage */
#stage{position:relative;overflow:hidden;background:var(--floor)}
#stage svg{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none}
#floor{cursor:grab}
#floor.drag{cursor:grabbing}
body[data-view="floor"] #things{display:none}
body[data-view="things"] #floor{display:none}
body[data-view="things"] .zoom{visibility:hidden}

svg text{font-family:var(--sign)}
.district rect{fill:var(--zone);stroke:var(--zone-line);stroke-width:1.2}
.district text{fill:var(--zone-ink);font-weight:600;font-size:12px;letter-spacing:.05em}
.district .big{display:none;font-size:27px;letter-spacing:.03em;fill:var(--ink)}
.district:hover rect{stroke:var(--ink-2)}
.district{cursor:pointer}
.district.sel rect{stroke:#B89500;stroke-width:3}

.node{cursor:pointer}
.node .box{fill:var(--paper);stroke:var(--ink);stroke-width:1.3}
.node .bar{fill:var(--ink)}
.node .lid{fill:none;stroke:var(--ink);stroke-width:1.1}
.node .name{font-size:13.5px;font-weight:600;fill:var(--ink)}
.node .tag{font-size:10.5px;fill:var(--ink-3);letter-spacing:.01em}
.node .name-s{display:none;font-size:5.6px;font-weight:600;fill:var(--ink)}
.node:hover .box{stroke-width:2.1}
.node .ring{fill:none;stroke:none}
.node.sel .ring{stroke:var(--mark);stroke-width:5}
.node.sel .box{stroke-width:2.1}
.node.planned .box{stroke-dasharray:4 3}
.terminal.person .box{fill:var(--ink);stroke:var(--ink)}
.terminal.person .name{fill:#fff}
.terminal.person .glyph{stroke:#fff;fill:none;stroke-width:1.4}
.terminal.system .box{stroke-width:2}
.terminal.clock .box{stroke-width:1.6;stroke-dasharray:1.5 3;stroke-linecap:round}
.terminal .glyph{stroke:var(--ink);fill:none;stroke-width:1.4}
.terminal .name{font-size:11.5px;font-weight:600}
.part{display:none;cursor:pointer}
.part rect{fill:#EFF2F3;stroke:var(--ink);stroke-width:.45}
.part text{fill:var(--ink);font-weight:500}
.part:hover rect{fill:#fff;stroke-width:.8}
.part.sel rect{fill:var(--mark-soft);stroke:var(--ink);stroke-width:1}
.part.planned rect{stroke-dasharray:1.6 1.2}
.gapn{font-size:9.5px;font-weight:600;fill:#9A5D00}
.sg-ok{fill:var(--ok)}
.sg-gap{fill:var(--gap)}
.sg-ring{fill:#fff;stroke:var(--gap);stroke-width:1.3}
.sg-plan{fill:#fff;stroke:var(--plan);stroke-width:1.3;stroke-dasharray:2 1.4}
.sg-unk{fill:#fff;stroke:var(--ink-3);stroke-width:1.2}

.belt .case{fill:none;stroke:#E8EBED;stroke-width:6.5;stroke-linejoin:round}
.belt .line{fill:none;stroke-width:2.3;stroke-linejoin:round}
.belt .hit{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.belt.job .line{stroke:var(--job)} .belt.job .head{fill:var(--job)}
.belt.talk .line{stroke:var(--talk)} .belt.talk .head{fill:var(--talk)}
.belt.access .line{stroke:var(--access);stroke-width:1.7;stroke-dasharray:5 3} .belt.access .head{fill:var(--access)}
.belt.tick .line{stroke:var(--tick);stroke-width:2;stroke-dasharray:.1 4.2;stroke-linecap:round} .belt.tick .head{fill:var(--tick)}
.belt.ops .line{stroke:var(--ops)} .belt.ops .head{fill:var(--ops)}
.belt:hover .line{stroke-width:3.4}
.blabel{font-size:10.5px;font-weight:500;paint-order:stroke;stroke:#E8EBED;stroke-width:3.6px;stroke-linejoin:round;pointer-events:none;font-stretch:92%}
.blabel.job{fill:#0E4A85} .blabel.talk{fill:#74205F} .blabel.access{fill:#3F4C56} .blabel.tick{fill:#56626B} .blabel.ops{fill:#6B4C06}
.belt.sel .line{stroke-width:3.6}

@keyframes flow{to{stroke-dashoffset:-13}}
.focus .belt.lit .line{stroke-width:3.4;stroke-dasharray:8 5;animation:flow .8s linear infinite}
.focus .belt.lit.tick .line,.focus .belt.lit.access .line{stroke-width:2.6}
.focus .belt:not(.lit){opacity:.13}
.focus .blabel:not(.lit){opacity:.16}
.focus .node:not(.lit){opacity:.2}
.focus .district:not(.lit){opacity:.5}
.focus .part:not(.lit){opacity:.22}
.focus .key{opacity:.25}
@media (prefers-reduced-motion:reduce){.focus .belt.lit .line{animation:none}}

.badge rect{fill:var(--mark);stroke:var(--ink);stroke-width:1}
.badge text{font-size:10.5px;font-weight:700;fill:var(--ink)}
.badge.small{display:none}
.badge.small rect{stroke-width:.4}
.badge.small text{font-size:3.6px}

.key text{font-size:10.5px;fill:var(--ink-2)}
.key .kt{font-weight:600;font-size:12px;fill:var(--zone-ink);letter-spacing:.05em}
.key .frame{fill:none;stroke:var(--zone-line);stroke-width:1;stroke-dasharray:2 3}

/* levels of detail */
.lod0 .node.inner,.lod0 .belt.inner,.lod0 .blabel.inner,.lod0 .key,.lod0 .badge.onnode{display:none}
.lod0 .district .small{display:none}
.lod0 .district .big{display:block}
.lod0 .district rect{stroke-width:2}
.lod0 .blabel{font-size:14px;stroke-width:4.5px}
.lod0 .belt .line{stroke-width:3}
.lod0 .terminal .name{font-size:12.5px}
.lod2 .part{display:block}
.lod2 .node.has-parts .name,.lod2 .node.has-parts .tag,.lod2 .node.has-parts .sg{display:none}
.lod2 .node.has-parts .name-s{display:block}
.lod2 .blabel{font-size:6px;stroke-width:2px}
.lod2 .belt .line{stroke-width:1.3}
.lod2 .belt .case{stroke-width:3.4}
.lod2.focus .belt.lit .line{stroke-width:1.9;stroke-dasharray:5 3}
.lod2 .badge.small{display:block}
.lod2 .badge.onnode{transform-box:fill-box;transform-origin:0 0;transform:scale(.5)}
.lod2 .district text.small{font-size:7px}

/* ---------- things map */
#things .card{cursor:pointer}
#things .card .box{fill:var(--paper);stroke:var(--ink);stroke-width:1.2}
#things .card:hover .box{stroke-width:2.1}
#things .card .ring{fill:none}
#things .card.sel .ring{stroke:var(--mark);stroke-width:5}
#things .card .name{font-size:15px;font-weight:600;fill:var(--ink)}
#things .card .field{font-size:11px;fill:var(--ink-2)}
#things .card .rule{stroke:var(--line);stroke-width:1}
#things .card .pill rect{fill:#fff;stroke:var(--ink-2);stroke-width:.9}
#things .card .pill text{font-size:10px;font-weight:500;fill:var(--ink)}
#things .card .ar{fill:none;stroke:var(--ink-3);stroke-width:1.1}
#things .rel .line{fill:none;stroke:var(--ink-2);stroke-width:1.5}
#things .rel .head{fill:var(--ink-2)}
#things .rel text{font-size:11px;font-weight:500;fill:var(--ink-2);paint-order:stroke;stroke:var(--floor);stroke-width:4px;stroke-linejoin:round}
#things .band{font-size:12px;font-weight:600;letter-spacing:.05em;fill:var(--zone-ink)}
#things.focus .card:not(.lit){opacity:.22}
#things.focus .rel:not(.lit){opacity:.15}

/* ---------- bottom strip */
#strip{grid-column:1/3;display:flex;align-items:center;gap:6px;padding:0 12px;background:#DCE1E4;border-top:1px solid var(--line);overflow:hidden;white-space:nowrap}
#strip .lead{font:600 11.5px/1 var(--sign);letter-spacing:.05em;color:var(--zone-ink);margin-right:6px}
.chip{display:inline-flex;align-items:center;padding:4px 7px 4px 6px;border-radius:3px;background:#fff;border:1px solid #B9C2C8;border-left-width:4px;font:500 12px/1 var(--sign)}
.chip:hover{background:#F1F3F4}
.chip.lit{box-shadow:0 0 0 2px var(--mark)}
#strip.focus .chip:not(.lit){opacity:.4}
.chip.sel{background:var(--mark-soft)}
#bar .src{color:#8FA0AB;font:12px/1 var(--sign);white-space:nowrap}

/* ---------- tooltip */
#tip{position:absolute;z-index:5;max-width:280px;padding:7px 9px 8px;background:var(--ink);color:#fff;border-radius:5px;font-size:12px;line-height:1.36;pointer-events:none;display:none}
#tip b{display:block;font:600 13px/1.2 var(--sign);margin-bottom:2px}
#tip .s{color:#FFD21F;font:500 11px/1.2 var(--sign);display:block;margin-top:3px}
#err{position:fixed;left:300px;top:50px;z-index:9;background:#B00020;color:#fff;padding:8px 10px;font:12px var(--code);max-width:700px;display:none;white-space:pre-wrap}
</style>
</head>

</header>
<aside id="panel" aria-label="Use cases and details"></aside>

</main>
<footer id="strip"></footer>

function focus(){
  var lit = {}, nums = {}, things = {}, active = false;
  function addEl(id){ lit[id] = 1; var e = E[id]; if (e && e.parent) lit[e.parent] = 1; }
  function addLink(id){ var l = L[id]; lit[id] = 1; addEl(l.from); addEl(l.to); (l.carries || []).forEach(function(c){ things[c] = 1; }); }

    R[S.r].steps.forEach(function(id){
      if (L[id]) addLink(id);
      else { addEl(id); n++; num(id, n); var e = E[id]; if (e.parent) num(e.parent, n); (e.holds || []).forEach(function(c){ things[c] = 1; }); }
    });
  } else if (S.e){

    else {
      var e = E[id];

        FLOOR_LINKS.forEach(function(l){ if ((l.carries || []).indexOf(id) >= 0){ lit[l.id] = 1; addEl(l.from); addEl(l.to); } });
        D.elements.forEach(function(x){ if ((x.holds || []).indexOf(id) >= 0) addEl(x.id); });
        THING_LINKS.forEach(function(l){ if (l.from === id || l.to === id){ lit[l.id] = 1; things[l.from] = 1; things[l.to] = 1; } });
      } else if (e.kind === 'district'){

        D.elements.forEach(function(x){ if (x.district === id && x.kind !== 'part') addEl(x.id); });
        FLOOR_LINKS.forEach(function(l){ if (districtOf(l.from) === id || districtOf(l.to) === id) addLink(l.id); });
      } else {
        addEl(id); var key = e.kind === 'part' ? e.parent : id;
        FLOOR_LINKS.forEach(function(l){ if (l.from === key || l.to === key) addLink(l.id); });
        (E[key].holds || []).forEach(function(c){ things[c] = 1; });
      }

}

  D.elements.forEach(function(e){ if (F.lit[e.id] && e.district) memberLit[e.district] = 1; });
  // parts: lit when named, or when the parent is lit and no sibling was named
  var named = {};
  D.elements.forEach(function(e){ if (e.kind === 'part' && F.lit[e.id]) named[e.parent] = 1; });
  D.elements.forEach(function(e){
    var el = DOM[e.id]; if (!el) return;
    var on = !!F.lit[e.id];
    if (e.kind === 'district') on = on || !!memberLit[e.id];
    if (e.kind === 'part') on = on || (!!F.lit[e.parent] && !named[e.parent]);
    el.classList.toggle('lit', on);
    el.classList.toggle('sel', S.e === e.id || (!!S.e && E[S.e] && E[S.e].parent === e.id));
  });
  FLOOR_LINKS.forEach(function(l){
    var on = !!F.lit[l.id];
    DOM[l.id].classList.toggle('lit', on); DOM[l.id].classList.toggle('sel', S.e === l.id);
    if (LABEL[l.id]) LABEL[l.id].classList.toggle('lit', on);
  });
  while (gBadges.firstChild) gBadges.removeChild(gBadges.firstChild);
  Object.keys(F.nums).forEach(function(id){
    var e = E[id], p = e.pos, txt = F.nums[id].filter(function(v, i, a){ return a.indexOf(v) === i; }).join(' ');
    if (e.kind === 'part'){
      var w2 = 4.6 + (txt.length-1)*2;
      gBadges.appendChild(s('g', {'class':'badge small'}, s('rect', {x:p.x-1.6, y:p.y-2.2, width:w2, height:4.6, rx:2.3}),
        s('text', {x:p.x-1.6+w2/2, y:p.y+1.4, 'text-anchor':'middle'}, txt)));
    } else {
      var w1 = 17 + (txt.length-1)*6.2, bx = p.x - 7, by = p.y - 8;
      if (e.kind === 'terminal'){ bx = p.x + p.w/2 - w1/2; by = p.y - 10; }
      gBadges.appendChild(s('g', {'class':'badge onnode'}, s('rect', {x:bx, y:by, width:w1, height:16, rx:8}),
        s('text', {x:bx + w1/2, y:by + 11.8, 'text-anchor':'middle'}, txt)));
    }
  });
}
function paintThings(F){
  var any = F.active && Object.keys(F.things).length > 0;
  thingsSvg.classList.toggle('focus', any);
  THINGS.forEach(function(t){ TDOM[t.id].classList.toggle('lit', !!F.things[t.id]); TDOM[t.id].classList.toggle('sel', S.e === t.id); });
  THING_LINKS.forEach(function(l){ TDOM[l.id].classList.toggle('lit', !!F.things[l.from] && !!F.things[l.to]); });
  strip.classList.toggle('focus', any);
  Array.prototype.forEach.call(strip.querySelectorAll('.chip'), function(c){
    c.classList.toggle('lit', !!F.things[c.dataset.e]); c.classList.toggle('sel', S.e === c.dataset.e);
  });
}

/* ================= left panel ================= */
var panel = document.getElementById('panel');
function elName(id){ return E[id] ? E[id].name : (L[id] ? L[id].label : id); }
function codeItems(paths){
  return paths.map(function(p){
    var i = p.replace(/\/$/, '').lastIndexOf('/');
    return '<li><span class="dir">' + esc(p.slice(0, i+1)).replace(/\//g, '/<wbr>') + '</span><b>' + esc(p.slice(i+1)) + '</b></li>'; }).join('');
}
function codeList(paths){ return '<div class="sec"><h4>Change it here</h4><ul class="code">' + codeItems(paths) + '</ul></div>'; }
function bullets(cls, title, items){
  if (!items || !items.length) return '';
  return '<div class="sec ' + cls + '"><h4>' + title + '</h4><ul>' + items.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ul></div>';
}
function board(){
  var html = '<div class="p-head"><h2>Use cases</h2><span class="n">' + D.routes.length + '</span></div>' +
    '<div class="keyline"><span>' + statusHtml('works') + 'works</span><span>' + statusHtml('partial') + 'has a gap</span><span>' + statusHtml('planned') + 'planned</span></div>';
  var sel = !S.r && S.e ? S.e : null;
  D.groups.forEach(function(gr){
    html += '<div class="grp"><h3>' + esc(gr.name) + '</h3>';
    D.routes.forEach(function(r){
      if (r.group !== gr.id) return;
      var on = S.r === r.id, cls = 'uc' + (on ? ' on' : '');
      if (sel) cls += ROUTE_TOUCH[r.id][sel] ? ' touch' : ' fade';
      html += '<div class="' + cls + '"><button data-r="' + r.id + '" aria-expanded="' + on + '" title="' + esc(r.summary) + '">' + statusHtml(r.status) + '<span>' + esc(r.name) + '</span></button>';
      if (on) html += '<div class="body"><p class="sum">' + esc(r.summary) + '</p>' + stepList(r) + '</div>';
      html += '</div>';
    });
    html += '</div>';
  });
  return html;
}
function stepList(r){
  var n = 0, html = '<ol class="steps">';
  r.steps.forEach(function(id){
    if (L[id]) return;
    var e = E[id], where = e.kind === 'part' ? E[e.parent].name + ', ' + e.name : e.name;
    html += '<li' + (S.e === id ? ' class="cur"' : '') + '><button data-e="' + id + '"><span class="num">' + (n+1) + '</span><span class="what">' + esc(r.stepNotes[n]) + '</span><span class="where">' + esc(where) + '</span></button></li>';
    n++;
  });
  return html + '</ol>';
}
function detail(id){
  var html = '<div class="det">';
  if (S.r){
    var r = R[S.r], n = 0;
    html += '<div class="crumb"><div class="rn">' + statusHtml(r.status) + esc(r.name) + '</div><div class="nums">';
    r.steps.forEach(function(sid){ if (L[sid]) return; n++; html += '<button data-e="' + sid + '" class="' + (sid === id ? 'cur' : '') + '" title="' + esc(r.stepNotes[n-1]) + '">' + n + '</button>'; });
    html += '</div></div>';
  }
  html += '<button class="back" data-clear="e">Back to the use cases</button>';
  if (L[id]) return html + linkDetail(L[id]) + '</div>';
  var e = E[id], kind = KIND_WORD[e.kind];
  if (e.kind === 'part') kind = 'Inside <button data-e="' + e.parent + '">' + esc(E[e.parent].name) + '</button>';
  else if (e.district) kind += ' in <button data-e="' + e.district + '">' + esc(E[e.district].name) + '</button>';
  else if (e.kind === 'thing') kind = 'Thing, ' + esc(FAM[e.family].name.toLowerCase());
  html += '<div class="kind">' + kind + '</div><h2>' + esc(e.name) + '</h2>';
  if (e.kind !== 'thing') html += '<div class="status">' + statusHtml(e.status) + STATUS_WORD[e.status] + (e.app || (e.parent && E[e.parent].app) ? '<span class="app">' + esc(APP_WORD[e.app || E[e.parent].app]) + '</span>' : '') + '</div>';
  html += '<p class="sum">' + esc(e.summary) + '</p>';
  if (e.kind === 'part' && cam.z < 2) html += '<div class="sec"><button class="back" data-zoomto="' + e.parent + '">Zoom in to see it</button></div>';
  if (e.kind === 'thing'){
    if (e.fields) html += '<div class="sec"><h4>What it holds</h4><ul>' + e.fields.map(function(f){ return '<li>' + esc(f) + '</li>'; }).join('') + '</ul></div>';
    if (e.states && e.states.length){
      var sep = e.loop ? '⇄' : '→';
      html += '<div class="sec"><h4>States it goes through</h4><div class="pills">' + e.states.map(function(x){ return '<span class="pill">' + esc(x) + '</span>'; }).join('<span class="ar">' + sep + '</span>') + '</div>';
      if (e.altStates) html += '<div class="pills" style="margin-top:4px">' + e.altStates.map(function(x){ return '<span class="pill">' + esc(x) + '</span>'; }).join('<span class="ar">' + sep + '</span>') + '</div>';
      html += '</div>';
    }
    var rel = THING_LINKS.filter(function(l){ return l.from === id || l.to === id; });
    if (rel.length) html += '<div class="sec flow"><h4>How it relates</h4><ul>' + rel.map(function(l){
      var other = l.from === id ? l.to : l.from;
      return '<li><button data-e="' + other + '">' + (l.from === id ? '<span class="muted">' + esc(l.label) + '</span><b>' + esc(E[other].name) + '</b>' : '<b>' + esc(E[other].name) + '</b><span class="muted">' + esc(l.label) + ' it</span>') + '</button></li>'; }).join('') + '</ul></div>';
    var on = FLOOR_LINKS.filter(function(l){ return (l.carries || []).indexOf(id) >= 0; });
    if (on.length) html += '<div class="sec flow"><h4>Travels on</h4><ul>' + on.map(function(l){
      return '<li><button data-e="' + l.id + '"><i class="dot" style="background:' + FAM[l.kind].color + '"></i><span>' + esc(E[l.from].name) + ' <span class="muted">to</span> ' + esc(E[l.to].name) + '</span></button></li>'; }).join('') + '</ul></div>';
  } else {
    var key = e.kind === 'part' ? null : id, isD = e.kind === 'district', ins = [], outs = [];
    function mine(end){ return end === key || (isD && districtOf(end) === key); }
    if (key) FLOOR_LINKS.forEach(function(l){
      var a = mine(l.from), b = mine(l.to);
      if (a === b) return;
      if (b || l.both) ins.push(l);
      if (a || l.both) outs.push(l);
    });
    function flow(title, list, word){
      if (!list.length) return '';
      return '<div class="sec flow"><h4>' + title + '</h4><ul>' + list.map(function(l){
        var o = mine(l.from) ? E[l.to] : E[l.from];
        return '<li><button data-e="' + l.id + '"><i class="dot" style="background:' + FAM[l.kind].color + '"></i><span><b>' + esc(l.label || 'non-compliant orders') + '</b> <span class="muted">' + word + ' ' + esc(o.name) + '</span></span></button></li>'; }).join('') + '</ul></div>';
    }
    html += flow('Takes in', ins, 'from') + flow('Gives out', outs, 'to');
    html += bullets('', 'Always true', e.rules) + bullets('gaps', 'Gaps', e.caveats) + bullets('unv', 'Not verified', e.unverified);
    if (e.parts && e.parts.length) html += '<div class="sec inside"><h4>Inside</h4><ul>' + e.parts.map(function(pid){
      return '<li><button data-e="' + pid + '" title="' + esc(E[pid].summary) + '">' + statusHtml(E[pid].status) + '<span>' + esc(E[pid].name) + '</span></button></li>'; }).join('') + '</ul></div>';
    if (e.kind === 'district'){
      var mem = D.elements.filter(function(x){ return x.district === id && x.kind !== 'part'; });
      html += '<div class="sec inside"><h4>Machines and stores</h4><ul>' + mem.map(function(x){
        return '<li><button data-e="' + x.id + '">' + statusHtml(x.status) + '<span>' + esc(x.name) + '</span></button></li>'; }).join('') + '</ul></div>';
    }
  }
  if (e.kind === 'thing') html += bullets('', 'Always true', e.rules);
  if (e.code && e.code.length) html += codeList(e.code);
  var used = D.routes.filter(function(r){ return ROUTE_TOUCH[r.id][id]; });
  if (used.length) html += '<div class="sec used"><h4>Use cases that pass here</h4><ul>' + used.map(function(r){
    return '<li><button data-r="' + r.id + '" data-keep="1">' + statusHtml(r.status) + '<span>' + esc(r.name) + '</span></button></li>'; }).join('') + '</ul></div>';
  return html + '</div>';
}
function linkDetail(l){
  var html = '<div class="kind">' + (l.view === 'floor' ? 'Belt, ' + esc(FAM[l.kind].name.toLowerCase()) : 'Relation') + '</div><h2>' + esc(l.label || 'non-compliant orders') + '</h2>';
  html += '<div class="sec flow"><ul><li><button data-e="' + l.from + '"><span class="muted">from</span><b>' + esc(E[l.from].name) + '</b></button></li><li><button data-e="' + l.to + '"><span class="muted">' + (l.both ? 'and back, to' : 'to') + '</span><b>' + esc(E[l.to].name) + '</b></button></li></ul></div>';
  if (l.summary) html += '<p class="sum">' + esc(l.summary) + '</p>';
  if (l.carries && l.carries.length) html += '<div class="sec flow"><h4>Carries</h4><ul>' + l.carries.map(function(c){
    return '<li><button data-e="' + c + '"><i class="dot" style="background:' + FAM[E[c].family].color + '"></i><b>' + esc(E[c].name) + '</b></button></li>'; }).join('') + '</ul></div>';
  var code = (E[l.from].code || []).slice(0, 2).concat((E[l.to].code || []).slice(0, 2));
  if (l.view === 'floor') html += '<div class="sec"><h4>Change it at either end</h4><ul class="code">' + codeItems(code.filter(function(v, i, a){ return a.indexOf(v) === i; })) + '</ul></div>';
  var used = D.routes.filter(function(r){ return r.steps.indexOf(l.id) >= 0; });
  if (used.length) html += '<div class="sec used"><h4>Use cases that pass here</h4><ul>' + used.map(function(r){
    return '<li><button data-r="' + r.id + '" data-keep="1">' + statusHtml(r.status) + '<span>' + esc(r.name) + '</span></button></li>'; }).join('') + '</ul></div>';
  return html;
}
function renderPanel(){
  var top = panel.scrollTop, was = panel.dataset.mode, mode = S.e ? 'detail:' + S.e : 'board';
  panel.innerHTML = S.e ? detail(S.e) : board();
  panel.dataset.mode = mode;
  panel.scrollTop = (was === mode) ? top : 0;
}

/* ================= apply ================= */
function apply(){
  document.body.dataset.view = S.view;
  Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function(b){ b.setAttribute('aria-pressed', String(b.dataset.view === S.view)); });
  setCam(S.v || HOME);
  var F = focus();
  paintFloor(F); paintThings(F); renderPanel();
  if (S.tip) tipFor(S.tip); else hideTip();
}

/* ================= interaction ================= */
panel.addEventListener('click', function(ev){
  var b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.r){ if (b.dataset.keep) go({r:b.dataset.r, e:null}); else go({r: S.r === b.dataset.r ? null : b.dataset.r, e:null}); }
  else if (b.dataset.e) pick(b.dataset.e);
  else if (b.dataset.clear) go({e:null});
  else if (b.dataset.zoomto) zoomTo(b.dataset.zoomto, S.e);
});
function pick(id){
  var e = E[id];
  if (e && e.kind === 'thing' && S.view === 'floor'){ go({e:id}); return; }
  if (e && e.kind !== 'thing' && S.view === 'things'){ go({view:'floor', e:id}); return; }
  if (L[id] && L[id].view === 'floor' && S.view === 'things'){ go({view:'floor', e:id}); return; }
  go({e:id});
}
function zoomTo(id, keepSel){
  var p = E[id].pos, z = clamp(Math.min(W/(p.w*2.4), H/(p.h*2.6)), 2.2, 5);
  go({v:{z:z, cx:p.x + p.w/2, cy:p.y + p.h/2}, e: keepSel || id});
}
strip.addEventListener('click', function(ev){ var b = ev.target.closest('.chip'); if (b) go({e: S.e === b.dataset.e ? null : b.dataset.e}); });
document.getElementById('bar').addEventListener('click', function(ev){
  var b = ev.target.closest('button'); if (!b) return;
  if (b.dataset.view) go({view:b.dataset.view});
  else if (b.dataset.zoom === 'home') go({v:null});
  else if (b.dataset.zoom) go({v:{z:clamp(cam.z * (b.dataset.zoom === 'in' ? 1.5 : 1/1.5), ZMIN, ZMAX), cx:cam.cx, cy:cam.cy}}, true);
});
thingsSvg.addEventListener('click', function(ev){
  var c = ev.target.closest('.card, .rel');
  go({e: c ? (S.e === c.dataset.id ? null : c.dataset.id) : null});
});

// floor: drag to pan, wheel to zoom, click to select, double click to zoom into a machine
function toWorld(x, y){ var m = floor.getScreenCTM().inverse(); return {x: m.a*x + m.c*y + m.e, y: m.b*x + m.d*y + m.f}; }
var drag = null, moved = false, camTimer = null;
function camLater(){ clearTimeout(camTimer); camTimer = setTimeout(function(){ go({v:cam}, true); }, 160); }
floor.addEventListener('pointerdown', function(ev){ if (ev.button !== 0) return; drag = {x:ev.clientX, y:ev.clientY, cx:cam.cx, cy:cam.cy, k:(W/cam.z)/floor.getBoundingClientRect().width}; moved = false; });
window.addEventListener('pointermove', function(ev){
  if (!drag) return;
  var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
  if (!moved && Math.hypot(dx, dy) < 5) return;
  moved = true; floor.classList.add('drag'); hideTip();
  var r = floor.getBoundingClientRect(), k = Math.max((W/cam.z)/r.width, (H/cam.z)/r.height);
  setCam({z:cam.z, cx:drag.cx - dx*k, cy:drag.cy - dy*k});
});
window.addEventListener('pointerup', function(){ if (drag && moved){ floor.classList.remove('drag'); camLater(); } drag = null; });
floor.addEventListener('wheel', function(ev){
  ev.preventDefault();
  var p = toWorld(ev.clientX, ev.clientY), z2 = clamp(cam.z * Math.exp(-ev.deltaY * 0.0016), ZMIN, ZMAX), k = cam.z / z2;
  setCam({z:z2, cx:p.x - (p.x - cam.cx)*k, cy:p.y - (p.y - cam.cy)*k}); hideTip(); camLater();
}, {passive:false});
function targetId(ev){ var g = ev.target.closest('[data-id]'); return g ? g.getAttribute('data-id') : null; }
floor.addEventListener('click', function(ev){
  if (moved){ moved = false; return; }
  var id = targetId(ev);
  go({e: id ? (S.e === id ? null : id) : null, v: S.v || (cam.z !== 1 ? cam : null)});
});
floor.addEventListener('dblclick', function(ev){
  var id = targetId(ev), e = id && E[id]; if (!e) return;
  if (e.kind === 'part') e = E[e.parent];
  if (e.kind === 'machine' || e.kind === 'store' || e.kind === 'district') zoomTo(e.id);
});
document.addEventListener('keydown', function(ev){
  if (ev.key === 'Escape'){ if (S.e) go({e:null}); else if (S.r) go({r:null}); else if (S.v) go({v:null}); }
  else if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.getAttribute && ev.target.getAttribute('data-id') && ev.target.namespaceURI === NS){ ev.preventDefault(); go({e:ev.target.getAttribute('data-id')}); }
});

/* ================= tooltip ================= */
var tip = document.getElementById('tip'), stage = document.getElementById('stage');
function tipHtml(id){
  var x = E[id] || L[id]; if (!x) return '';
  var title = E[id] ? x.name : (x.label || 'non-compliant orders'), extra = '';
  if (E[id] && (x.status === 'partial' || x.status === 'planned')) extra = '<span class="s">' + STATUS_WORD[x.status] + '</span>';
  if (L[id] && x.view === 'floor') title += ': ' + E[x.from].name + ' to ' + E[x.to].name;
  return '<b>' + esc(title) + '</b>' + esc(x.summary || '') + extra;
}
function showTip(id, cx, cy){
  var html = tipHtml(id); if (!html){ hideTip(); return; }
  tip.innerHTML = html; tip.style.display = 'block';
  var r = stage.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  var x = clamp(cx - r.left + 14, 6, r.width - tw - 6), y = cy - r.top + 16;
  if (y + th > r.height - 6) y = cy - r.top - th - 12;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip(){ tip.style.display = 'none'; }
function tipFor(id){
  var el = (S.view === 'things' ? TDOM[id] : DOM[id]) || DOM[id]; if (!el) return;
  var b = el.getBoundingClientRect(); showTip(id, b.left + b.width/2, b.top + b.height/2);
}
[floor, thingsSvg].forEach(function(svgEl){
  svgEl.addEventListener('mousemove', function(ev){ if (drag && moved) return; var id = targetId(ev); if (id) showTip(id, ev.clientX, ev.clientY); else hideTip(); });
  svgEl.addEventListener('mouseleave', hideTip);
});

S = parse(location.hash);
apply();
})();
</script>
