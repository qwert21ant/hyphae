<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatcher: dispatch board</title>
<style>
:root{
  --ground:#E6EBEF; --paper:#FCFDFE; --ink:#14212B; --ink2:#4E5E6B; --line:#B5C1CA;
  --hunt:#F4C61C; --hunt-deep:#8A6800; --hunt-soft:#FBF0BE;
  --collect:#C6DEEA; --collect-deep:#1D6A8E; --collect-soft:#E3EFF5;
  --slab:#1B2B38; --risk:#C4391D; --tile:#D3DBE1;
  --sign: Bahnschrift, "DIN Alternate", "Roboto Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --text: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --code: Consolas, "SF Mono", Menlo, monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sign);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer}
#stage{position:absolute;left:0;top:0;width:1440px;height:842px;transform-origin:0 0}
#wires,#routeLayer{position:absolute;left:0;top:0;width:1440px;height:842px;pointer-events:none}
#routeLayer{z-index:1}
#nodes{position:absolute;inset:0;z-index:2}
#badges{position:absolute;inset:0;z-index:4;pointer-events:none}

/* ── top bar ── */
.title{position:absolute;left:24px;top:12px;font-size:31px;font-weight:700;font-stretch:88%;letter-spacing:-.2px;line-height:44px}
.subtitle{position:absolute;left:186px;top:12px;line-height:48px;font-size:16px;color:var(--ink2);font-stretch:92%}
.nav{position:absolute;right:24px;top:16px;display:flex;gap:8px;align-items:center}
.nav button{height:34px;padding:0 14px 0 14px;border:1.5px solid var(--ink);border-radius:17px;font-size:15px;font-weight:600;font-stretch:92%;background:var(--paper);display:flex;align-items:center;gap:8px}
.nav button .ct{font-weight:700;background:var(--ink);color:#fff;border-radius:10px;min-width:22px;height:20px;padding:0 6px;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center}
.nav button:hover{background:#fff;box-shadow:2px 2px 0 var(--ink)}
.nav button[aria-pressed="true"]{background:var(--ink);color:#fff}
.nav button[aria-pressed="true"] .ct{background:#fff;color:var(--ink)}
.nav .commit{font-family:var(--code);font-size:11.5px;color:var(--ink2);margin-left:6px}

/* ── nodes: shared ── */
.n{position:absolute;display:flex;flex-direction:column;justify-content:center;font-stretch:90%;line-height:1.1;transition:opacity .18s}
.n:focus-visible{outline:3px solid var(--collect-deep);outline-offset:2px;z-index:3}
.n .t{font-weight:600}
.n .g{font-weight:400;color:var(--ink2);margin-top:4px;font-size:12px}
.n:hover{z-index:3}
.dim{opacity:.2}
.sel{box-shadow:0 0 0 3px var(--ink), 5px 5px 0 3px rgba(20,33,43,.28);z-index:3}
.hit{box-shadow:0 0 0 1.5px var(--ink);z-index:3}

/* band headers = the two programmes */
.band{height:32px;border-radius:4px;flex-direction:row;align-items:center;justify-content:flex-start;gap:10px;padding:0 12px;font-size:17px}
.band .t{font-weight:700}
.band .g{margin:0;font-size:13.5px}
.band.hunt{background:var(--hunt)}
.band.hunt .g{color:#4b3b00}
.band.collect{background:var(--collect-deep);color:#fff}
.band.collect .g{color:#d6e8f1}
.band:hover{filter:brightness(1.06)}
.spinehead{position:absolute;height:32px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--ink2);font-stretch:92%;border-bottom:2px solid var(--ink)}

/* stage headers */
.stage{height:22px;font-size:13.5px;font-weight:600;color:var(--ink2);padding:0 2px;justify-content:flex-end}
.stage:hover{color:var(--ink);text-decoration:underline}
.stage.sel,.stage.hit{box-shadow:none;color:var(--ink);text-decoration:underline;text-decoration-thickness:3px}
.colhead{position:absolute;height:22px;font-size:13.5px;font-weight:600;color:var(--ink2);display:flex;align-items:flex-end;padding:0 2px;font-stretch:90%}

/* job cells */
.job{padding:8px 10px;border-radius:3px}
.job.hunt{background:var(--hunt);font-size:15.5px}
.job.collect{background:var(--collect);font-size:13.5px;padding:4px 9px 4px 12px}
.job.hunt::after,.src.L::after{content:"";position:absolute;right:-6px;top:50%;margin-top:-7px;border:7px solid transparent;border-right:0;border-left:6px solid var(--hunt)}
.src.L::after{border-left-color:var(--ink)}
.job.collect::before,.src.R::before{content:"";position:absolute;left:-6px;top:50%;margin-top:-6px;border:6px solid transparent;border-left:0;border-right:6px solid var(--collect)}
.src.R::before{border-right-color:var(--ink)}
.job:hover{filter:brightness(1.05);box-shadow:0 0 0 2px var(--ink)}
.job.sel:hover{box-shadow:0 0 0 3px var(--ink), 5px 5px 0 3px rgba(20,33,43,.28)}

/* sources: the outside world */
.src{background:var(--paper);border:1.5px solid var(--ink);border-radius:3px;font-size:15px;padding:0 8px}
.src .mono{position:absolute;top:-1.5px;bottom:-1.5px;width:30px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;letter-spacing:.3px}
.src.L{padding-left:40px}.src.L .mono{left:-1.5px;border-radius:3px 0 0 3px}
.src.R{padding-right:38px;font-size:13.5px;align-items:flex-end;text-align:right}.src.R .mono{right:-1.5px;border-radius:0 3px 3px 0}
.src .g{font-size:11.5px;overflow-wrap:anywhere}
.src:hover{background:#fff;box-shadow:2px 2px 0 var(--ink)}
.src.sel:hover{box-shadow:0 0 0 3px var(--ink), 5px 5px 0 3px rgba(20,33,43,.28)}

/* spine */
.ticket{background:var(--paper);border:1.5px solid var(--ink);border-radius:3px;padding:10px 22px;font-size:18px;align-items:center;text-align:center;
  -webkit-mask:radial-gradient(circle 7px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat, radial-gradient(circle 7px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat;
          mask:radial-gradient(circle 7px at 0 50%,transparent 98%,#000) left/51% 100% no-repeat, radial-gradient(circle 7px at 100% 50%,transparent 98%,#000) right/51% 100% no-repeat}
.ticket .fields{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.ticket .fields i{font-style:normal;font-size:11.5px;border:1px solid var(--line);border-radius:2px;padding:1px 5px;color:var(--ink2)}
.ticket:hover{background:#fff}
.outlet{background:var(--slab);color:#fff;border-radius:3px;padding:8px 12px;font-size:15.5px;border-top:6px solid var(--ink)}
.outlet .g{color:#b9c7d1}
.outlet.from-hunt{border-top-color:var(--hunt)}
.outlet.from-collect{border-top-color:#69b3d3}
.outlet.from-both{border-image:linear-gradient(90deg,var(--hunt) 0 50%,#69b3d3 50% 100%) 1;border-image-slice:6 0 0 0;border-top:6px solid}
.outlet:hover{filter:brightness(1.25)}
.actor{background:var(--paper);border:1.5px solid var(--ink);border-radius:32px;padding:6px 16px 6px 52px;font-size:16.5px}
.actor .ico{position:absolute;left:14px;top:50%;margin-top:-15px;width:30px;height:30px}
.actor:hover{background:#fff;box-shadow:2px 2px 0 var(--ink)}

/* status marks: only what is not plainly working is marked */
.st-partial.job,.st-partial.tile{background-image:repeating-linear-gradient(135deg,transparent 0 5px,rgba(20,33,43,.17) 5px 7px)}
.st-partial::marker{content:""}
.mark{position:absolute;top:4px;right:5px;width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink);background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.job.collect .mark{top:50%;margin-top:-6.5px;right:6px}
.job.collect.st-partial{padding-right:24px}
.st-unknown{border-style:dashed !important}
.qmark{position:absolute;top:-8px;right:10px;width:17px;height:17px;border-radius:50%;background:var(--ground);border:1.5px dashed var(--ink);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--ink)}

/* levers */
.desk{position:absolute;border:1.5px dashed var(--ink2);border-radius:6px;background:rgba(252,253,254,.55)}
.desk h2{position:absolute;left:12px;top:-12px;margin:0;padding:0 8px;background:var(--ground);font-size:15px;font-weight:700;font-stretch:92%;line-height:22px}
.guide{position:absolute;width:0;border-left:1.5px dotted var(--line)}
.lcol{position:absolute;display:flex;flex-direction:column;gap:6px}
.lever{position:relative;min-height:28px;padding:4px 10px 4px 22px;font-size:13.5px;font-weight:600;background:var(--paper);border:1.5px solid var(--ink);border-radius:15px;justify-content:center}
.lever.config{border-radius:2px}
.lever.state{border-radius:15px;border-style:dashed}
.lever .rows{position:absolute;left:8px;top:50%;margin-top:-9px;width:6px;display:flex;flex-direction:column;gap:2px}
.lever .rows b{display:block;height:4.7px;background:var(--line);border-radius:1px}
.lever .rows b.on{background:var(--ink)}
.lever:hover{background:#fff;box-shadow:2px 2px 0 var(--ink)}
.lever.sel:hover{box-shadow:0 0 0 3px var(--ink), 5px 5px 0 3px rgba(20,33,43,.28)}

/* runtime strip */
.striphead{position:absolute;font-size:15px;font-weight:700;font-stretch:92%;line-height:20px}
.tile{background:var(--tile);border-radius:3px;padding:6px 12px;font-size:14.5px;border:1.5px solid transparent}
.tile.st-unknown{background:transparent;border-color:var(--ink)}
.tile:hover{background-color:#c5cfd7;box-shadow:0 0 0 2px var(--ink)}
.tile.sel:hover{box-shadow:0 0 0 3px var(--ink), 5px 5px 0 3px rgba(20,33,43,.28)}

/* key */
.key{position:absolute;left:24px;right:24px;top:810px;height:22px;display:flex;gap:18px;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--ink2);font-stretch:92%}
.key span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.key i{display:inline-block;width:20px;height:13px;border-radius:2px}
.key .k-hunt{background:var(--hunt)}.key .k-col{background:var(--collect)}
.key .k-out{background:var(--paper);border:1.5px solid var(--ink)}
.key .k-part{background:var(--tile) repeating-linear-gradient(135deg,transparent 0 4px,rgba(20,33,43,.3) 4px 6px)}
.key .k-unk{border:1.5px dashed var(--ink)}
.key .k-tg{border:1.5px solid var(--ink);border-radius:7px;background:var(--paper)}
.key .k-cfg{border:1.5px solid var(--ink);border-radius:1px;background:var(--paper)}
.key .k-state{border:1.5px dashed var(--ink);border-radius:7px;background:var(--paper)}
.key .k-rows{width:6px;height:16px;background:linear-gradient(var(--ink) 0 27%,transparent 27% 37%,var(--line) 37% 63%,transparent 63% 73%,var(--ink) 73%);border-radius:1px}

/* route + pins */
.badge{position:absolute;width:23px;height:23px;margin:-10px 0 0 -10px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--ground)}
.badge.cur{background:var(--risk);transform:scale(1.25)}
.pin{position:absolute;margin:-9px 0 0 -6px;min-width:19px;height:19px;padding:0 4px;border-radius:3px;background:var(--risk);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--ground)}
.pin.ok{background:var(--ink)}

/* ── drawer ── */
#drawer{position:fixed;width:420px;background:var(--paper);border:2px solid var(--ink);border-radius:4px;box-shadow:8px 8px 0 rgba(20,33,43,.22);z-index:20;overflow:auto;display:none;font-family:var(--text);font-size:14px;line-height:1.45;padding:18px 20px 22px}
#drawer.open{display:block}
#drawer .x{position:sticky;float:right;top:0;margin:-8px -10px 0 8px;width:32px;height:32px;border-radius:16px;font-size:22px;line-height:1;display:flex;align-items:center;justify-content:center;background:var(--paper)}
#drawer .x:hover{background:var(--ground)}
#drawer .kind{font-size:12.5px;color:var(--ink2);margin-bottom:2px}
#drawer h1{font-family:var(--sign);font-stretch:90%;font-size:25px;line-height:1.1;margin:0 0 8px;font-weight:700}
#drawer h3{font-family:var(--sign);font-stretch:92%;font-size:14.5px;margin:18px 0 6px;font-weight:700;border-top:1.5px solid var(--ink);padding-top:7px}
#drawer p{margin:0 0 8px;max-width:60ch}
#drawer ul{margin:0;padding:0 0 0 18px}
#drawer li{margin:0 0 5px}
#drawer .status{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border:1.5px solid var(--ink);border-radius:3px;padding:1px 8px;margin:0 0 10px}
#drawer .status.partial{background:repeating-linear-gradient(135deg,transparent 0 5px,rgba(20,33,43,.14) 5px 7px)}
#drawer .status.unknown,#drawer .status.planned{border-style:dashed}
#drawer .code{list-style:none;padding:0;font-family:var(--code);font-size:12px;line-height:1.5;overflow-wrap:break-word}
#drawer .code li{margin:0;padding:1px 0 1px 14px;text-indent:-14px}
#drawer .unv{background:#fbe9e4;border-left:3px solid var(--risk);padding:6px 10px;margin:0 0 6px;list-style:none}
#drawer a.ref{display:inline-flex;align-items:center;gap:6px;color:var(--ink);text-decoration:none;border:1.5px solid var(--ink);border-radius:3px;padding:1px 8px;margin:0 5px 5px 0;font-family:var(--sign);font-stretch:90%;font-weight:600;font-size:13.5px;background:var(--paper)}
#drawer a.ref:hover{background:var(--ink);color:#fff}
#drawer a.ref small{font-family:var(--text);font-weight:400;font-size:12px;opacity:.8}
#drawer .flow{list-style:none;padding:0}
#drawer .flow li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
#drawer .flow .lbl{color:var(--ink2);font-size:12.5px}
#drawer .item{display:block;color:var(--ink);text-decoration:none;border-top:1px solid var(--line);padding:9px 0 9px 34px;position:relative}
#drawer .item:hover{background:var(--ground)}
#drawer .item.on{background:var(--hunt-soft)}
#drawer .item b{font-family:var(--sign);font-stretch:90%;font-size:15.5px;display:block}
#drawer .item .num{position:absolute;left:4px;top:9px;width:23px;height:23px;border-radius:50%;background:var(--ink);color:#fff;font-family:var(--sign);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
#drawer .item.on .num{background:var(--risk)}
#drawer .item .tagk{font-size:11.5px;color:var(--ink2);border:1px solid var(--line);border-radius:2px;padding:0 5px;margin-left:6px;font-family:var(--text);font-weight:400;vertical-align:1px}
#drawer .item span.more{display:block;font-size:13px;color:var(--ink2)}
#drawer .item.on span.more{color:var(--ink)}
#drawer .pager{display:flex;gap:8px;margin:12px 0 4px}
#drawer .pager a{flex:1;text-align:center;border:1.5px solid var(--ink);border-radius:17px;padding:5px 0;color:var(--ink);text-decoration:none;font-family:var(--sign);font-weight:600}
#drawer .pager a:hover{background:var(--ink);color:#fff}
#drawer .pager a.off{opacity:.3;pointer-events:none}
#drawer .back{font-size:12.5px;color:var(--collect-deep);display:inline-block;margin-bottom:4px}
#drawer .rh{display:grid;grid-template-columns:1fr;gap:9px;margin-top:10px}
#drawer .rh .row{position:relative}
#drawer .rh .nm{font-family:var(--sign);font-stretch:90%;font-weight:600;font-size:14.5px}
#drawer .rh .who{font-size:12px;color:var(--ink2);margin-left:6px}
#drawer .rh .track{position:relative;height:10px;margin-top:3px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 100%);background-size:28.08% 100%;border-bottom:1px solid var(--line)}
#drawer .rh .bar{position:absolute;left:0;top:1px;height:8px;background:var(--ink);border-radius:0 4px 4px 0}
#drawer .rh .val{position:absolute;top:-4px;font-family:var(--sign);font-size:13px;font-weight:700;padding-left:6px}
#drawer .rh .axis{display:flex;font-size:11.5px;color:var(--ink2);margin-top:2px}
#drawer .rh .axis span{width:28.08%}

#tip{position:fixed;z-index:30;max-width:300px;background:var(--ink);color:#fff;font-family:var(--text);font-size:12.5px;line-height:1.4;padding:8px 10px;border-radius:4px;pointer-events:none;display:none}
#tip b{font-family:var(--sign);font-size:14px;display:block;margin-bottom:2px}
#tip em{font-style:normal;color:#ffd84d;display:block;margin-top:3px}
@media (prefers-reduced-motion:reduce){.n{transition:none}}
</style>
</head>
<body>
<div id="stage">
  <svg id="wires" viewBox="0 0 1440 842" aria-hidden="true"></svg>
  <svg id="routeLayer" viewBox="0 0 1440 842" aria-hidden="true"></svg>
  <div id="nodes"></div>
  <div id="badges"></div>
</div>
<aside id="drawer" aria-live="polite"></aside>
<div id="tip" role="tooltip"></div>

<script>

cto", "summary": "An outside ride platform (connectotransfers.com) whose new offers the robot hunts and whose already-assigned rides it also collects.", "code": ["packages/components/connecto/"], "status": "works", "wing": "both", "mono": "CN", "tag": "connectotransfers.com", "hunted": true}, {"id": "src-talixo", "kind": "source", "name": "Talixo", "summary": "An outside ride platform (talixo.com) from which the robot only collects already-assigned rides, never taking offers.", "code": ["packages/components/talixo/"], "status": "works", "wing": "collect", "mono": "TX", "tag": "talixo.com", "hunted": false}, {"id": "src-atob", "kind": "source", "name": "AtoB", "summary": "An outside ride platform (atobtransfer.com) from which the robot only collects already-assigned rides, never taking offers.", "code": ["packages/components/atob/"], "status": "works", "wing": "collect", "mono": "AB", "tag": "atobtransfer.com", "hunted": false}, {"id": "src-kiwi", "kind": "source", "name": "Kiwitaxi", "summary": "An outside ride platform (kiwitaxi.com) from which the robot only collects already-assigned rides, never taking offers.", "code": ["packages/components/kiwi/"], "status": "works", "wing": "collect", "mono": "KW", "tag": "kiwitaxi.com", "hunted": false}, {"id": "src-wtdriver", "kind": "source", "name": "World Transfer", "summary": "An outside ride platform (world-transfer.com) from which the robot only collects already-assigned rides, never taking offers.", "code": ["packages/components/wtdriver/"], "status": "works", "wing": "collect", "mono": "WT", "tag": "world-transfer.com", "hunted": false}, {"id": "src-elife", "kind": "source", "name": "Elife", "summary": "An outside ride platform (elifelimo.com) from which the robot only collects already-assigned rides, never taking offers.", "code": ["packages/components/elife/"], "status": "works", "wing": "collect", "mono": "EL", "tag": "elifelimo.com", "hunted": false}, {"id": "src-sheet", "kind": "source", "name": "Google Sheet",   s+=`<path d="M${mid} 330V361" stroke="${INK}" stroke-width="2.5" marker-end="url(#ai)"/>`;
  // outlets to the operator; the operator also sends requests back to the answering bot
  s+=`<path d="M${SPX+58} 536V589" stroke="${HD}" stroke-width="2.5" marker-end="url(#ah)"/>`;
  s+=`<path d="M${SPX+SPW-58} 537V589" stroke="${CD}" stroke-width="2.5" marker-start="url(#ac)" marker-end="url(#ac)"/>`;
  // operator to levers
  s+=`<path d="M${SPX+35} 618H${LEFT_END+10}" stroke="${INK}" stroke-width="2.5" marker-end="url(#ai)"/>`;
  wires.innerHTML=s;
}
drawWires();

/* ───────────── state from the URL hash ───────────── */
function parse(){
  const p=decodeURIComponent(location.hash.replace(/^#\/?/,'')).split('/');
  if(p[0]==='e'&&byId[p[1]]) return {t:'e',id:p[1]};
  if(p[0]==='r'&&routes[p[1]]){const n=parseInt(p[2],10),r=routes[p[1]];
    return {t:'r',id:p[1],step:(n>=1&&n<=r.steps.length)?n-1:-1};}
  if(p[0]==='list'&&['routes','guarantees','loose-ends','rhythm'].includes(p[1])) return {t:'list',list:p[1]};
  if(p[0]==='g'&&G[p[1]]) return {t:'g',id:p[1]};
  if(p[0]==='x'&&X[p[1]]) return {t:'x',id:p[1]};
  return {t:'home'};
}
const allNodeEls=()=>Object.values(nodes).flat();
function pickNode(id,near){const a=nodes[id]||[];if(a.length<2||!near)return a[0];
  return a.map(n=>[n,Math.hypot(rectOf(n).cx-near.cx,rectOf(n).cy-near.cy)]).sort((x,y)=>x[1]-y[1])[0][0];}
function meanX(ids){const xs=ids.flatMap(id=>(nodes[id]||[]).map(n=>rectOf(n).cx));return xs.length?xs.reduce((a,b)=>a+b,0)/xs.length:0;}

function ref(id,small){const e=byId[id];if(!e)return '';return `<a class="ref" href="#e/${id}">${esc(label(e))}${small?` <small>${esc(small)}</small>`:''}</a>`;}
function label(e){ if(e.kind==='job'){return e.name+' ('+byId[e.source].name+')';} return e.name; }
function kindLine(e){
  switch(e.kind){
    case 'job': return `${esc(byId[e.stage].name)} stage of ${e.wing==='hunt'?'the hunt':'the collection'}, for ${esc(byId[e.source].name)}`;
    case 'source': return e.hunted?'An outside source, hunted and collected':'An outside source, collected only';
    case 'lever': return 'A lever, '+({telegram:'set by the operator in Telegram',config:'set in the config file at deploy time',state:'kept in the saved state file only'})[e.setFrom];
    case 'stage': return 'A stage of '+(e.wing==='hunt'?'the hunt':'the collection');
    case 'programme': return 'One of the two programmes';
    case 'thing': return 'What moves through the system';
    case 'outlet': return 'A way out of the system';
    case 'actor': return 'Outside the code';
    case 'place': return 'Where it runs, or what it leans on';
  } return e.kind;
}
const codeList=c=>`<ul class="code">${c.map(p=>`<li>${esc(p).replace(/\//g,'/<wbr>')}</li>`).join('')}</ul>`;
const X_BTN=`<button class="x" type="button" aria-label="Close" data-close>×</button>`;

function elementHtml(e){
  let h=X_BTN+`<div class="kind">${kindLine(e)}</div><h1>${esc(e.name)}</h1>
   <div class="status ${e.status}">${STATUS[e.status]}</div><p>${esc(e.summary)}</p>`;
  if(e.how) h+=`<ul>${e.how.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  if(e.kind==='source'){
    const js=DATA.elements.filter(j=>j.kind==='job'&&j.source===e.id);
    const hj=js.filter(j=>j.wing==='hunt'), cj=js.filter(j=>j.wing==='collect').sort((a,b)=>byId[b.stage].col-byId[a.stage].col);
    if(hj.length) h+=`<h3>When hunting</h3><div>${hj.map(j=>`<a class="ref" href="#e/${j.id}">${esc(j.name)}</a>`).join('')}</div>`;
    h+=`<h3>When collecting</h3><div>${cj.map(j=>`<a class="ref" href="#e/${j.id}">${esc(j.name)}</a>`).join('')}</div>`;
  }
  if(e.kind==='stage'){
    const js=DATA.elements.filter(j=>j.kind==='job'&&j.stage===e.id);
    h+=`<h3>Done differently per source</h3><div>${js.map(j=>ref(j.id)).join('')}</div>`;
  }
  const lv=DATA.links.filter(l=>l.to===e.id&&byId[l.from].kind==='lever');
  if(lv.length) h+=`<h3>Changed by these levers</h3><div>${lv.map(l=>ref(l.from)).join('')}</div>`;
  if(e.kind==='lever'){
    const tg=DATA.links.filter(l=>l.from===e.id);
    h+=`<h3>What it changes</h3><div>${tg.map(l=>ref(l.to)).join('')}</div>`;
  }
  const inn=DATA.links.filter(l=>l.to===e.id&&byId[l.from].kind!=='lever'), out=DATA.links.filter(l=>l.from===e.id&&e.kind!=='lever');
  if(inn.length&&e.kind!=='source') h+=`<h3>Receives</h3><ul class="flow">${inn.slice(0,9).map(l=>`<li><span class="lbl">${esc(l.label)}, from</span>${ref(l.from)}</li>`).join('')}${inn.length>9?`<li class="lbl">and ${inn.length-9} more of the same kind</li>`:''}</ul>`;
  if(out.length&&e.kind!=='source') h+=`<h3>Hands on</h3><ul class="flow">${out.map(l=>`<li><span class="lbl">${esc(l.label)}, to</span>${ref(l.to)}</li>`).join('')}</ul>`;
  const gs=DATA.guarantees.filter(g=>g.binds.includes(e.id)), xs=DATA.looseEnds.filter(g=>g.binds.includes(e.id));
  if(gs.length) h+=`<h3>Must hold here</h3><div>${gs.map(g=>`<a class="ref" href="#g/${g.id}">${esc(g.name)}</a>`).join('')}</div>`;
  if(xs.length) h+=`<h3>Loose ends here</h3><div>${xs.map(g=>`<a class="ref" href="#x/${g.id}">${esc(g.name)}</a>`).join('')}</div>`;
  if(e.change) h+=`<h3>To make it behave differently</h3><ul>${e.change.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  if(e.unverified) h+=`<h3>Not verified</h3><ul style="padding:0">${e.unverified.map(x=>`<li class="unv">${esc(x)}</li>`).join('')}</ul>`;
  h+=`<h3>Code</h3>${codeList(e.code)}`;
  const rs=DATA.routes.filter(r=>r.steps.includes(e.id));
  if(rs.length) h+=`<h3>Seen on these routes</h3><div>${rs.map(r=>`<a class="ref" href="#r/${r.id}/${r.steps.indexOf(e.id)+1}">${esc(r.name)}</a>`).join('')}</div>`;
  return h;
}
function routeHtml(r,step){
  let h=X_BTN+`<a class="back" href="#list/routes">All routes</a><div class="kind">A route: what happens, in order</div><h1>${esc(r.name)}</h1>`;
  h+=r.steps.map((id,i)=>`<a class="item ${i===step?'on':''}" href="#r/${r.id}/${i+1}"><span class="num">${i+1}</span><b>${esc(label(byId[id]))}</b><span class="more">${esc(r.notes[i])}</span></a>`).join('');
  const prev=step>0?`#r/${r.id}/${step}`:'', next=step<r.steps.length-1?`#r/${r.id}/${step+2}`:'';
  h+=`<div class="pager"><a class="${prev?'':'off'}" href="${prev||'#'}">Previous step</a><a class="${next?'':'off'}" href="${next||'#'}">Next step</a></div>`;
  if(step>=0) h+=`<p style="margin-top:10px">${ref(r.steps[step],'open this part')}</p>`;
  return h;
}
function listHtml(kind,sel){
  if(kind==='routes') return X_BTN+`<div class="kind">Scenarios you can follow across the board</div><h1>Follow a route</h1>`+
    DATA.routes.map((r,i)=>`<a class="item" href="#r/${r.id}"><span class="num">${i+1}</span><b>${esc(r.name)}</b><span class="more">${r.steps.length} steps, from ${esc(label(byId[r.steps[0]]))}</span></a>`).join('');
  if(kind==='rhythm') return rhythmHtml();
  const isG=kind==='guarantees', arr=isG?DATA.guarantees:DATA.looseEnds, pre=isG?'g':'x';
  let h=X_BTN+`<div class="kind">${isG?'Rules the code keeps, with the parts that keep them':'Stubbed, half-done, risky or outside this repo'}</div><h1>${isG?'What must always hold':'Loose ends'}</h1>`;
  h+=arr.map(g=>{const on=g.id===sel;
    return `<a class="item ${on?'on':''}" href="#${on?'list/'+kind:pre+'/'+g.id}" style="padding-left:8px"><b>${esc(g.name)}${g.kind?`<span class="tagk">${esc(g.kind)}</span>`:''}</b><span class="more">${esc(g.text)}</span>`+
      (on?`${g.unverified?`<span class="more unv" style="margin-top:6px">${esc(g.unverified)}</span>`:''}<span class="more" style="margin-top:6px">Touches: ${g.binds.map(b=>esc(label(byId[b]))).join('; ')}</span>${codeList(g.code)}`:'')+`</a>`;}).join('');
  return h;
}
function rhythmHtml(){
  const max=Math.log10(600);
  const fmt=s=>s<60?s+' s':(s/60)+' min';
  return X_BTN+`<div class="kind">How often things happen, shortest first (log scale)</div><h1>Rhythm</h1>
  <div class="rh">${DATA.rhythms.map(r=>{const p=Math.max(2,Math.log10(r.seconds)/max*78);
    return `<div class="row"><span class="nm">${esc(r.name)}</span><span class="who">${esc(r.who)}</span>
      <div class="track"><span class="bar" style="width:${p}%"></span><span class="val" style="left:${p}%">${fmt(r.seconds)}</span></div></div>`;}).join('')}
    <div class="axis"><span>1 s</span><span>10 s</span><span>100 s</span><span>1000 s</span></div></div>
  <h3>Code</h3>${codeList([...new Set(DATA.rhythms.flatMap(r=>r.code))])}`;
}

let scale=1,ox=0,oy=0,side='right';
function placeDrawer(){
  const w=Math.min(420,innerWidth-24);
  drawer.style.width=w+'px';
  drawer.style.top=(oy+64*scale)+'px';
  drawer.style.height=Math.max(220,(726-64)*scale)+'px';
  drawer.style.left=(side==='left'?ox+12*scale:ox+W*scale-w-12*scale)+'px';
}
function fit(){
  scale=Math.min(innerWidth/W,innerHeight/H);
  ox=(innerWidth-W*scale)/2; oy=Math.max(0,(innerHeight-H*scale)/2);
  stage.style.transform=`translate(${ox}px,${oy}px) scale(${scale})`;
  placeDrawer();
}
function badge(node,n,cur,cls){const r=rectOf(node),b=document.createElement('div');b.className=(cls||'badge')+(cur?' cur':'');b.textContent=n;
  b.style.left=r.x+'px';b.style.top=r.y+'px';badges.appendChild(b);}

function render(){
  const st=parse();
  allNodeEls().forEach(n=>n.classList.remove('dim','sel','hit'));
  badges.innerHTML=''; routeLayer.innerHTML='';
  document.querySelectorAll('.nav [data-list]').forEach(b=>b.setAttribute('aria-pressed',String(
    (st.t==='list'&&st.list===b.dataset.list)||(st.t==='r'&&b.dataset.list==='routes')||(st.t==='g'&&b.dataset.list==='guarantees')||(st.t==='x'&&b.dataset.list==='loose-ends'))));
  let focus=null, html='', sideIds=[];
  if(st.t==='e'){
    const e=byId[st.id]; (nodes[st.id]||[]).forEach(n=>n.classList.add('sel'));
    focus=new Set([st.id]);
    DATA.links.forEach(l=>{if(l.from===st.id)focus.add(l.to);if(l.to===st.id)focus.add(l.from);});
    if(e.kind==='source') DATA.elements.forEach(j=>{if(j.source===st.id)focus.add(j.id);});
    if(e.kind==='stage') DATA.elements.forEach(j=>{if(j.stage===st.id)focus.add(j.id);});
    if(e.kind==='job'){focus.add(e.source);focus.add(e.stage);}
    if(e.kind==='lever') e.applies.forEach(a=>focus.add(a));
    focus.forEach(id=>{if(id!==st.id)(nodes[id]||[]).forEach(n=>n.classList.add('hit'));});
    // a hunted source is drawn twice; keep the twin that is not next to this job quiet
    if(e.kind==='job'){(nodes[e.source]||[]).forEach(n=>{const left=n.classList.contains('L');if((e.wing==='hunt')!==left){n.classList.remove('hit');n.classList.add('dim');}});}
    html=elementHtml(e); sideIds=[st.id];
    if(e.kind==='job'||e.kind==='source'){ sideIds=(e.kind==='job')?[st.id]:(e.hunted?[]:[st.id]); }
  } else if(st.t==='r'){
    const r=routes[st.id]; focus=new Set(r.steps);
    let prev=null; const pts=[];
    const chosen=r.steps.map((id,i)=>{const nx=r.steps[i+1]&&nodes[r.steps[i+1]]?rectOf(nodes[r.steps[i+1]][0]):null;
      const n=pickNode(id,prev||nx); prev=rectOf(n); pts.push(prev); return n;});
    chosen.forEach((n,i)=>{badge(n,i+1,i===st.step); if(i===st.step)n.classList.add('sel'); else n.classList.add('hit');});
    // twins of chosen source nodes stay dim
    r.steps.forEach((id,i)=>(nodes[id]||[]).forEach(n=>{if(n!==chosen[i])n.dataset.twinDim='1';}));
    html=routeHtml(r,st.step); sideIds=r.steps;
  } else if(st.t==='g'||st.t==='x'){
    const g=(st.t==='g'?G:X)[st.id]; focus=new Set(g.binds);
    g.binds.forEach(id=>(nodes[id]||[]).forEach(n=>n.classList.add('hit')));
    html=listHtml(st.t==='g'?'guarantees':'loose-ends',st.id); sideIds=g.binds;
  } else if(st.t==='list'){
    html=listHtml(st.list);
    if(st.list==='loose-ends'||st.list==='guarantees'){
      const arr=st.list==='loose-ends'?DATA.looseEnds:DATA.guarantees, count={};
      arr.forEach(g=>g.binds.forEach(b=>count[b]=(count[b]||0)+1));
      Object.entries(count).forEach(([id,c])=>(nodes[id]||[]).forEach(n=>badge(n,c,false,st.list==='loose-ends'?'pin':'pin ok')));
      sideIds=Object.keys(count);
    }
  }
  if(focus) allNodeEls().forEach(n=>{ if(!focus.has(n.dataset.id)||n.dataset.twinDim){n.classList.add('dim');n.classList.remove('hit');} delete n.dataset.twinDim; });
  if(html){
    const mx=sideIds.length?meanX(sideIds):0;
    side=(sideIds.length&&mx>W/2)?'left':'right';
    drawer.innerHTML=html; drawer.classList.add('open'); placeDrawer();
    const on=drawer.querySelector('.item.on'); drawer.scrollTop=0; if(on&&on.offsetTop+on.offsetHeight>drawer.clientHeight-20) drawer.scrollTop=on.offsetTop-90;
  } else { drawer.classList.remove('open'); drawer.innerHTML=''; }
  document.title=(st.t==='e'?byId[st.id].name+' – ':st.t==='r'?routes[st.id].name+' – ':'')+'Dispatcher: dispatch board';
}
drawer.addEventListener('click',e=>{ if(e.target.closest('[data-close]')) go(''); });
window.addEventListener('hashchange',render);
window.addEventListener('resize',()=>{tip.style.display='none';fit();});
window.addEventListener('keydown',e=>{
  const st=parse();
  if(e.key==='Escape'&&st.t!=='home'){ go(st.t==='g'?'list/guarantees':st.t==='x'?'list/loose-ends':''); }
  if(st.t==='r'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){
    const n=routes[st.id].steps.length, s=Math.min(n-1,Math.max(0,st.step+(e.key==='ArrowRight'?1:-1)));
    go(`r/${st.id}/${s+1}`); e.preventDefault(); }
});
/* hover: the long text lives here, never on the board */
nodesEl.addEventListener('mouseover',ev=>{
  const n=ev.target.closest('.n'); if(!n){tip.style.display='none';return;}
  const e=byId[n.dataset.id]; tip.innerHTML=`<b>${esc(label(e))}</b>${esc(e.summary)}${e.status!=='works'?`<em>${STATUS[e.status]}</em>`:''}`;
  tip.style.display='block'; const r=n.getBoundingClientRect(), tw=tip.offsetWidth, th=tip.offsetHeight;
  let x=Math.min(innerWidth-tw-8,Math.max(8,r.left)), y=r.bottom+8; if(y+th>innerHeight-8) y=r.top-th-8;
  tip.style.left=x+'px'; tip.style.top=y+'px';
});
nodesEl.addEventListener('mouseleave',()=>tip.style.display='none');
nodesEl.addEventListener('click',()=>tip.style.display='none');
fit(); render();
})();
</script>
</body>
</html>
