<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dispatcher — use-case map</title>
<style>
:root{
  --paper:#E8ECEF; --card:#FBFCFD; --ink:#15202B; --ink2:#566473; --line:#C2CBD3; --soft:#DCE2E7;
  --road:#FFC61A; --road-deep:#D99E00;
  --hatch:repeating-linear-gradient(135deg, rgba(21,32,43,.16) 0 1.5px, transparent 1.5px 6px);
  --sign:Bahnschrift,"DIN Alternate","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --text:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"SF Mono",Menlo,monospace;
  --lift:54px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{overflow:auto}
body{background:var(--paper);color:var(--ink);font-family:var(--sign);font-stretch:88%;
  font-variation-settings:"wdth" 88;min-width:1180px;min-height:700px;overflow:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:3px solid var(--road-deep);outline-offset:2px}
svg.g{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
svg.m{width:12px;height:12px;flex:none;color:var(--ink)}

/* lift: the one control that is on every screen */
#lift{position:fixed;left:0;top:0;bottom:0;width:var(--lift);background:var(--ink);display:flex;flex-direction:column;
  align-items:center;padding:12px 0;gap:8px;z-index:20}
#lift a{width:38px;height:38px;border-radius:5px;display:grid;place-items:center;color:#C9D3DC;font-size:21px;font-weight:600;
  position:relative}
#lift a::after{content:"";position:absolute;left:8px;right:8px;bottom:4px;height:3px;border-radius:2px;background:var(--hue,transparent)}
#lift a:hover{background:#243342;color:#fff}
#lift a.on{background:var(--road);color:var(--ink)}
#lift a.on::after{background:var(--ink)}
#lift svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7}
#lift .sp{flex:1}
#lift .cm{writing-mode:vertical-rl;transform:rotate(180deg);color:#7E8D9B;font-size:11.5px;letter-spacing:.04em;font-family:var(--mono)}

#view{margin-left:var(--lift);height:100vh;min-height:700px}


/* ─────────── board ─────────── */
.board{display:grid;grid-template-rows:62px 1fr;height:100%}
.top{display:flex;align-items:baseline;gap:18px;padding:16px 22px 0 22px}
.top h1{margin:0;font-size:31px;font-weight:700;letter-spacing:-.01em;line-height:1}
.top .tag{font-size:16px;color:var(--ink2)}
.top .count{margin-left:auto;font-size:14px;color:var(--ink2)}
.top .count b{color:var(--ink);font-weight:600}
.bgrid{display:grid;grid-template-columns:198px 1fr;gap:14px;padding:6px 20px 16px 20px;min-height:0}
.who{display:flex;flex-direction:column;gap:6px;min-height:0}
.who h2,.legend h2{margin:2px 0 2px 2px;font-size:13px;font-weight:600;color:var(--ink2)}
.actor{display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:8px;padding:7px 10px 7px 10px;border:1.5px solid var(--ink);
  border-radius:999px;font-size:14px;line-height:1.1}
.actor small{display:block;font-size:11.5px;color:var(--ink2)}
.actor b{font-weight:600;font-size:13px;min-width:20px;text-align:right}
.actor:hover{background:var(--card)}
.actor.on{background:var(--road)}
.legend{margin-top:auto;font-size:12.5px;color:var(--ink2);display:grid;gap:5px}
.legend div{display:flex;align-items:center;gap:8px}
.legend .sw{width:26px;height:14px;border:1.5px solid var(--ink);border-radius:3px;flex:none;background:var(--card)}
.legend .sw.pl{border-style:dashed;background:transparent}
.legend .sw.pa{background-image:var(--hatch)}
.legend .sw.un{border-style:dotted;background:transparent}
.bands{display:grid;grid-template-rows:repeat(4,1fr);gap:9px;min-height:0}
.band{display:grid;grid-template-columns:236px 1fr;background:var(--card);border:1px solid var(--line);border-radius:6px;position:relative;min-height:0}
.band.at{box-shadow:0 0 0 3px var(--road)}
.bhead{display:grid;grid-template-columns:54px 1fr;column-gap:6px;align-content:center;padding:8px 12px 8px 14px;border-left:9px solid var(--hue);
  border-radius:6px 0 0 6px}
.bhead:hover{background:#F1F4F6}
.bhead .n{font-size:62px;font-weight:700;line-height:.9;color:var(--hue);grid-row:1 / span 3;align-self:center}
.bhead .nm{font-size:19px;font-weight:600;line-height:1.08}
.bhead .wt{margin-top:7px;font-size:12px;color:var(--ink2);line-height:1.2}
.bhead .bar{display:block;height:7px;background:var(--soft);border-radius:2px;margin-bottom:3px;overflow:hidden}
.bhead .bar i{display:block;height:100%;background:var(--hue)}
.bhead .tally{margin-top:5px;display:flex;flex-wrap:wrap;gap:2px 9px;font-size:12px;color:var(--ink2);align-items:center}
.bhead .tally span{display:inline-flex;gap:3px;align-items:center;white-space:nowrap}
.tiles{display:flex;flex-wrap:wrap;gap:7px 8px;align-content:center;padding:8px 12px}
.tile{width:168px;height:62px;border:1.5px solid var(--ink);border-radius:4px;background:var(--card);position:relative;
  padding:6px 8px 6px 15px;font-size:15px;line-height:1.12;display:block;overflow:hidden}
.tile::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--hue)}
.tile .tw{position:absolute;right:6px;bottom:4px;display:flex;gap:4px;color:var(--ink2)}
.tile .tw svg.g{width:13px;height:13px}
.tile .tm{position:absolute;left:14px;bottom:5px;display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--ink2)}
.tile.s-partial{background-image:var(--hatch)}
.tile.s-partial::before{background:repeating-linear-gradient(0deg,var(--hue) 0 4px,transparent 4px 7px)}
.tile.s-planned{border-style:dashed;background:transparent}
.tile.s-planned::before{background:transparent;border-right:1.5px dashed var(--hue)}
.tile.s-unknown{border-style:dotted;background:transparent}
.tile.s-unknown::before{background:transparent;border-right:1.5px dotted var(--hue)}
.tile:hover,.mini:hover{box-shadow:0 0 0 2px var(--ink)}
.tile.on,.mini.on{box-shadow:0 0 0 3px var(--road),0 0 0 4.5px var(--ink)}
.tile.dim,.mini.dim{opacity:.22}
.minis{flex-basis:100%;display:grid;grid-template-columns:repeat(6,1fr);gap:5px 6px;align-items:center;max-width:872px}
.minis .cap{grid-column:1 / -1;font-size:12px;color:var(--ink2);line-height:1;margin-top:1px}
.mini{width:100%;height:24px;border:1.5px solid var(--ink);border-radius:999px;background:var(--card);font-size:12.5px;display:flex;align-items:center;
  gap:5px;padding:0 9px;white-space:nowrap;overflow:hidden}
.mini.s-partial{background-image:var(--hatch)}
.twrap{position:relative;display:block}
.twrap.mw{min-width:0}
.pin{position:absolute;z-index:30;width:330px;top:calc(100% + 8px);left:0;background:var(--card);border:1.5px solid var(--ink);border-radius:5px;padding:13px 15px 14px;
  box-shadow:5px 5px 0 rgba(21,32,43,.18);font-family:var(--text);font-stretch:normal;font-variation-settings:normal}
.pin.up{top:auto;bottom:calc(100% + 8px)}
.pin.rt{left:auto;right:0}
.pin .st{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink2);margin-bottom:5px}
.pin h3{margin:0 0 6px;font:600 17px/1.15 var(--sign);font-stretch:88%}
.pin p{margin:0 0 9px;font-size:13.5px;line-height:1.4}
.pin .whoz{font-size:12.5px;color:var(--ink2);margin-bottom:11px}
.go{display:inline-block;background:var(--ink);color:#fff;font:600 13.5px/1 var(--sign);padding:9px 12px;border-radius:4px}
.go:hover{background:#000}
.pin .x{position:absolute;right:8px;top:6px;font-size:18px;color:var(--ink2);padding:2px 6px}

/* ─────────── floor ─────────── */
.floor{display:grid;grid-template-columns:262px 1fr;grid-template-rows:56px 1fr;height:100%}
.ftop{grid-column:1 / -1;display:flex;align-items:center;gap:14px;padding:0 22px 0 16px;border-bottom:1px solid var(--line);background:var(--card)}
.ftop .n{width:36px;height:36px;border-radius:4px;background:var(--hue);color:#fff;display:grid;place-items:center;font-size:24px;font-weight:700}
.ftop h1{margin:0;font-size:23px;font-weight:700;white-space:nowrap}
.ftop .sum{font-size:14.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ftop .back{margin-left:auto;font-size:14px;border:1.5px solid var(--ink);border-radius:999px;padding:5px 13px;white-space:nowrap}
.ftop .back:hover{background:var(--paper)}
.rail{background:var(--card);border-right:1px solid var(--line);overflow:auto;padding:12px 10px 16px 14px;min-height:0}
.rail h2{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--ink2)}
.route{display:grid;grid-template-columns:14px 1fr;gap:7px;align-items:start;padding:6px 8px;border-radius:4px;font-size:14.5px;line-height:1.15;
  border:1.5px solid transparent}
.route svg.m{margin-top:2px}
.route:hover{background:var(--paper)}
.route.on{background:var(--road);font-weight:600}
.rbody{margin:2px 0 8px 8px;padding:4px 0 2px 12px;border-left:3px solid var(--road)}
.rbody p{margin:0 0 7px;font:13px/1.38 var(--text);font-stretch:normal;font-variation-settings:normal;color:var(--ink)}
.rbody ol{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:20px 1fr;gap:7px;padding:3px 4px;border-radius:3px;font-size:13.5px;line-height:1.15;align-items:start}
.step:hover{background:var(--paper)}
.step .k,.num{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--ink);color:#fff;
  font:600 11.5px/1 var(--sign);flex:none}
.step.now{background:var(--paper)}
.step.now .k{background:var(--road);color:var(--ink);box-shadow:0 0 0 1.5px var(--ink)}
.step .nt{grid-column:2;font:12.5px/1.38 var(--text);font-stretch:normal;font-variation-settings:normal;color:var(--ink2);margin:3px 0 4px}
.keys{font:11.5px/1.3 var(--text);color:var(--ink2);margin:6px 0 0 4px}
.minilist{display:grid;grid-template-columns:1fr 1fr;gap:3px 4px;margin:4px 0 8px}
.minilist .route{font-size:12.5px;padding:3px 5px;grid-template-columns:12px 1fr;gap:5px}
.sub{margin:12px 0 4px 2px;font-size:12.5px;color:var(--ink2)}
.stage{position:relative;overflow:hidden;min-width:0;min-height:0}
.canvas{position:absolute;left:0;top:0;transition:transform .28s ease}
.canvas > svg{position:absolute;left:0;top:0;overflow:visible}
.under-band{fill:#DDE3E8;stroke:none}
.frame{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:2 4}
.ccap{position:absolute;font-size:12px;color:var(--ink2);white-space:nowrap}
.edge .ul{fill:none;stroke:var(--road);stroke-width:8;stroke-linecap:round;opacity:0}
.edge .ln{fill:none;stroke:var(--ink);stroke-width:1.4;marker-end:url(#ah)}
.edge.k-act .ln,.edge.k-reply .ln,.edge.k-support .ln{stroke-dasharray:5 4}
.edge.k-off .ln{stroke-dasharray:1.5 4;marker-end:url(#ahx)}
.edge.quiet{display:none}
.edge.quiet.lit,.edge.quiet.rel{display:block}
.edge.lit .ul{opacity:1}
.edge.lit .ln{stroke-width:1.8}
.edge.now .ul{stroke-width:13}
.edge.rel .ln{stroke-width:2.4}
.elabel{position:absolute;transform:translate(-50%,-50%);font-size:11.5px;line-height:1.08;color:var(--ink2);text-align:center;
  background:var(--paper);padding:1px 4px;border-radius:3px;max-width:var(--mw,88px);pointer-events:none;display:flex;gap:4px;align-items:center}
.elabel.inband{background:#DDE3E8}
.elabel.hide{display:none}
.elabel.lit{color:var(--ink);background:var(--road);font-weight:600;max-width:calc(var(--mw,88px) + 30px);padding:2px 6px 2px 3px;z-index:6;box-shadow:0 0 0 1.5px var(--ink)}
.elabel.now{box-shadow:0 0 0 3px var(--ink)}
.elabel.lit.short{transform:translate(-50%,calc(-50% - 36px))}
.node{position:absolute;z-index:3}
.node .hit{position:absolute;inset:0;display:flex;align-items:center;gap:7px;font-size:13.5px;line-height:1.1;padding:3px 8px 3px 12px;
  border:1.5px solid var(--ink);background-color:var(--card);border-radius:4px}
.node.k-part .hit{border-left:7px solid var(--hue)}
.node.k-actor .hit,.node.k-platform .hit{border-radius:999px;background-color:var(--paper);padding-left:12px;font-size:13.5px}
.node.k-thing .hit{border-radius:2px;padding-left:13px;padding-right:11px;justify-content:center;text-align:center;font-size:13.5px;
  -webkit-mask:radial-gradient(circle 7px at 0 50%,transparent 6.5px,#000 7px) left / 51% 100% no-repeat,
               radial-gradient(circle 7px at 100% 50%,transparent 6.5px,#000 7px) right / 51% 100% no-repeat;
  mask:radial-gradient(circle 7px at 0 50%,transparent 6.5px,#000 7px) left / 51% 100% no-repeat,
       radial-gradient(circle 7px at 100% 50%,transparent 6.5px,#000 7px) right / 51% 100% no-repeat}
.node.k-thing::before,.node.k-thing::after{content:"";position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border:1.5px solid var(--ink);
  border-radius:50%;z-index:2;pointer-events:none}
.node.k-thing::before{left:-7px;clip-path:inset(0 0 0 50%)}
.node.k-thing::after{right:-7px;clip-path:inset(0 50% 0 0)}
.node.tiny .hit{font-size:12.5px;padding:0 9px;gap:5px}
.node.s-partial .hit,.node.s-planned .hit,.node.s-unknown .hit{background-image:var(--hatch)}
.node.s-planned .hit{border-style:dashed;border-left-style:solid}
.node .sm{position:absolute;right:5px;bottom:4px;display:flex}
.node.tiny .sm{position:static;margin-left:auto}
.node:hover .hit{box-shadow:0 0 0 2px var(--ink)}
.node.lit .hit{background-color:var(--road);background-image:none}
.node.now .hit{box-shadow:0 0 0 3px var(--ink)}
.node.sel .hit{box-shadow:0 0 0 3px var(--road),0 0 0 5px var(--ink)}
.node .num{position:absolute;left:-8px;top:-9px;z-index:5;box-shadow:0 0 0 1.5px var(--card)}
.tabs{position:absolute;right:10px;top:-16px;display:flex;gap:3px;z-index:4}
.tab{width:19px;height:17px;border-radius:3px 3px 0 0;background:var(--hue);color:#fff;font:700 12px/17px var(--sign);text-align:center;
  border:1.5px solid var(--ink);border-bottom:0}
.tab:hover{height:21px;margin-top:-4px}
.canvas.has-route .node:not(.lit):not(.sel){opacity:.3}
.canvas.has-route .edge:not(.lit):not(.rel){opacity:.13}
.canvas.has-route .elabel:not(.lit){opacity:0}
.canvas.has-route .frame,.canvas.has-route .under-band,.canvas.has-route .ccap{opacity:.45}
@keyframes road{from{opacity:0}to{opacity:1}}
.canvas.anim .edge.lit .ul,.canvas.anim .elabel.lit{animation:road .3s both;animation-delay:calc(var(--i,0) * 90ms)}
@media (prefers-reduced-motion:reduce){.canvas.anim .edge.lit .ul,.canvas.anim .elabel.lit{animation:none}.canvas,.drawer{transition:none}}
.key{position:absolute;left:14px;bottom:10px;display:flex;gap:14px;font-size:12px;color:var(--ink2);align-items:center;z-index:2;
  background:var(--paper);padding:3px 6px;border-radius:3px}
.key span{display:inline-flex;align-items:center;gap:5px}
.key i{display:inline-block;width:22px;height:12px;border:1.5px solid var(--ink);background:var(--card)}
.key i.a{border-radius:999px;background:var(--paper)}
.key i.p{border-left:5px solid var(--hue);border-radius:2px}
.key i.t{border-radius:1px;-webkit-mask:radial-gradient(circle 4px at 0 50%,transparent 3.5px,#000 4px) left / 51% 100% no-repeat,radial-gradient(circle 4px at 100% 50%,transparent 3.5px,#000 4px) right / 51% 100% no-repeat}
.key i.s{width:15px;height:13px;border-radius:3px 3px 0 0;background:var(--ink2);border-bottom:0}
.key i.d{border:0;border-top:1.5px dashed var(--ink);height:0;background:none}
.drawer{position:absolute;right:0;top:0;bottom:0;width:356px;background:var(--card);border-left:1.5px solid var(--ink);overflow:auto;
  padding:16px 18px 22px;transform:translateX(102%);transition:transform .25s ease;z-index:10;font-family:var(--text);font-stretch:normal;
  font-variation-settings:normal}
.drawer.open{transform:none}
.drawer .x{position:absolute;right:10px;top:8px;font-size:20px;color:var(--ink2);padding:2px 7px;border-radius:3px}
.drawer .x:hover{background:var(--paper)}
.drawer .st{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--ink2);margin-bottom:6px}
.drawer h3{margin:0 26px 7px 0;font:700 21px/1.1 var(--sign);font-stretch:88%}
.drawer .lead{font-size:14px;line-height:1.42;margin:0 0 4px}
.drawer h4{margin:15px 0 5px;font:600 13.5px/1.2 var(--sign);font-stretch:88%;color:var(--ink);display:flex;gap:6px;align-items:center}
.drawer h4::after{content:"";flex:1;height:1px;background:var(--line)}
.drawer ul{margin:0;padding:0 0 0 16px;font-size:13px;line-height:1.42}
.drawer li{margin:0 0 4px}
.drawer li::marker{color:var(--ink2)}
.drawer .wo li::marker{content:"! ";font-weight:700;color:var(--ink)}
.drawer .code{list-style:none;padding:0;font:12px/1.35 var(--mono)}
.drawer .code li{display:flex;gap:6px;margin:0 0 3px;word-break:break-all}
.drawer .code code{user-select:all;cursor:text}
.drawer .code small{margin-left:auto;color:var(--ink2);white-space:nowrap;font-family:var(--text)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font:13px/1 var(--sign);font-stretch:88%;border:1.5px solid var(--ink);border-radius:999px;padding:5px 9px;display:inline-flex;gap:5px;align-items:center}
.chip:hover{background:var(--paper)}
button.chip{background:var(--card);cursor:pointer;color:var(--ink);margin-top:6px}
.chip.fl{background:var(--hue);color:#fff;border-radius:3px}
.chip.on{background:var(--road)}
.err{position:fixed;left:70px;bottom:10px;background:#B00020;color:#fff;font:13px var(--mono);padding:8px 12px;z-index:99;max-width:80vw}
</style>
</head>

oor":"run","from":"r-watch","to":"p-log-tg","kind":"off","label":"log lines","secondary":false,"note":null},{"id":"run:x-admin>p-registry","floor":"run","from":"x-admin","to":"p-registry","kind":"flow","label":"registry playbook","secondary":true,"note":null},{"id":"run:x-admin>r-watch","floor":"run","from":"x-admin","to":"r-watch","kind":"flow","label":"pnpm dev","secondary":true,"note":null},{"id":"run:p-browser>x-admin","floor":"run","from":"p-browser","to":"x-admin","kind":"reply","label":"screen over VNC","secondary":true,"note":null},{"id":"run:r-watch>p-health","floor":"run","from":"r-watch","to":"p-health","kind":"off","label":"health probe","secondary":true,"note":null},{"id":"run:r-collect>p-health","floor":"run","from":"r-collect","to":"p-health","kind":"off","label":"health probe","secondary":false,"note":null}],"routes":[{"id":"take-wp","group":"catch","name":"Take a Welcome Pickups transfer","status":"works","who":["timer","platforms","controller"],"summary":"A transfer that fits the rules gets one of your drivers assigned, with nobody clicking.","steps":["catch:x-wp>p-poll","catch:p-poll>p-judge","catch:t-rules>p-judge","catch:p-judge>p-take-wp","catch:p-take-wp>x-wp","catch:p-take-wp>t-order","catch:t-order>p-announce","catch:p-announce>x-chat","catch:t-order>p-publish","catch:p-publish>x-controller"],"step_titles":["Ask for open transfers","Look at each one","Apply the rules","It fits: take it","Assign driver and car","Make it an order","Hand it to the announcer","Green 'New order' message","Hand it to the publisher","Send to the controller"],"step_notes":["Every fetch delay (20 s by default) the worker asks the site for unassigned upcoming transfers: next 14 days, first 100.","Every transfer in the answer is checked on every poll.","It fits when it is not cancelled, the driver's cost reaches the minimum for a minivan or sedan, the cost per km reaches the minimal rate, and the pickup is outside all blocked hours.","No one is asked. A fitting transfer is taken straight away.","On the site: open 'Assign driver', pick a random driver who is not excluded and the first vehicle, click assign, wait for the OK, then verify. Up to 5 tries.","The transfer becomes an order marked compliant, with the traveler's name and phone.","Every order a worker reports goes to the chat side.","Chats bound to this worker get pickup time, route, distance, car, traveler and cost.","The same order goes to the controller side.","The order is posted to the controller's addOrders address. A failed send is only logged."],"platform":null,"variant":false},{"id":"take-tf","group":"catch","name":"Take a Transfeero ride","status":"works","who":["timer","platforms","controller"],"summary":"A new ride that fits the rules is accepted with the right vehicle, with nobody clicking.","steps":["catch:x-tf>p-poll","catch:p-poll>p-judge","catch:t-rules>p-judge","catch:p-judge>p-take-tf","catch:p-take-tf>x-tf","catch:p-take-tf>t-order","catch:t-order>p-announce","catch:p-announce>x-chat","catch:t-order>p-publish","catch:p-publish>x-controller"],"step_titles":["Ask for new rides","Look at each one","Apply the rules","It fits: take it","Pick vehicle, accept","Make it an order","Hand it to the announcer","Green 'New order' message","Hand it to the publisher","Send to the controller"],"step_notes":["Every fetch delay the worker re-sends the site's own 'new rides' request from inside the page.","Every ride in the answer is checked on every poll.","It fits when the pickup is outside blocked hours, start or end contains 'Alicante', the payout reaches the minimal order cost, and the vehicle class is in the configured vehicle map.","Fitting rides are taken one after another; config can reverse their order.","On the site: open the ride, pass the security room and the Cloudflare box, select the mapped vehicle, click accept, wait up to 10 s. Only status 200 counts.","The ride becomes an order marked compliant, with the customer's note as comment.","Every order a worker reports goes to the chat side.","Chats bound to this worker get pickup time, route, distance, car, passengers and cost.","The same order goes to the controller side.","The order is posted to the controller's addOrders address."],"platform":null,"variant":false},{"id":"take-cn","group":"catch","name":"Take a Connecto email offer","status":"works","who":["mailbox","platforms","controller"],"summary":"An offer that arrives by e-mail and matches the accept list is accepted on Connecto's page.","steps":["catch:x-mail>p-mail","catch:x-cn>p-mail","catch:p-mail>p-judge","catch:t-rules>p-judge","catch:p-judge>p-take-cn","catch:p-take-cn>x-cn","catch:p-take-cn>t-order","catch:t-order>p-announce","catch:p-announce>x-chat","catch:t-order>p-publish","catch:p-publish>x-controller"],"step_titles":["Find new offer mails","Open the offer page","Check the offer","Apply the accept list","It fits: take it","Click accept","Make it an order","Hand it to the announcer","Green 'New order' message","Hand it to the publisher","Send to the controller"],"step_notes":["Every fetch delay the worker looks in the inbox for Connecto mail newer than the last one it handled.","It pulls the link out of the mail, opens it in the browser and reads from, to, date, vehicle and price. Expired offers are skipped.","Each offer is judged once.","It fits when the pickup is outside blocked hours and a line of the uploaded list has the same from, the same to, a vehicle name the offer contains, and a price the offer reaches.","No one is asked.","The accept control on the open offer page is pressed. Nothing checks afterwards that the site confirmed.","The offer becomes an order marked compliant. Connecto orders carry no traveler details.","Every order a worker reports goes to the chat side.","Chats bound to this worker get pickup time, route, car and cost.","The same order goes to the controller side.","The order is posted to the controller's addOrders address."],"platform":null,"variant":false},{"id":"report-misfit","group":"catch","name":"Report offers that don't fit","status":"works","who":["timer","platforms","controller"],"summary":"An offer that fails the rules is left alone, but the operator and the controller still hear about it.","steps":["catch:p-poll>p-judge","catch:p-judge>t-order","catch:t-order>p-announce","catch:p-announce>x-chat","catch:t-order>p-publish","catch:p-publish>x-controller"],"step_titles":["An offer comes in","It fails the rules","Hand it to the announcer","Yellow 'non-compliant' message","Hand it to the publisher","Send to the controller"],"step_notes":["From a poll — or, for Connecto, from a mail.","It is not taken. It becomes an order marked non-compliant. Welcome Pickups and Transfeero remember, in memory, which ones they already reported.","Misfits go the same way as taken orders.","Without traveler details. More than 10 misfits at once become one summary line.","Misfits are published too.","Posted with its type set to non-compliant."],"platform":null,"variant":false},{"id":"report-failed","group":"catch","name":"Report a failed accept","status":"works","who":["timer","platforms"],"summary":"When taking a fitting offer goes wrong, the operator gets a red message so a person can step in.","steps":["catch:p-judge>p-take-tf","catch:p-take-tf>x-tf","catch:p-take-tf>t-order","catch:t-order>p-announce","catch:p-announce>x-chat"],"step_titles":["A fitting offer is being taken","The accept goes wrong","Flag the order as failed","Hand it to the announcer","Red 'Failed to accept' message"],"step_notes":["Shown here for Transfeero; the other two platforms behave the same.","The site says no, a step times out, or a control is missing.","The offer is still turned into an order, so the message can show it.","Failures go to the chat side only.","A failed order is not sent to the controller. Welcome Pickups and Transfeero try again on the next poll; a Connecto mail is handled only once."],"platform":null,"variant":false},{"id":"stay-signed-in","group":"catch","name":"Stay signed in","status":"works","who":["timer"],"summary":"Workers log in by themselves and keep their sessions, so polling never needs a person.","steps":["catch:p-browser>p-session","p-session","catch:p-session>p-poll"],"step_titles":["Get the worker's Chrome page","Load saved cookies","Sign in if needed"],"step_notes":["Each worker has its own Chrome, with its own profile.","Cookies from the last successful sign-in are put back into the browser.","It opens the platform; if that does not land on the working page it types the login from config and saves the new cookies. Transfeero repeats this every 3 minutes."],"platform":null,"variant":false},{"id":"resume","group":"catch","name":"Resume workers after restart","status":"works","who":["admin"],"summary":"After the app restarts, the workers that were running start again without anyone pressing Start.","steps":["p-run","catch:p-run>p-browser","catch:p-run>p-poll"],"step_titles":["Read who was running","Connect each worker's Chrome","Start them again"],"step_notes":["Running yes/no is saved for every worker.","10 tries, 3 s apart. If a Chrome cannot be reached the app exits.","Workers marked running sign in and begin polling; the others wait for Start."],"platform":null,"variant":false},{"id":"bind-chat","group":"steer","name":"Point chat at a worker","status":"works","who":["operator"],"summary":"/worker <name> decides which worker this chat controls and whose orders it hears about.","steps":["steer:x-chat>p-gate","steer:p-gate>p-bind","steer:p-bind>t-binding"],"step_titles":["Send /worker name","Look the worker up","Save the binding"],"step_notes":["Only chats on the allowed list are answered.","An unknown name is answered with the list of workers.","From now on this chat's menu controls that worker, and that worker's order messages come here."],"platform":null,"variant":false},{"id":"start-stop","group":"steer","name":"Start or stop a worker","status":"works","who":["operator"],"summary":"Two buttons in the /config menu switch a worker's polling on and off.","steps":["steer:x-chat>p-gate","steer:p-gate>p-menu","steer:t-binding>p-menu","steer:p-menu>p-run","steer:p-menu>x-chat"],"step_titles":["Send /config","Open the menu","For the bound worker","Press Start or Stop","See the result"],"step_notes":["Only chats on the allowed list are answered.","The menu opens as a message with buttons.","It shows that worker's name and whether it is running.","Start signs in first, so it can fail; the error text is then shown. The new state is saved and survives restarts.","'Worker started' or 'Worker stopped', with a Back button."],"platform":null,"variant":false},{"id":"set-delay","group":"steer","name":"Change the fetch delay","status":"works","who":["operator"],"summary":"How many seconds a worker waits between two polls.","steps":["steer:x-chat>p-gate","steer:p-gate>p-menu","steer:p-menu>p-edit","steer:p-edit>t-rules"],"step_titles":["Send /config","Fetch delay, Set delay","Type the seconds","Saved"],"step_notes":["Only chats on the allowed list are answered.","The menu shows the current delay and asks for a new one.","The next message from this chat is read as the number.","The very next wait already uses it."],"platform":null,"variant":false},{"id":"block-hours","group":"steer","name":"Block out hours","status":"works","who":["operator","timer"],"summary":"Time exclusions: windows in which no offer fits, whatever its price.","steps":["steer:x-chat>p-gate","steer:p-gate>p-menu","steer:p-menu>p-edit","steer:p-edit>t-rules","steer:p-expire>t-rules"],"step_titles":["Send /config","Filter, time exclusions","Type the window","Saved","Past windows vanish"],"step_notes":["Only chats on the allowed list are answered.","The menu lists the current windows in local time.","Format 'HH:MM-HH:MM DD.MM', local time, one day at a time. Remove by number: 1, 1-3 or 1,3,5.","Offers with a pickup inside the window stop fitting from the next poll.","Every 10 minutes, while the worker runs, windows that have ended are removed."],"platform":null,"variant":false},{"id":"min-cost","group":"steer","name":"Set the minimal order cost","status":"works","who":["operator"],"summary":"The price below which an offer does not fit.","steps":["steer:x-chat>p-gate","steer:p-gate>p-menu","steer:p-menu>p-edit","steer:p-edit>t-rules"],"step_titles":["Send /config","Filter, minimal order cost","Type the amount","Saved"],"step_notes":["Only chats on the allowed list are answered.","Transfeero: one number. Welcome Pickups: one per vehicle (minivan, sedan) and a separate per-km rate. Connecto has no such screen.","Anything that is not a number is refused.","Used from the next poll."],"platform":null,"variant":false},{"id":"accept-list","group":"steer","name":"Upload Connecto accept list","status":"works","who":["operator"],"summary":"The list of routes, vehicles and lowest prices that Connecto offers are accepted against.","steps":["steer:x-chat>p-gate","steer:p-gate>p-menu","steer:p-menu>p-edit","steer:p-edit>t-rules"],"step_titles":["Send /config","Filter, order details","Send the text file","List replaced"],"step_notes":["The chat must be bound to a Connecto worker.","Shows how many entries the list has; offers Upload and Download.","One line per entry: 'from - to - vehicle - price'. A line that does not parse rejects the whole file.","The new list replaces the old one entirely."],"platform":null,"variant":false},{"id":"restart-app","group":"steer","name":"Restart the app","status":"works","who":["operator"],"summary":"/restart_app ends the dispatcher process so that it starts fresh.","steps":["steer:x-chat>p-gate","steer:p-gate>p-host","steer:p-host>x-server"],"step_titles":["Send /restart_app","Reply, then exit","Docker starts it again"],"step_notes":["Only chats on the allowed list are answered.","The bot answers 'Restarting application' and the process exits with code 2.","The container's restart policy brings the app back; workers that were running resume (floor 1)."],"platform":null,"variant":false},{"id":"reboot","group":"steer","name":"Reboot the server","status":"unknown","who":["operator"],"summary":"/reboot_host asks the operating system to reboot.","steps":["steer:x-chat>p-gate","steer:p-gate>p-host","steer:p-host>x-server"],"step_titles":["Send /reboot_host","Reply, then reboot","Effect unverified"],"step_notes":["Only chats on the allowed list are answered.","The bot answers 'Restarting server' and runs the system's reboot command.","The shipped app runs inside a container. Whether a reboot issued there reaches the host cannot be told from the repository."],"platform":null,"variant":false},{"id":"refresh","group":"collect","name":"Refresh schedule every 10 min","status":"works","who":["timer","platforms","controller"],"summary":"Without being asked, the app re-reads every platform and sends the whole schedule to the controller.","steps":["collect:x-timer>p-round","collect:p-round>p-walk","collect:p-walk>p-read","p-read","collect:p-read>t-schedule","collect:t-schedule>p-publish","collect:p-publish>x-controller"],"step_titles":["The timer fires","Start a round","Platform after platform","Read its booked transfers","Keep what was found","Hand over everything","Send to the controller"],"step_notes":["10 minutes after the previous round ended. The first round starts with the app.","Only one round runs at a time.","In config order, in the single Chrome. Cookies are wiped before each one. Up to 3 tries per platform.","Sign in if needed, then read the transfers already assigned to the company.","Past pickups are dropped. A platform that failed keeps its error instead.","All platforms' bookings together.","The whole schedule is posted after every round."],"platform":null,"variant":false},{"id":"collect-all","group":"collect","name":"Ask for the full schedule","status":"works","who":["operator"],"summary":"/collect_all returns the upcoming booked transfers of all platforms in one sorted list.","steps":["collect:x-chat>p-ask","coll     into.append(h("a", { class: "route s-" + x.status + (on ? " on" : ""), href: on ? fh(g.id, { part: s.part }) : fh(g.id, { route: x.id }), title: x.summary,
      html: mark(x.status) + "<span>" + esc(x.mini ? EL[x.focus].name : x.name) + "</span>" }));
  };
  const body = x => {
    const b = h("div", { class: "rbody" }, h("p", { text: (x.mini ? x.name + ". " : "") + (x.status !== "works" ? "[" + x.status + "] " : "") + x.summary }));
    const ol = h("ol");
    x.steps.forEach((id, i) => {
      const now = s.step === i + 1;
      const a = h("a", { class: "step" + (now ? " now" : ""), href: fh(g.id, { route: x.id, step: now ? null : i + 1 }) },
        h("span", { class: "k", text: i + 1 }), h("span", { text: x.step_titles[i] }));
      if (now) a.append(h("span", { class: "nt", text: x.step_notes[i] }));
      ol.append(h("li", null, a));

    return b;
  };
  rs.filter(x => !x.mini).forEach(x => { addRoute(x, rail); if (s.route === x.id) rail.append(body(x)); });
  const minis = rs.filter(x => x.mini);
  if (minis.length) {
    rail.append(h("div", { class: "sub", text: "Reads bookings from" }));
    const ml = h("div", { class: "minilist" }); minis.forEach(x => addRoute(x, ml)); rail.append(ml);
    if (r && r.mini) rail.append(body(r));
  }
  rail.scrollTop = keepScroll;
  const nowEl = rail.querySelector(".step.now, .route.on"); if (nowEl && nowEl.scrollIntoView) nowEl.scrollIntoView({ block: "nearest" });
  /* drawer */
  let shift = 0;
  if (s.part) {
    drawer.textContent = ""; fillDrawer(drawer, EL[s.part], s, g); drawer.classList.add("open");
    const rc = cur.rects[s.part], free = cur.W - 356 - 22;
    if (rc && rc.r > free) shift = rc.r - free;
  } else drawer.classList.remove("open");
  canvas.style.transform = shift ? "translateX(" + (-shift) + "px)" : "";
}
function fillDrawer(d, e, s, g) {
  const KW = { part: "A job", thing: "Stored or passed on", actor: "Outside the apps", platform: "Transfer platform" };
  d.append(h("a", { class: "x", href: fh(g.id, { route: s.route, step: s.step }), "aria-label": "Close", text: "×" }),
    h("div", { class: "st", html: mark(e.status) + KW[e.kind] + " · " + STATUS_WORD[e.status] }),
    h("h3", { text: e.name }), h("p", { class: "lead", text: e.summary }));
  const jump = h("button", { class: "chip jump", type: "button", text: "Its code: " + e.files + (e.files === 1 ? " file, " : " files, ") + e.lines.toLocaleString("en-US") + " lines" });
  jump.addEventListener("click", () => { const c = d.querySelector(".codeh"); if (c) c.scrollIntoView({ block: "start", behavior: "smooth" }); });
  d.append(jump);
  const sec = (title, items, c) => { if (!items || !items.length) return; d.append(h("h4", { text: title })); const ul = h("ul", { class: c || "" }); items.forEach(t => ul.append(h("li", { text: t }))); d.append(ul); };
  sec("How it works", e.how); sec("Must always hold", e.must_hold); sec("Where to change it", e.change_here); sec("Watch out", e.watch_out, "wo");
  const others = e.floors.filter(f => f !== g.id);
  if (others.length || (e.see || []).length) {
    d.append(h("h4", { text: "Same part on other floors" })); const c = h("div", { class: "chips" });
    others.forEach(f => c.append(h("a", { class: "chip fl", href: fh(f, { part: e.id }), style: "--hue:" + GR[f].hue, text: GR[f].n + "  " + GR[f].name })));
    (e.see || []).forEach(f => c.append(h("a", { class: "chip fl", href: fh(f), style: "--hue:" + GR[f].hue, text: GR[f].n + "  " + GR[f].name })));
    d.append(c);
  }
  d.append(h("h4", { class: "codeh", text: "Code · " + e.lines.toLocaleString("en-US") + " lines in " + e.files + (e.files === 1 ? " file" : " files") }));
  const ul = h("ul", { class: "code" });
  e.code.forEach(p => ul.append(h("li", null, h("code", { text: p }))));
  d.append(ul);
  const uses = D.routes.filter(x => x.group === g.id && x.steps.some(id => id === e.id || (LK[id] && (LK[id].from === e.id || LK[id].to === e.id))));
  if (uses.length) {
    d.append(h("h4", { text: "Use cases that pass through" })); const c = h("div", { class: "chips" });
    uses.forEach(x => c.append(h("a", { class: "chip" + (s.route === x.id ? " on" : ""), href: fh(g.id, { route: x.id, part: e.id }), html: mark(x.status) + esc(x.mini ? EL[x.focus].name : x.name) })));
    d.append(c);
  }
}

/* ── wiring ── */
function render() {
  const s = parse();
  document.title = "Dispatcher — " + (s.view === "floor" ? "floor " + GR[s.g].n + ", " + GR[s.g].name : "use-case board");
  renderLift(s);
  if (s.view === "board") renderBoard(s); else renderFloor(s);
}
window.addEventListener("hashchange", render);
let lastW = 0, lastH = 0, quietRender = false;
new ResizeObserver(() => {
  const w = view.clientWidth, hh = view.clientHeight;
  if (w === lastW && hh === lastH) return;
  const first = !lastW; lastW = w; lastH = hh;
  if (!first) { cur.W = -1; quietRender = true; render(); quietRender = false; }
}).observe(view);
window.addEventListener("keydown", ev => {
  const s = parse();
  if (ev.key === "Escape") {
    if (s.view === "board") { if (s.uc || s.who || s.at) location.hash = "#board"; }
    else if (s.part) location.hash = fh(s.g, { route: s.route, step: s.step });
    else if (s.step) location.hash = fh(s.g, { route: s.route });
    else if (s.route) location.hash = fh(s.g);
  } else if ((ev.key === "ArrowRight" || ev.key === "ArrowLeft") && s.view === "floor" && s.route) {
    const n = RT[s.route].steps.length, d = ev.key === "ArrowRight" ? 1 : -1;
    let k = (s.step || (d > 0 ? 0 : n + 1)) + d; if (k < 1) k = 1; if (k > n) k = n;
    location.hash = fh(s.g, { route: s.route, step: k, part: s.part }); ev.preventDefault();
  }
});
render();
