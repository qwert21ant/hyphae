<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Continuo: the walk, tick by tick</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --paper:#DFE4E0; --panel:#F5F7F3; --ink:#15202B; --ink2:#52606B; --line:#9FABAB; --faint:#C9D1CE;
  --ok:#1C7A4C; --ok-bg:#D2E8D9; --part:#B56A00; --part-bg:#F6E2B8; --plan:#7B878D;
  --bad:#B3271E; --sel:#3536D0; --sel-bg:#E3E4FB;
  --p-game:#12365E; --p-tests:#5B8FC7; --p-reasoned:#C3D6EA;
  --sign:"Bahnschrift","DIN Alternate","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --text:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--paper);overflow:hidden}
body{color:var(--ink);font-family:var(--sign);font-stretch:87%;font-size:13.5px;line-height:1.25}
#stage{position:absolute;width:1440px;height:900px;transform-origin:0 0;background:var(--paper)}
#stage *{position:absolute}
#wires{left:0;top:0;width:1440px;height:900px;pointer-events:none;z-index:1}
#wires line{stroke:var(--ink);stroke-width:1.6;fill:none}
#wires line.hit{stroke:transparent;stroke-width:14;pointer-events:stroke;cursor:pointer}
#wires line.bad{stroke:var(--bad)}
#wires line.end{stroke:var(--ink2);stroke-dasharray:5 4}
#wires line.x{stroke:var(--ink2)}
#wires line.sel{stroke:var(--sel);stroke-width:3}
#wires line.dim{opacity:.22}

/* text helpers: inner flow content is static, not absolute */
#stage .flow, #stage .flow *{position:static}
#stage .flow .chip, #stage .flow .dot, #stage .flow .pin{position:relative}

.h{font-size:13px;color:var(--ink2);letter-spacing:.01em}
.title{left:20px;top:7px;font-size:25px;font-weight:700;font-stretch:80%;letter-spacing:.01em}
.tagline{left:142px;top:16px;font-size:15px;color:var(--ink2)}
.commit{left:560px;top:18px;font-size:12px;color:var(--ink2);font-family:var(--mono);font-stretch:100%}

/* lens switch */
#lens{right:16px;top:8px;height:30px;display:flex;gap:0;position:absolute}
#lens a{position:static;display:block;padding:6px 14px 0;height:30px;border:1.5px solid var(--ink);border-left-width:0;color:var(--ink);text-decoration:none;font-size:14px;background:var(--panel)}
#lens a:first-child{border-left-width:1.5px;border-radius:15px 0 0 15px}
#lens a:last-child{border-radius:0 15px 15px 0}
#lens a.on{background:var(--ink);color:var(--panel)}

/* the element base */
.el{cursor:pointer;outline:0;z-index:2}
#stage .k-job>*{position:static}
#stage .k-job>.ord{position:absolute;left:-13px;top:2px}
.el:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.s-works{--m:var(--ok);--mb:var(--ok);--ms:solid}
.s-partial{--m:var(--part);--mb:linear-gradient(90deg,var(--part) 50%,transparent 50%);--ms:solid}
.s-planned{--m:var(--plan);--mb:transparent;--ms:solid}
body[data-lens=proof] .p-game,.chip.p-game,.lpk.p-game{--m:var(--p-game);--mb:var(--p-game);--ms:solid}
body[data-lens=proof] .p-tests,.chip.p-tests,.lpk.p-tests{--m:var(--p-tests);--mb:var(--p-tests);--ms:solid}
body[data-lens=proof] .p-reasoned,.chip.p-reasoned,.lpk.p-reasoned{--m:var(--p-game);--mb:var(--p-reasoned);--ms:dotted}
body[data-lens=proof] .p-none,.lpk.p-none{--m:var(--plan);--mb:transparent;--ms:solid}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px var(--ms,solid) var(--m,var(--ok));background:var(--mb,var(--ok));flex:none;vertical-align:baseline;margin-right:6px}
.gap{display:inline-block;margin-left:5px;color:var(--part);font-size:10px;transform:translateY(-1px)}
body[data-lens=proof] .dot,.chip .dot,.lpk .dot{border-radius:2px}
#stage .lp-row *{position:static}
body[data-lens=proof] .gap{display:none}

/* selection and focus */
.el.sel{box-shadow:0 0 0 2.5px var(--sel)}
.k-job.sel,.k-link.sel,.k-out.sel,.lp-row.sel{background:var(--sel-bg)}
.el.rel{box-shadow:0 0 0 1.5px var(--sel)}
.el.cur{box-shadow:0 0 0 3px var(--sel);background:var(--sel-bg)}
.el.dim{opacity:.28}
.k-mode.dim{opacity:1;border-color:var(--line)}
.k-mode.dim>.mhead{opacity:.28}
.ord{display:none;min-width:17px;height:17px;border-radius:9px;background:var(--sel);color:#fff;font-size:11px;font-weight:700;text-align:center;line-height:17px;padding:0 4px;z-index:6;font-stretch:100%}
.onroute>.ord,.cur>.ord{display:block}

/* roadmap */
#road{left:0;top:46px;width:1440px;height:56px}
#road .h{left:20px;top:4px}
#road .track{left:104px;top:13px;width:1318px;height:0;border-top:2px solid var(--ink)}
#road .track.todo{border-top:2px dashed var(--line)}
.k-ms{height:48px;top:2px;padding:0;border-radius:6px}
.k-ms .stn{left:0;top:4px;width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);background:var(--mb)}
.k-ms.s-planned .stn,body[data-lens=proof] .k-ms.p-none .stn{border-color:var(--plan);background:var(--paper)}
.k-ms.s-partial .stn{background:linear-gradient(90deg,var(--part) 50%,var(--panel) 50%)}
body[data-lens=proof] .k-ms.s-partial .stn{background:var(--mb)}
.k-ms .num{left:18px;top:3px;font-size:13px;font-weight:700;background:var(--paper);padding:0 5px 0 4px}
.k-ms .nm{left:0;top:25px;font-size:13px;white-space:nowrap}
.k-ms.s-planned .nm,.k-ms.s-planned .num{color:var(--ink2)}
.k-ms .here{left:52px;top:2px;font-size:11.5px;background:var(--ink);color:var(--panel);padding:2px 7px 1px;border-radius:9px;white-space:nowrap}

/* left column */
.keyrow{left:16px;width:182px;height:40px;border-radius:6px}
.keycap{left:0;top:2px;width:34px;height:34px;border:1.5px solid var(--ink);border-bottom-width:4px;border-radius:6px;background:var(--panel);font-size:18px;font-weight:700;text-align:center;line-height:28px}
.keyrow .kn{left:46px;top:9px;font-size:14.5px;white-space:nowrap}
.keyrow.has-tool .kn{top:1px}
.keyrow .ksub{left:44px;top:20px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.keyrow .ksub .dot{width:7px;height:7px;margin-right:4px}
.k-tool{left:58px;width:140px;height:18px;border-radius:4px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
#lp{left:16px;top:340px;width:186px;height:290px}
#lp .h{left:0;top:0}
.lp-row{left:0;width:190px;height:22px;padding:3px 2px 0 4px;border-radius:4px;font-size:13.5px;white-space:nowrap;overflow:hidden}
body[data-lens=rules] .lp-row{font-size:13px;font-stretch:84%}
.lp-row .n{color:var(--ink2);margin-left:4px}
.lp-row .enf{float:right;font-size:11.5px;color:var(--ink2)}
#legend{left:16px;top:636px;width:186px;height:92px;font-size:12.5px;color:var(--ink2)}
#legend .flow div{margin-bottom:3px;white-space:nowrap}
#legend .dot{margin-right:4px}
#legend .dot:first-child{margin-left:0}

/* standby */
.k-standby{width:108px;height:58px;border:1.5px solid var(--ink);border-radius:10px;background:repeating-linear-gradient(135deg,var(--panel) 0 6px,#E6EAE5 6px 12px);padding:8px 8px}
.k-standby .flow{font-size:14.5px;font-weight:600;line-height:1.15}
.k-link{height:18px;padding:1px 6px 0;font-size:12.5px;white-space:nowrap;background:var(--paper);border-radius:3px;z-index:3}
.k-link.bad{color:var(--bad)}
.k-link.end{color:var(--ink2)}

/* the frame */
#frame{left:340px;top:122px;width:784px;height:606px;border:1.5px solid var(--ink);border-radius:18px;background:#E9EDE8}
.k-guard{left:372px;top:111px;height:22px;padding:2px 10px 0;background:var(--ink);color:var(--panel);border-radius:11px;font-size:13.5px;white-space:nowrap;z-index:2}
.k-guard .dot{border-color:var(--panel);background:var(--panel)}
.axis{font-size:15px;font-weight:700;color:var(--ink2);text-align:center;white-space:nowrap}
.axis.v{transform:rotate(-90deg);transform-origin:0 0;}

.k-mode{border:2px solid var(--ink);border-radius:14px;background:var(--panel);padding:0}
.k-mode>.mhead{left:14px;top:9px;right:10px;height:46px}
.k-mode .mname{left:0;top:0;font-size:25px;font-weight:700;font-stretch:80%;white-space:nowrap}
.k-mode .mname .dot{width:11px;height:11px;margin-right:8px}
.k-mode .mtag{left:20px;top:30px;font-size:13px;color:var(--ink2);white-space:nowrap}
.k-mode>.jobs{left:8px;right:8px;top:62px}
.k-mode>.mnote{left:16px;bottom:10px;font-size:13px;color:var(--ink2);white-space:nowrap}
.k-job{position:relative!important;display:flex;align-items:center;height:21px;padding:0 6px;border-radius:4px;font-size:14px;white-space:nowrap}
.k-job .nm{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis}
.k-job:hover,.k-link:hover,.k-out:hover,.lp-row:hover,.keyrow:hover,.k-tool:hover,.k-door:hover,.k-beat:hover,.k-ms:hover{background:var(--sel-bg)}

.k-out{height:21px;padding:2px 9px 0 7px;border:1.3px solid var(--ink2);border-radius:11px;background:var(--panel);font-size:12.5px;white-space:nowrap;z-index:3;display:flex!important;align-items:center}
.k-out .dot{width:8px;height:8px;margin-right:5px}
#anystrip{left:372px;top:694px;width:740px;height:24px;display:flex;align-items:center;gap:10px}
#anystrip>*{position:static}
#anystrip .h{margin-right:2px}
#anystrip .k-link{background:var(--panel);border:1.2px solid var(--line);height:21px;padding-top:2px}

/* chips and pins */
.chip{display:none;align-items:center;height:17px;margin-left:5px;padding:0 6px 0 5px;border-radius:3px;font-size:12px;font-stretch:95%;border:1.2px solid var(--p-game);background:var(--panel);color:var(--ink);white-space:nowrap;z-index:5;flex:none}
#stage .chip>*{position:static}
.chip{font-weight:400;font-stretch:95%;letter-spacing:0}
.k-mode .mname .chip{vertical-align:4px;margin-left:10px}
.k-mode .mname .chip .dot{width:7px;height:7px;margin-right:4px}
.chip .dot{width:7px;height:7px;margin-right:4px}
.chip.p-reasoned{border-style:dashed}
body[data-lens=dials] .chip{display:inline-flex}
.pin{display:none;margin-left:5px;font-size:11.5px;color:var(--sel);white-space:nowrap;flex:none}
body[data-lens=rules] .pin{display:inline}
body[data-lens=dials] .gap,body[data-lens=rules] .gap{display:none}

/* the game column */
#border{left:1137px;top:112px;width:0;height:616px;border-left:2px dashed var(--ink2)}
.k-door{left:1150px;width:134px;height:44px;border:1.5px solid var(--ink);border-left-width:5px;background:var(--panel);padding:5px 6px 0 7px;font-size:13.5px;line-height:1.15}
.k-ver{left:1296px;width:128px;border:1.5px solid var(--ink);background:var(--panel);padding:8px 8px}
.k-ver.s-planned{border-style:dashed;border-color:var(--plan);background:transparent;color:var(--ink2)}
.k-ver .flow .vn{font-size:15px;font-weight:700;line-height:1.1}
.k-ver .flow .vs{font-size:13px;color:var(--ink2);margin-top:2px}
.k-ver .flow .dot{width:8px;height:8px}

/* the tick strip */
#tick{left:16px;top:738px;width:1408px;height:150px;border:1.5px solid var(--ink);border-radius:14px;background:var(--panel)}
#tick .big{left:14px;top:30px;font-size:25px;font-weight:700;font-stretch:80%;white-space:nowrap}
#tick .small{left:14px;top:62px;font-size:13px;color:var(--ink2);width:86px;line-height:1.2}
.phase{top:10px;height:17px;font-size:12.5px;color:var(--ink2);border-bottom:1.5px solid var(--ink2);white-space:nowrap}
.k-beat{top:38px;width:98px;height:100px;border-radius:8px;padding:0}
.k-beat .bn{left:6px;top:6px;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);font-size:14px;font-weight:700;text-align:center;line-height:23px}
.k-beat .bl{left:6px;top:38px;width:90px;font-size:14px;line-height:1.15}
.k-beat .bd{left:40px;top:11px;white-space:nowrap}
.g4{left:7px;top:78px;width:25px;height:17px;display:grid;grid-template-columns:11px 11px;grid-template-rows:7px 7px;gap:2px 3px}
#stage .g4 i{position:static;border:1.2px solid var(--ink2);border-radius:1.5px}
#stage .g4 i.on{background:var(--ink);border-color:var(--ink)}
.k-beat.lit .bn{background:var(--ink);color:var(--panel)}
.k-beat.off{opacity:.25}
#gamemove{top:44px;width:62px;height:88px;border-left:2px dashed var(--ink2);border-right:2px dashed var(--ink2);font-size:12.5px;color:var(--ink2);text-align:center;padding-top:20px;line-height:1.2}

/* drawer */
#drawer{display:none;top:106px;width:318px;height:626px;background:#FFFFFF;border:2px solid var(--ink);border-radius:14px;z-index:20;overflow:hidden;box-shadow:6px 6px 0 rgba(21,32,43,.14)}
#drawer.open{display:block}
#drawer.right{left:1114px}
#drawer.left{left:8px}
#drawer .body{left:0;top:0;right:0;bottom:0;overflow-y:auto;padding:14px 16px 18px}
#drawer .body, #drawer .body *{position:static}
#drawer .x{position:absolute;right:8px;top:8px;width:26px;height:26px;border:0;background:transparent;font-size:20px;line-height:1;cursor:pointer;color:var(--ink);z-index:2}
#drawer .kind{font-size:12.5px;color:var(--ink2);margin-right:24px}
#drawer h2{font-size:23px;font-stretch:80%;margin:2px 24px 6px 0;line-height:1.1}
#drawer .badges{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
#drawer .badge{font-size:12px;padding:2px 7px 1px;border-radius:9px;border:1.2px solid var(--ink2);white-space:nowrap}
.badge.b-works{border-color:var(--ok);background:var(--ok-bg)}
.badge.b-partial{border-color:var(--part);background:var(--part-bg)}
.badge.b-planned{border-style:dashed}
.badge.b-game{background:var(--p-game);color:#fff;border-color:var(--p-game)}
.badge.b-tests{background:var(--p-tests);color:#fff;border-color:var(--p-tests)}
.badge.b-reasoned{background:var(--p-reasoned);border:1.2px dotted var(--p-game)}
#drawer p{font-family:var(--text);font-stretch:100%;font-size:13.5px;line-height:1.4;margin:0 0 10px}
#drawer h3{font-size:12.5px;font-weight:700;color:var(--ink2);margin:12px 0 4px;border-top:1px solid var(--faint);padding-top:8px}
#drawer ul{margin:0;padding:0 0 0 16px;font-family:var(--text);font-stretch:100%;font-size:13px;line-height:1.38}
#drawer ul.gaps li::marker{color:var(--part)}
#drawer .log{font-family:var(--mono);font-stretch:100%;font-size:11.5px;line-height:1.35;background:#EEF1EC;border-left:3px solid var(--ink);padding:4px 7px;margin:0 0 4px;word-break:break-word}
#drawer .code{font-family:var(--mono);font-stretch:100%;font-size:11px;line-height:1.35;word-break:break-all;margin-bottom:3px;color:var(--ink)}
#drawer .code b{font-weight:400;color:var(--ink2)}
#drawer a.ref{display:inline-block;margin:0 4px 4px 0;padding:2px 7px 1px;border:1.2px solid var(--line);border-radius:4px;color:var(--ink);text-decoration:none;font-size:13px}
#drawer a.ref:hover{background:var(--sel-bg);border-color:var(--sel)}
#drawer a.ref .v{color:var(--ink2);margin-left:5px}
#drawer .big{font-size:30px;font-weight:700;font-stretch:80%;margin:0 0 6px}
#drawer ol.steps{list-style:none;margin:0 0 10px;padding:0}
#drawer ol.steps li{margin:0}
#drawer ol.steps a{display:flex;gap:8px;padding:4px 6px;border-radius:5px;text-decoration:none;color:var(--ink);font-family:var(--text);font-stretch:100%;font-size:13px;line-height:1.3}
#drawer ol.steps a .o{flex:none;width:18px;height:18px;border-radius:9px;border:1.3px solid var(--ink2);font-size:11px;text-align:center;line-height:16px;font-family:var(--sign)}
#drawer ol.steps a.cur{background:var(--sel-bg)}
#drawer ol.steps a.cur .o{background:var(--sel);border-color:var(--sel);color:#fff}
#drawer ol.steps a.past .o{background:var(--ink2);color:#fff}
#drawer .nav{display:flex;gap:8px;margin:0 0 10px}
#drawer .nav a{flex:1;text-align:center;padding:6px 0 4px;border:1.5px solid var(--ink);border-radius:6px;text-decoration:none;color:var(--ink);font-size:14px}
#drawer .nav a.off{opacity:.3;pointer-events:none}
#drawer .card{border:1.3px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
#drawer .card .t{font-size:15px;font-weight:700;margin-bottom:3px}
#drawer .card p{margin-bottom:6px;font-size:13px}

#tip{display:none;max-width:290px;background:var(--ink);color:#fff;padding:7px 10px;border-radius:6px;font-family:var(--text);font-stretch:100%;font-size:12.5px;line-height:1.35;z-index:40;pointer-events:none}
#tip b{font-family:var(--sign);font-stretch:87%;font-size:13.5px;display:block;margin-bottom:2px}
@media (prefers-reduced-motion:no-preference){.el,#wires line{transition:opacity .15s}}
</style>
</head>

<div id="stage">

function parse(){
  var p=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
  var s={lens:'flow',type:null,id:null,step:0};
  if(p[0]&&LENSES.some(function(l){return l[0]===p[0];}))s.lens=p.shift();
  if(p[0]==='el'&&thing(p[1])){s.type='el';s.id=p[1];}
  else if(p[0]==='story'){var r=DATA.routes.filter(function(r){return r.id===p[1];})[0];if(r){s.type='story';s.id=r.id;s.step=Math.max(1,Math.min(r.steps.length,parseInt(p[2]||'1',10)||1));}}
  else if(p[0]==='level'&&PROOF[p[1]]){s.type='level';s.id=p[1];s.lens='proof';}
  if(s.type==='el'&&EL[s.id]){if(EL[s.id].kind==='dial')s.lens='dials';if(EL[s.id].kind==='rule')s.lens='rules';}
  return s;
}

function detail(id,compact){

  s+='<div class="kind">'+esc(KINDNAME[e.kind]||e.kind)+(e.n&&e.kind==='beat'?' '+e.n+' of 12':'')+(e.kind==='milestone'?' '+e.n+' of 10':'')+'</div>';

  else{s+='<div class="badges"><span class="badge">'+esc(name(e.from))+' → '+esc(name(e.to))+'</span>'+(e.drawn===false?'<span class="badge b-planned">not drawn on the picture</span>':'')+'</div>';}
  if(e.kind==='dial')s+='<div class="big">'+esc(e.value)+'</div>';
  s+='<p>'+esc(e.summary)+'</p>';

    s+='<h3>Jobs done in this mode</h3>'+DATA.elements.filter(function(j){return j.in===id;}).map(function(j){return ref(j.id);}).join('');
    s+='<h3>Leaves this mode when</h3>'+DATA.links.filter(function(l){return (l.from===id&&l.to!==id)||(l.from==='any'&&l.to!==id);}).map(function(l){return ref(l.id,l.label+' → '+name(l.to));}).join('');
    s+='<h3>Each tick, in this mode</h3>'+e.beats.map(function(b){return ref(b,EL[b].n+'. '+EL[b].name);}).join('');
  }

  s+='<h3>'+(e.kind==='dial'?'Change it here':'Where the code is')+'</h3>'+codeList(e.code);

  if(st.type==='el'){

    else if(e.kind==='rule'){e.pins.forEach(function(p){keep[p]='rel';});focus=true;}
    else if(e.kind==='dial'){keep[e.on]='rel';}

    else if(e.kind==='outcome'){DATA.links.forEach(function(l){if(l.carries&&l.carries.indexOf(st.id)>=0)wire(l.id,'sel');});}

    var r=DATA.routes.filter(function(r){return r.id===st.id;})[0];focus=true;
    r.steps.forEach(function(x,i){if(i<st.step){keep[x[0]]=(i===st.step-1)?'cur':(keep[x[0]]==='cur'?'cur':'onroute');
      nodes(x[0]).forEach(function(n){var o=n.querySelector(':scope > .ord');if(o){var prev=(n._ord||[]);if(prev.indexOf(i+1)<0)prev.push(i+1);n._ord=prev;}});
      if(LK[x[0]])wire(x[0],'sel');}});
    selId=r.steps[st.step-1][0];mode=modeOf(selId);if(!mode&&LK[selId]&&EL[LK[selId].from]&&EL[LK[selId].from].kind==='mode')mode=LK[selId].from;
    dbody.innerHTML=storyPanel(r,st.step);
    keep['story:'+r.id]='sel';
  } else if(st.type==='level'){
    focus=true;DATA.elements.forEach(function(e){if(e.proof===st.id&&e.kind!=='dial')keep[e.id]='rel';});
  }
  /* order badges for stories */
  all.forEach(function(n){var o=n.querySelector(':scope > .ord');if(o){o.textContent=(st.type==='story'&&n._ord)?n._ord.join(' '):'';}n._ord=null;});
  all.forEach(function(n){
    var id=n.dataset.id||n.dataset.row, k=keep[id];
    if(n.dataset.row){ if((st.type==='story'&&n.dataset.row==='story:'+st.id)||(st.type==='level'&&n.dataset.row==='level:'+st.id)||(st.type==='el'&&n.dataset.row==='el:'+st.id))n.classList.add('sel'); return; }
    if(k==='sel')n.classList.add('sel'); else if(k==='rel')n.classList.add('rel'); else if(k==='cur')n.classList.add('cur'); else if(k==='onroute')n.classList.add('onroute');
    else if(focus&&!n.classList.contains('chip')&&!(n.classList.contains('k-beat')&&(st.type==='story'||LK[st.id])))n.classList.add('dim');
  });
  if(focus)Array.prototype.forEach.call(svg.querySelectorAll('line:not(.hit)'),function(l){if(!/sel/.test(l.getAttribute('class'))&&!keep[l.dataset.wire])l.setAttribute('class',l.getAttribute('class')+' dim');});
  /* tick strip follows the mode in focus */
  if(mode){var bs=EL[mode].beats;nodes(mode);DATA.elements.forEach(function(b){if(b.kind!=='beat')return;nodes(b.id).forEach(function(n){n.classList.remove('dim');if(bs.indexOf(b.id)>=0)n.classList.add('lit');else if(!keep[b.id])n.classList.add('off');});});}
  /* drawer side */
  if(st.type==='el'||st.type==='story'){
    var n0=nodes(selId)[0];
    if(n0){var r0=n0.getBoundingClientRect(), s0=stage.getBoundingClientRect();var cx=(r0.left+r0.width/2-s0.left)/(s0.width/1440);side=cx>1124?'left':'right';}
    drawer.className='open '+side;dbody.scrollTop=0;
  } else drawer.className='';
  tip.style.display='none';
}

/* ---------- events ---------- */
stage.addEventListener('click',function(ev){
  if(ev.target.closest('#drawer')){if(ev.target.closest('.x')){ev.preventDefault();location.hash=href(st.lens);}return;}
  var a=ev.target.closest('a');if(a)return;
  var n=ev.target.closest('[data-id]');
  if(n){ev.preventDefault();var id=n.dataset.id;if(st.type==='el'&&st.id===id)location.hash=href(st.lens);else go('el',id);return;}
  if(st.type)location.hash=href(st.lens);
});
svg.addEventListener('click',function(ev){var n=ev.target.closest('[data-id]');if(n){ev.stopPropagation();go('el',n.dataset.id);}});
document.addEventListener('keydown',function(ev){
  if(ev.key==='Escape'&&st.type)location.hash=href(st.lens);
  if(st.type==='story'){var r=DATA.routes.filter(function(r){return r.id===st.id;})[0];
    if(ev.key==='ArrowRight'&&st.step<r.steps.length)go('story',st.id,st.step+1);
    if(ev.key==='ArrowLeft'&&st.step>1)go('story',st.id,st.step-1);}
  if((ev.key==='Enter'||ev.key===' ')&&document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.id){ev.preventDefault();go('el',document.activeElement.dataset.id);}
});
stage.addEventListener('mouseover',function(ev){
  var n=ev.target.closest('[data-id]');if(!n||ev.target.closest('#drawer')){tip.style.display='none';return;}
  var e=thing(n.dataset.id);if(!e)return;
  tip.innerHTML='<b>'+esc(e.name||e.label)+(e.value?' · '+esc(e.value):'')+'</b>'+esc(e.summary);
  tip.style.display='block';
  var s0=stage.getBoundingClientRect(),k=s0.width/1440,r=n.getBoundingClientRect();
  var x=(r.left-s0.left)/k,y=(r.bottom-s0.top)/k+6;
  if(x+300>1436)x=1436-300;if(y+90>896)y=(r.top-s0.top)/k-tip.offsetHeight-6;
  tip.style.left=Math.max(4,x)+'px';tip.style.top=y+'px';
});
stage.addEventListener('mouseleave',function(){tip.style.display='none';});
function fit(){var s=Math.min(window.innerWidth/1440,window.innerHeight/900);stage.style.transform='scale('+s+')';stage.style.left=Math.max(0,(window.innerWidth-1440*s)/2)+'px';stage.style.top=Math.max(0,(window.innerHeight-900*s)/2)+'px';}
window.addEventListener('resize',fit);window.addEventListener('hashchange',apply);
fit();apply();
})();
</script>
</body>
