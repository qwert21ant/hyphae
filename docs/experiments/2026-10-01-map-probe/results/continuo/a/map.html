<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Continuo — factory floor</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --floor:#D8DDD7; --area:#E9ECE7; --area-line:#B4BDB6; --tile:#FCFDFB;
  --ink:#152025; --ink2:#4E5E66; --ink3:#89959A; --belt:#33434A;
  --accent:#1340D8; --accent-bg:#DCE4FC; --ok:#16804D; --part:#C27803; --plan:#89959A;
  --rail:#F1F3EF; --bar:#152025; --paper:#FCFDFB;
  --font:Bahnschrift,"DIN Alternate","DIN 2014","Segoe UI",system-ui,sans-serif;
  --mono:Consolas,"Cascadia Mono","SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.35 var(--font);color:var(--ink);background:var(--floor);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── top bar ── */
.bar{height:46px;background:var(--bar);color:#EEF1EC;display:flex;align-items:center;gap:22px;padding:0 16px}
.bar h1{font-size:19px;font-weight:700;letter-spacing:.01em;margin:0;white-space:nowrap}
.bar .sub{color:#A9B5B0;font-size:13px;white-space:nowrap}
.seg{display:flex;border:1px solid #5A6A70;border-radius:4px;overflow:hidden;margin-left:auto}
.seg button{padding:5px 12px;color:#C9D2CE;font-size:12.5px}
.seg button+button{border-left:1px solid #5A6A70}
.seg button[aria-pressed=true]{background:#EEF1EC;color:var(--ink);font-weight:700}
.bar .commit{font-size:12px;color:#A9B5B0;white-space:nowrap}
.bar .commit b{color:#EEF1EC;font-weight:600}

/* ── layout ── */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);height:calc(100% - 46px);position:relative;overflow:hidden}
main{display:grid;grid-template-rows:minmax(0,1fr) 250px;min-width:0;position:relative}

/* ── use-case board ── */
.board{background:var(--rail);border-right:1px solid var(--area-line);display:flex;flex-direction:column;min-height:0}
.board h2,.things h2{font-size:12px;font-weight:700;margin:0;color:var(--ink2)}
.board .head{padding:10px 12px 4px}
.board .list{overflow-y:auto;flex:1;min-height:0;padding:0 6px 8px}
.grp{font-size:11.5px;color:var(--ink2);padding:9px 6px 3px;display:flex;align-items:center;gap:6px}
.grp .n{color:var(--ink3)}
.uc{display:flex;align-items:center;gap:7px;width:100%;padding:4px 6px;border-radius:4px;font-size:13px;line-height:1.2;border-left:3px solid transparent}
.uc:hover{background:#E4E8E2}
.uc .kc{margin-left:auto;font:600 10.5px var(--mono);border:1px solid var(--ink3);border-bottom-width:2px;border-radius:3px;padding:0 4px;color:var(--ink2);background:#fff}
.uc.sel{background:var(--accent);color:#fff}
.uc.sel .kc{background:transparent;color:#fff;border-color:#fff}
.uc.sel .lamp{box-shadow:0 0 0 2px #fff}
.uc.via{border-left-color:var(--accent);background:var(--accent-bg)}
.board.filtering .uc:not(.via):not(.sel){opacity:.42}
.steps{margin:2px 0 8px 9px;padding:0 0 0 0;list-style:none;border-left:2px solid var(--accent)}
.steps li button{display:grid;grid-template-columns:22px 1fr;gap:4px;width:100%;padding:3px 4px 3px 6px;font-size:12px;line-height:1.3;color:var(--ink2);border-radius:0 4px 4px 0}
.steps li button:hover{background:#E4E8E2}
.steps li button .i{font-weight:700;color:var(--accent);text-align:right}
.steps li button.cur{background:var(--accent-bg);color:var(--ink)}
.steps .sum{font-size:12px;color:var(--ink);padding:5px 6px 5px 8px;line-height:1.35}
.steps .why{font-size:11.5px;color:var(--ink2);padding:0 6px 5px 8px;line-height:1.35}
.legend{border-top:1px solid var(--area-line);padding:8px 12px 10px;font-size:11.5px;color:var(--ink2);display:grid;grid-template-columns:1fr 1fr;gap:5px 10px}
.legend span{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{flex:none;display:inline-block}
.lg-m{width:18px;height:11px;border:1.5px solid var(--ink);border-radius:2px;background:var(--tile)}
.lg-pv{width:16px;height:10px;border:1.5px solid var(--ink);border-radius:2px;background:var(--tile);box-shadow:3px 3px 0 -1.5px var(--tile),3px 3px 0 0 var(--ink);margin-right:3px}
.lg-t{width:18px;height:10px;border:1.2px solid var(--ink2);border-radius:6px;background:#fff}
.lg-e{width:18px;height:11px;border-radius:2px;background:var(--ink)}
.lg-b{width:18px;height:0;border-top:2px solid var(--belt);position:relative}
.lg-b:after{content:"";position:absolute;right:-1px;top:-5px;border:4px solid transparent;border-left:6px solid var(--belt);border-right:0}
.lg-p{width:18px;height:11px;border:1.5px dashed var(--ink3);border-radius:2px}
.lg-c{width:18px;height:0;border-top:2px dotted var(--ink2)}
.gapbtn{font-size:12.5px;color:#EEF1EC;border:1px solid #5A6A70;border-radius:4px;padding:5px 10px;white-space:nowrap}
.gapbtn:hover{background:#2B3A40}
.gapbtn b{color:#F0B454;font-weight:700;margin-right:5px}

/* status lamp: colour and form both carry it */
.lamp{flex:none;display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--ok);background:var(--ok)}
.lamp.partial{border-color:var(--part);background:linear-gradient(90deg,var(--part) 50%,transparent 50%)}
.lamp.planned{border:1.5px dashed var(--plan);background:transparent}
.lamp.unknown{border-color:var(--ink3);background:transparent}

/* ── floor ── */
.floorwrap{position:relative;overflow:hidden;min-height:0}
.stage{position:absolute;left:0;top:0;width:1176px;height:600px;transform-origin:0 0;transition:transform .45s cubic-bezier(.3,.7,.2,1);--k:1}
.stage svg{position:absolute;left:0;top:0;width:1176px;height:600px;overflow:visible;pointer-events:none}
.district{position:absolute;background:var(--area);border:1px solid var(--area-line);border-radius:6px}
.district.planned{background:transparent;border-style:dashed}
.dn{position:absolute;font-weight:700;font-size:12px;line-height:1.25;color:var(--ink2);padding:1px 4px;border-radius:3px;white-space:nowrap;display:flex;align-items:baseline;gap:7px;background:var(--area)}
.dn small{font-weight:400;font-size:10.5px;color:var(--ink3)}
.dn:hover{color:var(--accent)}
.zm .dn.narrow small{display:none}
.zd .district{cursor:pointer}
.zd .district:hover{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.zd .dn{font-size:15.5px;color:var(--ink);pointer-events:none;gap:9px;background:transparent;margin:2px 0 0 3px}
.zd .dn small{font-size:11px;color:var(--ink2)}
.zd .dn.narrow{flex-direction:column;gap:0}

.tile{position:absolute;background:var(--tile);border:1.5px solid var(--ink);border-radius:3px;font-weight:600;font-size:11.5px;line-height:1.15;padding:0 15px 0 7px;display:flex;align-items:center;overflow:hidden;font-stretch:92%}
.tile .lamp{position:absolute;right:4px;top:4px;width:8px;height:8px}
.tile.pv{box-shadow:3px 3px 0 -1.5px var(--tile),3px 3px 0 0 var(--ink);overflow:visible}
.tile.planned{border-style:dashed;border-color:var(--ink3);background:transparent;color:var(--ink2);font-weight:500}
.tile:hover{border-color:var(--accent)}
.tile .subs{display:none}
.zd .tile{pointer-events:none;color:transparent;border-color:var(--area-line);background:#F3F5F1;box-shadow:none;border-width:1px}
.zd .tile.pv{box-shadow:3px 3px 0 -1px #F3F5F1,3px 3px 0 0 var(--area-line)}
.zd .tile .lamp{opacity:.9}
.zd .tile.planned{background:transparent}
.dock{position:absolute;background:var(--ink);color:#EEF1EC;border-radius:4px;font-weight:600;font-size:11.5px;line-height:1.15;padding:0 8px;display:flex;flex-direction:column;justify-content:center;font-stretch:92%}
.dock small{font-weight:400;font-size:10px;color:#A9B5B0;margin-top:3px}
.dock:hover{background:#2B3A40}
.dock .pl{align-self:flex-start;background:#fff;color:var(--ink);border-radius:8px;font-weight:400;font-size:10px;line-height:1;padding:2px 6px 3px;margin-top:4px;white-space:nowrap}
.zf .dock .pl{font-size:calc(10px/var(--k));padding:calc(2px/var(--k)) calc(6px/var(--k)) calc(3px/var(--k));border-radius:calc(8px/var(--k));margin-top:calc(4px/var(--k))}
.cargo.indock:not(.numbered),.cargo.chk{display:none!important}

/* focus on one district: detail drawn at constant on-screen size */
.zf .tile{align-items:flex-start;flex-direction:column;justify-content:flex-start;padding:calc(6px/var(--k)) calc(16px/var(--k)) 0 calc(9px/var(--k));border:0;box-shadow:0 0 0 calc(1.5px/var(--k)) var(--ink);font-size:min(11.5px,calc(14px/var(--k)));border-radius:calc(3px/var(--k))}
.zf .tile.pv{box-shadow:0 0 0 calc(1.5px/var(--k)) var(--ink),calc(4px/var(--k)) calc(4px/var(--k)) 0 0 var(--tile),calc(4px/var(--k)) calc(4px/var(--k)) 0 calc(1.5px/var(--k)) var(--ink)}
.zf .tile.planned{box-shadow:0 0 0 calc(1px/var(--k)) var(--ink3)}
.zf .tile:hover{box-shadow:0 0 0 calc(2px/var(--k)) var(--accent)}
.zf .tile .lamp{width:calc(9px/var(--k));height:calc(9px/var(--k));right:calc(6px/var(--k));top:calc(6px/var(--k));border-width:0}
.zf .tile .lamp.planned{box-shadow:0 0 0 calc(1px/var(--k)) var(--plan)}
.zf .tile.infocus .subs{display:block;margin-top:calc(4px/var(--k));font-weight:400;font-size:calc(11.5px/var(--k));line-height:calc(14px/var(--k));color:var(--ink2);white-space:nowrap}
.zf .tile .subs div:before{content:"";display:inline-block;width:calc(4px/var(--k));height:calc(4px/var(--k));border-radius:50%;background:var(--ink3);margin-right:calc(6px/var(--k));vertical-align:calc(2px/var(--k))}
.zf .tile .subs div.partial:before{background:var(--part)}
.zf .district{border:0;box-shadow:0 0 0 calc(1px/var(--k)) var(--area-line);border-radius:calc(6px/var(--k))}
.zf .district.planned{box-shadow:0 0 0 calc(1px/var(--k)) var(--ink3)}
.zf .district.focused{box-shadow:0 0 0 calc(2px/var(--k)) var(--ink)}
.zf .dn{font-size:calc(13px/var(--k));padding:calc(1px/var(--k)) calc(4px/var(--k));gap:calc(7px/var(--k))}
.zf .dn small{font-size:calc(11px/var(--k))}
.zf .dock{font-size:calc(11.5px/var(--k))}
.zf .dock small{font-size:calc(10px/var(--k))}

/* belts */
.belt{fill:none;stroke:var(--belt);stroke-width:1.4;marker-end:url(#ah);opacity:.75}
.belt.main{stroke-width:2.4;opacity:.9}
.belt.planned{stroke:var(--ink3);stroke-dasharray:4 3;marker-end:url(#ah-p)}
.belt.checks{stroke:var(--ink2);stroke-dasharray:1.5 3;marker-end:url(#ah)}
.hit{fill:none;stroke:transparent;stroke-width:9;pointer-events:stroke;cursor:pointer}
.zf .belt{stroke-width:calc(1.5px/var(--k))}
.zd .l-m,.zd .hit.l-m{display:none}
.zm .l-d,.zf .l-d,.zm .hit.l-d,.zf .hit.l-d{display:none}
.belt.checks{display:none}
.belt.checks.on{display:inline}
.belt.on{stroke:var(--accent);opacity:1;stroke-width:2.2;marker-end:url(#ah-on)}
.belt.main.on{stroke-width:3}
.zf .belt.on{stroke-width:calc(2.4px/var(--k))}
.routing .belt.on{stroke-dasharray:7 4;animation:march .7s linear infinite}
.belt.cur{stroke-width:3.4;stroke-dasharray:none!important;animation:none!important}
@keyframes march{to{stroke-dashoffset:-11}}
@media (prefers-reduced-motion:reduce){.routing .belt.on{animation:none}.stage{transition:none}}

/* cargo labels are pill-shaped, like the things they name */
.cargo{position:absolute;transform:translate(-50%,-50%);background:#fff;border:1px solid var(--ink2);border-radius:9px;font-size:10.5px;line-height:1;padding:2.5px 7px 3px;white-space:nowrap;color:var(--ink);pointer-events:none;display:none;font-stretch:92%;z-index:4}
.cargo .no{display:none;font-weight:700;color:var(--accent);margin-right:4px}
.cargo.lft{transform:translate(-100%,-50%);margin-left:-4px}
.cargo.rgt{transform:translate(0,-50%);margin-left:4px}
.zf .cargo.lft{margin-left:calc(-5px/var(--k))}
.zf .cargo.rgt{margin-left:calc(5px/var(--k))}
.zd .cargo.l-d{display:block}
.cargo.planned{border-style:dashed;color:var(--ink2)}
.cargo.on{display:block;border-color:var(--accent);color:var(--accent);background:var(--accent-bg);z-index:6}
.zd .cargo.l-m,.zm .cargo.l-d,.zf .cargo.l-d{display:none!important}
.zf .cargo.l-m.near{display:block}
.zf .cargo{font-size:calc(11px/var(--k));padding:calc(3px/var(--k)) calc(7px/var(--k)) calc(4px/var(--k));border:0;box-shadow:0 0 0 calc(1px/var(--k)) var(--ink2);border-radius:calc(9px/var(--k))}
.zf .cargo.on{box-shadow:0 0 0 calc(1px/var(--k)) var(--accent)}
.routing .cargo.on{display:none}
.routing .cargo.on.numbered{display:block;padding:2px 5px}
.routing .cargo.on.numbered .no{display:inline;margin:0}
.routing .cargo.on.numbered .tx{display:none}
.routing.zd .cargo.on.numbered .tx,.routing .cargo.on.numbered.cur .tx,.routing .cargo.on.numbered.hov .tx{display:inline;margin-left:4px}
.routing.zd .cargo.indock.on.numbered .tx{display:none}
.routing .cargo.near:not(.on){display:none!important}
.routing.zf .cargo.on.numbered{padding:calc(2px/var(--k)) calc(6px/var(--k)) calc(3px/var(--k))}
.zf .tile .lamp.partial{box-shadow:0 0 0 calc(1.2px/var(--k)) var(--part)}
.cargo.hov{display:block!important;z-index:9}
.cargo.cur{background:var(--accent);color:#fff;z-index:8}
.cargo.cur .no{color:#fff}

/* lit and dimmed */
.dim .tile:not(.on),.dim .dock:not(.on){opacity:.3}
.dim .belt:not(.on){opacity:.13}
.dim.zd .district:not(.on){opacity:.45}
.dim.zd .dn:not(.on){opacity:.45}
.dim.zd .cargo.l-d:not(.on){opacity:.3}
.tile.on,.dock.on{opacity:1}
.zd .district.on{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.tile.sel,.dock.sel{outline:3px solid var(--accent);outline-offset:1px;z-index:3}
.zf .tile.sel{outline-width:calc(3px/var(--k));outline-offset:calc(1px/var(--k))}
.tile.cur{background:var(--accent-bg)}
.back{position:absolute;left:10px;top:10px;z-index:20;background:var(--ink);color:#fff;border-radius:4px;padding:5px 10px;font-size:12.5px;display:none}
.zf-on .back{display:block}
.dinfo{position:absolute;left:196px;right:10px;top:10px;z-index:20;background:rgba(252,253,251,.94);border:1px solid var(--area-line);border-radius:4px;padding:6px 10px;font-size:12.5px;display:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dinfo code{font:11.5px var(--mono);color:var(--ink2);margin-left:10px}
.zf-on .dinfo{display:block}

/* ── things ── */
.things{background:var(--rail);border-top:1px solid var(--area-line);position:relative;padding:7px 12px 6px;min-width:0}
.things h2{margin-bottom:3px}
.things h2 span{font-weight:400;color:var(--ink3);margin-left:8px}
.tgrid{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:repeat(4,53px);grid-auto-flow:column;column-gap:10px}
.tcell{position:relative;min-width:0;padding-top:3px}
.thing{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.2px solid var(--ink2);border-radius:12px;padding:2px 10px 3px;font-weight:600;font-size:12px;white-space:nowrap;position:relative;z-index:2}
.thing:hover{border-color:var(--accent)}
.thing .lamp{width:7px;height:7px}
.tsub{font-size:10.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:3px 0 0 4px;position:relative;z-index:2}
.tsub .st{display:inline-block;border:1px solid var(--area-line);border-radius:2px;padding:0 4px;background:var(--rail);line-height:14px}
.tsub .ar{color:var(--ink3);margin:0 2px}
.tsub.f{color:var(--ink3)}
.things svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:1}
.rel{fill:none;stroke:var(--ink3);stroke-width:1;opacity:.4;marker-end:url(#rh)}
.rel.on{stroke:var(--accent);opacity:1;stroke-width:1.6;marker-end:url(#rh-on)}
.things.dim .tcell:not(.on){opacity:.35}
.things.dim .rel:not(.on){opacity:.12}
.tcell.sel .thing{background:var(--accent);border-color:var(--accent);color:#fff}
.tcell.on .thing{border-color:var(--accent)}
.rlab{position:absolute;transform:translate(-50%,-50%);font-size:10px;background:var(--accent-bg);color:var(--accent);padding:0 4px;border-radius:2px;z-index:3;white-space:nowrap;pointer-events:none}

/* ── drawer ── */
.drawer{position:absolute;right:0;top:0;bottom:0;width:372px;background:var(--paper);border-left:1.5px solid var(--ink);box-shadow:-10px 0 24px rgba(21,32,37,.14);z-index:30;overflow-y:auto;padding:14px 16px 24px;transform:translateX(102%);transition:transform .25s ease-out}
.drawer.open{transform:none}
.drawer .x{position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:4px;text-align:center;font-size:18px;line-height:24px;color:var(--ink2)}
.drawer .x:hover{background:var(--area)}
.drawer .kind{font-size:11.5px;color:var(--ink2);display:flex;align-items:center;gap:8px;margin-right:30px}
.drawer h3{font-size:21px;line-height:1.15;margin:4px 30px 6px 0;font-weight:700}
.drawer p{margin:0 0 8px;font-size:13.5px;line-height:1.4}
.drawer .st{display:flex;gap:7px;align-items:baseline;font-size:12.5px;color:var(--ink2);margin-bottom:8px}
.drawer .st .lamp{align-self:center}
.drawer .st b{color:var(--ink)}
.drawer h4{font-size:11.5px;font-weight:700;color:var(--ink2);margin:14px 0 4px;border-top:1px solid var(--area-line);padding-top:8px}
.drawer ul{margin:0;padding:0;list-style:none}
.drawer li{font-size:12.5px;line-height:1.4;padding:2px 0 2px 14px;position:relative}
.drawer li:before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;background:var(--ink2)}
.drawer ul.gaps li:before{background:var(--part);border-radius:50%}
.drawer ul.plain li{padding-left:0}.drawer ul.plain li:before{display:none}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--ink2);border-radius:3px;padding:1px 7px 2px;font-size:12px;background:#fff}
.chip.t{border-radius:10px}
.chip.partial{border-color:var(--part)}
button.chip:hover{border-color:var(--accent);color:var(--accent)}
.io{display:grid;grid-template-columns:auto 1fr;gap:3px 8px;align-items:baseline;font-size:12.5px}
.io .c{border:1px solid var(--ink2);border-radius:9px;padding:0 7px 1px;font-size:11.5px;white-space:nowrap;background:#fff;justify-self:start}
.io button:hover{color:var(--accent);text-decoration:underline}
.knob{font-size:12.5px;line-height:1.35;padding:3px 0}
.knob b{font:600 11.5px var(--mono)}
.knob .v{font-weight:700;margin-left:5px}
.knob code,.code li{font:11px/1.45 var(--mono);color:var(--ink2);word-break:break-all}
.knob code{display:block}
.code li{padding-left:0}.code li:before{display:none}

.boot *{transition:none!important}
/* hover card */
.pop{position:fixed;z-index:50;max-width:290px;background:var(--ink);color:#EEF1EC;border-radius:5px;padding:7px 10px 8px;font-size:12.5px;line-height:1.35;pointer-events:none;display:none}
.pop b{display:block;font-size:13px;margin-bottom:2px;color:#fff}
.pop i{font-style:normal;color:#A9B5B0;font-size:11.5px;display:block;margin-top:3px}
</style>
</head>
<body>
<header class="bar">
  <h1>Continuo</h1>
  <span class="sub" id="sub"></span>
  <div class="seg" role="group" aria-label="Zoom level">
    <button id="zD" data-z="districts">Districts</button>
    <button id="zM" data-z="machines">Machines</button>
  </div>
  <button class="gapbtn" data-sel="gaps" id="gapbtn"></button>
  <span class="commit" id="commit"></span>
</header>
<div class="app" id="app">
  <aside class="board" id="board" aria-label="Use-case board">
    <div class="head"><h2>Use cases</h2></div>

d block","status":"partial","summary":"Press K and the bot plans a route to the marked block and walks it, turning gradually, until it stands on it.","key":"K","statusWhy":"Built and unit-tested without the game. The repository's own checklist says the in-game steps for the walker have never been run, and its seven tuning numbers are still estimates.","steps":["b.keys","b.tickclick","b.walkorder","b.order","b.posexec","b.ask","b.segask","b.stateid","b.raw","b.classified","b.blocks","b.terrain","b.standq","b.offers","b.leg","b.route","b.keysout","b.facing","b.keysfinal","b.held","b.why","b.loglines"],"stepNotes":["The owner presses K.","The click rides in with the next tick.","The marked goal becomes a walk order.","The walker drops whatever it was doing and takes the destination.","It reads where the player is standing.","It asks for a route from there to the goal, with no gap jumps.","A search leg starts; 2,000 positions are explored per tick.","Blocks around the search are read from the game.","A kind of block seen for the first time is described in full.","It is classified once and remembered.","Each position read is copied, so it is read only once.","The search reads terrain from that copy.","Each candidate spot is judged: passable, a floor, standable.","Reachable neighbours come back with a cost in ticks.","The leg ends: found, partial, no path or over budget.","The route comes back as positions and steps.","Every tick: forward held, jump on a step up, facing the next block.","The current facing is read.","The turn is limited to 30 degrees per tick.","The game's own keys are held; the player walks.","Within half a block of the goal: 'arrived', all keys released.","The line appears in the game log."]},{"id":"uc.longwalk","name":"Plan ahead on long walks","status":"partial","summary":"When fewer than 20 steps of route remain and the goal is further, the next stretch is searched while the player keeps walking.","key":null,"statusWhy":"Unit-tested; the 100-block in l remembered block kinds are forgotten.","The marked goal is cleared too.","'stopping: client level changed' is logged.","The line appears in the game log."]},{"id":"uc.fault","name":"Survive a bot crash","status":"works","summary":"If the bot throws an error, the game carries on: the bot is stopped, its keys released, and it stays silent until the next world load.","key":null,"statusWhy":"Asserted by the conformance suite. Never exercised in a real game, by design: it would need a deliberate crash.","steps":["m.core","m.gate","b.notices","b.safetick","b.loglines","b.gameticks"],"stepNotes":["Something inside the bot throws.","The gate catches it; the game's tick loop never sees it.","The error is logged with its stack trace.","The bot is ordered to stop, releasing keys.","The line appears in the game log.","No more ticks are delivered until a world loads, which clears the fault."]},{"id":"uc.probe","name":"Preview a route","status":"works","summary":"Press L to search from where you stand to the marked goal without walking; you get a summary line and a text map of the route.","key":"L","statusWhy":"Run in a live client on 2026-08-31, and in both game versions on 2026-09-02.","steps":["b.keys","b.probeclick","b.goalprobe","b.posprobe","b.face","b.probeask","b.segask","b.terrain","b.offers","b.leg","b.proberes","b.sealed","b.drawblocks","b.mapfile","b.summary","b.loglines"],"stepNotes":["The owner presses L.","The click is collected at the end of the tick.","The marked goal is taken; without one the probe says so and stops.","The start is the player's feet position.","The player is turned to face the goal.","A search starts, with the gap jump allowed.","It advances one slice per tick.","Terrain is read through a copy.","Moves are offered and priced.","The search ends.","The route and every visited position come back.","The search is replayed twice on the frozen copy, to time it.","The area around the route is read for drawing.","continuo-path-probe.txt is written."," ker.","steps":["b.plugins","m.moves","b.probeask","b.offers","b.proberes","m.exec"],"stepNotes":["The jar is found on the classpath at start.","It is registered after the four built-in moves.","A preview grants the 'parkour' permission.","Gap jumps are offered alongside the other moves.","A previewed route may contain gap jumps.","The walker grants no permission, and stops if it ever meets such a step."]},{"id":"uc.guard","name":"Keep game code out of the core","status":"works","summary":"Any change that makes the shared core mention Minecraft, need newer Java, or depend the wrong way fails the build.","key":null,"statusWhy":"Wired into the build's 'check' step and into CI.","steps":["b.code","m.ci","b.classes","m.purity","b.v.pur"],"stepNotes":["A change is pushed.","The full build runs.","The compiled classes are scanned.","Three checks: no game references, Java 8 bytecode, allowed dependencies only.","Any violation fails the build."]},{"id":"uc.goto","name":"Go to coordinates by command","status":"planned","summary":"Planned: type a destination instead of walking there to mark it; several goals compete by priority.","key":null,"statusWhy":"Named as part D3 of milestone M5; no code exists.","steps":["m.goto","p.goals","m.core"],"stepNotes":["A goal is named by command.","The highest-priority goal is handed over.","The existing walker takes it from there."]},{"id":"uc.browser","name":"Drive the bot from a browser","status":"planned","summary":"Planned: a web page sets goals and settings and shows the route and the search live.","key":null,"statusWhy":"Milestones M6 and M7; no code exists.","steps":["m.webui","p.ui","m.bridge","p.cmd","m.goto"],"stepNotes":["The owner acts in a web page.","Commands travel over a local connection.","The bridge checks the token and accepts them.","A command becomes a goal.","The goal manager takes it."]},{"id":"uc.scripts","name":"Mine a vein, build a schematic","status":"planned","summary":"Planned: scripts that string goals and actions together.","key":null,"statusWhy":"Milestone M8; no code exists. The bot cannot break or place blocks today.","steps":["m.scripts","p.script","m.goto"],"stepNotes":["A script decides the next goal.","It hands the goal over.","The goal manager runs it."]},{"id":"uc.elytra","name":"Fly with elytra","status":"planned","summary":"Planned: new movement kinds that need more than a block position to describe.","key":null,"statusWhy":"Milestone M10; no code exists.","steps":["m.elytra","p.elytra","m.moves"],"stepNotes":["A new move type is written.","It plugs into the move offers.","It is used only where the game supports it."]},{"id":"uc.versions","name":"Add another game version","status":"planned","summary":"Planned: a third and fourth adapter, each touching only the per-version machines.","key":null,"statusWhy":"Milestone M9; only two adapters exist.","steps":["m.versions","p.versions","m.hear"],"stepNotes":["A new adapter is written.","It implements the same four per-version jobs.","The shared core is not changed."]}]}</script>
<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById('map-data').textContent);
var W = D.floor.w, H = D.floor.h, DRAWER = 372;
var byId = {}, linkById = {}, routeById = {};
D.elements.forEach(function(e){ byId[e.id] = e; });
D.links.forEach(function(l){ linkById[l.id] = l; });
D.routes.forEach(function(r){ routeById[r.id] = r; });
var STATUS = {works:'Works', partial:'Partly there', planned:'Planned', unknown:'Unknown'};
var KIND = {machine:'Machine', district:'District', input:'Input', output:'Output', thing:'Thing'};
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function svg(tag, attrs){ var n = document.createElementNS('http://www.w3.org/2000/svg', tag); for (var k in attrs) n.setAttribute(k, attrs[k]); return n; }
function districtOf(id){ var e = byId[id]; return e.kind === 'machine' ? e.district : id; }
function isFloorLink(l){ return l.kind === 'belt' || l.kind === 'checks' || l.kind === 'main'; }
var mLinks = D.links.filter(function(l){ return l.kind === 'belt' || l.kind === 'checks'; });

$('sub').textContent = D.subtitle;

$('commit').innerHTML = 'read at commit <b>' + esc(D.repo.commit) + '</b>, ' + esc(D.repo.commitDate);

/* ───────── state lives in the hash ───────── */
var state = {};
function parseHash(){
  var s = {z:'districts', d:null, sel:null, route:null, step:null};
  location.hash.replace(/^#/, '').split('&').forEach(function(p){
    var i = p.indexOf('='); if (i < 0) return;
    var k = p.slice(0, i), v = decodeURIComponent(p.slice(i + 1));
    if (k in s && v) s[k] = v;
  });
  if (s.step != null) s.step = parseInt(s.step, 10);
  if (s.z !== 'machines') s.z = 'districts';
  if (s.d && !(byId[s.d] && byId[s.d].kind === 'district')) s.d = null;
  if (s.sel && !(byId[s.sel] || linkById[s.sel] || s.sel === 'gaps')) s.sel = null;
  if (s.route && !routeById[s.route]) { s.route = null; s.step = null; }
  if (!s.route || isNaN(s.step)) s.step = null;
  return s;
}
function go(patch){
  var s = {}; for (var k in state) s[k] = state[k]; for (k in patch) s[k] = patch[k];
  var parts = [];
  if (s.z === 'machines') parts.push('z=machines');
  if (s.d) parts.push('d=' + s.d);
  if (s.route) parts.push('route=' + s.route);
  if (s.route && s.step != null) parts.push('step=' + s.step);
  if (s.sel) parts.push('sel=' + s.sel);
  var h = parts.join('&');
  if (location.hash.replace(/^#/, '') === h) render(); else location.hash = h;
}
window.addEventListener('hashchange', render);

/* ───────── belt geometry: computed once from the stored positions ───────── */
function sideToward(r, p){
  var inX = p[0] >= r.x && p[0] <= r.x + r.w, inY = p[1] >= r.y && p[1] <= r.y + r.h;
  if (inX && !inY) return p[1] < r.y ? 'T' : 'B';
  if (inY && !inX) return p[0] < r.x ? 'L' : 'R';
  var dx = p[0] < r.x ? r.x - p[0] : p[0] - (r.x + r.w), dy = p[1] < r.y ? r.y - p[1] : p[1] - (r.y + r.h);
  return dx >= dy ? (p[0] < r.x ? 'L' : 'R') : (p[1] < r.y ? 'T' : 'B');
}
function layoutBelts(links){
  var ends = [], twins = {};
  links.forEach(function(l){ var k = [l.from, l.to].sort().join('|'); (twins[k] = twins[k] || []).push(l); });
  links.forEach(function(l){
    var A = byId[l.from].pos, B = byId[l.to].pos, sa, sb;
    if (l.via) { sa = sideToward(A, l.via[0]); sb = sideToward(B, l.via[l.via.length - 1]); }
    else if (A.x + A.w <= B.x) { sa = 'R'; sb = 'L'; }
    else if (B.x + B.w <= A.x) { sa = 'L'; sb = 'R'; }
    else if (A.y + A.h <= B.y) { sa = 'B'; sb = 'T'; }
    else { sa = 'T'; sb = 'B'; }
    l._s = sa; l._e = sb;
    [[l.from, A, sa, B, l.via ? l.via[0] : null, 's'], [l.to, B, sb, A, l.via ? l.via[l.via.length - 1] : null, 'e']].forEach(function(q){
      var r = q[1], side = q[2], o = q[3], via = q[4], horiz = side === 'T' || side === 'B';
      var lo = horiz ? r.x : r.y, hi = horiz ? r.x + r.w : r.y + r.h, want, fixed = false;
      if (via) { var v = horiz ? via[0] : via[1]; if (v >= lo && v <= hi) { want = v; fixed = true; } else want = Math.max(lo + 6, Math.min(hi - 6, v)); }
      else {
        var olo = horiz ? o.x : o.y, ohi = horiz ? o.x + o.w : o.y + o.h;
        var a = Math.max(lo, olo), b = Math.min(hi, ohi);
        want = a < b ? (a + b) / 2 : (olo + ohi) / 2;
        want = Math.max(lo + 6, Math.min(hi - 6, want));
      }
      ends.push({key:q[0] + '|' + side, l:l, which:q[5], want:want, fixed:fixed, lo:lo + 5, hi:hi - 5, r:r, side:side});
    });
  });
  var groups = {};
  ends.forEach(function(e){ (groups[e.key] = groups[e.key] || []).push(e); });
  Object.keys(groups).forEach(function(k){
    var g = groups[k].sort(function(a, b){ return a.want - b.want; }), gap = 9, i;
    var span = g[0].hi - g[0].lo; if ((g.length - 1) * gap > span) gap = span / Math.max(1, g.length - 1);
    for (i = 1; i < g.length; i++) if (!g[i].fixed && g[i].want < g[i - 1].want + gap) g[i].want = g[i - 1].want + gap;
    for (i = g.length - 1; i >= 0; i--) {
      if (g[i].fixed) continue;
      var max = i === g.length - 1 ? g[i].hi : g[i + 1].want - gap;
      if (g[i].want > max) g[i].want = max;
    }
    g.forEach(function(e){
      var r = e.r, p = e.side === 'L' ? [r.x, e.want] : e.side === 'R' ? [r.x + r.w, e.want] : e.side === 'T' ? [e.want, r.y] : [e.want, r.y + r.h];
      e.l['_p' + e.which] = p;
    });
  });
  links.forEach(function(l){
    var s = l._ps, e = l._pe, pts = [s], prev = s, dir = (l._s === 'L' || l._s === 'R') ? 'h' : 'v';
    if (l.via) {
      l.via.forEach(function(q){
        if (prev[0] !== q[0] && prev[1] !== q[1]) { pts.push(dir === 'h' ? [q[0], prev[1]] : [prev[0], q[1]]); dir = dir === 'h' ? 'v' : 'h'; }
        else dir = prev[1] === q[1] ? 'h' : 'v';
        pts.push(q); prev = q;
      });

    if (e.kind === 'thing') {
      var rel = rLinks.filter(function(r){ return r.from === id || r.to === id; });
      if (rel.length) h += '<h4>Relations</h4><ul class="plain">' + rel.map(function(r){ return '<li>' + (r.from === id ? esc(e.name) + ' <i>' + esc(r.label) + '</i> ' + chip(r.to, 't') : chip(r.from, 't') + ' <i>' + esc(r.label) + '</i> ' + esc(e.name)) + '</li>'; }).join('') + '</ul>';
      var car = mLinks.filter(function(b){ return b.carries.indexOf(id) >= 0; });
      if (car.length) h += '<h4>Travels on these belts</h4><div class="io">' + car.map(function(b){ return '<span class="c">' + esc(b.label) + '</span><span><button data-sel="' + b.from + '">' + esc(nameOf(b.from)) + '</button> to <button data-sel="' + b.to + '">' + esc(nameOf(b.to)) + '</button></span>'; }).join('') + '</div>';
    } else if (e.kind !== 'district') {
      var ins = mLinks.filter(function(b){ return b.to === id && b.kind === 'belt'; }), outs = mLinks.filter(function(b){ return b.from === id && b.kind === 'belt'; });
      var chk = mLinks.filter(function(b){ return b.kind === 'checks' && (b.from === id || b.to === id); });
      if (ins.length) h += '<h4>Takes in</h4><div class="io">' + ins.map(function(b){ return '<span class="c">' + esc(b.label) + '</span><span>from <button data-sel="' + b.from + '">' + esc(nameOf(b.from)) + '</button>' + (b.status === 'planned' ? ' (planned)' : '') + '</span>'; }).join('') + '</div>';
      if (outs.length) h += '<h4>Puts out</h4><div class="io">' + outs.map(function(b){ return '<span class="c">' + esc(b.label) + '</span><span>to <button data-sel="' + b.to + '">' + esc(nameOf(b.to)) + '</button>' + (b.status === 'planned' ? ' (planned)' : '') + '</span>'; }).join('') + '</div>';
      if (chk.length) h += '<h4>' + (chk[0].from === id ? 'Checks' : 'Checked by') + '</h4><div class="chips">' + chk.map(function(b){ return chip(b.from === id ? b.to : b.from); }).join('') + '</div>';
    }
    if (e.rules) h += '<h4>Must always hold</h4><ul>' + e.rules.map(function(r){ return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>';
    if (e.knobs) h += '<h4>Change it here</h4>' + e.knobs.map(function(k){ return '<div class="knob"><b>' + esc(k.name) + '</b><span class="v">' + esc(k.value) + '</span><br>' + esc(k.effect) + '<code>' + esc(k.file) + '</code></div>'; }).join('');
    if (e.notes) h += '<h4>Known gaps</h4><ul class="gaps">' + e.notes.map(function(r){ return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>';
    var ucs = routesThrough(id);
    if (ucs.length) h += '<h4>Use cases that pass here</h4><div class="chips">' + ucs.map(ucChip).join('') + '</div>';
    h += '<h4>Code</h4><ul class="code">' + e.code.map(function(c){ return '<li>' + esc(c) + '</li>'; }).join('') + '</ul>';
  } else {
    h += '<div class="kind">' + (l.kind === 'relation' ? 'Relation between things' : l.kind === 'main' ? 'Main belt between districts' : 'Belt') + '</div><h3>' + esc(l.label) + '</h3>';
    h += '<div class="st"><i class="lamp ' + l.status + '"></i><b>' + STATUS[l.status] + '</b></div>';
    h += '<p>From ' + chip(l.from) + ' to ' + chip(l.to) + '</p>';
    if (l.carries && l.carries.length) h += '<h4>Carries</h4><div class="chips">' + l.carries.map(function(t){ return chip(t, 't'); }).join('') + '</div>';
    if (l.kind === 'main') {
      var under = mLinks.filter(function(b){ return b.kind === 'belt' && districtOf(b.from) === l.from && districtOf(b.to) === l.to; });
      if (under.length) h += '<h4>Belts inside this one</h4><div class="io">' + under.map(function(b){ return '<span class="c">' + esc(b.label) + '</span><span><button data-sel="' + b.from + '">' + esc(nameOf(b.from)) + '</button> to <button data-sel="' + b.to + '">' + esc(nameOf(b.to)) + '</button></span>'; }).join('') + '</div>';
    }
    var u2 = D.routes.filter(function(r){ return r.steps.indexOf(id) >= 0; });
    if (u2.length) h += '<h4>Use cases that use it</h4><div class="chips">' + u2.map(ucChip).join('') + '</div>';
  }
  dr.innerHTML = h; dr.classList.add('open'); dr.scrollTop = 0;
}

/* ───────── interaction ───────── */
document.addEventListener('click', function(ev){
  var t = ev.target.closest('[data-close],[data-step],[data-route],[data-sel],[data-z],[data-d],[data-dz]');
  if (t && t.hasAttribute('data-dz') && !$('stage').classList.contains('zd')) t = null;
  if (!t) {
    if (ev.target.closest('#floorwrap')) { if (state.sel) go({sel:null}); else if (state.d) go({d:null}); }
    return;
  }
  if (t.hasAttribute('data-close')) return go({sel:null});
  if (t.hasAttribute('data-step')) return go({step:parseInt(t.getAttribute('data-step'), 10), sel:null});
  if (t.hasAttribute('data-route')) {
    var r = t.getAttribute('data-route');
    if (state.route === r && state.step == null && !t.closest('.drawer')) return go({route:null, step:null});
    return go({route:r, step:null, sel:null, z:(state.z === 'districts' && !state.d) ? 'machines' : state.z});
  }
  if (t.hasAttribute('data-sel')) {
    var id = t.getAttribute('data-sel');
    if ($('stage').classList.contains('zd') && t.closest('#tiles') && byId[id] && byId[id].kind === 'machine') return;
    return go({sel:state.sel === id ? null : id});
  }
  if (t.hasAttribute('data-z')) { var z = t.getAttribute('data-z'); return go(z === 'keep' ? {d:null} : {z:z, d:null}); }
  if (t.hasAttribute('data-d')) return go({d:t.getAttribute('data-d'), sel:null});
  if (t.hasAttribute('data-dz') && $('stage').classList.contains('zd')) return go({d:t.getAttribute('data-dz'), sel:null});
});
document.addEventListener('keydown', function(ev){
  if (ev.key !== 'Escape') return;
  if (state.sel) go({sel:null}); else if (state.step != null) go({step:null}); else if (state.route) go({route:null}); else if (state.d) go({d:null});
});
var pop = $('pop'), hov = null;
document.addEventListener('mousemove', function(ev){
  var t = ev.target.closest && ev.target.closest('[data-tip],[data-hov]'), id = t && (t.getAttribute('data-tip') || t.getAttribute('data-hov'));
  if (hov && hov !== id && cargoNode[hov]) cargoNode[hov].classList.remove('hov');
  hov = id;
  if (!id) { pop.style.display = 'none'; return; }
  if (cargoNode[id]) cargoNode[id].classList.add('hov');
  if (t.hasAttribute('data-hov')) { pop.style.display = 'none'; return; }
  var e = byId[id] || routeById[id], l = linkById[id], h;
  if (e) h = '<b>' + esc(e.name) + '</b>' + esc(e.summary) + '<i>' + STATUS[e.status] + (e.statusWhy ? '. ' + esc(e.statusWhy) : '') + '</i>';
  else if (l) h = '<b>' + esc(l.label) + '</b>' + esc(nameOf(l.from)) + ' to ' + esc(nameOf(l.to)) + (l.carries.length ? '<i>carries ' + l.carries.map(nameOf).map(esc).join(', ') + '</i>' : '');
  else return;
  pop.innerHTML = h; pop.style.display = 'block';
  var x = ev.clientX + 14, y = ev.clientY + 16, r = pop.getBoundingClientRect();
  if (x + r.width > innerWidth - 8) x = ev.clientX - r.width - 10;
  if (y + r.height > innerHeight - 8) y = ev.clientY - r.height - 10;
  pop.style.left = x + 'px'; pop.style.top = y + 'px';
});

/* first paint without the zoom animation */
document.body.classList.add('boot');
layoutRels(); render(); layoutRels(); render();
setTimeout(function(){ document.body.classList.remove('boot'); }, 400);
})();
</script>
