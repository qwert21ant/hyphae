<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Continuo: what you can do with it</title>
<style>
:root{
  --paper:#ECF0F1; --card:#FFFFFF; --ink:#15232D; --ink2:#51626E; --ink3:#8696A1; --line:#C3CED5; --line2:#DCE3E7;
  --works:#157A56; --works-bg:#D9EEE5; --partial:#B26C06; --partial-bg:#FAE9CB; --planned:#6E7C87;
  --accent:#2B49D6; --accent-bg:#E2E7FC;
  --ui:Bahnschrift,"DIN Alternate","Roboto Condensed","Arial Narrow","Segoe UI",sans-serif;
  --text:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:Consolas,"Cascadia Mono","SF Mono",Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.4 var(--text);overflow:auto}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.ui{font-family:var(--ui);font-stretch:86%}
#app{display:flex;flex-direction:column;height:100vh;min-width:1180px;min-height:740px}

/* ---------- top bar ---------- */
#top{flex:0 0 48px;display:flex;align-items:center;gap:18px;padding:0 20px;background:var(--ink);color:#fff}
#top .mark{font:600 22px/1 var(--ui);letter-spacing:.01em}
#top .sub{font:400 14px/1 var(--ui);font-stretch:88%;color:#B9C6CE}
#top .grow{flex:1}
#top .legend{display:flex;gap:14px;align-items:center;font:400 13px/1 var(--ui);font-stretch:88%;color:#D5DEE3}
#top .legend span{display:inline-flex;align-items:center;gap:5px}
#top .commit{font:12px/1 var(--mono);color:#93A4AF}
.crumb{display:inline-flex;align-items:center;gap:6px;font:500 14px/1 var(--ui);padding:7px 10px 7px 6px;border:1px solid #3B4C58;border-radius:4px;color:#fff}
.crumb:hover{background:#22333F}
.tabs{display:flex;gap:4px;align-items:center}
.tab{display:inline-flex;align-items:center;gap:7px;height:30px;min-width:30px;padding:0 9px;border-radius:4px;font:600 15px/1 var(--ui);color:#B9C6CE;border:1px solid #3B4C58}
.tab:hover{background:#22333F;color:#fff}
.tab.on{background:#fff;color:var(--ink);border-color:#fff}
.tab .tn{font:500 14px/1 var(--ui);font-stretch:86%}

/* status glyph */
.g{flex:0 0 auto;width:11px;height:11px;border-radius:50%;display:inline-block;position:relative}
.g.works{background:var(--works)}
.g.partial{background:linear-gradient(90deg,var(--partial) 50%,transparent 50%);box-shadow:inset 0 0 0 1.6px var(--partial)}
.g.planned{box-shadow:inset 0 0 0 1.4px var(--planned);background:transparent}
.g.planned::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:transparent}
#top .g.works{background:#4FD3A2}
#top .g.partial{background:linear-gradient(90deg,#F2B553 50%,transparent 50%);box-shadow:inset 0 0 0 1.6px #F2B553}
#top .g.planned{box-shadow:inset 0 0 0 1.4px #B9C6CE}
.ic{width:14px;height:14px;flex:0 0 14px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}

/* ---------- board ---------- */
#board{flex:1;display:flex;flex-direction:column;padding:8px 20px 10px;gap:6px;min-height:0}
.who{flex:0 0 34px;display:flex;align-items:center;gap:8px}
.lab{font:600 13px/1.1 var(--ui);font-stretch:86%;color:var(--ink2);width:52px;flex:0 0 52px}
.whochip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 9px;border:1px solid var(--line);border-radius:15px;background:var(--card);font:500 14px/1 var(--ui);font-stretch:86%}
.whochip .n{color:var(--ink3);font-weight:400}
.whochip:hover{border-color:var(--ink2)}
.whochip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.whochip.on .n{color:#B9C6CE}
.whochip.planned{border-style:dashed;background:transparent;color:var(--ink2)}
.floors{flex:1;display:grid;grid-template-rows:repeat(7,1fr);gap:5px;min-height:0}
.frow{display:grid;grid-template-columns:56px 186px 1fr 160px;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line2);border-radius:5px;padding:0 14px 0 0;min-height:0;position:relative}
.frow.at{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.frow.later{background:transparent;border-style:dashed;border-color:var(--line)}
.fnum{align-self:stretch;display:flex;align-items:center;justify-content:center;font:600 46px/1 var(--ui);font-stretch:80%;color:var(--ink);border-right:1px solid var(--line2);border-radius:5px 0 0 5px}
.fnum:hover{background:var(--ink);color:#fff}
.later .fnum{color:var(--planned);border-right-style:dashed;border-right-color:var(--line)}
.fname a{font:600 19px/1.1 var(--ui);font-stretch:88%;display:block}
.fname a:hover{color:var(--accent)}
.tally{display:flex;align-items:center;gap:9px;margin-top:8px;font:500 13px/1 var(--ui);color:var(--ink2)}
.tally span{display:inline-flex;align-items:center;gap:4px}
.sbar{display:flex;height:6px;width:150px;margin-top:7px;border-radius:3px;overflow:hidden;background:var(--line2)}
.sbar i{display:block;height:100%}
.sbar .works{background:var(--works)} .sbar .partial{background:#E0A038}
.sbar .planned{background:repeating-linear-gradient(90deg,var(--ink3) 0 2px,transparent 2px 5px)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:5px 6px;align-content:center}
.tile{display:flex;align-items:center;gap:6px;height:25px;padding:0 6px 0 7px;border-radius:3px;border:1px solid transparent;font:500 13.5px/1 var(--ui);font-stretch:77%;white-space:nowrap;overflow:hidden;min-width:0}
.tile .t{flex:1;overflow:hidden;text-overflow:ellipsis}
.tile .ic{color:var(--ink2);width:13px;height:13px;flex-basis:13px}
.tile.works{background:var(--works-bg)}
.tile.partial{background:var(--partial-bg)}
.tile.planned{background:transparent;border:1px dashed var(--ink3);color:var(--ink2)}
.tile:hover,.tile.pin{border:1px solid var(--ink);}
.tile.pin{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent)}
.filtering .tile:not(.match){opacity:.2}
.mass{font:500 13px/1.2 var(--ui);font-stretch:88%;color:var(--ink2)}
.mass b{color:var(--ink);font-weight:600}
.mbar{height:8px;background:var(--line2);border-radius:2px;margin:6px 0 5px;overflow:hidden}
.mbar i{display:block;height:100%;background:var(--ink)}
.rules{flex:0 0 auto;display:flex;gap:8px;align-items:flex-start;padding-top:2px}
.rules .lab{padding-top:8px}
.rchips{display:flex;flex-wrap:wrap;gap:5px 6px}
.rchip{display:inline-flex;align-items:center;gap:6px;height:27px;padding:0 8px 0 7px;border:1px solid var(--line);border-radius:3px;background:var(--card);font:500 13px/1 var(--ui);font-stretch:77%}
.rchip:hover,.rchip.pin{border-color:var(--ink)}
.rchip.pin{box-shadow:0 0 0 2px var(--accent);border-color:var(--accent)}
.lock{width:11px;height:12px;flex:0 0 11px}
.lock rect{fill:var(--ink)} .lock path{fill:none;stroke:var(--ink);stroke-width:1.5}
.lock.soft rect{fill:none;stroke:var(--ink2);stroke-width:1.2;stroke-dasharray:2 1.5} .lock.soft path{stroke:var(--ink2);stroke-dasharray:2 1.5}

/* ---------- popover ---------- */
#pop{position:fixed;z-index:50;width:330px;background:var(--card);border:1px solid var(--ink);border-radius:5px;box-shadow:0 10px 30px rgba(21,35,45,.22);padding:13px 15px 14px;display:none}
#pop.show{display:block}
#pop h3{font:600 18px/1.15 var(--ui);font-stretch:90%;margin-bottom:7px}
#pop p{font-size:13.5px;line-height:1.42;margin-top:7px}
#pop .ev{color:var(--ink2);font-size:12.5px}
#pop ul{margin:4px 0 0;padding:0;list-style:none}
#pop li{padding:2px 0}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 12.5px/1 var(--ui);padding:3px 7px 3px 5px;border-radius:10px;background:var(--paper);color:var(--ink)}
.chip.works{background:var(--works-bg)} .chip.partial{background:var(--partial-bg)}
.chip.planned{background:transparent;box-shadow:inset 0 0 0 1px var(--ink3);color:var(--ink2)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:7px;margin-top:11px;height:30px;padding:0 12px;border-radius:4px;background:var(--ink);color:#fff;font:500 14px/1 var(--ui);font-stretch:88%}
.btn:hover{background:var(--accent)}
.fchip{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;border-radius:2px;background:var(--ink);color:#fff;font:600 12px/1 var(--ui)}
a.fchip:hover{background:var(--accent)}
.plink{display:inline-flex;align-items:center;gap:5px;font:500 13px/1 var(--ui);font-stretch:86%;padding:4px 7px;border:1px solid var(--line);border-radius:3px;margin:3px 4px 0 0}
.plink:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- floor ---------- */
#floor{flex:1;display:none;min-height:0}
body.v-floor #floor{display:flex} body.v-floor #board{display:none}
#canvas{flex:1;position:relative;min-width:0;overflow:hidden;
  background-image:linear-gradient(var(--line2) 1px,transparent 1px),linear-gradient(90deg,var(--line2) 1px,transparent 1px);background-size:32px 32px;background-position:-1px -1px}
#canvas > svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wire{fill:none;stroke:var(--ink2);stroke-width:1.5}
.wire.planned{stroke:var(--ink3);stroke-dasharray:5 4}
.wire.lit,.wire.sel{stroke:var(--accent);stroke-width:2.4}
.routing .wire:not(.lit){opacity:.16}
.strip{position:absolute;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font:500 14px/1 var(--ui);font-stretch:88%;border-radius:3px;white-space:nowrap}
.strip{padding:0 14px}
.strip.left{writing-mode:vertical-rl;transform:translateY(-50%) rotate(180deg);padding:14px 0}
.strip.left .ic{transform:rotate(90deg)}
.strip.planned{background:transparent;color:var(--ink2);border:1px dashed var(--ink3)}
.routing .strip:not(.lit){opacity:.35}
.part{position:absolute;background:var(--card);border:1.5px solid var(--ink);border-radius:4px;display:flex;align-items:center;padding:0 10px 0 11px;gap:8px}
.part .hit{position:absolute;inset:0;border-radius:3px;z-index:1}
.part .nm{font:600 15.5px/1.12 var(--ui);font-stretch:86%}
.part.partial{border-color:var(--partial);box-shadow:inset 5px 0 0 var(--partial-bg)}
.part.planned{border:1.5px dashed var(--ink3);background:var(--paper);color:var(--ink2)}
.part.shared{box-shadow:4px 4px 0 var(--ink)}
.part.shared.partial{box-shadow:inset 5px 0 0 var(--partial-bg),4px 4px 0 var(--partial)}
.part.shared.planned{box-shadow:4px 4px 0 var(--line)}
.part:hover{background:#F7FAFB}
.part.sel{outline:3px solid var(--accent);outline-offset:2px}
.part.lit{border-color:var(--accent)}
.routing .part:not(.lit){opacity:.3}
.part .also{position:absolute;right:6px;bottom:-10px;display:flex;gap:3px;z-index:2}
.part .x2{position:absolute;left:8px;top:-9px;z-index:2;font:600 11.5px/1 var(--ui);background:var(--card);border:1px solid var(--ink);border-radius:2px;padding:2px 4px;color:var(--ink)}
.part .rl{position:absolute;right:7px;top:-9px;z-index:2;display:inline-flex;align-items:center;gap:3px;font:600 11.5px/1 var(--ui);background:var(--card);border:1px solid var(--ink);border-radius:2px;padding:2px 4px}
.part .rl .lock{width:8px;height:9px;flex-basis:8px}
.ll{position:absolute;z-index:3;transform:translate(-50%,-50%);text-align:center;font:500 12.5px/1.12 var(--ui);font-stretch:82%;color:var(--ink);background:var(--paper);padding:2px 4px;border-radius:2px}
.ll:hover{color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.ll.planned{color:var(--ink2)}
.ll.lit,.ll.sel{color:var(--accent);background:var(--accent-bg);box-shadow:0 0 0 1px var(--accent)}
.ll .no{position:absolute;left:-11px;top:-11px;display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--accent);color:#fff;font:600 11px/1 var(--ui);box-shadow:0 0 0 1.5px var(--paper)}
.routing .ll:not(.lit){opacity:.2}
@media (prefers-reduced-motion:no-preference){
  .fresh .ll.lit,.fresh .wire.lit{animation:lightup .32s ease-out both;animation-delay:calc(var(--i,0)*55ms)}
  @keyframes lightup{from{opacity:.1}to{opacity:1}}
}

/* ---------- side panel ---------- */
#panel{flex:0 0 344px;background:var(--card);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.phead{padding:12px 16px 10px;border-bottom:1px solid var(--line2);display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center}
.phead .num{font:600 44px/1 var(--ui);font-stretch:80%;grid-row:span 2}
.phead h1{font:600 20px/1.1 var(--ui);font-stretch:88%}
.phead .tally{margin-top:5px}
.uclist{padding:8px 8px 8px;border-bottom:1px solid var(--line2);flex:0 0 auto}
.uclist h2,.detail h2{font:600 12.5px/1 var(--ui);color:var(--ink2);margin:0 8px 5px}
.uc{display:flex;align-items:center;gap:8px;height:23px;padding:0 8px;border-radius:3px;font:500 14px/1 var(--ui);font-stretch:86%}
.uc:hover{background:var(--paper)}
.allucs{display:block;padding:5px 8px 1px;font:500 13px/1 var(--ui);color:var(--accent)}
.allucs:hover{text-decoration:underline}
.uc.on{background:var(--accent);color:#fff}
.uc.on .g.works{background:#fff}.uc.on .g.partial{background:linear-gradient(90deg,#fff 50%,transparent 50%);box-shadow:inset 0 0 0 1.6px #fff}.uc.on .g.planned{box-shadow:inset 0 0 0 1.4px #fff}
.uc .ic{margin-left:auto;color:var(--ink3)} .uc.on .ic{color:#fff}
.detail{flex:1;overflow:auto;padding:12px 16px 18px;min-height:0}
.detail h2{margin:14px 0 5px}
.detail h3{font:600 19px/1.15 var(--ui);font-stretch:90%}
.detail p{font-size:13.5px;line-height:1.43;margin-top:7px}
.detail .ev{color:var(--ink2);font-size:12.5px}
.detail ul,.detail ol{margin:0;padding:0;list-style:none}
.detail li{font-size:13px;line-height:1.35;padding:3px 0;border-top:1px solid var(--line2)}
.detail li:first-child{border-top:0}
.io b{font:600 13px/1 var(--ui);font-stretch:88%}
.io span{color:var(--ink2)}
.step{display:grid;grid-template-columns:22px 1fr;gap:2px}
.step .no{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:9px;background:var(--accent);color:#fff;font:600 11px/1 var(--ui);margin-top:1px}
.step a:hover{color:var(--accent)}
.step .ft{color:var(--ink2);font-size:12.5px}
.knob{display:grid;grid-template-columns:1fr auto;column-gap:8px}
.knob .v{font:600 13px/1.3 var(--ui);text-align:right}
.code{font:12px/1.35 var(--mono);word-break:break-all;display:block;color:var(--ink)}
a.code:hover{color:var(--accent);text-decoration:underline}
.code .m{color:var(--ink3)}
.rule{display:flex;gap:7px;align-items:flex-start}
.rule .lock{margin-top:3px}
.rule small{display:block;color:var(--ink2);font-size:12.5px;line-height:1.35}
.hint{color:var(--ink2);font-size:13px;line-height:1.45}
.back{display:inline-flex;align-items:center;gap:5px;font:500 13px/1 var(--ui);color:var(--accent);margin-bottom:9px}
.keyline{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:10px;font:500 12.5px/1 var(--ui);font-stretch:88%;color:var(--ink2)}
.keyline span{display:inline-flex;align-items:center;gap:5px}
.keyline .sw{width:16px;height:11px;border:1.5px solid var(--ink);border-radius:2px;background:#fff}
.keyline .sw.sh{box-shadow:2px 2px 0 var(--ink)}
.keyline .sw.pl{border-style:dashed;border-color:var(--ink3);background:transparent}
.keyline .sw.pa{border-color:var(--partial);box-shadow:inset 4px 0 0 var(--partial-bg)}
.keyline .x2s{font:600 11px/1 var(--ui);border:1px solid var(--ink);border-radius:2px;padding:1px 3px;color:var(--ink)}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="board"></main>
  <main id="floor"><div id="canvas"></div><aside id="panel"></aside></main>
</div>

e planned 'server moved you' event.", "route": "route-teleported"}, {"id": "uc-stuck", "kind": "usecase", "name": "Notice it is stuck", "summary": "If your position on the path has not advanced for 40 ticks, it logs 'stuck, repathing' and searches again from where you are.", "code": [], "status": "partial", "group": "walk", "actor": "player", "evidence": "Built and unit-tested; never run in a real game (checklist steps 13-22 unrun).", "route": "route-stuck"}, {"id": "uc-give-up", "kind": "usecase", "name": "Give up cleanly", "summary": "After three repaths without progress, or when a search proves there is no way, it logs why, releases every key and goes idle.", "code": [], "status": "partial", "group": "walk", "actor": "player", "evidence": "Built and unit-tested; never run in a real game (checklist steps 13-22 unrun).", "route": "route-give-up"}, {"id": "uc-retarget", "kind": "usecase", "name": "Retarget mid-walk", "summary": "Marking a new spot and pressing K while walking drops the old walk, releases the keys and starts a fresh search.", "code": [], "status": "partial", "group": "walk", "actor": "player", "evidence": "Built and unit-tested; never run in a real game (checklist steps 13-22 unrun).", "route": "route-retarget"}, {"id": "uc-inventory", "kind": "usecase", "name": "Survive an open screen", "summary": "Opening a screen clears held keys in the game; because every key is restated each tick, the walk loses one tick and carries on.", "code": [], "status": "partial", "group": "walk", "actor": "player", "evidence": "The mechanism was seen in game with the old 40-tick demo walk (2026-09-02); not yet with the path walker.", "route": "route-inventory"}, {"id": "uc-smooth-turn", "kind": "usecase", "name": "Turn smoothly, not snap", "summary": "Each tick the view turns at most 30 degrees toward the next step, starting from where you actually face.", "code": [], "status": "partial", "group": "walk", "actor": "player", "evidence": "Built and unit-tested; never run in a real game (checklist steps 13-22 unrun).", "route": "route-smooth-turn"}, {"id": "uc-goto", "kind": "usecase", "name": "Go there by command", "summary": "A 'goto x y z' command and named goals are the next planned sub-project (D3); today the only way to name a destination is to stand on it.", "code": ["docs/superpowers/specs/2026-09-03-d2-path-executor-design.md", "docs/superpowers/specs/2026-08-01-mc-automation-roadmap-design.md"], "status": "planned", "group": "walk", "actor": "player", "evidence": "Not built: named in the D2 spec as D3.", "route": "route-goto"}, {"id": "uc-sprint-jump", "kind": "usecase", "name": "Sprint and jump gaps", "summary": "The walker never presses sprint and stops if a path contains a gap-jump; executing parkour is carried forward as later work.", "code": ["docs/superpowers/specs/2026-09-03-d2-path-executor-design.md"], "status": "planned", "group": "walk", "actor": "player", "evidence": "Not built: listed under 'carried forward' in the D2 spec.", "route": "route-sprint-jump"}, {"id": "uc-around", "kind": "usecase", "name": "Route around obstacles", "summary": "From the start it keeps expanding the cheapest spot, asking each allowed movement where you could stand next, until it reaches the goal block.", "code": [], "status": "works", "group": "plan", "actor": "player", "evidence": "Unit-tested on text-art worlds and five captured terrains, against a shortest-path oracle.", "route": "route-around"}, {"id": "uc-step-up", "kind": "usecase", "name": "Step up one block", "summary": "A step-up is offered when the block above your head is clear and the higher neighbour can be stood on; it costs a block's walk plus a jump.", "code": [], "status": "works", "group": "plan", "actor": "player", "evidence": "Unit-tested (AscendMoveTest).", "route": "route-step-up"}, {"id": "uc-drop", "kind": "usecase", "name": "Drop up to three blocks", "summary": "Walking off a ledge is offered only if the first thing below is a real floor within three blocks; lava, a bottom slab or the unknown below means no offer.", "code": [], "status": "works", "group": "plan", "actor": "player", "evidence": "Unit-tested (DescendMoveTest).", "route": "route-drop"}, {"id": "uc-corner", "kind": "usecase", "name": "Cut corners when clear", "summary": "A diagonal step is offered only if both squares beside the corner are clear at feet and head height.", "code": [], "status": "works", "group": "plan", "actor": "player", "evidence": "Unit-tested (DiagonalMoveTest).", "route": "route-corner"}, {"id": "uc-gap", "kind": "usecase", "name": "Jump a one-block gap", "summary": "The parkour plugin offers a jump over a one-block hole, but only searches that grant gap-jumps see it: the preview does, the walker does not.", "code": [], "status": "partial", "group": "plan", "actor": "plugin", "evidence": "Works in searches and tests; the walker refuses to execute it.", "route": "route-gap"}, {"id": "uc-quickest", "kind": "usecase", "name": "Take the quickest route", "summary": "Moves are priced in game ticks and the estimate never overshoots, so the first route to reach the goal is the fastest one under those prices.", "code": [], "status": "works", "group": "plan", "actor": "player", "evidence": "Unit-tested against an oracle; the prices themselves were never checked against a real walk.", "route": "route-quickest"}, {"id": "uc-no-freeze", "kind": "usecase", "name": "Search without freezing", "summary": "A search explores 2,000 spots per tick and carries on next tick, so a 245-step route took about 13 ticks instead of one long stall.", "code": [], "status": "works", "group": "plan", "actor": "player", "evidence": "Measured in game: worst slice 22 ms cold, 6-9 ms warm (2026-09-02).", "route": "route-no-freeze"}, {"id": "uc-far", "kind": "usecase", "name": "Reach far goals in stages", "summary": "If one stage explores 25,000 spots without reaching the goal, it settles for the explored spot nearest the goal and starts the next stage there.", "code": [], "s oup": "world", "actor": "player", "evidence": "Measured in game: positions were otherwise read 4 to 16 times.", "route": "route-read-once"}, {"id": "uc-classify-once", "kind": "usecase", "name": "Classify each type once", "summary": "The cheap state id is read per position; the costly description and classification run only the first time a state id is seen.", "code": [], "status": "works", "group": "world", "actor": "player", "evidence": "Unit-tested (BlockLookupTest).", "route": "route-classify-once"}, {"id": "uc-forget", "kind": "usecase", "name": "Forget blocks per world", "summary": "State ids only mean something within one world, so the memo is cleared whenever the bot is stopped for a world change.", "code": [], "status": "works", "group": "world", "actor": "game", "evidence": "Unit-tested.", "route": "route-forget"}, {"id": "uc-agree", "kind": "usecase", "name": "Agree on both versions", "summary": "Both mods report raw facts into one shared classifier, so they cannot reach different conclusions about the same boxes.", "code": [], "status": "works", "group": "world", "actor": "maintainer", "evidence": "In-game dumps: 27 of 27 compared blocks match; carpet and farmland differ because the games do.", "route": "route-agree"}, {"id": "uc-ice", "kind": "usecase", "name": "Account for slippery ice", "summary": "Ice and packed ice classify exactly like stone; there is no tag for slipperiness yet.", "code": ["docs/superpowers/specs/2026-08-01-mc-automation-roadmap-design.md"], "status": "planned", "group": "world", "actor": "player", "evidence": "Not built: named as a live candidate in the roadmap.", "route": "route-ice"}, {"id": "uc-start", "kind": "usecase", "name": "Start with the game", "summary": "When the mod loads it builds the bot, hands it the platform bundle exactly once and logs 'Continuo core started on <version> / <loader>'.", "code": [], "status": "works", "group": "host", "actor": "game", "evidence": "Seen in game on both versions (records up to 2026-09-02).", "route": "route-start"}, {"id": "uc-world-change", "kind": "usecase", "name": "Stop on world change", "summary": "Quit to title, disconnect, a portal or a fresh load all change the world object; the bot is stopped, keys go up, blocks and the mark are forgotten.", "code": [], "status": "works", "group": "host", "actor": "game", "evidence": "28 conformance cases; the portal step passed in game on both versions.", "route": "route-world-change"}, {"id": "uc-no-world-keys", "kind": "usecase", "name": "Ignore out-of-world keys", "summary": "Clicks queued while no world is loaded, or while the bot is faulted, are thrown away so they cannot fire later.", "code": [], "status": "works", "group": "host", "actor": "player", "evidence": "Conformance cases only: no hand test can reach this.", "route": "route-no-world-keys"}, {"id": "uc-contain-crash", "kind": "usecase", "name": "Contain a bot crash", "summary": "If the bot throws, the gate logs it with a stack trace, stops the bot so no key stays down, and delivers no more ticks until the next world load.", "code": [], "status": "works", "group": "host", "actor": "game", "evidence": "Conformance cases only: never triggered in a real game.", "route": "route-contain-crash"}, {"id": "uc-idle", "kind": "usecase", "name": "Hands off keys when idle", "summary": "Ticks still arrive while the bot is idle, but it writes nothing, so your own key presses are never overridden.", "code": [], "status": "works", "group": "host", "actor": "player", "evidence": "Unit-tested (ContinuoCoreTest).", "route": "route-idle"}, {"id": "uc-client-close", "kind": "usecase", "name": "Stop when game closes", "summary": "On Fabric the bot is stopped when the client shuts down; Forge 1.7.10 has no such event, so there it simply is not.", "code": [], "status": "partial", "group": "host", "actor": "game", "evidence": "By design: stopping has no effect that outlives the process.", "route": "route-client-close"}, {"id": "uc-two-versions", "kind": "usecase     for (i = 1; i + 1 < p.length; i += 2) s[p[i]] = p[i + 1];

/* ---------- board ---------- */

}

/* ---------- floor ---------- */

function renderFloor(s){

  var x0 = padL + ((W - padL - padR) - (BW + cp * (view.cols - 1))) / 2;
  var y0 = padT + ((H - padT - padB) - (BH + rp * (view.rows - 1))) / 2;
  function box(id){ var g = view.grid[id]; return {x: x0 + g[0] * cp, y: y0 + g[1] * rp, c: g[0], r: g[1]}; }
  var links = MAP.links.filter(function(l){ return l.floor === s.floor; });

  /* which side each link end uses */
  var ends = [], rel = {};  /* ends: {link, part, side, other:{x,y}, role} */
  var topOf = {}, leftOf = {};
  view.top.forEach(function(t){ topOf[t[0]] = t; });
  view.left.forEach(function(t){ leftOf[t[0]] = t; });
  links.forEach(function(l){
    var a = l.from, b = l.to, aP = !!view.grid[a], bP = !!view.grid[b];
    if (aP && bP){
      var A = box(a), B = box(b), sa, sb;
      if (A.r === B.r){ sa = B.c > A.c ? "R" : "L"; sb = B.c > A.c ? "L" : "R"; }
      else if (A.c === B.c){ sa = B.r > A.r ? "B" : "T"; sb = B.r > A.r ? "T" : "B"; }
      else { sa = B.c > A.c ? "R" : "L"; sb = B.c > A.c ? "L" : "R"; }
      rel[l.id] = A.r === B.r ? "h" : (A.c === B.c ? "v" : "d");
      ends.push({l: l, part: a, side: sa, ox: B.x, oy: B.y, role: "from", k: l.from < l.to ? 0 : 1});
      ends.push({l: l, part: b, side: sb, ox: A.x, oy: A.y, role: "to", k: l.from < l.to ? 0 : 1});
    } else {
      var part = aP ? a : b, actor = aP ? b : a, side = topOf[actor] ? "T" : "L";
      rel[l.id] = side === "T" ? "v" : "h";
      ends.push({l: l, part: part, side: side, ox: -1e4, oy: -1e4, role: aP ? "from" : "to", actor: actor, k: aP ? 0 : 1});
    }
  });
  /* spread ports along each side */
  var groups = {};
  ends.forEach(function(e){ var k = e.part + "|" + e.side; (groups[k] = groups[k] || []).push(e); });
  Object.keys(groups).forEach(function(k){
    var g = groups[k], vertical = g[0].side === "L" || g[0].side === "R";
    g.sort(function(p, q){ return vertical ? (p.oy - q.oy) || (p.ox - q.ox) || (p.k - q.k) : (p.ox - q.ox) || (p.oy - q.oy) || (p.k - q.k); });
    var pitch = Math.min(17, ((vertical ? BH : BW) - 16) / g.length);
    g.forEach(function(e, i){
      var off = (i - (g.length - 1) / 2) * pitch, B = box(e.part);
      if (e.side === "L") e.pt = {x: B.x, y: B.y + BH / 2 + off};
      if (e.side === "R") e.pt = {x: B.x + BW, y: B.y + BH / 2 + off};
      if (e.side === "T") e.pt = {x: B.x + BW / 2 + off, y: B.y};
      if (e.side === "B") e.pt = {x: B.x + BW / 2 + off, y: B.y + BH};
    });
  });
  var geo = {};
  ends.forEach(function(e){
    var g = geo[e.l.id] = geo[e.l.id] || {};
    g[e.role] = e.pt;
    if (e.actor){
      var other = e.side === "T" ? {x: e.pt.x, y: y0 - GAPT} : {x: x0 - GAPL, y: e.pt.y};
      g[e.role === "from" ? "to" : "from"] = other;
    }
  });

  /* route numbering */
  var litLinks = {}, litNodes = {}, order = {};
  if (route) route.steps.forEach(function(id, i){
    litLinks[id] = true; (order[id] = order[id] || []).push(i + 1);
    litNodes[LINK[id].from] = true; litNodes[LINK[id].to] = true;
  });

  var svg = '<svg><defs>' +
    ['ink2:#51626E', 'acc:#2B49D6', 'pl:#8696A1'].map(function(m){ var p = m.split(":"); return '<marker id="ah-' + p[0] + '" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1.5L9 5 1 8.5z" fill="' + p[1] + '"/></marker>'; }).join('') + '</defs>';
  var html = '';
  /* strips */
  view.top.forEach(function(t){
    var a = E[t[0]], xa = x0 + t[1] * cp, xb = x0 + t[2] * cp + BW;
    html += '<div class="strip' + (litNodes[a.id] ? ' lit' : '') + (a.status === "planned" ? ' planned' : '') + '" title="' + esc(a.summary) + '" style="left:' + ((xa + xb) / 2) + 'px;top:' + (y0 - GAPT - ST) + 'px;min-width:' + (xb - xa) + 'px;height:' + ST + 'px;transform:translateX(-50%)">' + icon(a.icon) + esc(a.name) + '</div>';
  });
  view.left.forEach(function(t){
    var a = E[t[0]], ya = y0 + t[1] * rp, yb = y0 + t[2] * rp + BH;
    html += '<div class="strip left' + (litNodes[a.id] ? ' lit' : '') + (a.status === "planned" ? ' planned' : '') + '" title="' + esc(a.summary) + '" style="left:' + (x0 - GAPL - SL) + 'px;top:' + ((ya + yb) / 2) + 'px;width:' + SL + 'px;min-height:' + (yb - ya) + 'px">' + icon(a.icon) + esc(a.name) + '</div>';
  });
  /* links */
  var rev = {};
  links.forEach(function(l){ rev[l.from + ">" + l.to] = l; });
  links.forEach(function(l){
    var g = geo[l.id], a = g.from, b = g.to;
    var lit = !!litLinks[l.id], sel = s.link === l.id, planned = l.kind === "planned";
    var cls = "wire" + (planned ? " planned" : "") + (lit ? " lit" : "") + (sel ? " sel" : "");
    var mk = (lit || sel) ? "acc" : (planned ? "pl" : "ink2");
    var i0 = lit ? order[l.id][0] - 1 : 0;
    svg += '<path class="' + cls + '" style="--i:' + i0 + '" d="M' + a.x.toFixed(1) + ' ' + a.y.toFixed(1) + 'L' + b.x.toFixed(1) + ' ' + b.y.toFixed(1) + '" marker-end="url(#ah-' + mk + ')"/>';
    /* label position */
    var t = 0.5, dx = b.x - a.x, dy = b.y - a.y, tx = "-50%", ty = "-50%", mw = 118;
    var twin = rev[l.to + ">" + l.from];
    var horiz = rel[l.id] === "h", vert = rel[l.id] === "v";
    if (horiz) mw = Math.max(48, Math.abs(dx) - 18);
    if (twin){
      var tg = geo[twin.id], mine = {x: (a.x + b.x) / 2, y: (a.y + b.y) / 2}, theirs = {x: (tg.from.x + tg.to.x) / 2, y: (tg.from.y + tg.to.y) / 2};
      if (vert){ tx = mine.x < theirs.x ? "calc(-100% - 5px)" : "5px"; mw = 92; }
      else if (horiz){ ty = mine.y < theirs.y ? "calc(-100% - 4px)" : "4px"; }
      else { var first = (a.y < b.y) || (a.y === b.y && a.x < b.x); t = first ? 0.28 : 0.28; mw = 100; }
    } else if (!view.grid[l.from] || !view.grid[l.to]){
      if (vert){ tx = "7px"; }
      else { ty = "calc(-100% - 4px)"; mw = GAPL - 10; }
    }
    if (view.hints && view.hints[l.id] != null) t = view.hints[l.id];
    var px = a.x + dx * t, py = a.y + dy * t;
    var target = {view: "floor", floor: s.floor, uc: s.uc, link: sel ? null : l.id};
    html += '<a class="ll' + (planned ? ' planned' : '') + (lit ? ' lit' : '') + (sel ? ' sel' : '') + '" style="left:' + px.toFixed(1) + 'px;top:' + py.toFixed(1) + 'px;transform:translate(' + tx + ',' + ty + ');max-width:' + mw + 'px;--i:' + i0 + '" href="' + href(target) + '">' +
      (lit ? '<span class="no">' + order[l.id].join("·") + '</span>' : '') + esc(l.label) + '</a>';
  });
  svg += '</svg>';
  /* parts */
  Object.keys(view.grid).forEach(function(pid){
    var p = E[pid], B = box(pid), sel = s.part === pid;
    var target = {view: "floor", floor: s.floor, uc: s.uc, part: sel ? null : pid};
    var h = '<div class="part ' + p.status + (p.shared ? ' shared' : '') + (sel ? ' sel' : '') + (litNodes[pid] ? ' lit' : '') + '" style="left:' + B.x + 'px;top:' + B.y + 'px;width:' + BW + 'px;height:' + BH + 'px">' +
      '<a class="hit" href="' + href(target) + '" aria-label="' + esc(p.name) + '"></a>' + glyph(p.status) + '<span class="nm">' + esc(p.name) + '</span>';
    if (p.perGameVersion) h += '<span class="x2" title="Written once per game version">×2</span>';
    if (p.rules.length) h += '<span class="rl" title="' + p.rules.length + ' rule(s) must hold here">' + lock("tests") + p.rules.length + '</span>';
    if (p.shared){
      h += '<span class="also">';
      p.floors.forEach(function(fid){ if (fid !== s.floor) h += '<a class="fchip" href="#floor/' + fid + '/part/' + pid + '" title="Same part on floor ' + E[fid].floor + ': ' + esc(E[fid].name) + '">' + E[fid].floor + '</a>'; });
      h += '</span>';
    }
    html += h + '</div>';
  });
  cv.className = (route ? "routing" : "") + ((!firstRender && lastRoute !== s.uc && route) ? " fresh" : "");
  cv.innerHTML = svg + html;
  lastRoute = s.uc || null;
  renderPanel(s, links);
}

function renderPanel(s, links){
  var f = E[s.floor], ucs = f.usecases.map(function(id){ return E["uc-" + id]; });
  var h = '<div class="phead"><span class="num">' + f.floor + '</span><h1>' + esc(f.name) + '</h1>' + tallyHtml(tally(ucs)) + '</div>';
  if (s.part || s.link){
    h += '<div class="uclist mini">';
    if (s.uc){ var su = E["uc-" + s.uc]; h += '<a class="uc on" href="#floor/' + s.floor + '/uc/' + s.uc + '">' + glyph(su.status) + esc(su.name) + icon(E[su.actor].icon) + '</a>'; }
    h += '<a class="allucs" href="' + href({view: "floor", floor: s.floor, uc: s.uc}) + '">Show all ' + ucs.length + ' use cases on this floor</a>';
  } else {
    h += '<div class="uclist"><h2>Use cases on this floor: pick one to light its route</h2>';
    ucs.forEach(function(u){
      var id = ucId(u), on = s.uc === id;
      h += '<a class="uc' + (on ? ' on' : '') + '" href="' + (on ? '#floor/' + s.floor : '#floor/' + s.floor + '/uc/' + id) + '">' + glyph(u.status) + esc(u.name) + icon(E[u.actor].icon) + '</a>';
    });
  }
  h += '</div><div class="detail">';
  if (s.part) h += partDetail(s, links);
  else if (s.link) h += linkDetail(s);
  else if (s.uc) h += routeDetail(s);
  else h += '<h3>' + esc(f.name) + '</h3><p>' + esc(f.summary) + '</p><p class="hint">Click a part for what it does, what must hold there, where to change it, and its code. Click an arrow label for what moves along it.</p>' +
    '<div class="keyline"><span><i class="sw"></i>a job</span><span><i class="sw sh"></i>also on other floors</span><span><i class="sw pa"></i>built, with a gap</span><span><i class="sw pl"></i>not built yet</span><span><b class="x2s">×2</b>written per game version</span><span>' + lock("tests") + 'rules that hold here</span></div>';
  h += '</div>';
  var panel = document.getElementById("panel");
  panel.innerHTML = h;
}
function statusChips(e){
  var h = '<div class="meta"><span class="chip ' + e.status + '">' + glyph(e.status) + STATUS_WORD[e.status] + '</span>';
  if (e.perGameVersion) h += '<span class="chip"><b class="x2s" style="font:600 11px/1 var(--ui)">×2</b>written once per game version</span>';
  if (e.actor) h += '<span class="chip">' + icon(E[e.actor].icon) + esc(E[e.actor].name) + '</span>';
  return h + '</div>';
}
function partDetail(s, links){
  var p = E[s.part], h = '';
  if (s.uc) h += '<a class="back" href="#floor/' + s.floor + '/uc/' + s.uc + '"><svg class="ic" viewBox="0 0 14 14"><path d="M9 2.5L4.5 7 9 11.5"/></svg>Back to the steps of “' + esc(E["uc-" + s.uc].name) + '”</a>';
  h += '<h3>' + esc(p.name) + '</h3>' + statusChips(p) + '<p>' + esc(p.summary) + '</p><p class="ev">' + esc(p.evidence) + '</p>';
  if (p.shared){
    h += '<h2>Same part, other floors</h2><div>';
    p.floors.forEach(function(fid){ if (fid !== s.floor) h += '<a class="plink" href="#floor/' + fid + '/part/' + p.id + '"><span class="fchip">' + E[fid].floor + '</span>' + esc(E[fid].name) + '</a>'; });
    h += '</div>';
  }
  if (p.knobs.length){
    h += '<h2>Change it here</h2><ul>' + p.knobs.map(function(k){ return '<li><div class="knob"><span>' + esc(k.name) + '</span><span class="v">' + esc(k.value) + '</span></div>' + codeLink(k.where, k.line) + '</li>'; }).join('') + '</ul>';
  }
  h += '<h2>' + (p.status === "planned" ? 'Where it is described (no code yet)' : 'Code') + '</h2>' + codeList(p.code);
  if (p.gaps.length){ h += '<h2>Known gaps</h2><ul>' + p.gaps.map(function(g){ return '<li>' + esc(g) + '</li>'; }).join('') + '</ul>'; }
  if (p.docConflicts.length){ h += '<h2>The docs say otherwise (the code wins)</h2><ul>' + p.docConflicts.map(function(g){ return '<li>' + esc(g) + '</li>'; }).join('') + '</ul>'; }
  if (p.rules.length){
    h += '<h2>Must always hold here</h2><ul>' + p.rules.map(function(rid){ var r = E[rid]; return '<li class="rule">' + lock(r.enforcedBy) + '<div><b class="ui">' + esc(r.name) + '</b><small>' + esc(r.summary) + ' <i>(' + esc(BY_WORD[r.enforcedBy]) + ')</i></small></div></li>'; }).join('') + '</ul>';
  }
  var ins = links.filter(function(l){ return l.to === p.id; }), outs = links.filter(function(l){ return l.from === p.id; });
  if (ins.length){ h += '<h2>Takes in, on this floor</h2><ul>' + ins.map(function(l){ return '<li class="io"><b>' + esc(l.label) + '</b> <span>from ' + esc(nameOf(l.from)) + '</span></li>'; }).join('') + '</ul>'; }
  if (outs.length){ h += '<h2>Gives out, on this floor</h2><ul>' + outs.map(function(l){ return '<li class="io"><b>' + esc(l.label) + '</b> <span>to ' + esc(nameOf(l.to)) + '</span></li>'; }).join('') + '</ul>'; }
  if (p.tests.length) h += '<h2>Tests that pin it</h2>' + codeList(p.tests);
  return h;
}
function routeDetail(s){
  var u = E["uc-" + s.uc], r = ROUTE[u.route];
  var h = '<h3>' + esc(u.name) + '</h3>' + statusChips(u) + '<p>' + esc(u.summary) + '</p><p class="ev">' + esc(u.evidence) + '</p><h2>Steps, in order</h2><ol>';
  r.steps.forEach(function(id, i){
    var l = LINK[id], to = E[l.to].kind === "part" ? l.to : (E[l.from].kind === "part" ? l.from : null);
    var tgt = to ? '#floor/' + s.floor + '/uc/' + s.uc + '/part/' + to : '#';
    h += '<li class="step"><span class="no">' + (i + 1) + '</span><a href="' + tgt + '"><b class="ui">' + esc(l.label) + '</b> <span class="ft">' + esc(nameOf(l.from)) + ' &#9656; ' + esc(nameOf(l.to)) + '</span></a></li>';
  });
  h += '</ol>';
  if (u.code.length) h += '<h2>Where it is described</h2>' + codeList(u.code);
  return h;
}
function linkDetail(s){
  var l = LINK[s.link], h = '';
  if (s.uc) h += '<a class="back" href="#floor/' + s.floor + '/uc/' + s.uc + '"><svg class="ic" viewBox="0 0 14 14"><path d="M9 2.5L4.5 7 9 11.5"/></svg>Back to the steps of “' + esc(E["uc-" + s.uc].name) + '”</a>';
  h += '<h3>' + esc(l.label) + '</h3><p>Moves from <b>' + esc(nameOf(l.from)) + '</b> to <b>' + esc(nameOf(l.to)) + '</b>' + (l.kind === "planned" ? ' (planned, not built).' : '.') + '</p>';
  if (l.carries.length){
    h += '<h2>What it carries</h2><ul>';
    l.carries.forEach(function(tid){ var t = E[tid]; h += '<li><b class="ui">' + esc(t.name) + '</b><br>' + esc(t.summary) + codeList(t.code) + '</li>'; });
    h += '</ul>';
  }
  var used = MAP.routes.filter(function(r){ return r.steps.indexOf(l.id) >= 0; });
  if (used.length){ h += '<h2>Use cases that pass here</h2><div>' + used.map(function(r){ return '<a class="plink" href="#floor/' + s.floor + '/uc/' + r.id.replace(/^route-/, "") + '">' + glyph(E[r.usecase].status) + esc(r.name) + '</a>'; }).join('') + '</div>'; }
  return h;
}

/* ---------- main ---------- */
function render(){
  state = parse();
  document.body.className = "v-" + state.view;
  renderTop(state);
  if (state.view === "board"){ renderBoard(state); lastRoute = null; }
  else { pop.classList.remove("show"); renderFloor(state); }
  document.title = state.view === "floor" ? "Continuo: floor " + E[state.floor].floor + ", " + E[state.floor].name : "Continuo: what you can do with it";
  firstRender = false;
}
window.addEventListener("hashchange", render);
window.addEventListener("resize", function(){ if (state && state.view === "floor") renderFloor(state); else pinnedPop(); });
document.addEventListener("keydown", function(e){
  if (e.key !== "Escape" || !state) return;
  if (state.view === "floor" && (state.part || state.link)) location.hash = href({view: "floor", floor: state.floor, uc: state.uc});
  else if (state.view === "floor" && state.uc) location.hash = "#floor/" + state.floor;
  else if (state.view === "board" && (state.uc || state.rule || state.who)) location.hash = "#board";
});
render();
})();
</script>
</body>
</html>
